    { name:'Pic Saint-Loup AOC', classification:'AOC', grapes:["Syrah (min 30%), Grenache, Mourvèdre"], method:'Old oak foudres or French barriques', aging:'Min 12 months in wood', style:'Full body, concentrated, elegant for Languedoc, cooler character — dark fruit, pepper, mineral', notes:'Best red AC in Languedoc. Dramatic rocky peak (Pic Saint-Loup) north of Montpellier. Cooler altitude. Mas Bruguière, Domaine de l\'Hortus, Château Capion: top producers. Increasingly acclaimed. Also white and rosé.' },
    { name:'Terrasses du Larzac AOC', classification:'AOC', grapes:["Syrah, Grenache (minimum % rules), Carignan, Cinsault, Mourvèdre"], method:'Mixed — large oak, barriques, concrete eggs, amphorae used by adventurous producers', aging:'No minimum', style:'Full body, complex, earthy, herbal, darker fruit, more freshness from altitude, structured', notes:'Newest and most exciting Languedoc sub-zone. High limestone plateaus (Larzac). Cool continental influence. Producers include Mas Jullien, Domaine de Montcalmès, Clos du Joncuas, La Pèira. Important for natural wine movement.' },
    { name:'Fitou AOC', classification:'AOC', grapes:["Carignan (min 60%), Grenache, Syrah, Mourvèdre"], method:'Carbonic maceration for Carignan; traditional maceration overall', aging:'Min 9 months in wood', style:'Full body, rustic, dark fruit, earthy, spice, warming — Carignan-dominant', notes:'One of France\'s oldest AOCs (1948). Two zones: coastal and inland around Tuchan. Carignan-dominant style — unusual and distinctive. Worth knowing for WSET: Fitou is highest Carignan-content AC in France.' },
    { name:'Corbières AOC', classification:'AOC', grapes:["Carignan (max 50%), Grenache, Syrah, Mourvèdre"], method:'Carbonic maceration for Carignan; mixed styles', aging:'No minimum', style:'Medium-full body, earthy, garrigue, dark fruit, rustic', notes:'Large appellation in eastern Languedoc. Varied terroir. Château Lastours, Château des Ollieux-Romanis: top producers. Good value. Boutenac: sub-zone for superior quality (Corbières-Boutenac AOC).' },
    { name:'Minervois AOC', classification:'AOC', grapes:["Syrah, Grenache, Mourvèdre (min 40%), Carignan (max 40%), Cinsault"], method:'Mixed styles', aging:'No minimum', style:'Medium body, red and dark fruit, herbal, accessible', notes:'North of Corbières. La Livinière (cooler, higher): best sub-zone. Château Oupia, Domaine de Cals: notable. Also whites (Grenache Blanc, Marsanne, Roussanne, Viognier, Bourboulenc).' },
    { name:'Crémant de Limoux AOC / Limoux AOC (Blanquette)', classification:'AOC', grapes:["Mauzac (Blanquette), Chardonnay, Chenin Blanc"], method:'Traditional method for all. Blanquette: Mauzac-dominant. Crémant: Chardonnay + Chenin dominant. Ancestral method (Blanquette Méthode Ancestrale) also made.', aging:'Blanquette: min 9 months. Crémant: min 12 months', style:'Crisp, apple, citrus, fresh. Blanquette de Limoux: distinctive "Granny Smith" apple character from Mauzac', notes:'Claims to be world\'s oldest sparkling wine (1531 monks at Saint-Hilaire). High altitude cool Pyrenees climate. Three ACs: Blanquette de Limoux (Mauzac-dominant), Crémant de Limoux (Chardonnay-dominant, longer aging), Blanquette Méthode Ancestrale (Mauzac, single fermentation — pét-nat ancestor). Domaine J. Laurens: top producer.' },
    { name:'Roussillon AOC / Côtes du Roussillon-Villages AOC', classification:'AOC', grapes:["Grenache, Syrah, Mourvèdre, Carignan (reds); Grenache Blanc, Macabeu, others (whites)"], method:'Mixed; barriques and old foudres', aging:'Villages reds: min 12 months', style:'Full body, ripe, warming, Mediterranean, garrigue, dark fruit, high alcohol', notes:'Far south near Spanish border. Catalan character. Best: Côtes du Roussillon-Villages (4 named crus: Tautavel, Caramany, Latour-de-France, Lesquerde). Also produces VDN (see Banyuls, Maury). Gérard Gauby: natural wine pioneer. Carignan on old vines = interesting structured wines.' },
    { name:'Banyuls AOC / Maury AOC (Vin Doux Naturel)', classification:'AOC (VDN)', grapes:["Grenache Noir (min 50% for Banyuls; 75% for Maury)"], method:'Fortification with neutral grape spirit (mutage) during fermentation', aging:'Banyuls Grand Cru: min 30 months in oak. Regular Banyuls: min 12 months.', abv:'15–18%', style:'Sweet, dark ruby to tawny, dried fruit, fig, chocolate, coffee, leather, rancio (oxidative note if wood-aged)', notes:'France\'s finest fortified red wines. Grenache-dominant. Terraced slate vineyards on Mediterranean coast. Three styles: Banyuls (fresher), Banyuls Grand Cru (more aged), Rimage (vintage, not oxidized). Pairs with chocolate — classic. Maury: inland Roussillon, Grenache-dominant, often more concentrated. Domaine du Mas Blanc, Domaine de la Rectorie: top Banyuls producers.' },
  ],
  // ===== FRANCE — PROVENCE =====
  'Provence': [
    { name:'Côtes de Provence AOC (Rosé)', classification:'AOC', grapes:["Grenache, Cinsault, Syrah, Tibouren (dominant for rosé), Mourvèdre, others permitted"], method:'Direct press (no skin contact) or very brief (<12 hour) saignée; cold settling, cold fermentation in stainless steel', aging:'No minimum', style:'Pale salmon-pink ("Provence pale"), bone dry, delicate red fruit, citrus, subtle herb, crisp finish, elegant', notes:'Provence produces ~40% of all French rosé and 8% of global rosé. The "pale" pink (vin gris) style now globally imitated. Grenache and Cinsault give delicate character; Tibouren is distinctive local variety. Tavel (Rhône) is the contrast: deeper, fuller. Direct press (no skin maceration) is key to pale color and delicate style. Bandol rosé is richer.' },
    { name:'Bandol AOC (Red)', classification:'AOC', grapes:["Mourvèdre (min 50%), Grenache, Cinsault, Syrah"], method:'Traditional long maceration; aged in large old oak foudres', aging:'Min 18 months in wood', style:'Full body, dark fruit, lavender, garrigue, leather, iron, firm tannins, complex, very long-lived (10–20+ years)', notes:'Finest red wine of Provence. Mourvèdre is king here — rare terroir where it fully ripens (needs heat). Château Tempier: the iconic benchmark (La Migoua, La Tourtine single vineyard wines). Pibarnon, Pradeaux: also top estates. Structured, complex — worth the 5–10 year wait.' },
    { name:'Bandol AOC (Rosé)', classification:'AOC', grapes:["Mourvèdre, Grenache, Cinsault"], method:'Brief skin contact (saignée)', aging:'No minimum but often 6+ months before release', style:'Deeper salmon, more complex and structured than standard Côtes de Provence rosé, nutty, floral, garrigue, longer finish', notes:'Richer, more age-worthy than typical Provence rosé. Mourvèdre gives structure and complexity. Château Tempier rosé: benchmark. Ages 2–5 years. Best with food.' },
    { name:'Côtes de Provence — Sainte-Victoire/Pierrefeu/La Londe (Sub-zones)', classification:'AOC', grapes:["Grenache, Cinsault, Syrah, Tibouren, Vermentino (white)"], method:'Cold fermentation for rosé; oak aging for reds', aging:'Sub-zone reds may require 12 months', style:'Varies: Sainte-Victoire (Cézanne\'s mountain) = structured rosé and red; Pierrefeu = fuller reds; La Londe (maritime) = fresher, mineral', notes:'Côtes de Provence now has multiple sub-zone designations for premium quality rosé and red wines. Sainte-Victoire (northeast, limestone) is most famous. Good provenance and terroir transparency.' },
    { name:'Coteaux d\'Aix-en-Provence AOC', classification:'AOC', grapes:["Grenache, Syrah, Cabernet Sauvignon, Cinsault, Counoise (reds); Grenache Blanc, Rolle (Vermentino), Clairette (whites)"], method:'Mixed', aging:'No minimum', style:'Medium body, approachable, Mediterranean, red fruit, herb — slightly lighter than Côtes de Provence', notes:'Large appellation around Aix-en-Provence. Allows Cabernet Sauvignon — gives more structure. Château Vignelaure: pioneer of Cab Sauv here. Also notable: Château Revelette, Domaine de Triennes (Aubert de Villaine of DRC). Good value Provence.' },
    { name:'Cassis AOC (White)', classification:'AOC', grapes:["Clairette, Marsanne, Ugni Blanc, Bourboulenc, Grenache Blanc, Sauvignon Blanc"], method:'Stainless steel, fresh', aging:'No minimum', style:'Light-medium body, citrus, herbal, mineral, sea breeze, delicate', notes:'Tiny AC on coast east of Marseille. White wine specialty — unusual for Provence. Very expensive locals. Oyster wine — the classic pairing. Small production.' },
    { name:'Palette AOC', classification:'AOC', grapes:["Grenache, Mourvèdre, Cinsault (reds/rosés); Clairette, Grenache Blanc, Ugni Blanc, Muscat (whites)"], method:'Old oak foudres, traditional aging', aging:'Reds: min 18 months. Whites: min 12 months', style:'Reds: full body, complex, earthy, age-worthy. Whites: nutty, oxidative, interesting', notes:'Tiny appellation (only ~32ha) near Aix-en-Provence. Dominated by Château Simone (one estate owns 80%+ of AC). Unusual in that whites age 5–10 years. Grenache-dominant reds. A curiosity and fine wine destination.' },
  ],
  // ===== FRANCE — SW FRANCE =====
  'SW France (Cahors, Madiran, Jurançon)': [
    { name:'Cahors AOC (Malbec/Côt)', classification:'AOC', grapes:["Malbec (Côt/Auxerrois, min 70%), Merlot, Tannat"], method:'Traditional: long maceration, old oak or new French barriques. Modern: shorter maceration, fruity style.', aging:'No minimum; quality wines: 12–24 months in oak', style:'Full body, very firm tannins, dark plum, blackberry, graphite, spice, earth — "Black Wine of Cahors"', notes:'Cahors was THE Malbec region long before Argentina took it global. "Black Wine" (vin noir): historically high-tannin style. Terraces on the Lot River: limestone plateau + gravel = different terroir to Argentina. Château du Cèdre, Château Lagrezette: top producers. Appellation fighting Argentina\'s success for Malbec recognition.' },
    { name:'Madiran AOC', classification:'AOC', grapes:["Tannat (min 40%, often 60–80%), Cabernet Franc, Cabernet Sauvignon"], method:'Traditional: long maceration. Modern: micro-oxygenation (invented here by Patrick Ducournau to soften Tannat)', aging:'Min 12 months in wood', style:'Full body, very high tannin, very high acid, dark fruit, spice, earthy, robust, needs food and/or age', notes:'Tannat: world\'s highest-tannin grape variety. High in resveratrol (heart-healthy claims). Micro-oxygenation was invented here to tame Tannat. Château Montus (Alain Brumont): benchmark — powerful, structured, age-worthy (10–20 years). Exported to Uruguay (main Tannat country after Madiran).' },
    { name:'Jurançon AOC (Dry and Sweet)', classification:'AOC', grapes:["Petit Manseng (dominant for sweet), Gros Manseng (dominant for dry), Camaralet, Courbu"], method:'Dry: early harvest, stainless steel. Sweet: late harvest passerillage — grapes left to dry on vine (mountain winds), no botrytis', aging:'No minimum', style:'Dry Jurançon (Sec): medium body, high acid, citrus, pineapple, ginger, exotic spice, striking. Sweet: intense, tropical fruit, honey, apricot, ginger, high acid for balance, extraordinary complexity', notes:'WSET key point: Jurançon sweet wines made by PASSERILLAGE not botrytis — mountain winds dry the grapes on the vine (late autumn). Petit Manseng: thick skins survive drying. Gros Manseng: used for drier styles. Charles Hrs (Clos Uroulat), Domaine Cauhapé: top estates. Henri IV was baptized with Jurançon wine. Far Pyrenees location — high altitude, Foehn winds.' },
    { name:'Pacherenc du Vic-Bilh AOC', classification:'AOC', grapes:["Arrufiac, Petit Courbu, Petit Manseng, Gros Manseng"], method:'Dry: cold fermentation. Sweet: passerillage (late harvest)', aging:'No minimum', style:'Dry: aromatic, floral, citrus, exotic. Sweet: honey, tropical fruit, high acid', notes:'White wine counterpart to Madiran (same geographic zone, Vic-Bilh hills). Both dry (Sec) and sweet (Doux) styles. Very small production, rarely seen outside SW France. Alain Brumont (Château Montus) also makes top examples.' },
    { name:'Bergerac AOC & Pécharmant AOC', classification:'AOC', grapes:["Cabernet Sauvignon, Merlot, Cabernet Franc, Malbec (reds); Sauvignon Blanc, Sémillon, Muscadelle (whites)"], method:'Classic Bordeaux-style production', aging:'No minimum (Bergerac). Pécharmant: min 1 year in oak.', style:'Bergerac: medium body, lighter Bordeaux-style. Pécharmant: fuller, more structured, tannic, earthy.', notes:'East of Bordeaux in Dordogne. Bergerac = affordable Bordeaux alternative (same varieties). Pécharmant = Bergerac\'s best red AC (iron-rich clay soils on plateau north of town). Monbazillac: sweet white AC within Bergerac zone (botrytis, similar to Sauternes but cheaper). Château Tour des Gendres, Clos l\'Envège: quality producers.' },
  ],
  'Bergerac': [
    { name:'Bergerac AOC (Red)', classification:'AOC', grapes:["Cabernet Sauvignon, Merlot, Cabernet Franc, Malbec, Mérille"], method:'Classic Bordeaux-style production', aging:'No minimum', style:'Medium body, red and dark fruit, fresh, lighter Bordeaux-style, approachable', notes:'East of Bordeaux in Dordogne. Same varieties as Bordeaux but separate AC. Affordable everyday wines. Quality improving with ambitious producers.' },
    { name:'Pécharmant AOC', classification:'AOC', grapes:["Cabernet Sauvignon, Merlot, Cabernet Franc, Malbec"], method:'Oak aging', aging:'Min 1 year in oak', style:'Full-medium body, more structured and tannic than Bergerac, earthy, iron-rich mineral', notes:'Best red sub-zone of Bergerac. Iron-rich clay-gravel plateau (crasse de fer). More age-worthy than basic Bergerac. Domaine du Haut-Pécharmant: leading estate.' },
    { name:'Monbazillac AOC', classification:'AOC', grapes:["Sémillon (dominant), Sauvignon Blanc, Muscadelle"], method:'Botrytis cinerea (noble rot); barrel fermented and aged', aging:'No minimum; quality wines aged 12–18 months', abv:'13–15%', style:'Sweet, golden, honey, apricot, marmalade — Sauternes style but lighter, earlier-drinking, more affordable', notes:'Best-value noble rot sweet wine of France. Same method as Sauternes but less concentrated. The morning mists from the Dordogne River create botrytis conditions on the north-facing slopes. Château Tirecul La Gravière: legendary producer. Great value gateway to Sauternes style.' },
    { name:'Rosette AOC & Saussignac AOC', classification:'AOC', grapes:["Sémillon, Sauvignon Blanc, Muscadelle"], method:'Sweet (Rosette: off-dry to sweet; Saussignac: sweeter, often botrytis)', aging:'No minimum', style:'Rosette: delicate, off-dry, fresh. Saussignac: richer sweet white', notes:'Two small sweet white ACs within Bergerac zone. Rosette: rare, off-dry style. Saussignac: southwest of Bergerac, richer moelleux style. Very small production.' },
  ],


  // ===== GERMANY — NAHE =====
  'Nahe': [
    { name:'Nahe Riesling — Trocken/Halbtrocken', classification:'QbA/Prädikat', grapes:["Riesling (100%)"], method:'Stainless steel, cool fermentation', aging:'No minimum', abv:'12–13%', style:'Dry to off-dry, high acid, stone fruit, mineral (varied — basalt/volcanic/slate soils), apple, citrus, elegant', notes:'Diverse geology: volcanic (Rotenfels cliff), slate, sandstone, loam all within small area. Nahe Riesling often described as "between Mosel and Rheingau in style" — elegant but with body. Dönnhoff: Germany\'s most acclaimed producer. Schlossgut Diel, Emrich-Schönleber: also excellent.' },
    { name:'Nahe Riesling — Kabinett/Spätlese/Auslese', classification:'Prädikat', grapes:["Riesling (100%)"], method:'No chaptalization; late harvest; natural sweetness preserved', aging:'No minimum', abv:'8–12%', style:'Light-medium body, off-dry to sweet, stone fruit, peach, apricot, mineral, racy acidity, elegant', notes:'Traditional German Prädikat style. Nahe sweet wines: among Germany\'s finest. Dönnhoff Oberhäuser Brücke Auslese: legendary benchmark. Volcanic sites produce wines with distinctive mineral complexity.' },
  ],
  // ===== GERMANY — RHEINGAU =====
  'Rheingau': [
    { name:'Rheingau Riesling — Trocken', classification:'QbA/Prädikat', grapes:["Riesling (dominant, 79% of plantings)"], method:'Stainless steel or old oak, dry fermented', aging:'No minimum; quality wines: 12–18 months', abv:'12–13.5%', style:'Full body, dry, structured, elegant, peach, citrus, mineral, high acid, long aging potential', notes:'South-facing slopes above Rhine River. Historically the most prestigious German Riesling region. Schloss Johannisberg: first classified German wine estate (1720). Kloster Eberbach: historic Cistercian abbey. "Ersten Gewächse" (First Growths): dry Riesling classification. Geisenheim: Germany\'s famous wine university.' },
    { name:'Rheingau Riesling — Spätburgunder (Pinot Noir)', classification:'QbA/Prädikat', grapes:["Spätburgunder (Pinot Noir, 12% of plantings)"], method:'French oak, lighter extraction', aging:'12 months', style:'Light-medium body, red cherry, elegant, earthy, silky tannins — delicate German Pinot style', notes:'Assmannshausen: famous for red Spätburgunder within Rheingau. Georg Breuer: also makes fine red. German red wine quality rising dramatically since 2000s. Weight and style: lighter than Burgundy.' },
  ],
  // ===== GERMANY — RHEINHESSEN =====
  'Rheinhessen': [
    { name:'Rheinhessen Riesling — Nierstein Trocken', classification:'QbA', grapes:["Riesling (dominant in quality zones)"], method:'Stainless steel, dry fermented', aging:'No minimum', style:'Medium body, dry, mineral, citrus, stone fruit, earthy character from red slate soils', notes:'Rheinhessen is Germany\'s largest wine region. Wide quality range. Best wines: Rheinhessen Trocken Riesling from Nierstein (red slate = "Roter Hang" or red slope). Keller: Rheinhessen\'s most celebrated producer, world-class. St. Antony, Wittmann: also top quality.' },
    { name:'Rheinhessen Silvaner / Grauburgunder / Weissburgunder', classification:'QbA', grapes:["Silvaner, Grauburgunder (Pinot Gris), Weissburgunder (Pinot Blanc)"], method:'Stainless steel, clean modern style', aging:'No minimum', style:'Silvaner: dry, neutral, earthy, asparagus note. Grauburgunder: full, spicy, stone fruit. Weissburgunder: crisp, apple, clean', notes:'Rheinhessen is more than Riesling. Silvaner: classic food wine. Grauburgunder and Weissburgunder: increasingly popular. Gunderloch, Schales: good producers across varieties.' },
    { name:'Rheinhessen Müller-Thurgau / Dornfelder', classification:'QbA', grapes:["Müller-Thurgau (large plantings), Dornfelder (red)"], method:'Tank, fresh, commercial', aging:'No minimum', style:'Müller-Thurgau: light, grapey, simple, off-dry, floral. Dornfelder: deep purple, low acid, red fruit, juicy, easy-drinking', notes:'Volume wines. Müller-Thurgau: Riesling × Madeleine Royale cross. Simple but widely grown. Dornfelder: Germany\'s most popular red variety for easy drinking. Both important for German wine basics exam knowledge.' },
  ],
  // ===== GERMANY — PFALZ =====
  'Pfalz': [
    { name:'Pfalz Riesling — Trocken / GG (Grosses Gewächs)', classification:'QbA / VDP.Grosse Lage', grapes:["Riesling (dominant quality grape)"], method:'Stainless steel or old oval casks; dry fermented', aging:'GG: min 18 months before release (September following 2nd year)', abv:'12.5–13.5%', style:'Full body, dry, powerful, ripe stone fruit (peach, nectarine), spice, minerality, lower acid than Mosel/Rheingau — warmer climate', notes:'Germany\'s warmest Riesling region (southern Pfalz = almost Alsace). Two zones: Mittelhaardt (best — Forst, Deidesheim, Ruppertsberg, Wachenheim) and Südliche Weinstrasse. Basalt and sandstone soils. Knipser, Müller-Catoir, Bassermann-Jordan, Dr. Bürklin-Wolf: top producers. GG (Grosses Gewächs) = VDP\'s dry single-vineyard designation.' },
    { name:'Pfalz Spätburgunder (Pinot Noir)', classification:'QbA / VDP.Grosse Lage', grapes:["Spätburgunder (Pinot Noir)"], method:'Burgundy-inspired: partial whole-bunch, old oak foudres and new barriques', aging:'12–18 months', style:'Medium-full body, red and dark cherry, earthy, spice, silky tannins — Germany\'s best Pinot Noirs often here', notes:'Pfalz leading red wine region. Knipser: benchmark for Pfalz Spätburgunder. Hansjörg Rebholz: elegant, Burgundy-inspired. Quality rival to Assmannshausen. Warming climate improving ripeness.' },
    { name:'Pfalz Weissburgunder (Pinot Blanc) / Grauburgunder', classification:'QbA', grapes:["Weissburgunder (Pinot Blanc), Grauburgunder (Pinot Gris)"], method:'Stainless steel; some barrel fermented', aging:'No minimum', style:'Full-medium body, ripe apple, peach, spice, nutty, clean, dry', notes:'Warmer climate = fuller styles of Pinot Blanc and Pinot Gris than further north. Excellent food wines. Rebholz makes outstanding examples. Good everyday drinking.' },
  ],
  // ===== GERMANY — BADEN =====
  'Baden': [
    { name:'Baden Spätburgunder (Pinot Noir)', classification:'QbA / VDP.Grosse Lage', grapes:["Spätburgunder (Pinot Noir, 35% of Baden plantings)"], method:'French oak barriques (12–18 months); partial whole-bunch; Burgundy-inspired winemaking', aging:'12–18 months', style:'Medium-full body, red and dark cherry, silky tannins, earthy, elegant, complex', notes:'Germany\'s largest region by area (southernmost). Kaiserstuhl: volcanic basalt plateau = warmest, finest Spätburgunder zone. Bernhard Huber (Malterdingen): benchmark until his early death — Huber estate continues. Andreas Laible: also superb. Quality rivals or exceeds Burgundy village wines.' },
    { name:'Baden Weissburgunder / Grauburgunder', classification:'QbA', grapes:["Weissburgunder (Pinot Blanc), Grauburgunder (Pinot Gris)"], method:'Stainless steel or barrel, often with skin contact (Grauburgunder)', aging:'No minimum; oak versions: 8–12 months', style:'Full body, ripe, nutty, spicy, peach — Germany\'s richest Pinot Blanc and Gris', notes:'Baden\'s warm climate creates Alsace-like richness for these varieties. Kaiserstuhl and Tuniberg volcanic soils. Karl H. Johner, Salwey: top producers for both varieties. Popular Michelin-starred restaurant wine.' },
    { name:'Baden Riesling', classification:'QbA', grapes:["Riesling"], method:'Stainless steel', aging:'No minimum', style:'Full body, ripe, stone fruit, lower acid than Mosel — warmer and rounder style', notes:'Less common in Baden than Spätburgunder or Pinot varieties. Ortenau district: best Riesling zone in Baden. Markgräflerland: Gutedel (Chasselas) dominant.' },
  ],
  // ===== GERMANY — FRANKEN =====
  'Franken': [
    { name:'Franken Silvaner — Trocken (Bocksbeutel)', classification:'QbA/Prädikat', grapes:["Silvaner (dominant in quality zones), Müller-Thurgau, Bacchus, Riesling"], method:'Stainless steel, dry fermented', aging:'No minimum', style:'Dry, earthy, mineral, asparagus/herbaceous, lean, high acid — distinctive "Franconian" style', notes:'Unique bottle: Bocksbeutel (flat-sided flagon). Silvaner: the noble grape of Franken (vs Riesling elsewhere). Continental climate. Würzburg: cultural center. Würzburger Stein: most famous single vineyard. Juliusspital, Bürgerspital, Hans Wirsching: top estates. WSET exam: what is Franken known for? Silvaner + Bocksbeutel bottle.' },
    { name:'Franken Riesling / Riesling Trocken', classification:'QbA', grapes:["Riesling (growing in quality zones)"], method:'Stainless steel, dry', aging:'No minimum', style:'Full body, dry, stone fruit, high acid, earthy Franken mineral character', notes:'Less common than Silvaner but quality is high. Hans Wirsching makes fine Franken Riesling from Iphofen (gypsum-laden marl soils = distinctive). Worth knowing alongside Silvaner.' },
  ],
  // ===== AUSTRIA — NIEDERÖSTERREICH =====
  'Wachau / Kremstal / Kamptal (Niederösterreich)': [
    { name:'Wachau Riesling — Smaragd', classification:'Wachau (DAC adjacent)', grapes:["Riesling (100%)"], method:'Stainless steel, long slow fermentation; dry', aging:'No minimum; ages 10–20+ years', abv:'13–14.5%', style:'Full body, dry, powerful, peach, grapefruit, apricot, mineral (primary/rock), herbal, long, complex', notes:'Wachau: narrow Danube gorge, steep terraced vineyards, primary rock (gneiss/granite) soils. Three ripeness categories: Steinfeder (lightest, <11.5% ABV), Federspiel (dry, 11.5–12.5%), Smaragd (named after green lizard, richest, 12.5%+). FX Pichler: legendary benchmark — Dürnsteiner Kellerberg Smaragd. Knoll, Prager, Rudi Pichler: also iconic. Loibner vineyard opposite Dürnstein: finest terroir.' },
    { name:'Wachau Grüner Veltliner — Smaragd', classification:'Wachau', grapes:["Grüner Veltliner (100%)"], method:'Stainless steel, dry', aging:'No minimum; Smaragd ages 5–15 years', abv:'13–14.5%', style:'Full body, dry, white pepper (signature), citrus, stone fruit, mineral, long aging potential', notes:'GrüVe is Austria\'s signature variety — distinctive white pepper note on finish. Wachau Smaragd = richest, most age-worthy expression. FX Pichler, Alzinger, Jamek: top producers. Different from Kremstal/Kamptal GV — more powerful.' },
    { name:'Kremstal DAC Grüner Veltliner / Riesling', classification:'DAC', grapes:["Grüner Veltliner (dominant), Riesling"], method:'Stainless steel; dry', aging:'No minimum', style:'GV: medium-full body, white pepper, citrus, stone fruit, mineral. Riesling: elegant, citrus, stone fruit, high acid.', notes:'Kremstal surrounds the town of Krems. Loess and primary rock soils. Nigl, Stadt Krems (Kloster Und), Salomon-Undhof: top producers. GV and Riesling must be dry to use DAC designation. Quality rival to Wachau at lower prices.' },
    { name:'Kamptal DAC Grüner Veltliner / Riesling', classification:'DAC', grapes:["Grüner Veltliner (dominant), Riesling"], method:'Stainless steel; dry', aging:'No minimum', style:'GV: medium-full, white pepper, citrus, mineral, more lush than Wachau. Riesling: crisp, citrus, stone fruit.', notes:'Kamp river valley north of Krems. Famous vineyards: Heiligenstein (Riesling — distinctive "Urgestein" volcanic rock soil), Lamm, Gaisberg (GV). Bründlmayer: the iconic Kamptal estate. Hirsch, Jurtschitsch: also top. Accessible DAC with excellent value.' },
  ],
  // ===== AUSTRIA — BURGENLAND =====
  'Burgenland': [
    { name:'Burgenland Blaufränkisch (Leithaberg / Mittelburgenland DAC)', classification:'DAC', grapes:["Blaufränkisch (100% for DAC reds)"], method:'Large foudres (traditional Austrian) or new barriques; sometimes both', aging:'Leithaberg: min 12 months. Mittelburgenland: min 12 months.', style:'Full body, dark cherry, black pepper, spice, firm tannin, high acid, complex — Austria\'s greatest red grape', notes:'Blaufränkisch (Lemberger in Germany, Kékfrankos in Hungary): makes Austria\'s finest reds. Three DACs: Leithaberg (limestone + schist = elegant, cool), Mittelburgenland (clay = richer, fuller), Eisenberg DAC (slate = peppery, mineral). Moric: benchmark for old-vine Blaufränkisch. Ernst Triebaumer, Gesellmann, Prieler: top estates.' },
    { name:'Burgenland TBA / Beerenauslese (Neusiedlersee)', classification:'Prädikat', grapes:["Welschriesling, Chardonnay, Pinot Blanc, Bouvier, Scheurebe and others — botrytis-prone varieties"], method:'Botrytis cinerea (noble rot); natural sweetness; no fortification; barrel aged', aging:'2+ years for TBA; often much longer', abv:'Varies widely — 6–13% (natural, not fortified)', style:'TBA: intensely sweet, concentrated, honey, apricot, saffron, marmalade — extraordinary complexity and acidity for balance', notes:'Lake Neusiedl (Neusiedlersee): shallow Pannonian lake with morning fogs creating annual botrytis conditions — most reliable in the world. Kracher (Alois Kracher): world-famous for TBA and Beerenauslese (BA). Feiler-Artinger: also excellent. Both sweet and (new) dry Zweigelt from same zone.' },
    { name:'Neusiedlersee DAC (Zweigelt)', classification:'DAC', grapes:["Zweigelt (100%)"], method:'Stainless steel or large old oak; ripe extraction', aging:'No minimum', style:'Medium body, deep ruby, red cherry, pepper, earthy, soft tannins — easy-drinking red', notes:'Zweigelt: Austria\'s most-planted red grape (Blaufränkisch × St. Laurent cross). Fruity, approachable, low tannin. New DAC (2012). Gols: key village. Schloss Halbturn, Umathum: quality producers.' },
  ],
  // ===== HUNGARY — TOKAJ =====
  'Tokaj': [
    { name:'Tokaji Aszú (3, 4, 5, 6 Puttonyos)', classification:'PDO', grapes:["Furmint (dominant), Hárslevelű, Sárga Muskotály (Yellow Muscat, small amount)"], method:'Botrytis-infected aszú berries (individually harvested "Essencia" grapes) added by puttonyos (wooden hods of ~25kg) to fermenting base wine or dry base wine. Number of puttonyos = sweetness level. Aged in small Gönc barrels (136L) in tunnels (partly oxidative).', aging:'Aszú: min 2 years in oak + 1 year in bottle. Aszú Eszencia: 3+ years.', abv:'10–14%', style:'Deep gold to amber, sweet to very sweet, honey, apricot, orange marmalade, dried fruit, spice, botrytis complexity, high acid for balance — remarkably age-worthy', notes:'Hungary\'s and one of world\'s greatest sweet wines. "Wine of kings, king of wines" (Louis XIV). Puttonyos now indicated as minimum sugar (3Pu=60g/L RS, 4Pu=90g/L, 5Pu=120g/L, 6Pu=150g/L — only 5 and 6 puttonyos produced since 2013 regulations). Tokaj hill region (volcanic tuff, rhyolite); unique combination of botrytis varieties. Royal Tokaji: first-class estates. Château Pajzos, Disznókő (AXA Millésimes): major French investment brought quality revolution.' },
    { name:'Tokaji Szamorodni', classification:'PDO', grapes:["Furmint, Hárslevelű"], method:'Entire bunches fermented (including aszú and non-aszú berries together). Dry (Száraz) or sweet (Édes). Oxidative aging like Vin Jaune.', aging:'Min 2 years: 1 in oak + 1 in bottle', style:'Dry (Száraz): bone dry, oxidative, nutty, complex, saline — like dry Sherry. Sweet (Édes): honeyed, amber, dried fruit.', notes:'Szamorodni = "as it comes" in Polish (the old noble language of trading). Both versions undergo partial oxidative aging with flor-like yeast (like Fino Sherry). Unique style: if botrytis is patchy, whole bunches fermented together.' },
    { name:'Tokaji Furmint (Dry)', classification:'PDO', grapes:["Furmint (100%)"], method:'Stainless steel or old oak; dry fermented; minimal oxidation', aging:'No minimum; quality dry aged 6–12 months', abv:'13–14%', style:'Full body, very high acid, citrus (lime), stone fruit, ginger, saline mineral, long finish — outstanding dry white', notes:'Modern renaissance: top producers now making world-class dry Furmint. Furmint = extremely high acid, thick-skinned, late-ripening. Volcanic soils (tuff, rhyolite). Oremus, Demeter, Juliet Victor: top dry Furmint. Internationally competitive price/quality. Similar to White Burgundy in body but with unique character.' },
    { name:'Tokaji Eszencia', classification:'PDO', grapes:["Furmint, Hárslevelű"], method:'Gravity-dripped "free-run" juice from aszú berries only — no pressing, just gravity. Ferments slowly for years.', aging:'Min 3 years in Gönc barrels; often 5–10+ years', abv:'2–5% (barely ferments — extreme sugar prevents yeast)', style:'Nearly unfermentable, syrup consistency, intensely sweet (400–900g/L RS!), concentrated essence of botrytis honey, apricot, infinite complexity, ages 100+ years', notes:'The rarest wine in the world by volume. Free-run juice from aszú berries: pure botrytis nectar. So sweet yeast can barely survive — ferments for years reaching only 2–5% ABV. Sold in small (50–100ml) quantities. Historically used as medicine. A tablespoon can resuscitate a dying person (legend). Beyond price comparison.' },
  ],
  // ===== GREECE — NAOUSSA =====
  'Naoussa PDO': [
    { name:'Naoussa PDO (Xinomavro)', classification:'PDO', grapes:["Xinomavro (100%)"], method:'Traditional: long maceration (2–3 weeks), large oak aging. Modern: shorter maceration, French barriques.', aging:'Min 1 year in oak + 6 months bottle; Reserva: 2 years in oak', style:'Full body, high acid, high tannin, red and dark fruit, sour cherry, olive tapenade, leather, tomato — described as "the Barolo of Greece"', notes:'Xinomavro ("acid black") = Greece\'s most complex red grape. Aromatic loss of color with age (like Nebbiolo). Cool-climate northern Greece (Macedonia). Domaine Thymiopoulos: the acclaimed young producer revitalizing the region. Kyr-Yianni: iconic estate. Naoussa: steep terraced vineyards on flanks of Mount Vermio.' },
    { name:'Naoussa Xinomavro — Vieilles Vignes / Single Vineyard', classification:'PDO', grapes:["Xinomavro (100%)"], method:'Burgundy-inspired: whole-bunch, aged French oak', aging:'18–24 months', style:'Complex, elegant, dried rose, tobacco, mineral, very fine tannin, extraordinary', notes:'Top level of Naoussa from single plots. Thymiopoulos "Uranos" and "Earth and Sky": benchmark. Comparable to good Barolo in complexity and price. Greece\'s most internationally acclaimed red wine.' },
  ],
  // ===== GREECE — NEMEA =====
  'Nemea PDO': [
    { name:'Nemea PDO (Agiorgitiko)', classification:'PDO', grapes:["Agiorgitiko (100%)"], method:'Various: stainless, concrete, French oak', aging:'No minimum; Reserva: min 2 years oak', style:'Medium-full body, deep ruby, plum, cherry, earthy, velvety tannins, good acid, accessible', notes:'Nemea: "Blood of Hercules" (from Hercules\' slaying of the Nemean Lion). Agiorgitiko ("Saint George\'s grape") = most-planted Greek red variety. Three altitude zones: low (rich, jammy), mid (balanced), high (most elegant). Gaia Estate (Gaia Wines): outstanding producer. Skouras: also excellent.' },
    { name:'Nemea PDO Rosé (Agiorgitiko)', classification:'PDO', grapes:["Agiorgitiko (100%)"], method:'Direct press or brief maceration, cold fermentation', aging:'No minimum', style:'Dry, salmon-pink, strawberry, cherry, fresh, medium body', notes:'Excellent Greek rosé from lower-altitude Nemea vines. Often better value than red Nemea. Gaia Estate "14-18h": iconic rosé made with brief skin contact.' },
  ],
  // ===== GREECE — SANTORINI =====
  'Santorini PDO': [
    { name:'Santorini PDO (Assyrtiko)', classification:'PDO', grapes:["Assyrtiko (min 75%), Athiri, Aidani"], method:'Stainless steel (traditional dry); barrel fermented (premium). No irrigation possible — basket-trained vines (kouloura) for wind protection.', aging:'No minimum; barrel versions: 6–12 months', abv:'13–15%', style:'Full body, extremely high acid, dry, citrus (lime, lemon), saline/iodine mineral, smoke, volcanic character — riveting intensity', notes:'Unique terroir: volcanic Aegean island, 500–3500 year old ungrafted vines (phylloxera can\'t survive volcanic ash soil), extreme drought, Meltemi winds. Basket-trained kouloura vines. Santo Wines (cooperative), Hatzidakis, Domaine Sigalas, Estate Argyros: top producers. Assyrtiko on Santorini = one of world\'s most distinctive white wine terroirs. Export success story.' },
    { name:'Vinsanto PDO (Santorini Sweet)', classification:'PDO', grapes:["Assyrtiko, Athiri, Aidani"], method:'Sun-dried grapes (passerillage) for 14+ days, then fermented and aged in small oak for min 2 years', aging:'Min 2 years in oak; premium 10–20 years', abv:'9–14%', style:'Sweet to luscious, amber, dried fig, raisin, honey, coffee, chocolate, orange peel, high acid, complex', notes:'Vinsanto = "wine of Santorini" (not Italian Vin Santo). Different to mainland Greek dried-grape wines. No botrytis — sun drying only. Estate Argyros: benchmark producer. Remarkable age-worthy sweet wine. Recently subject of EU PDO dispute with Italian Vin Santo (resolved in Greece\'s favor).' },
  ],


  // ===== USA — NAPA VALLEY =====
  'Napa Valley': [
    { name:'Napa Valley Cabernet Sauvignon', classification:'AVA', grapes:["Cabernet Sauvignon (dominant, often 80–100%), Merlot, Cabernet Franc, Petit Verdot, Malbec"], method:'New French oak (225L barriques), 18–24 months; malolactic fermentation; extended maceration', aging:'18–24 months in new French oak', abv:'14–15.5%', style:'Full body, intense cassis, blackcurrant, blackberry, cedar, vanilla, chocolate, tobacco, firm polished tannins, long finish, age-worthy', notes:'America\'s most prestigious red wine. Napa Valley AVA contains 16 sub-AVAs. Benchmark estates: Beaulieu Vineyard (Georges de Latour Private Reserve), Stag\'s Leap (won Paris Tasting 1976), Heitz Cellar (Martha\'s Vineyard — eucalyptus character), Caymus, Screaming Eagle (cult), Harlan Estate, Opus One (Mondavi/Mouton Rothschild). Climate: warm days, cool nights from San Francisco Bay. Valley floor vs mountain sub-AVAs critical.' },
    { name:'Napa Valley — Stags Leap District Cabernet Sauvignon', classification:'AVA', grapes:["Cabernet Sauvignon (dominant), Merlot"], method:'French oak, 18–20 months', aging:'18–20 months in French oak', style:'Full body, elegant, silky tannins, cassis, cedar, tobacco — softer than Rutherford/Oakville, often described as most "European" style Napa Cab', notes:'Eastern benchlands with volcanic tuff soils. Stag\'s Leap Wine Cellars: beat top Bordeaux in Paris Tasting 1976. Clos du Val: also excellent. Designated sub-AVA (distinct from Stags\' Leap Winery — note apostrophe position).' },
    { name:'Napa Valley — Rutherford Cabernet Sauvignon', classification:'AVA', grapes:["Cabernet Sauvignon (dominant)"], method:'French oak, extended aging', aging:'18–24 months', style:'Full body, distinctive "Rutherford dust" (earthy, mineral, herbs), cassis, chocolate, tobacco, structured', notes:'"Rutherford dust" = legendary quality descriptor for unique earthy mineral character. Alluvial fans. Beaulieu Vineyard, Inglenook (Coppola), Rubicon Estate: historic estates. Benchmark for Napa Cabernet heritage.' },
    { name:'Napa Valley — Oakville Cabernet Sauvignon', classification:'AVA', grapes:["Cabernet Sauvignon (dominant)"], method:'French oak', aging:'18–24 months', style:'Full body, concentrated, plum, cassis, spice, firm structure — benchmark Napa Cab', notes:'Home to Robert Mondavi Winery (transformed California wine industry), Opus One, Far Niente, Groth. Oakville Grocery landmark. Diverse soils (alluvial, volcanic). Quality heartland of Napa.' },
    { name:'Napa Valley — Howell Mountain / Spring Mountain / Diamond Mountain Cabernet Sauvignon', classification:'AVA', grapes:["Cabernet Sauvignon (dominant), Merlot, Cab Franc"], method:'Mountain winemaking: small lots, French oak', aging:'24+ months for mountain wines', style:'Full body, powerful, very firm tannins, concentrated dark fruit, iron/mineral, cooler mountain character — excellent aging (15–25+ years)', notes:'Mountain AVAs: higher elevation (1000-2000ft+), volcanic/rocky soils, smaller berries, thicker skins = more tannin and concentration. Dunn Vineyards (Howell Mountain): benchmark for mountain Napa — ages extraordinarily. Sky-high prices for Screaming Eagle, Harlan (hillside vineyards).' },
    { name:'Napa Valley Chardonnay', classification:'AVA', grapes:["Chardonnay (100%)"], method:'Barrel fermented in new/used French oak; malolactic fermentation (full); bâtonnage (lees stirring)', aging:'8–12 months in oak', style:'Full body, rich, buttery, toasty, vanilla, ripe apple, tropical fruit, cream — the archetypal "Napa style" (now shifting to leaner styles)', notes:'Carneros (southernmost, coolest): best Chardonnay sub-AVA, influenced by San Pablo Bay. Hyde Vineyard (Hyde de Villaine): world-class. Kistler, Kongsgaard: benchmark. "Butter bomb" style: full malo + heavy oak = traditional California Chardonnay. Trend shifting to less oak, less malo.' },
  ],
  // ===== USA — SONOMA =====
  'Sonoma County': [
    { name:'Sonoma Pinot Noir (Russian River Valley AVA)', classification:'AVA', grapes:["Pinot Noir (100%)"], method:'Cold soak, whole-bunch possible, French oak (50–100% new)', aging:'10–16 months in French oak', style:'Medium body, silky, red cherry, strawberry, spice, earth, cola, forest floor — among best Pinot Noir in world', notes:'Russian River Valley: Pinot Noir heartland. Morning fog from Pacific burns off by afternoon — cool climate. Goldridge sandy loam soils. Williams Selyem: the benchmark (estate and vineyard designates). Kistler, Littorai, Rochioli (estate wines rarely seen outside): top tier. Also Flowers, La Crema, Merry Edwards: widely available quality.' },
    { name:'Sonoma Chardonnay (Russian River Valley / Sonoma Coast)', classification:'AVA', grapes:["Chardonnay (100%)"], method:'Barrel fermented; degree of new oak varies; some producers avoid/minimize malo', aging:'8–12 months in oak', style:'Medium-full body, apple, pear, citrus, subtle oak, crisp acid — leaner and more mineral than Napa Chardonnay', notes:'Cooler climate than Napa = more restrained style. Hyde, Kistler, Kosta Browne (from purchased fruit): top quality. Sonoma Coast AVA: very cool, fog-influenced — even more restrained, almost Burgundian. Flowers, Littorai, Hirsch Vineyards: benchmark Sonoma Coast Chardonnay.' },
    { name:'Sonoma Zinfandel (Dry Creek Valley AVA)', classification:'AVA', grapes:["Zinfandel (dominant, often 85–100%), Petite Sirah (sometimes blended)"], method:'American or French oak; warm fermentation', aging:'12–18 months', style:'Full body, ripe blackberry, plum, jam, spice, pepper, licorice, high alcohol (14–16%), generous', notes:'Dry Creek Valley: Zinfandel heartland. Old vines on dry-farmed benchland ridges. Seghesio, Ridge (Geyserville blend also includes Carignane/Mataro), Ravenswood: key producers. Zinfandel = California\'s heritage variety (Croatian origins as Tribidrag/Crljenak Kaštelanski identified 2001).' },
    { name:'Sonoma Cabernet Sauvignon (Alexander Valley AVA)', classification:'AVA', grapes:["Cabernet Sauvignon (dominant), Merlot, Cab Franc"], method:'French oak, 18–20 months', aging:'18–20 months', style:'Full body, ripe, soft, accessible cassis, plum, vanilla — warmer, more approachable than Napa Cab', notes:'Alexander Valley: warmer than Russian River Valley, influenced by inland heat. Jordan Winery: large producer of elegant, food-friendly Cab. Stonestreet: mountain vineyards. Ridge Monte Bello: hillside benchmark for California Cab (classic since 1970 Paris Tasting).' },
    { name:'Sonoma Sparkling Wine (J Vineyards / Schramsberg)', classification:'AVA', grapes:["Pinot Noir, Chardonnay, Pinot Meunier"], method:'Traditional method — secondary fermentation in bottle', aging:'Min 18 months on lees; prestige cuvées 3–5+ years', style:'Fine bubbles, apple, citrus, brioche, toasty — very good Champagne-alternative quality', notes:'Schramsberg: California\'s most historic sparkling house (1862, revived 1965). J Vineyards: high quality, Brut and Rosé. Iron Horse (Green Valley): prestigious benchmark, served at White House. Good quality at fraction of Champagne price.' },
  ],
  // ===== USA — CENTRAL COAST =====
  'Central Coast (Paso Robles, Santa Barbara)': [
    { name:'Santa Barbara — Pinot Noir (Santa Rita Hills AVA)', classification:'AVA', grapes:["Pinot Noir (100%)"], method:'Whole-bunch fermentation common; French oak', aging:'10–14 months in French oak', style:'Medium body, bright red cherry, cranberry, mineral, floral, high acid — distinctive, cool-climate purity', notes:'"Sideways" movie (2004) put Santa Barbara Pinot Noir on the map globally. Santa Rita Hills: coolest sub-AVA (east-west transverse valleys channel Pacific fog and wind). Sta. Rita Hills (Santa Rita Hills): Brewer-Clifton, Sea Smoke, Sanford, Melville: top estates. Sandstone, shale, clay soils. Highly individualistic terroir.' },
    { name:'Santa Barbara — Chardonnay (Santa Maria Valley / Sta. Rita Hills)', classification:'AVA', grapes:["Chardonnay (100%)"], method:'Barrel fermented, varying malo usage', aging:'8–12 months in French oak', style:'Medium-full body, citrus, apple, stone fruit, mineral, integrated oak — elegant, less tropical than Napa Chardonnay', notes:'Santa Maria Valley: extremely cool (further north), fog-driven. Au Bon Climat: benchmark — more Burgundian style (Jim Clendenen). Foxen: another key name. Two sub-AVAs: Santa Maria (coolest), Happy Canyon (warmest). Good typicity for WSET.' },
    { name:'Paso Robles — Cabernet Sauvignon & GSM Blends', classification:'AVA', grapes:["Cabernet Sauvignon (West Side); Grenache, Syrah, Mourvèdre (East and West)"], method:'French/American oak; various techniques', aging:'12–20 months', style:'Full body, ripe, warm, dark fruit, generous — "Rhône in California" for GSM blends', notes:'Paso Robles: large AC with two very different sides. West Side (limestone soils, cooler): more elegant, structured. East Side (clay, warmer): richer. Justin Winery, Turley (Zinfandel legend also makes here), Tablas Creek (Perrin family of Beaucastel): top producers. Adelaida District: premium hillside area. Also strong Zinfandel.' },
    { name:'Paso Robles — Rhône Varieties (Syrah, Grenache, Mourvèdre, Viognier)', classification:'AVA', grapes:["Syrah, Grenache, Mourvèdre, Roussanne, Viognier"], method:'French oak, minimal intervention philosophy common', aging:'12–18 months', style:'Syrah: full body, dark fruit, black pepper, herbal. Viognier: aromatic, stone fruit, floral.', notes:'Tablas Creek: brought in Perrin family expertise and Beaucastel clonal material. Now the most important Rhône variety producer in California. L\'Aventure: award-winning GSM blends. Quality comparable to top Côtes du Rhône at much lower prices.' },
  ],
  // ===== USA — CENTRAL VALLEY =====
  'Central Valley': [
    { name:'California Central Valley Table Wine', classification:'AVA', grapes:["Cabernet Sauvignon, Merlot, Zinfandel, Chardonnay, Colombard, Chenin Blanc"], method:'Industrial scale; temperature-controlled fermentation in large stainless steel tanks; no oak aging for basic tier', aging:'No minimum', style:'Simple, fruit-forward, clean, easy-drinking — volume wines designed for everyday consumption', notes:'San Joaquin Valley: California\'s bulk wine heartland. Extremely hot, flat, irrigated, high yields. Gallo, Constellation, The Wine Group: massive producers. Most inexpensive California wine comes from here. Lodi AVA: smaller zone within with old-vine Zinfandel as specialty (superior quality). Michael David Winery (7 Deadly Zins): Lodi benchmark.' },
    { name:'Lodi AVA — Old Vine Zinfandel', classification:'AVA', grapes:["Zinfandel (dominant), Petite Sirah"], method:'Some whole-cluster, old vine minimal intervention, French or American oak', aging:'12–16 months', style:'Full body, jammy, blackberry, plum, raisin, pepper, licorice, high alcohol (15–16%), lush', notes:'Lodi: oasis within Central Valley. Mediterranean climate moderated by Sacramento-San Joaquin Delta breezes. Old vine Zinfandel (50–100+ year old vines) distinctive. 7 Deadly Zins (Michael David): most recognized brand. Turley Wine Cellars: cult old-vine Zinfandel from here and Napa.' },
  ],
  // ===== USA — NEW YORK STATE =====
  'New York State': [
    { name:'Finger Lakes — Riesling', classification:'AVA', grapes:["Riesling (100%)"], method:'Stainless steel; cool fermentation; dry to off-dry to sweet', aging:'No minimum', style:'Light-medium body, high acid, lime, green apple, stone fruit, mineral, off-dry to sweet — very Germaneque', notes:'Finger Lakes: deep, glacially-carved lakes moderate the harsh continental climate. NY\'s highest quality wine region. Dr. Konstantin Frank: pioneer who proved classic European varieties viable (1960s). Hermann J. Wiemer: benchmark Riesling. Red Newt Cellars, Ravines Wine Cellars: also excellent. Seneca and Cayuga Lakes: most important sub-AVAs.' },
    { name:'Finger Lakes — Dry Riesling & Gewürztraminer', classification:'AVA', grapes:["Riesling, Gewürztraminer, Pinot Gris"], method:'Stainless steel; dry fermented', aging:'No minimum', style:'Dry, high acid, mineral, citrus — challenging but elegant wines', notes:'Trend toward drier styles following German and Alsace inspiration. Ravines (dry style specialist), Kemmeter: excellent dry Riesling. Finger Lakes increasingly winning international recognition.' },
    { name:'Long Island — Cabernet Franc / Merlot', classification:'AVA', grapes:["Merlot (dominant for reds), Cabernet Franc, Cabernet Sauvignon"], method:'French oak aging', aging:'12–18 months', style:'Medium body, red fruit, earthy, accessible — Right Bank Bordeaux-influenced style', notes:'Long Island: two forks — North Fork (warmer, bulk of production) and Hamptons (cooler, smaller). Maritime-influenced. Bedell Cellars, Wölffer Estate, Paumanok: top producers. Merlot and Cabernet Franc: best varieties for the cool maritime climate. Chardonnay also notable.' },
  ],
  // ===== USA — WILLAMETTE VALLEY =====
  'Willamette Valley (Oregon)': [
    { name:'Willamette Valley Pinot Noir', classification:'AVA', grapes:["Pinot Noir (100%)"], method:'Cold soak, whole-cluster varying 20–100%, French oak (25–50% new)', aging:'10–14 months in French oak', style:'Medium body, red cherry, strawberry, cranberry, earthy, spice, silky tannins, high acid — elegant, cool-climate', notes:'Oregon\'s flagship variety. Dundee Hills: volcanic red Jory soil (iron-rich basalt) = deepest, most complex Pinot. Eola-Amity Hills: Missoula flood sediment soils, stronger winds = more mineral. Ribbonridge: sedimentary (Willakenzie) = lighter, more delicate. Domaine Drouhin Oregon: French ownership bringing Burgundy expertise. Beaux Frères (Robert Parker\'s brother-in-law): cult wine. Cristom, Archery Summit, Adelsheim: major quality producers.' },
    { name:'Willamette Valley Pinot Gris', classification:'AVA', grapes:["Pinot Gris (100%)"], method:'Stainless steel; dry; clean', aging:'No minimum', style:'Medium body, dry, white peach, pear, citrus, mineral, fresh — Oregon\'s signature white', notes:'Oregon\'s most-planted white variety. Different from Alsace (less rich, less aromatic) and Italy (more substance). Clean, food-friendly. Elk Cove, King Estate (large, sustainable), Adelsheim: reliable producers. King Estate: largest certified biodynamic winery in US.' },
    { name:'Willamette Valley Chardonnay', classification:'AVA', grapes:["Chardonnay (100%)"], method:'Barrel fermented; restrained use of new oak; whole-cluster pressing', aging:'8–12 months in oak', style:'Medium body, citrus, apple, mineral, restrained oak, crisp — Oregon is developing distinctive lean Chardonnay style', notes:'Growing in quality. Less oak-dominant than Napa/Sonoma. Domaine Drouhin Oregon "Arthur": benchmark Oregon Chardonnay with Burgundian inspiration. Lingua Franca (Burgundy consultant Larry Stone): top quality.' },
  ],
  // ===== USA — SOUTHERN OREGON AVA (umbrella) =====
  'Southern Oregon AVA': [
    { name:'Southern Oregon AVA — Overview', classification:'AVA', grapes:["Pinot Noir","Tempranillo","Cabernet Sauvignon","Syrah","Merlot","Riesling","Pinot Gris","Viognier"], method:'Varies by sub-region and variety', aging:'Varies', style:'Diverse — from cool-climate Pinot Noir (Elkton) to full-bodied Bordeaux/Rhône reds (Rogue Valley). Greatest varietal diversity in Oregon.', notes:'SOUTHERN OREGON AVA (est. 2004): Oregon\'s largest appellation by area, encompassing the entire region south of the Willamette Valley. Umbrella AVA covering Umpqua Valley (north) and Rogue Valley (south), plus smaller appellations. Warmer and drier than Willamette. Key sub-regions: Red Hill Douglas County (volcanic Jory soils, structured reds), Elkton Oregon (cool maritime, elegant Pinot and Riesling), Applegate Valley (premium complex reds), Bear Creek Valley (Bordeaux varieties, warmest zone).' },
    { name:'Southern Oregon — Tempranillo & Spanish Varieties', classification:'AVA', grapes:["Tempranillo (dominant), Graciano, Garnacha, Albariño"], method:'French or American oak; Spanish-inspired winemaking', aging:'12–18 months', style:'Medium-full body, red cherry, plum, spice, leather, firm tannin — Oregon\'s Iberian niche', notes:'Abacela Winery (Umpqua, 1992) pioneered Tempranillo in Oregon, recognizing the climate parallels to Spain\'s Ribera del Duero. Red Hill Douglas County sub-AVA: volcanic Jory-like soil at elevation — considered Oregon\'s best Tempranillo terroir. Unique to Pacific Northwest; no other major American region grows Spanish varieties at this quality level.' },
  ],
  // ===== USA — UMPQUA VALLEY =====
  'Umpqua Valley (Oregon)': [
    { name:'Umpqua Valley — Tempranillo (Red Hill)', classification:'AVA', grapes:["Tempranillo (100%)"], method:'French oak; sometimes American oak for Spanish character', aging:'12–18 months in oak', style:'Medium-full body, red cherry, plum, spice, leather, earth, firm tannin — Oregon\'s finest Tempranillo', notes:'Abacela Winery (1992) pioneered Tempranillo in Oregon after owner Milton Eng studied Spanish varieties suited to Oregon\'s climate. Red Hill Douglas County: volcanic Jory-like soil, elevation 290–490m. Considered Oregon\'s best Tempranillo terroir. World-class quality. Also producing Graciano, Garnacha, Albariño in Spanish-influenced style.' },
    { name:'Umpqua Valley — Pinot Noir', classification:'AVA', grapes:["Pinot Noir (100%)"], method:'Cold soak; French oak', aging:'10–14 months', style:'Medium body, red cherry, earth, spice — more robust than Willamette; warmer fruit profile', notes:'Oregon\'s first Pinot Noir was planted here by Richard Sommer (HillCrest, 1961). Red Hill sub-AVA: structured, concentrated from volcanic soils. Elkton Oregon sub-AVA: more maritime, elegant style. Spangler Vineyards: reliable producer. Umpqua Pinot Noir is warmer and more generous than Willamette.' },
    { name:'Umpqua Valley — Riesling (Elkton)', classification:'AVA', grapes:["Riesling (100%)"], method:'Stainless steel; cool fermentation; dry to off-dry', aging:'No minimum', style:'Light-medium body, high acid, citrus, peach, mineral, off-dry — maritime freshness', notes:'Elkton Oregon AVA: coolest and most maritime Umpqua sub-zone near the coast. Excellent Riesling from cooler slopes. Brandborg Winery: specialist in cool-climate varieties. Bridges Wine Farm. Shows Northern Willamette character in a warmer region.' },
  ],
  // ===== USA — ROGUE VALLEY =====
  'Rogue Valley (Oregon)': [
    { name:'Rogue Valley — Cabernet Sauvignon / Merlot (Bear Creek)', classification:'AVA', grapes:["Cabernet Sauvignon (dominant), Merlot, Cabernet Franc"], method:'French oak; Bordeaux-style winemaking', aging:'14–20 months in French oak', style:'Full body, dark fruit, cassis, plum, tobacco, structured tannins — Oregon\'s most Bordeaux-like reds', notes:'Bear Creek Valley: warmest Rogue sub-zone. Cabernet Sauvignon: Oregon\'s most southerly and warmest climate allows full ripening. Del Rio Vineyards: largest and most consistent producer (360 acres). Weisinger Family Winery: pioneer family estate. Significant elevation (600–750m) maintains acidity and freshness despite warm summers.' },
    { name:'Rogue Valley — Syrah & Rhône Blends', classification:'AVA', grapes:["Syrah (dominant), Grenache, Viognier"], method:'French oak; whole-cluster common for Syrah', aging:'12–16 months', style:'Medium-full body, dark plum, pepper, violet, olive, savory — elegant cool-climate Syrah', notes:'Quady North (Herb Quady): Oregon\'s Syrah specialist in Applegate Valley — internationally acclaimed. Rocky volcanic soils in Applegate give mineral complexity. Syrah thrives in mountain valleys. More Crozes-Hermitage in character (savory, structured) than Australian Shiraz. Growing reputation internationally.' },
    { name:'Applegate Valley — Complex Reds (Applegate AVA)', classification:'AVA', grapes:["Cabernet Sauvignon, Merlot, Syrah, Tempranillo"], method:'Biodynamic or organic farming common; French oak', aging:'12–18 months', style:'Medium-full body, complex, earthy, mineral, structured — mountain-influenced reds with good aging potential', notes:'Troon Vineyard: biodynamic benchmark — clay and volcanic soils, elevation 450–600m, complex mountain reds. Rocky slopes and diverse soils give complexity not found on valley floors. Applegate becoming recognized as premium Oregon red wine sub-AVA separate from warmer Bear Creek. Multiple varieties succeed at different elevations.' },
  ],
  // ===== USA — WASHINGTON STATE =====
  'Columbia Valley & Walla Walla (Washington)': [
    { name:'Columbia Valley Cabernet Sauvignon / Merlot', classification:'AVA', grapes:["Cabernet Sauvignon (dominant), Merlot, Cab Franc, Syrah"], method:'French oak, 18 months', aging:'18 months', style:'Full body, dark cassis, plum, olive, tobacco, structured tannins — powerful but not overripe (high acid from desert climate)', notes:'Columbia Valley: desert climate east of Cascades — extreme temperature variation (hot days/cold nights) maintains high natural acidity. Large AVA. Walla Walla: prestigious sub-AVA (also in Oregon). Chateau Ste. Michelle: largest producer, excellent value. Leonetti Cellar: cult wine. L\'Ecole 41, Quilceda Creek: top estates.' },
    { name:'Washington State Syrah (Columbia Valley / Walla Walla)', classification:'AVA', grapes:["Syrah (100% or dominant), Grenache (blends)"], method:'French oak, sometimes whole-cluster', aging:'12–18 months', style:'Full body, dark fruit, pepper, olive, meaty, savory — considered some of best Syrah in world', notes:'Washington Syrah gaining world recognition. Cool-climate desert style: more Northern Rhône in character than Australian Shiraz. K Vintners (Charles Smith): transformative producer. Cayuse Vineyards (Walla Walla, basalt soils): cult status. Owen Roe: also excellent. More Northern Rhône-inspired than California Syrah.' },
    { name:'Washington State Riesling', classification:'AVA', grapes:["Riesling (100%)"], method:'Stainless steel; off-dry to sweet; cool desert nights preserve acidity', aging:'No minimum', style:'Light-medium body, high acid, citrus, peach, mineral, off-dry — German-esque style', notes:'Washington makes more Riesling than any other American state. Chateau Ste. Michelle (Eroica in collaboration with Mosel\'s Dr. Loosen): benchmark off-dry Riesling. High natural acidity from temperature swings. Columbia Gorge AVA: also notable for Riesling.' },
  ],
  // ===== CANADA — BRITISH COLUMBIA (umbrella) =====
  'British Columbia (Canada)': [
    { name:'BC VQA — Okanagan Valley Overview', classification:'VQA', grapes:["Merlot","Pinot Gris","Pinot Noir","Riesling","Chardonnay","Syrah","Cabernet Sauvignon","Gewurztraminer"], method:'Varies by variety and sub-zone', aging:'Varies', style:'Diverse — semi-arid desert reds (South Okanagan: full-body, ripe tannin) to cool-climate aromatics (North Okanagan: Riesling, Gewürztraminer). Pinot Gris: BC\'s signature white — rich, textured, spicy, stone fruit.', notes:'Okanagan Valley: BC\'s flagship appellation, producing 80%+ of provincial volume. Semi-arid (250mm rainfall, Cascade rain shadow). Key sub-zones: South Okanagan/Osoyoos (warmest, desert, Merlot/Cab/Syrah), Naramata Bench (steep east-facing, diverse varieties), Kelowna (central, Pinot Noir, Chardonnay), North Okanagan (coolest, Riesling, Gewurztraminer). Major producers: Mission Hill, Quails\' Gate, Burrowing Owl, Black Hills, Tinhorn Creek.' },
    { name:'BC VQA — Similkameen Valley', classification:'VQA', grapes:["Merlot","Cabernet Franc","Cabernet Sauvignon","Chardonnay","Pinot Gris","Riesling"], method:'Often organic/biodynamic farming; French oak aging for reds', aging:'12–18 months (reds)', style:'Medium-full body, red and dark fruit, mineral, structured — mountain character with excellent natural acidity', notes:'Compact valley west of Okanagan surrounded by steep mountains. Extreme diurnal range similar to Okanagan but rockier, more mineral soils. BC\'s organic heartland by proportion — one of Canada\'s highest percentages of certified organic vineyards. Clos du Soleil: flagship estate (Bordeaux-style Signature blend, international recognition). Orofino Vineyards. Boutique scale; quality-driven.' },
    { name:'BC VQA — Fraser Valley', classification:'VQA', grapes:["Pinot Gris","Pinot Noir","Gamay","Chardonnay","Ortega","Siegerrebe"], method:'Cool climate techniques; stainless steel whites; light extraction reds', aging:'No minimum', style:'Light-medium body, fresh, cool-climate aromatics — Pinot Gris: crisp, apple, mineral; Gamay: light, fresh, red cherry', notes:'BC\'s westernmost appellation near Vancouver. Cool maritime climate (Pacific via Fraser River corridor). Lower heat accumulation than Okanagan. Suited to early-ripening varieties. Township 7: straddles both Fraser Valley and Okanagan, quality producer. Very small scale, mostly agritourism and direct sales.' },
    { name:'BC VQA — Vancouver Island', classification:'VQA', grapes:["Pinot Gris","Ortega","Pinot Noir","Gewurztraminer","Chardonnay","Marechal Foch"], method:'Cool-climate winemaking; often Germanic techniques for whites', aging:'No minimum', style:'Light-medium body, aromatic, high acid, crisp — Ortega: early-ripening, floral, citrus; Pinot Noir: light, earthy, red cherry', notes:'Cool Pacific maritime climate. Cowichan Valley: most important sub-zone, warmest microclimate. Ortega (early-ripening German cross) is uniquely suited to the short season. Blue Grouse Estate: Cowichan benchmark. Averill Creek: largest island producer. Very small boutique scale, strong agritourism.' },
    { name:'BC VQA — Gulf Islands', classification:'VQA', grapes:["Pinot Gris","Pinot Noir","Gewurztraminer","Ortega","Madeleine Sylvaner"], method:'Small artisan producers, minimal intervention common', aging:'No minimum', style:'Light, delicate, fresh — rain-shadow microclimate gives more sunshine than mainland coast; aromatic whites and light Pinot Noir', notes:'Archipelago of islands (Salt Spring, Saturna, Galiano, Pender) between Vancouver Island and BC mainland. Unique rain shadow — drier and sunnier than mainland despite coastal location. Salt Spring Vineyards: best known Gulf Islands producer. Very small scale; artisan, terroir-focused, mostly agritourism and local hospitality sales. Distinct, unhurried island wine culture.' },
  ],
  // ===== CANADA — ONTARIO (umbrella) =====
  'Ontario (Canada)': [
    { name:'Ontario VQA — Icewine (Vidal / Riesling)', classification:'VQA', grapes:["Vidal Blanc (volume), Riesling (prestige), Cabernet Franc (red Icewine)"], method:'Natural freeze on vine (min -8°C). Hand-harvested. Pressed frozen — only concentrated unfrozen juice extracted (~10% normal yield). Very slow cool fermentation.', aging:'No minimum', abv:'7–10%', style:'Vidal: intensely sweet, tropical (lychee, mango, apricot), honeyed, moderate acid. Riesling Icewine: higher acid, citrus, stone fruit, more complex and age-worthy. Red (Cab Franc): rare, berry-jam, rich.', notes:'Ontario produces the majority of Canada\'s Icewine output — the world\'s largest Icewine producer by volume. VQA rules prohibit artificial freezing. Inniskillin (Donald Ziraldo and Karl Kaiser): pioneered commercial Icewine and won the 1991 Vinexpo Grand Prix d\'Honneur — putting Ontario on the world wine map. Brix at harvest: minimum 35°Brix (vs ~18–22°Brix for table wine). Residual sugar: 150–220 g/L. Remarkable natural acidity balances the sweetness. Ageing potential: 10–20+ years for great Riesling Icewine (petrol, marmalade notes develop). Jackson-Triggs, Peller Estates, Cave Spring, Pillitteri: other major producers.' },
    { name:'Ontario VQA — Riesling (Niagara / Prince Edward County)', classification:'VQA', grapes:["Riesling (100%)"], method:'Stainless steel; cool fermentation; dry to off-dry; no/minimal oak', aging:'No minimum', style:'Dry to off-dry. High acid, citrus, green apple, peach, slate mineral. Age-worthy — develops petrol, toast. Elegant, European in style.', notes:'Ontario Riesling is arguably Canada\'s finest dry white — rivalling German Spätlese in quality. Niagara Escarpment limestone and clay soils give mineral precision. Cave Spring Cellars: benchmark dry Riesling, Beamsville Bench sub-zone. Closson Chase (PEC): notable example. Great acidity from cool nights and lake moderation. WSET significance: demonstrates that quality Riesling is not limited to Europe — Ontario\'s combination of limestone, cool temperatures, and lake influence produces genuinely world-class Riesling.' },
    { name:'Prince Edward County VQA — Pinot Noir / Chardonnay', classification:'VQA', grapes:["Pinot Noir (dominant), Chardonnay"], method:'Pinot: French oak, whole-cluster, minimal intervention. Chardonnay: barrel fermented, restrained new oak.', aging:'10–14 months (Pinot Noir)', style:'Pinot Noir: light-medium body, red cherry, raspberry, earthy, high acid, mineral limestone character. Chardonnay: lean, citrus, white peach, mineral, restrained.', notes:'Prince Edward County (PEC): Canada\'s most exciting emerging wine region on Lake Ontario peninsula. Limestone bedrock just below shallow clay loam topsoil — similar concept to Burgundy\'s Kimmeridgian limestone; roots reach limestone = mineral precision and lower vigour. Norman Hardie Winery: the pioneer and benchmark — biodynamic farming, elegant Pinot and Chardonnay with genuine Burgundian character. Rosehall Run: also excellent. Cool and frost-prone; only best sites succeed; very low yields. First commercial vintage early 2000s; rapid quality ascent; gaining international attention.' },
    { name:'Lake Erie North Shore VQA — Cabernet Franc / Merlot', classification:'VQA', grapes:["Cabernet Franc (dominant), Merlot, Cabernet Sauvignon"], method:'French oak; Bordeaux-style winemaking; temperature-controlled fermentation', aging:'12–16 months', style:'Medium body, red cherry, raspberry, leafy herb (Cab Franc), plum (Merlot), moderate tannin — riper than Niagara due to warmer climate', notes:'Canada\'s most southerly wine region (42°N): Lake Erie\'s shallow depth means it warms faster in spring and cools slowly in autumn — extending the growing season more than any other Canadian wine lake. Warmest Ontario wine climate. Cabernet Franc ripens reliably (unlike cooler Niagara Peninsula). Pelee Island (further south in Lake Erie): Canada\'s geographic southernmost wine producer; Mediterranean-feel with figs, peaches alongside grapes. Colio Estate, D\'Angelo Estate: main producers. Growing quality; still emerging.' },
  ],
  // ===== CANADA — NIAGARA =====
  'Niagara Peninsula (Canada)': [
    { name:'Niagara Peninsula VQA — Icewine (Eiswein)', classification:'VQA', grapes:["Vidal Blanc (dominant for volume), Riesling, Cabernet Franc (red Icewine)"], method:'Grapes must freeze naturally on vine (min -8°C). Hand-harvested frozen. Pressed immediately in cold. Concentrated juice fermented slowly.', aging:'No minimum', abv:'7–10%', style:'Vidal: intensely sweet, tropical (lychee, mango, apricot), moderate acid, syrupy. Riesling Icewine: more complex, higher acid, citrus and stone fruit. Red (Cab Franc): rich, berry-jam, unique.', notes:'Canada produces more Icewine than any country in the world (German Eiswein: rare; Canada: consistent annual production). Inniskillin: pioneered VQA Icewine and won Vinexpo Grand Prix 1991 — put Canada on world wine map. Jackson-Triggs, Henry of Pelham: also major. Vidal: thick-skinned hybrid survives -10 to -12°C easily. VQA = Vintners Quality Alliance (Canada\'s equivalent of AOC).' },
    { name:'Niagara Peninsula VQA — Chardonnay / Riesling', classification:'VQA', grapes:["Chardonnay, Riesling"], method:'Stainless steel (Riesling) or barrel fermented (Chardonnay)', aging:'No minimum', style:'Chardonnay: medium body, apple, citrus, subtle oak. Riesling: high acid, citrus, mineral, off-dry.', notes:'Lake Ontario moderates the extreme continental climate (lake effect). Two sub-AVAs: Niagara Escarpment (cooler, more limestone) and Niagara-on-the-Lake (warmer, more clay). Malivoire, Tawse, Flat Rock Cellars: top producers.' },
    { name:'Niagara Peninsula VQA — Pinot Noir / Cabernet Franc', classification:'VQA', grapes:["Pinot Noir, Cabernet Franc"], method:'French oak, light extraction', aging:'12 months', style:'Medium body, red cherry, earthy, fresh acid — cool climate, lighter style', notes:'Reds are a growth category. Escarpment Pinot Noir: best. Cab Franc important in warmer Lake Ontario zones. Tawse (biodynamic), Cave Spring, Stratus: top estates. Icewine still the iconic export product.' },
  ],
  // ===== CANADA — OKANAGAN =====
  'Okanagan Valley (Canada)': [
    { name:'Okanagan Valley VQA — Merlot / Cabernet Franc / Pinot Noir', classification:'VQA', grapes:["Merlot (dominant), Cabernet Franc, Pinot Noir, Syrah"], method:'French oak aging', aging:'12–18 months', style:'Medium-full body, dark cherry, plum, earthy — desert climate gives ripeness; elevation gives acid', notes:'British Columbia\'s wine heartland. Semi-arid (desert climate) — irrigation essential. South Okanagan (Osoyoos, Oliver): warmest, most Merlot/Cab Franc. North Okanagan (Kelowna): cooler, better Pinot Noir/whites. Mission Hill, Sumac Ridge, Burrowing Owl: top estates. Also Naramata Bench: premium hillside whites.' },
    { name:'Okanagan Valley VQA — Riesling / Chardonnay / Pinot Gris', classification:'VQA', grapes:["Riesling, Chardonnay, Pinot Gris, Gewürztraminer"], method:'Stainless steel (Riesling, PG) or barrel (Chardonnay)', aging:'No minimum', style:'High acid from cold nights. Riesling: citrus, mineral, off-dry. Pinot Gris: spicy, stone fruit. Chardonnay: restrained, fresh.', notes:'Large diurnal temperature variation (30°C+ variation) = natural high acid retained. Quails\' Gate: benchmark Chardonnay and Pinot Gris. Tantalus Vineyards: outstanding old-vine Riesling (oldest in BC). Poplar Grove: excellent Pinot Gris.' },
    { name:'Okanagan Valley VQA — Icewine', classification:'VQA', grapes:["Riesling, Vidal, Pinot Blanc"], method:'Same as Niagara: naturally frozen grapes, min -8°C', aging:'No minimum', style:'Sweet, concentrated, citrus/stone fruit (Riesling), tropical (Vidal), high acid', notes:'Okanagan produces Canada\'s second most Icewine after Niagara. Cold snaps reliable in November-December. Mission Hill, Quails\' Gate: top producers. Riesling Icewine: most prized variety here.' },
  ],


  // ===== SPAIN — ADDITIONAL REGIONS =====
  'Cariñena & Calatayud': [
    { name:'Cariñena DO (Garnacha / Cariñena)', classification:'DO', grapes:["Garnacha (dominant), Cariñena (Carignan), Tempranillo, Syrah"], method:'Stainless steel or oak', aging:'No minimum', style:'Full body, ripe dark fruit, spice, warm — old vine Garnacha specialty', notes:'Aragón region. Cariñena grape (Carignan) originates here — gave the grape its name. Old vine Garnacha on limestone. Campo de Borja (adjacent DO): also famous for "the soul of Garnacha." Good value.' },
    { name:'Calatayud DO (Garnacha)', classification:'DO', grapes:["Garnacha (dominant), Tempranillo, Syrah"], method:'Old vine, minimal intervention growing', aging:'No minimum', style:'Full body, concentrated, dark fruit, spice, high alcohol — old vine expression', notes:'High altitude (700–900m). Oldest Garnacha vines in Spain (some 100+ years old). Alto Moncayo, Ateca: quality producers gaining international recognition. Understated region, remarkable value.' },
  ],
  'Penedès & Priorat (Catalunya)': [
    { name:'Penedès DO — Torres Wines', classification:'DO', grapes:["Tempranillo, Garnacha, Cabernet Sauvignon, Chardonnay, Parellada, Xarel·lo"], method:'Modern: stainless steel whites; French oak reds', aging:'Varies', style:'International: clean, fruit-forward, accessible. Mas La Plana (Cab Sauv): structured, elegant', notes:'Miguel Torres: catalyzed quality revolution in Spain from 1970s. First to use French oak and temperature control. Mas La Plana: Torres flagship. Gran Coronas: benchmark. Also famous for Cava production.' },
    { name:'Priorat DOCa — Garnacha/Cariñena blends', classification:'DOCa', grapes:["Garnacha (dominant), Cariñena (Carignan), Cabernet Sauvignon, Syrah, Merlot"], method:'Low yield old vines, French oak (18–24 months)', aging:'18–24 months', style:'Very full body, very concentrated, slate mineral (llicorella), dark fruit, licorice, powerful, long-lived', notes:'Llicorella slate soils = distinctive mineral terroir. Alvaro Palacios (L\'Ermita): most prized Priorat wine. Clos Mogador, Clos de l\'Obac, Scala Dei: top estates. Priorat: one of only two Spanish DOCa. Very limited production, high prices.' },
  ],
  'Bierzo': [
    { name:'Bierzo DO (Mencía)', classification:'DO', grapes:["Mencía (min 70%)"], method:'Old vine (60–100+ years), minimal intervention, old oak or stainless', aging:'No minimum; quality: 12–24 months in old oak', style:'Medium body, red cherry, mineral, earthy, violet, slate, high acid, silky tannins — "the Pinot Noir of Spain"', notes:'Northwestern Spain (León). Mencía on slate hillsides of El Bierzo. Álvaro Palacios (Descendientes de J. Palacios) revitalized this obscure region with his nephew Ricardo — now internationally acclaimed. Raúl Pérez: also extraordinary producer. Slate soils give unique mineral character.' },
  ],
  'Valencia & Levante': [
    { name:'Valencia DO / Utiel-Requena DO', classification:'DO', grapes:["Bobal (dominant for Utiel-Requena), Tempranillo, Garnacha, Monastrell (Mourvèdre)"], method:'Various; modern: stainless steel', aging:'No minimum', style:'Full body, dark fruit, spice, earthy — warm Mediterranean character', notes:'Bobal: indigenous Valencia variety. Utiel-Requena: inland, cooler, best quality. Pago Casa Gran: pioneering quality estate. Monastrell: key Mediterranean variety increasingly planted here.' },
    { name:'Jumilla DO (Monastrell)', classification:'DO', grapes:["Monastrell (Mourvèdre, min 85%)"], method:'Low yield old vines (bush trained, dry farmed), stainless or oak', aging:'No minimum', style:'Full body, dark plum, chocolate, earthy, spice, high alcohol (14–15%) — dense and warming', notes:'Monastrell heartland. SE Spain, semi-arid plateau. Old vines phylloxera-free (sandy soils). Juan Gil: international success story for Jumilla quality. Bodegas Castaño: also excellent. Monastrell = Mourvèdre in France = Mataró in Australia.' },
  ],
  'La Mancha & Castilla-La Mancha': [
    { name:'La Mancha DO (Airén / Tempranillo)', classification:'DO', grapes:["Airén (white, most planted grape variety IN THE WORLD), Tempranillo (red), Garnacha, Syrah"], method:'Modern: temperature-controlled for whites; oak for quality reds', aging:'No minimum', style:'Airén whites: light, neutral, fresh, simple. Tempranillo reds: medium body, red fruit, earthy, accessible', notes:'World\'s largest wine region by area. High plateau, extreme continental climate (-10°C to +40°C). Airén: most planted variety on earth (but falling due to replanting with international varieties). Vast bulk wine production. Quality leaders (El Portillo, Félix Solís) proving La Mancha can make good affordable wines.' },
    { name:'Valdepeñas DO', classification:'DO', grapes:["Cencibel (Tempranillo, dominant), Airén"], method:'Old-fashioned: tinajas (clay amphoras) for traditional whites; oak for reds', aging:'Gran Reserva: 24 months oak + 36 months bottle', style:'Medium body, red fruit, earthy, traditional Spanish character', notes:'Within La Mancha. Higher quality ambitions. Known for traditional Reserva and Gran Reserva wines. Los Llanos: major estate.' },
  ],
  // ===== SOUTH AFRICA =====
  'Stellenbosch': [
    { name:'Stellenbosch Cabernet Sauvignon / Bordeaux Blends', classification:'WO', grapes:["Cabernet Sauvignon (dominant), Merlot, Cabernet Franc, Petit Verdot, Malbec"], method:'French oak aging (18–24 months)', aging:'18–24 months', style:'Full body, cassis, cedar, tobacco, chocolate — structured, age-worthy, Cape\'s finest reds', notes:'South Africa\'s most prestigious red wine region. Stellenbosch Mountains and Simonsberg create diverse sub-areas. Three key wine farms/wards: Helderberg (most maritime), Bottelary (clay soils), Jonkershoek Valley (cool, east-facing). Kanonkop: benchmark Pinotage and Bordeaux blends. Rust en Vrede, Waterford, Vergelegen (AngloAmerican estate), Meerlust: top estates.' },
    { name:'Stellenbosch Pinotage', classification:'WO', grapes:["Pinotage (100%)"], method:'Stainless steel or new oak; if new oak: vanilla/coffee notes', aging:'No minimum; premium: 12–18 months', style:'Full body, dark berry, earthy, smoky, coffee/chocolate (if new oak), distinctive ripe-bush character', notes:'Pinotage: created 1925 at Stellenbosch University by Abraham Perold (Pinot Noir × Cinsault cross). South Africa\'s unique red variety. Controversial: can be pungent/acetone at worst, rich/complex at best. Kanonkop: the most acclaimed Pinotage producer. "Café style" (new oak) now popular internationally.' },
    { name:'Stellenbosch Chenin Blanc (Steen)', classification:'WO', grapes:["Chenin Blanc (Steen, 100%)"], method:'Old bush vine, stainless or barrel — trending toward less new oak', aging:'No minimum', style:'Medium-full body, apple, quince, honey, ginger, citrus — rich, textured, unique character', notes:'South Africa has the world\'s oldest Chenin Blanc vines (80–100+ years). Cape White: dominated by Chenin Blanc (Steen). Old vine Chenin: world-class expression. Ken Forrester: Chenin Blanc specialist. DeMorgenzon, AA Badenhorst, Beaumont: also outstanding. "Chenin Blanc revolution" — SA now seen as equal to Loire.' },
  ],
  'Paarl': [
    { name:'Paarl Chenin Blanc / Chardonnay', classification:'WO', grapes:["Chenin Blanc, Chardonnay, Viognier"], method:'Old vine Chenin: old barrels or stainless. Chardonnay: new French oak.', aging:'No minimum', style:'Chenin: rich, honeyed, textured. Chardonnay: full body, tropical fruit, buttery, oak', notes:'Paarl: warmer than Stellenbosch. Hotter climate Chenin Blanc: richer, less precise than Stellenbosch. Some high-altitude sites (Perdeberg): fresher. Fairview: large quality producer. Simonsberg-Paarl: premium sub-ward.' },
    { name:'Paarl Shiraz / Cabernet', classification:'WO', grapes:["Shiraz, Cabernet Sauvignon, Merlot, Mourvèdre"], method:'French and American oak', aging:'12–18 months', style:'Full body, dark fruit, spice, pepper — warm Paarl climate gives generous fruit', notes:'Glen Carlou: Paarl flagship for Chardonnay and Bordeaux blends. Rupert & Rothschild (Fredericksburg): high-end Bordeaux blend. Warmer than Stellenbosch so more aromatic red varieties do well.' },
  ],
  'Constantia': [
    { name:'Constantia Sauvignon Blanc', classification:'WO', grapes:["Sauvignon Blanc (100%)"], method:'Stainless steel; cold fermentation; some barrel contact for complexity', aging:'No minimum', style:'Light-medium body, high acid, citrus, green fig, asparagus, tropical hint, grassy — cool maritime character', notes:'Cape Peninsula, cool maritime microclimate (False Bay). South Africa\'s oldest wine ward and most historic wine region. Klein Constantia, Buitenverwachting, Steenberg, Groot Constantia (state-owned oldest estate): top producers. Sauvignon Blanc excels in the cool conditions. The Constantia wine trail.' },
    { name:'Vin de Constance (Klein Constantia) — Sweet Muscat', classification:'WO', grapes:["Muscat de Frontignan (Muscat Blanc à Petits Grains)"], method:'Late harvest, natural drying, no botrytis/fortification', aging:'Min 3 years in 500L French oak', abv:'14%', style:'Sweet, amber, honeyed, dried apricot, orange marmalade, spice, high acid — extraordinary complexity', notes:'Historical recreation of the legendary 18th-century Constantia wine (favored by Napoleon in exile, Charles Dickens, Jane Austen references). World-famous in 1700–1800s; vineyards replanted in 1980s. Klein Constantia: the modern benchmark. One of the world\'s great sweet wines. Unfortified — alcohol stops naturally.' },
  ],
  'Swartland': [
