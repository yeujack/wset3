<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSET L3 Wine Regions Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header {
    background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid #7b2d8b;
    flex-shrink: 0;
  }
  #header h1 { font-size: 1.3rem; color: #e8c97a; letter-spacing: 1px; }
  #header p { font-size: 0.75rem; color: #aaa; margin-top: 2px; }
  #region-count { background: #7b2d8b; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

  #app { display: flex; flex: 1; overflow: hidden; }

  #sidebar {
    width: 280px;
    background: #16213e;
    border-right: 1px solid #0f3460;
    display: flex; flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    transition: width 0.25s ease, opacity 0.2s ease;
    position: relative;
    width: 0; min-width: 0; opacity: 0; pointer-events: none;
  }
  #sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; opacity: 0; pointer-events: none; }
  #sidebar.expanded { width: 280px; opacity: 1; pointer-events: auto; }
  #sidebar-toggle {
    position: absolute; top: 50%; z-index: 1000;
    width: 24px; height: 48px; border: 1px solid #0f3460;
    background: #16213e; color: #e8c97a; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; border-radius: 0 6px 6px 0;
    transition: left 0.25s ease, background 0.15s;
    transform: translateY(-50%);
  }
  #sidebar-toggle:hover { background: #0f3460; }
  #sidebar-toggle.shifted { left: 0; }
  #sidebar-toggle.unshifted { left: 280px; }

  #search-box {
    padding: 12px;
    border-bottom: 1px solid #0f3460;
  }
  #search-box input {
    width: 100%; padding: 8px 12px; border-radius: 20px;
    background: #0f3460; border: 1px solid #7b2d8b; color: #e0e0e0;
    font-size: 0.85rem; outline: none;
  }
  #search-box input::placeholder { color: #888; }

  .group-header {
    padding: 5px 10px 3px; margin: 8px 0 2px;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px;
    color: #aaa; cursor: pointer; display: flex; align-items: center;
    gap: 6px; border-left: 2px solid transparent;
    transition: all 0.15s; user-select: none;
  }
  .group-header:hover { color: #e8c97a; border-left-color: #e8c97a; }
  .group-header.active { color: #e8c97a; border-left-color: #e8c97a; }
  .group-chevron { font-size: 0.6rem; transition: transform 0.2s; margin-left: auto; }
  .group-header.collapsed .group-chevron { transform: rotate(-90deg); }
  .group-items.collapsed { display: none; }

  .sub-expand { margin: 2px 0 6px; padding: 4px 6px; border-left: 2px solid #7b2d8b; }
  .sub-expand-title { font-size: 0.68rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .sub-card {
    background: rgba(123,45,139,0.12); border: 1px solid rgba(123,45,139,0.3);
    border-radius: 5px; padding: 5px 8px; margin-bottom: 3px; cursor: pointer;
    transition: all 0.15s;
  }
  .sub-card:hover { background: rgba(123,45,139,0.25); border-color: #e8c97a; }
  .sub-card-name { font-size: 0.78rem; color: #e8c97a; font-weight: 500; margin-bottom: 2px; }
  .sub-card-grapes { font-size: 0.68rem; color: #b8a97a; line-height: 1.55; }
  .sub-card-grapes .grape-tag-btn { font-size: 0.65rem; padding: 1px 6px; margin: 1px 1px; }
  .sub-card-note { font-size: 0.65rem; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-card .grape-note-panel { margin-top: 4px; padding: 6px 8px; font-size: 0.68rem; }
  .sub-card .grape-note-region { font-size: 0.63rem; color: #7b2d8b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .sub-poly-tooltip { background: #16213e; color: #e8c97a; border: 1px solid #7b2d8b; font-size: 0.72rem; font-weight: 500; padding: 3px 8px; border-radius: 4px; }
  .sub-label-icon { background: none !important; border: none !important; }
  .sub-label { font-size: 0.62rem; color: #e8c97a; font-weight: 600; white-space: nowrap; text-shadow: 1px 1px 3px #000, -1px -1px 3px #000, 0 0 6px rgba(0,0,0,0.8); pointer-events: none; letter-spacing: 0.3px; }
  .sub-label-dim { opacity: 0.45; font-weight: 400; }

  #region-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  #region-list h3 { font-size: 0.75rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; margin: 6px 6px 8px; }

  .region-item {
    padding: 7px 10px; margin-bottom: 3px; border-radius: 5px;
    cursor: pointer; background: rgba(15,52,96,0.4);
    border-left: 3px solid transparent;
    transition: all 0.15s;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .region-item:hover { background: rgba(123,45,139,0.25); border-left-color: #e8c97a; }
  .region-item .r-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .region-item .r-info { flex: 1; min-width: 0; }
  .region-item .r-name { font-size: 0.82rem; color: #e0e0e0; font-weight: 500; }
  .region-item .r-country { font-size: 0.7rem; color: #888; }
  .region-item .r-grapes { font-size: 0.68rem; color: #b8a97a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #map { flex: 1; }

  /* Leaflet popup */
  .leaflet-popup-content-wrapper {
    background: #16213e; border: 1px solid #7b2d8b;
    border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    max-width: 340px;
  }
  .leaflet-popup-tip { background: #16213e; }
  .leaflet-popup-content { margin: 0; padding: 0; }

  .popup-inner { padding: 14px 16px; }
  .popup-header { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; }
  .popup-region { font-size: 1rem; font-weight: bold; color: #e8c97a; }
  .popup-country { font-size: 0.75rem; color: #888; margin-top: 2px; }

  .popup-section { margin-bottom: 8px; }
  .popup-label {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.8px;
    color: #7b2d8b; font-weight: bold; margin-bottom: 3px;
  }
  .popup-text { font-size: 0.78rem; color: #ccc; line-height: 1.5; }
  .grape-tag {
    display: inline-block; padding: 2px 8px; margin: 2px 2px;
    background: rgba(123,45,139,0.3); border: 1px solid #7b2d8b;
    border-radius: 12px; font-size: 0.7rem; color: #e8c97a;
  }
  .grape-tag-btn {
    display: inline-block; padding: 2px 8px; margin: 2px 2px;
    background: rgba(123,45,139,0.3); border: 1px solid #7b2d8b;
    border-radius: 12px; font-size: 0.7rem; color: #e8c97a;
    cursor: pointer; transition: background 0.15s, color 0.15s;
    user-select: none;
  }
  .grape-tag-btn:hover { background: rgba(123,45,139,0.55); }
  .grape-tag-btn.active { background: rgba(123,45,139,0.8); color: #fff; border-color: #b86fcc; }
  .grape-note-panel {
    margin-top: 6px; padding: 8px 10px; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(123,45,139,0.5); border-radius: 6px;
    font-size: 0.74rem; color: #ccc; line-height: 1.55; display: none;
  }
  .grape-note-panel.visible { display: block; }
  .grape-note-panel.wine-red { background: rgba(100,20,30,0.4); border-color: rgba(180,50,60,0.45); }
  .grape-note-panel.wine-red .grape-note-name { color: #e88; }
  .grape-note-panel.wine-white { background: rgba(120,110,40,0.3); border-color: rgba(180,170,70,0.4); }
  .grape-note-panel.wine-white .grape-note-name { color: #e8d880; }
  .grape-note-panel.wine-rose { background: rgba(150,80,90,0.3); border-color: rgba(200,120,130,0.4); }
  .grape-note-panel.wine-rose .grape-note-name { color: #f0b0b8; }
  .grape-note-panel.wine-both { background: rgba(100,60,110,0.3); border-color: rgba(160,100,160,0.4); }
  .grape-note-panel.wine-both .grape-note-name { color: #d0b0d8; }
  .grape-note-name { font-weight: bold; color: #e8c97a; margin-bottom: 4px; font-size: 0.75rem; }
  .popup-footer {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid #0f3460;
    font-size: 0.7rem; color: #666; font-style: italic;
  }

  /* Custom marker icon */
  .custom-pin {
    width: 28px; height: 28px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .custom-pin-inner {
    width: 10px; height: 10px; background: rgba(255,255,255,0.8);
    border-radius: 50%; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }

  /* Sub-region toggle button */
  #subregion-toggle-section {
    padding: 8px 12px;
    border-bottom: 1px solid #0f3460;
  }
  #subregion-toggle {
    width: 100%; padding: 6px 10px; border-radius: 6px;
    background: rgba(15,52,96,0.5); border: 1px solid #0f3460;
    color: #aaa; cursor: pointer; font-size: 0.78rem;
    transition: all 0.2s; text-align: left;
  }
  #subregion-toggle.active {
    background: rgba(123,45,139,0.35); border-color: #7b2d8b; color: #e8c97a;
  }
  #subregion-toggle:hover { border-color: #7b2d8b; color: #e8c97a; }

  .sub-badge {
    display: inline-block; padding: 1px 6px; margin-left: 6px;
    background: rgba(123,45,139,0.4); border-radius: 8px;
    font-size: 0.65rem; color: #e8c97a; vertical-align: middle;
  }

  /* Right info panel */
  #info-panel {
    width: 0; background: #16213e; border-left: 1px solid #0f3460;
    display: flex; flex-direction: column; overflow: hidden;
    flex-shrink: 0; transition: width 0.25s ease, opacity 0.2s ease;
    opacity: 0; pointer-events: none;
  }
  #info-panel.open { width: 320px; opacity: 1; pointer-events: auto; }
  #info-panel-header {
    padding: 10px 14px; border-bottom: 1px solid #0f3460;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #info-panel-select {
    flex: 1; font-size: 0.85rem; color: #e8c97a; font-weight: 600;
    background: rgba(15,52,96,0.5); border: 1px solid #0f3460; border-radius: 5px;
    padding: 5px 8px; cursor: pointer; outline: none;
    font-family: inherit; appearance: auto;
  }
  #info-panel-select option { background: #16213e; color: #e0e0e0; }
  #info-panel-close {
    background: none; border: none; color: #888; cursor: pointer;
    font-size: 1.1rem; padding: 2px 6px; border-radius: 4px;
    transition: color 0.15s;
  }
  #info-panel-close:hover { color: #e8c97a; }
  #info-panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .info-section { margin-bottom: 14px; }
  .info-section-label {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.8px;
    color: #7b2d8b; font-weight: bold; margin-bottom: 6px;
    cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; transition: color 0.15s;
  }
  .info-section-label:hover { color: #e8c97a; }
  .info-section-chevron { font-size: 0.55rem; transition: transform 0.2s; margin-left: auto; opacity: 0.6; }
  .info-section.collapsed .info-section-chevron { transform: rotate(-90deg); }
  .info-section.collapsed .info-section-content { display: none; }
  .info-nav-item {
    padding: 6px 10px; margin-bottom: 3px; border-radius: 5px;
    cursor: pointer; background: rgba(15,52,96,0.4);
    border-left: 3px solid transparent; transition: all 0.15s;
    font-size: 0.8rem; color: #ccc;
  }
  .info-nav-item:hover { background: rgba(123,45,139,0.25); border-left-color: #e8c97a; color: #e8c97a; }
  .info-nav-item.active { background: rgba(123,45,139,0.3); border-left-color: #e8c97a; color: #e8c97a; font-weight: 600; }
  .info-nav-sub { font-size: 0.7rem; color: #888; margin-top: 2px; }
  .info-grape-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .info-grape-tag {
    display: inline-block; padding: 3px 9px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 500; border: 1px solid rgba(255,255,255,0.15);
  }
  .info-grape-tag.red { background: rgba(139,30,30,0.45); color: #e88; border-color: rgba(200,60,60,0.4); }
  .info-grape-tag.white { background: rgba(180,170,80,0.3); color: #e8d880; border-color: rgba(200,190,100,0.4); }
  .info-grape-tag.rose { background: rgba(200,120,130,0.35); color: #f0b0b8; border-color: rgba(220,140,150,0.4); }
  .info-grape-tag.both { background: rgba(160,100,160,0.3); color: #d0b0d8; border-color: rgba(180,120,180,0.4); }
  .info-text { font-size: 0.78rem; color: #bbb; line-height: 1.55; }

  .info-wine-card { background: rgba(15,52,96,0.4); border: 1px solid rgba(123,45,139,0.3); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 0.75rem; line-height: 1.5; }
  .info-wine-name { color: #e8c97a; font-weight: 600; font-size: 0.78rem; margin-bottom: 4px; }
  .info-wine-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 0.6rem; font-weight: 600; margin-left: 4px; vertical-align: middle; }
  .info-wine-badge.docg { background: rgba(200,60,60,0.4); color: #e88; border: 1px solid rgba(200,60,60,0.3); }
  .info-wine-badge.doc { background: rgba(180,170,80,0.3); color: #e8d880; border: 1px solid rgba(180,170,80,0.3); }
  .info-wine-badge.doca, .info-wine-badge.doca { background: rgba(200,60,60,0.5); color: #f99; border: 1px solid rgba(200,60,60,0.4); }
  .info-wine-badge.igt { background: rgba(100,100,180,0.3); color: #aac; border: 1px solid rgba(100,100,180,0.3); }
  .info-wine-badge.do { background: rgba(180,170,80,0.3); color: #e8d880; border: 1px solid rgba(180,170,80,0.3); }
  .info-wine-badge.vdlt, .info-wine-badge.ava, .info-wine-badge.gi { background: rgba(100,160,100,0.3); color: #8c8; border: 1px solid rgba(100,160,100,0.3); }
  .info-wine-detail { color: #aaa; font-size: 0.7rem; }
  .info-wine-detail strong { color: #ccc; }

  /* Wine-colored grape tags for cards/popups */
  .grape-tag.red, .grape-tag-btn.red { background: rgba(139,30,30,0.4); border-color: rgba(200,60,60,0.35); color: #e88; }
  .grape-tag.white, .grape-tag-btn.white { background: rgba(180,170,80,0.25); border-color: rgba(200,190,100,0.35); color: #e8d880; }
  .grape-tag.rose, .grape-tag-btn.rose { background: rgba(200,120,130,0.3); border-color: rgba(220,140,150,0.35); color: #f0b0b8; }
  .grape-tag.both, .grape-tag-btn.both { background: rgba(160,100,160,0.25); border-color: rgba(180,120,180,0.35); color: #d0b0d8; }
  .grape-tag-btn.red:hover { background: rgba(139,30,30,0.6); }
  .grape-tag-btn.white:hover { background: rgba(180,170,80,0.45); }
  .grape-tag-btn.rose:hover { background: rgba(200,120,130,0.5); }
  .grape-tag-btn.both:hover { background: rgba(160,100,160,0.45); }

  /* Geo feature labels */
  .geo-label {
    font-size: 11px; font-weight: 600; white-space: nowrap;
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  .geo-label-river { color: #5ba8d4; font-style: italic; }
  .geo-label-mountain { color: #c8a87a; }
  .geo-label-wind { color: #8ecfab; font-style: italic; }
  .geo-label-current { color: #6ab8d8; font-style: italic; }
  .geo-label-feature { color: #c9a0d8; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #16213e; }
  ::-webkit-scrollbar-thumb { background: #7b2d8b; border-radius: 3px; }

  .hidden { display: none !important; }

  #grape-filters { padding: 10px 12px; border-bottom: 1px solid #0f3460; }
  #grape-filters h3 { font-size: 0.75rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; margin-bottom: 8px; }
  #grape-search-wrap { position: relative; }
  #grape-search { width: 100%; padding: 6px 10px; border-radius: 6px; background: #0f3460; border: 1px solid #7b2d8b; color: #e0e0e0; font-size: 0.82rem; outline: none; box-sizing: border-box; }
  #grape-search::placeholder { color: #888; }
  #grape-suggestions { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #16213e; border: 1px solid #7b2d8b; border-top: none; border-radius: 0 0 6px 6px; max-height: 140px; overflow-y: auto; z-index: 9999; }
  .grape-sug { padding: 5px 10px; cursor: pointer; font-size: 0.8rem; color: #ccc; }
  .grape-sug:hover { background: rgba(123,45,139,0.3); color: #e8c97a; }
  #active-grapes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .grape-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px 2px 9px; background: rgba(123,45,139,0.4); border: 1px solid #7b2d8b; border-radius: 12px; font-size: 0.72rem; color: #e8c97a; cursor: pointer; transition: background 0.15s; }
  .grape-chip:hover { background: rgba(200,50,50,0.35); border-color: #c33; }

  #stats-bar {
    padding: 6px 12px;
    background: rgba(15,52,96,0.5);
    border-top: 1px solid #0f3460;
    font-size: 0.7rem; color: #888;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>🍷 WSET Level 3 — Wine Regions World Map</h1>
    <p>Interactive study map · <small style="opacity:0.6;font-size:0.68rem">created by Jack Yeu, with the help of notes from Wang Haitian</small></p>
  </div>
  <div id="region-count">Loading...</div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="search-box">
      <input type="text" id="search" placeholder="🔍  Search region or grape...">
    </div>

    <div id="subregion-toggle-section">
      <button id="subregion-toggle" onclick="toggleSubregions()">
        ◎ Show Sub-appellations <span class="sub-badge" id="sub-count">0</span>
      </button>
    </div>

    <div id="grape-filters">
      <h3>Filter by Grape</h3>
      <div id="grape-search-wrap">
        <input type="text" id="grape-search" placeholder="Type a grape variety...">
        <div id="grape-suggestions"></div>
      </div>
      <div id="active-grapes"></div>
    </div>

    <div id="region-list">
      <h3>Regions (<span id="list-count">0</span>)</h3>
      <div id="region-items"></div>
    </div>

    <div id="stats-bar">
      <span id="stats-text"></span>
    </div>
  </div>

  <button id="sidebar-toggle" class="shifted" onclick="toggleSidebar()">▶</button>

  <div id="map"></div>

  <div id="info-panel">
    <div id="info-panel-header">
      <select id="info-panel-select" onchange="onInfoPanelGroupChange(this.value)"></select>
      <button id="info-panel-close" onclick="closeInfoPanel()">✕</button>
    </div>
    <div id="info-panel-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ============================================================
// WINE REGIONS DATA
// ============================================================
const COUNTRIES = {
  'France':        { color: '#3498db', flag: '🇫🇷' },
  'Germany':       { color: '#e67e22', flag: '🇩🇪' },
  'Austria':       { color: '#e74c3c', flag: '🇦🇹' },
  'Hungary':       { color: '#27ae60', flag: '🇭🇺' },
  'Greece':        { color: '#16a085', flag: '🇬🇷' },
  'Italy':         { color: '#2ecc71', flag: '🇮🇹' },
  'Spain':         { color: '#f39c12', flag: '🇪🇸' },
  'Portugal':      { color: '#8e44ad', flag: '🇵🇹' },
  'USA':           { color: '#c0392b', flag: '🇺🇸' },

function getRegionColor(regionName) {
  const group = REGION_GROUPS[regionName];
  if (group && GROUP_COLORS[group]) return GROUP_COLORS[group];
  const r = regions.find(r2 => r2.name === regionName);
  return COUNTRIES[r?.country]?.color || '#888';
}

  { name:'Saint-Estèphe', country:'France', parentRegion:'Bordeaux', lat:45.258, lng:-0.771, grapes:['Cabernet Sauvignon','Merlot'], notes:'Left Bank. More clay → more Merlot, fuller tannin, earthier. Cos d\'Estournel.' },

  { name:'Sauternes', country:'France', parentRegion:'Bordeaux', lat:44.575, lng:-0.328, grapes:['Sémillon','Sauvignon Blanc','Muscadelle'], notes:'Noble Rot. Ciron river morning mist. Min 45g/L RS. Château d\'Yquem: legendary. Honey, apricot, marmalade, great aging.' },
  { name:'Entre-Deux-Mers', country:'France', parentRegion:'Bordeaux', lat:44.75, lng:-0.30, grapes:['Sauvignon Blanc','Sémillon'], notes:'Between Garonne and Dordogne. Dry whites only in this AC. Fresh, crisp Sauvignon Blanc. Reds sold as Bordeaux AOC.' },

  { name:'Graves', country:'France', parentRegion:'Bordeaux', lat:44.62, lng:-0.52, grapes:['Cabernet Sauvignon','Merlot','Sauvignon Blanc','Sémillon'], notes:'South of Pessac-Léognan. Named for gravel soils. Both red and white wines. More affordable Left Bank wines.' },
  { name:'Haut-Médoc', country:'France', parentRegion:'Bordeaux', lat:45.08, lng:-0.78, grapes:['Cabernet Sauvignon','Merlot'], notes:'AC surrounding village appellations. 5 Classified Growths. Gravel ridges. Cab Sauv dominant. Cassis, cedar, firm tannins.' },

  // === FRANCE — Chablis ===

  // === FRANCE — Côte de Nuits ===

  { name:'Chambolle-Musigny', country:'France', parentRegion:'Côte de Nuits (Côte d\'Or)', lat:47.197, lng:4.963, grapes:['Pinot Noir'], notes:'GC: Musigny (most elegant) and Bonnes-Mares. Most feminine Côte de Nuits. Red flowers, silky. Musigny Blanc: rare Chardonnay GC.' },
  { name:'Vosne-Romanée', country:'France', parentRegion:'Côte de Nuits (Côte d\'Or)', lat:47.167, lng:4.953, grapes:['Pinot Noir'], notes:'Most prestigious village. GC: Romanée-Conti, La Tâche, Richebourg, La Romanée. Perfumed, complex, silky, extraordinary depth.' },

  { name:'Morey-Saint-Denis', country:'France', parentRegion:'Côte de Nuits (Côte d\'Or)', lat:47.207, lng:4.968, grapes:['Pinot Noir'], notes:'GC: Clos de la Roche, Clos Saint-Denis, Clos de Tart, Clos des Lambrays. Medium-full body, red and dark fruit.' },

  // === FRANCE — Côte de Beaune ===
  { name:'Aloxe-Corton', country:'France', parentRegion:'Côte de Beaune (Côte d\'Or)', lat:47.053, lng:4.867, grapes:['Chardonnay','Pinot Noir'], notes:'GC Corton (red, only red GC in Côte de Beaune) and Corton-Charlemagne (powerful, rich white). Structured, earthy.' },

  { name:'Chassagne-Montrachet', country:'France', parentRegion:'Côte de Beaune (Côte d\'Or)', lat:46.940, lng:4.818, grapes:['Chardonnay','Pinot Noir'], notes:'GC: Le Montrachet (shared), Bâtard-Montrachet (shared), Criots-Bâtard. More nutty and earthy than Puligny. Also Pinot Noir.' },
  { name:'Pommard', country:'France', parentRegion:'Côte de Beaune (Côte d\'Or)', lat:47.001, lng:4.834, grapes:['Pinot Noir'], notes:'No GC. Most tannic, structured Côte de Beaune red. PCs: Rugiens, Epenots. Dark cherry, earth, needs time.' },
  { name:'Volnay', country:'France', parentRegion:'Côte de Beaune (Côte d\'Or)', lat:46.985, lng:4.832, grapes:['Pinot Noir'], notes:'No GC. Most elegant, feminine Côte de Beaune red. Floral, red fruit, silky. PCs: Caillerets, Champans.' },

  // === FRANCE — Côte Chalonnaise ===

  { name:'Bouzeron', country:'France', parentRegion:'Côte Chalonnaise', lat:46.773, lng:4.764, grapes:['Aligoté'], notes:'Only village AC solely for Aligoté in Burgundy. High acid, lemon, crisp. Used with Cassis for Kir.' },

  // === FRANCE — Mâconnais ===
  { name:'Pouilly-Fuissé', country:'France', parentRegion:'Mâconnais', lat:46.297, lng:4.722, grapes:['Chardonnay'], notes:'Best Mâconnais AC. Limestone and clay. Ripe tropical and melon, stone fruit. Premier Cru designation since 2020.' },
  { name:'Saint-Véran', country:'France', parentRegion:'Mâconnais', lat:46.270, lng:4.720, grapes:['Chardonnay'], notes:'Surrounds Pouilly-Fuissé. Similar style, lighter and more affordable. Fresh citrus and stone fruit.' },

  // === FRANCE — Beaujolais Crus ===
  { name:'Moulin-à-Vent', country:'France', parentRegion:'Beaujolais', lat:46.194, lng:4.670, grapes:['Gamay'], notes:'Most powerful Beaujolais Cru. Manganese-rich soils. Dark fruit, full body. Can develop Pinot Noir-like complexity after 10 years.' },

  { name:'Morgon', country:'France', parentRegion:'Beaujolais', lat:46.156, lng:4.642, grapes:['Gamay'], notes:'"Morgonner" = develop Pinot-like complexity. Earthy, dark fruit, full body. Côte du Py sub-zone: most structured.' },
  { name:'Brouilly', country:'France', parentRegion:'Beaujolais', lat:46.115, lng:4.663, grapes:['Gamay'], notes:'Largest Cru. Fresh, easy-drinking. Côte de Brouilly: hillside sub-zone on volcanic Mont Brouilly.' },

  { name:'Chiroubles', country:'France', parentRegion:'Beaujolais', lat:46.175, lng:4.658, grapes:['Gamay'], notes:'Highest altitude Cru. Most delicate, aromatic, floral. Light body, pure red fruit. Best drunk young.' },

  { name:'Saint-Amour', country:'France', parentRegion:'Beaujolais', lat:46.247, lng:4.703, grapes:['Gamay'], notes:'Northernmost, most romantic-named Cru. Light, elegant, perfumed. Popular Valentine\'s wine. Relatively small production.' },
  { name:'Régnié', country:'France', parentRegion:'Beaujolais', lat:46.153, lng:4.638, grapes:['Gamay'], notes:'Newest Cru (1988). Between Morgon and Brouilly. Red currant, raspberry. Medium body, fresh, approachable.' },

  { name:'Menetou-Salon', country:'France', parentRegion:'Loire Valley — Central Vineyards', lat:47.230, lng:2.485, grapes:['Sauvignon Blanc','Pinot Noir'], notes:'West of Sancerre. Similar limestone soils. Fresh, herbaceous Sauvignon Blanc and light Pinot Noir. Good value alternative to Sancerre.' },

  { name:'Montlouis-sur-Loire', country:'France', parentRegion:'Loire Valley — Touraine', lat:47.352, lng:0.843, grapes:['Chenin Blanc'], notes:'Opposite bank from Vouvray. Similar styles: dry, off-dry, sweet, sparkling. Tuffeau limestone. Generally lighter, more mineral than Vouvray. Rising reputation.' },

  // === FRANCE — Loire Anjou-Saumur ===
  { name:'Savennières', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.370, lng:-0.723, grapes:['Chenin Blanc'], notes:'Bone dry Chenin Blanc. Schist soils. Two monopoles: Coulée de Serrant (biodynamic) and La Roche aux Moines. High acid, waxy texture, ages 20+ years.' },

  // === FRANCE — Northern Rhône ===
  { name:'Côte Rôtie', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.480, lng:4.782, grapes:['Syrah','Viognier'], notes:'Côte Brune (dark iron soil, powerful) and Côte Blonde (pale schist, elegant). Guigal La Mouline/La Landonne/La Turque: iconic. ≤20% Viognier co-fermented.' },

  { name:'Saint-Joseph', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.045, lng:4.790, grapes:['Syrah','Marsanne','Roussanne'], notes:'Long, thin strip on west bank. Most affordable N. Rhône Syrah. Variable quality. Best: concentrated from granite. Whites: Marsanne/Roussanne, fresh, floral.' },
  { name:'Saint-Péray', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:44.940, lng:4.838, grapes:['Marsanne','Roussanne'], notes:'Whites only. Still and sparkling. Southernmost N. Rhône AC. Granite + limestone. Richer and rounder than other N. Rhône whites.' },

  { name:'Lirac', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.040, lng:4.698, grapes:['Grenache','Syrah','Mourvèdre'], notes:'West bank Rhône opposite CdP. Reds, whites and rosés. Rocky galets. Underrated, similar quality potential to CdP.' },
  { name:'Rasteau', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.228, lng:5.012, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Cru since 2010. Rich, powerful Grenache-dominant. Also produces VDN (fortified). Clay-limestone terraces.' },
  { name:'Cairanne', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.240, lng:4.950, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Newest S. Rhône Cru (2016). Clay-limestone. Concentrated, structured Grenache-based reds. Rising star.' },
  { name:'Côtes du Rhône Villages', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.180, lng:4.880, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Step above generic CdR. 22 named villages. Min 50% Grenache. Better concentration and character.' },

function buildGeoFeatures() {
  // Rivers - blue polylines
  GEO_FEATURES.rivers.forEach(r => {
    const line = L.polyline(r.path, { color: '#4a9fd4', weight: 2, opacity: 0.6, dashArray: null }).addTo(geoLayer);
    line.bindTooltip(r.tooltip, { sticky: true, className: 'geo-tooltip' });
    const mid = r.path[Math.floor(r.path.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({ className: 'geo-label geo-label-river', html: r.name, iconSize: [0,0], iconAnchor: [-5, 8] }),
      interactive: false
    }).addTo(geoLayer);
  });

  // Mountains - triangle markers
  GEO_FEATURES.mountains.forEach(m => {
    const icon = L.divIcon({
      className: 'geo-label geo-label-mountain',
      html: `▲ ${m.name}`,
      iconSize: [0, 0], iconAnchor: [-5, 8]
    });
    L.marker([m.lat, m.lng], { icon }).addTo(geoLayer).bindTooltip(m.tooltip, { sticky: true });
  });

  // Winds - green dashed arrows
  GEO_FEATURES.winds.forEach(w => {
    const line = L.polyline(w.path, { color: '#6dc9a0', weight: 2.5, opacity: 0.55, dashArray: '8,6' }).addTo(geoLayer);
    line.bindTooltip(w.tooltip, { sticky: true });
    // Arrow at end
    const last = w.path[w.path.length - 1];
    const prev = w.path[w.path.length - 2];
    const angle = Math.atan2(last[0] - prev[0], last[1] - prev[1]) * 180 / Math.PI;
    L.marker(last, {
      icon: L.divIcon({
        className: 'geo-label geo-label-wind',
        html: `➤ ${w.name}`,
        iconSize: [0,0], iconAnchor: [-5, 8]
      }), interactive: false
    }).addTo(geoLayer);
  });

  // Ocean currents - cyan dashed arrows
  GEO_FEATURES.currents.forEach(c => {
    const line = L.polyline(c.path, { color: '#5bb8d8', weight: 3, opacity: 0.45, dashArray: '12,8' }).addTo(geoLayer);
    line.bindTooltip(c.tooltip, { sticky: true });
    const mid = c.path[Math.floor(c.path.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({
        className: 'geo-label geo-label-current',
        html: `〰 ${c.name}`,
        iconSize: [0,0], iconAnchor: [-5, 8]
      }), interactive: false
    }).addTo(geoLayer);
  });

  // Special features - purple markers
  GEO_FEATURES.features.forEach(f => {
    const icon = L.divIcon({
      className: 'geo-label geo-label-feature',
      html: `◆ ${f.name}`,
      iconSize: [0, 0], iconAnchor: [-5, 8]
    });
    L.marker([f.lat, f.lng], { icon }).addTo(geoLayer).bindTooltip(f.tooltip, { sticky: true });
  });
}

// Only show geo features at zoom >= 5 to reduce clutter at world view
let geoVisible = false;
function updateGeoVisibility() {
  const z = map.getZoom();
  if (z >= 5 && !geoVisible) {
    geoVisible = true;
    buildGeoFeatures();
  } else if (z < 5 && geoVisible) {
    geoVisible = false;
    geoLayer.clearLayers();
  }
}
map.on('zoomend', updateGeoVisibility);
updateGeoVisibility();

// MARKER CREATION
// ============================================================
function createIcon(color, size = 22) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size*1.4}" viewBox="0 0 30 42">
    <path d="M15 0C6.716 0 0 6.716 0 15c0 8.284 15 27 15 27s15-18.716 15-27C30 6.716 23.284 0 15 0z"
      fill="${color}" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="7" fill="rgba(255,255,255,0.85)"/>
    <circle cx="15" cy="15" r="4" fill="${color}"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [size, size * 1.4],
    iconAnchor: [size/2, size * 1.4],
    popupAnchor: [0, -(size * 1.4)]
  });
}

function formatGrapes(grapes) {
  return grapes.map(g => `<span class="grape-tag ${getGrapeWineClass(g)}">${g}</span>`).join('');
}

function showGrapeNote(btn) {
  const panel = btn.nextElementSibling; // always the grape-note-panel div
  const isOpen = btn.classList.contains('active');
  btn.closest('.popup-inner').querySelectorAll('.grape-tag-btn.active').forEach(b => b.classList.remove('active'));
  btn.closest('.popup-inner').querySelectorAll('.grape-note-panel.visible').forEach(p => p.classList.remove('visible'));
  if (!isOpen) {
    btn.classList.add('active');
    panel.classList.add('visible');
  }
}

function createSubIcon(color, size = 14) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="9" fill="${color}" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" opacity="0.88"/>
    <circle cx="10" cy="10" r="3.5" fill="rgba(255,255,255,0.9)"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -(size/2 + 6)] });

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 40,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let color = '#7b2d8b';
    const markers = cluster.getAllChildMarkers();
    // Use color of majority country in cluster
    const countryCounts = {};
    markers.forEach(m => {
      const c = m.options.regionData.country;
      countryCounts[c] = (countryCounts[c] || 0) + 1;
    });
    const topCountry = Object.keys(countryCounts).sort((a,b) => countryCounts[b]-countryCounts[a])[0];
    color = COUNTRIES[topCountry]?.color || '#7b2d8b';
    return L.divIcon({
      html: `<div style="background:${color};color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.82rem;border:2px solid rgba(255,255,255,0.4);box-shadow:0 2px 6px rgba(0,0,0,0.3);">${count}</div>`,
      className: '',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
  }
});

const markers = regions.map(r => {

// ============================================================
const polygonMap = {};
let activePolygons = new Set();

function toLatLngs(b) {
  return b.length === 4 && !Array.isArray(b[0])
    ? [[b[0],b[1]],[b[0],b[3]],[b[2],b[3]],[b[2],b[1]]]
    : b;
}
function polyDefaultStyle(color) {
  return { color, weight: 1.5, opacity: 0.45, fillColor: color, fillOpacity: 0.1, dashArray: '5 4' };
}
function polyActiveStyle(color) {
  return { color, weight: 3, opacity: 1, fillColor: color, fillOpacity: 0.3, dashArray: null };
}
function polyGroupStyle(color) {
  return { color, weight: 2, opacity: 0.6, fillColor: color, fillOpacity: 0.07, dashArray: '8 5' };
}

function activateRegion(name) {
  // Deactivate previously active polygons
  activePolygons.forEach(prev => {
    if (polygonMap[prev]) {
      const prevR = regions.find(r => r.name === prev);
      if (prevR) polygonMap[prev].setStyle(polyDefaultStyle(getRegionColor(prev)));
    }
  });
  activePolygons.clear();

  if (!name) return;

  // Highlight the clicked region
  const r = regions.find(r => r.name === name);
  if (r && polygonMap[name]) {
    const color = getRegionColor(name);
    polygonMap[name].setStyle(polyActiveStyle(color));
    polygonMap[name].bringToFront();
    activePolygons.add(name);
  }

  // Also highlight sibling regions in the same WSET L3 group
  const group = REGION_GROUPS[name];
  if (group) {
    regions.forEach(sibling => {
      if (sibling.name !== name && REGION_GROUPS[sibling.name] === group && polygonMap[sibling.name]) {
        const color = getRegionColor(sibling.name);
        polygonMap[sibling.name].setStyle(polyGroupStyle(color));
        activePolygons.add(sibling.name);
      }
    });
    // Update group header active state
    document.querySelectorAll('.group-header').forEach(el => {
      el.classList.toggle('active', el.dataset.group === group);
    });
  }
}

const polygonGroup = L.layerGroup().addTo(map);
regions.forEach(r => {
  const b = regionBounds[r.name];
  if (!b) return;
  const color = getRegionColor(r.name);
  const poly = L.polygon(toLatLngs(b), polyDefaultStyle(color));
  poly.on('click', () => {
    activateRegion(r.name);
    highlightListItem(r.name);
    showRegionSubappellations(r.name);
    clusterGroup.zoomToShowLayer(markerMap[r.name], () => markerMap[r.name]?.openPopup());
    openInfoPanel(r.name);
  });
  polygonMap[r.name] = poly;
  polygonGroup.addLayer(poly);
});

const allGrapes = [...new Set(regions.flatMap(r => r.grapes))].sort((a,b) => a.localeCompare(b));
let activeGrapes = new Set();

function initGrapeFilter() {
  const input = document.getElementById('grape-search');
  const sugg = document.getElementById('grape-suggestions');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    sugg.innerHTML = '';
    if (!q) { sugg.style.display = 'none'; return; }
    const matches = allGrapes.filter(g => g.toLowerCase().includes(q) && !activeGrapes.has(g));
    if (!matches.length) { sugg.style.display = 'none'; return; }
    sugg.style.display = 'block';
    matches.slice(0, 8).forEach(g => {
      const d = document.createElement('div');
      d.className = 'grape-sug';
      d.textContent = g;
      d.addEventListener('mousedown', e => {
        e.preventDefault();
        activeGrapes.add(g);
        input.value = '';
        sugg.style.display = 'none';
        renderGrapeChips();
        applyFilters();
      });
      sugg.appendChild(d);
    });
  });
  input.addEventListener('blur', () => setTimeout(() => { sugg.style.display = 'none'; }, 150));
}

function renderGrapeChips() {
  const c = document.getElementById('active-grapes');
  c.innerHTML = '';
  activeGrapes.forEach(g => {
    const chip = document.createElement('span');
    chip.className = 'grape-chip';
    chip.innerHTML = `${g} <span style="opacity:0.7">✕</span>`;
    chip.addEventListener('click', () => { activeGrapes.delete(g); renderGrapeChips(); applyFilters(); });
    c.appendChild(chip);
  });
}

// ============================================================
// SHOW SUB-APPELLATIONS FOR A REGION
// ============================================================
let activeRegionExpand = null;
const regionSubLayer = L.layerGroup().addTo(map);

function subPolyStyle(color) {
  return { color, weight: 2, opacity: 0.8, fillColor: color, fillOpacity: 0.18, dashArray: null };
}
function subPolyHoverStyle(color) {
  return { color: '#e8c97a', weight: 3, opacity: 1, fillColor: color, fillOpacity: 0.32 };
}

function showRegionSubappellations(regionName) {
  regionSubLayer.clearLayers();

  if (activeRegionExpand === regionName) {
    activeRegionExpand = null;
    return;
  }
  activeRegionExpand = regionName;

  // Find all sibling regions in the same WSET group
  const group = REGION_GROUPS[regionName];
  const siblingRegions = group
    ? regions.filter(r => REGION_GROUPS[r.name] === group).map(r => r.name)
    : [regionName];

  // Collect all sub-appellations across the group
  const allGroupSubs = subregionData.filter(sr => siblingRegions.includes(sr.parentRegion));
  if (!allGroupSubs.length) return;

  const allPts = [];

  allGroupSubs.forEach(sr => {
    const isActive = sr.parentRegion === regionName;
    const color = getRegionColor(sr.parentRegion);

    // Draw sub-appellation polygon
    const bounds = subregionBounds[sr.name];
    if (bounds) {
      const style = isActive
        ? subPolyStyle(color)
        : { ...subPolyStyle(color), fillOpacity: 0.08, opacity: 0.4, weight: 1, dashArray: '4 4' };
      const poly = L.polygon(bounds, style);
      poly.bindTooltip(sr.name, { permanent: false, direction: 'center', className: 'sub-poly-tooltip' });
      if (isActive) {
        poly.on('mouseover', () => poly.setStyle(subPolyHoverStyle(color)));
        poly.on('mouseout', () => poly.setStyle(subPolyStyle(color)));
      }
      poly.on('click', () => {
        map.setView([sr.lat, sr.lng], 11, { animate: true });
        regionSubLayer.eachLayer(m => {
          if (m.getLatLng && m.getLatLng().lat === sr.lat && m.getLatLng().lng === sr.lng) m.openPopup();
        });
      });
      regionSubLayer.addLayer(poly);
      bounds.forEach(pt => allPts.push(pt));
    }

    // Add marker
    const clone = L.marker([sr.lat, sr.lng], {
      icon: createSubIcon(color),
      regionData: sr,
      opacity: isActive ? 1 : 0.5
    });
    clone.bindPopup(createSubPopup(sr), { maxWidth: 300, className: 'wine-popup' });
    regionSubLayer.addLayer(clone);
    allPts.push([sr.lat, sr.lng]);

    // Add permanent name label next to pin
    const label = L.marker([sr.lat, sr.lng], {
      icon: L.divIcon({
        className: 'sub-label-icon',
        html: `<span class="sub-label${isActive ? '' : ' sub-label-dim'}">${sr.name}</span>`,
        iconSize: [0, 0],
        iconAnchor: [-10, 12]
      })
    });
    regionSubLayer.addLayer(label);
  });

  // Also add parent region points
  siblingRegions.forEach(rn => {
    const r = regions.find(r2 => r2.name === rn);
    if (r) allPts.push([r.lat, r.lng]);
  });

  if (allPts.length > 1) {
    map.fitBounds(L.latLngBounds(allPts).pad(0.1), { animate: true, maxZoom: 10 });
  }
}

// Helper: get all wines for a region (includes subregion wines)
function getWinesForRegion(regionName) {
  if (!WINE_DATA) return [];
  let wines = [];
  if (WINE_DATA[regionName]) wines = wines.concat(WINE_DATA[regionName]);
  subregionData.filter(sr => sr.parentRegion === regionName).forEach(sr => {
    if (WINE_DATA[sr.name]) wines = wines.concat(WINE_DATA[sr.name]);
  });
  const seen = new Set();
  return wines.filter(w => { if (seen.has(w.name)) return false; seen.add(w.name); return true; });
}

// Helper: for a grape, find which wines in a region use it
function getGrapeWineHints(grape, regionName) {
  const wines = getWinesForRegion(regionName);
  const gl = grape.toLowerCase();
  const matches = wines.filter(w => w.grapes.some(g => g.toLowerCase().includes(gl)));
  if (!matches.length) return '';
  return matches.map(w => w.name).join(', ');
}

// Toggle grape note in info panel
function toggleInfoGrapeNote(btn) {
  const panel = btn.nextElementSibling;
  const isOpen = btn.classList.contains('active');
  const body = document.getElementById('info-panel-body');
  body.querySelectorAll('.grape-tag-btn.active').forEach(b => b.classList.remove('active'));
  body.querySelectorAll('.grape-note-panel.visible').forEach(p => p.classList.remove('visible'));
  if (!isOpen) {
    btn.classList.add('active');
    panel.classList.add('visible');
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }
}

function buildSubCards(regionName) {
  const subs = subregionData.filter(sr => sr.parentRegion === regionName);
  if (!subs.length) return null;

  const wrap = document.createElement('div');
  wrap.className = 'sub-expand';
  wrap.innerHTML = `<div class="sub-expand-title">Sub-appellations (${subs.length})</div>`;

  subs.forEach(sr => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.innerHTML = `
      <div class="sub-card-name">${sr.name}</div>
      <div class="sub-card-grapes">${formatSidebarGrapes(sr.grapes, sr.name, sr.parentRegion)}</div>
      <div class="sub-card-note">${sr.notes.slice(0, 120)}${sr.notes.length > 120 ? '…' : ''}</div>`;
    // grape tag click handler (toggle note panels within this card)
    card.querySelectorAll('.grape-tag-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const panel = btn.nextElementSibling;
        const isOpen = btn.classList.contains('active');
        card.querySelectorAll('.grape-tag-btn.active').forEach(b => b.classList.remove('active'));
        card.querySelectorAll('.grape-note-panel.visible').forEach(p => p.classList.remove('visible'));
        if (!isOpen) {
          btn.classList.add('active');
          panel.classList.add('visible');
          setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
        }
      });
    });
    // card click → fly to sub-appellation on map
    card.querySelector('.sub-card-name').addEventListener('click', e => {
      e.stopPropagation();
      map.setView([sr.lat, sr.lng], 10, { animate: true });
      regionSubLayer.eachLayer(m => {
        if (m.getLatLng().lat === sr.lat && m.getLatLng().lng === sr.lng) m.openPopup();
      });
    });
    wrap.appendChild(card);
  });
  return wrap;
}

const collapsedGroups = new Set();

function buildRegionList(filtered) {
  const container = document.getElementById('region-items');
  container.innerHTML = '';
  document.getElementById('list-count').textContent = filtered.length;

  // Group filtered regions by WSET L3 group
  const grouped = new Map(); // group → [regions]
  const ungrouped = [];
  filtered.forEach(r => {
    const g = REGION_GROUPS[r.name];
    if (g) {
      if (!grouped.has(g)) grouped.set(g, []);
      grouped.get(g).push(r);
    } else {
      ungrouped.push(r);
    }
  });

  function makeRegionItem(r) {
    const color = getRegionColor(r.name);
    const subs = subregionData.filter(sr => sr.parentRegion === r.name);
    const div = document.createElement('div');
    div.className = 'region-item';
    div.id = `item_${r.name.replace(/\s/g,'_')}`;
    div.innerHTML = `
      <div class="r-dot" style="background:${color}"></div>
      <div class="r-info">
        <div class="r-name" title="${r.name}">${r.name}${subs.length ? ` <span style="font-size:0.6rem;opacity:0.5">(${subs.length})</span>` : ''}</div>
        <div class="r-grapes">${r.grapes.slice(0,3).join(' · ')}</div>
      </div>`;
    const wrapper = document.createElement('div');
    wrapper.appendChild(div);
    div.addEventListener('click', () => {
      activateRegion(r.name);
      showRegionSubappellations(r.name);
      // Remove any existing sub-cards from other regions
      container.querySelectorAll('.sub-expand').forEach(el => el.remove());
      // Insert sub-cards right below this region item
      if (activeRegionExpand === r.name) {
        const cards = buildSubCards(r.name);
        if (cards) wrapper.appendChild(cards);
      }
      // Also open the main popup and info panel
      const marker = markerMap[r.name];
      if (marker) clusterGroup.zoomToShowLayer(marker, () => marker.openPopup());
      openInfoPanel(r.name);
    });
    return wrapper;
  }

  grouped.forEach((members, group) => {
    const flag = GROUP_COUNTRY[group] || '';
    const isCollapsed = collapsedGroups.has(group);

    const header = document.createElement('div');
    header.className = 'group-header' + (isCollapsed ? ' collapsed' : '');
    header.dataset.group = group;
    header.innerHTML = `<span>${flag} ${group}</span><span class="group-chevron">▼</span>`;
    header.addEventListener('click', () => {
      const collapsed = collapsedGroups.has(group);
      if (collapsed) collapsedGroups.delete(group);
      else collapsedGroups.add(group);
      header.classList.toggle('collapsed', !collapsed);
      itemsWrap.classList.toggle('collapsed', !collapsed);
    });
    container.appendChild(header);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'group-items' + (isCollapsed ? ' collapsed' : '');
    members.forEach(r => itemsWrap.appendChild(makeRegionItem(r)));
    container.appendChild(itemsWrap);
  });

  ungrouped.forEach(r => container.appendChild(makeRegionItem(r)));
}

function highlightListItem(name) {
  document.querySelectorAll('.region-item').forEach(el => el.style.background = '');
  const id = `item_${name.replace(/\s/g,'_')}`;
  const el = document.getElementById(id);
  if (el) {
    el.style.background = 'rgba(123,45,139,0.4)';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ============================================================
// APPLY FILTERS
// ============================================================
function applyFilters() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  const filtered = regions.filter(r => {
    if (activeGrapes.size > 0 && !r.grapes.some(g => activeGrapes.has(g))) return false;
    if (query) {
      const searchStr = [r.name, r.country, r.subregions, r.climate, ...r.grapes, r.notes].join(' ').toLowerCase();
      return searchStr.includes(query);
    }
    return true;
  });

  clusterGroup.clearLayers();
  clusterGroup.addLayers(filtered.map(r => markerMap[r.name]).filter(Boolean));

  subClusterGroup.clearLayers();
  if (showSubregions) {
    const filteredSub = subregionData.filter(sr => {
      if (activeGrapes.size > 0 && !sr.grapes.some(g => activeGrapes.has(g))) return false;
      if (query) {
        const searchStr = [sr.name, sr.country, sr.parentRegion, ...sr.grapes, sr.notes].join(' ').toLowerCase();
        return searchStr.includes(query);
      }
      return true;
    });
    subClusterGroup.addLayers(filteredSub.map(sr => subMarkerMap[sr.name + '|' + sr.parentRegion]).filter(Boolean));
    if (!map.hasLayer(subClusterGroup)) map.addLayer(subClusterGroup);
  } else {
    if (map.hasLayer(subClusterGroup)) map.removeLayer(subClusterGroup);
  }

  // Sync polygon visibility
  const filteredNames = new Set(filtered.map(r => r.name));
  regions.forEach(r => {
    if (!polygonMap[r.name]) return;
    if (filteredNames.has(r.name)) {
      if (!polygonGroup.hasLayer(polygonMap[r.name])) polygonGroup.addLayer(polygonMap[r.name]);
    } else {
      polygonGroup.removeLayer(polygonMap[r.name]);
      activePolygons.delete(r.name);
    }
  });

  buildRegionList(filtered);
  document.getElementById('region-count').textContent = `${filtered.length} Regions`;
  const countryBreakdown = {};
  filtered.forEach(r => { countryBreakdown[r.country] = (countryBreakdown[r.country] || 0) + 1; });
  const top = Object.entries(countryBreakdown).sort((a,b) => b[1]-a[1]).slice(0,4).map(([c,n]) => `${c}: ${n}`).join(' · ');
  document.getElementById('stats-text').textContent = top;
}

let _infoPanelCurrentRegion = '';

function openInfoPanel(regionName) {
  const panel = document.getElementById('info-panel');
  const sel = document.getElementById('info-panel-select');
  const body = document.getElementById('info-panel-body');
  const r = regions.find(r2 => r2.name === regionName);
  if (!r) return;

  _infoPanelCurrentRegion = regionName;
  const group = REGION_GROUPS[regionName];
  const groupLabel = group || regionName;

  // Build dropdown with all groups
  const allGroups = [...new Set(Object.values(REGION_GROUPS))];
  sel.innerHTML = allGroups.map(g => {
    const flag = GROUP_COUNTRY[g] || '';
    return `<option value="${g}"${g === groupLabel ? ' selected' : ''}>${flag} ${g}</option>`;
  }).join('');

  let html = '';

  // Section 1: Sibling regions navigation
  const siblings = group
    ? regions.filter(r2 => REGION_GROUPS[r2.name] === group)
    : [r];
  if (siblings.length > 0) {
    html += `<div class="info-section"><div class="info-section-label"><span>Regions in ${groupLabel}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content">`;
    siblings.forEach(s => {
      const isActive = s.name === regionName;
      const subs = subregionData.filter(sr => sr.parentRegion === s.name);
      html += `<div class="info-nav-item${isActive ? ' active' : ''}" onclick="navigateToRegion('${s.name.replace(/'/g, "\\'")}')">
        ${s.name}${subs.length ? ` <span style="opacity:0.5;font-size:0.65rem">(${subs.length})</span>` : ''}
        ${subs.length ? `<div class="info-nav-sub">${subs.map(sr => sr.name).join(', ')}</div>` : ''}
      </div>`;
    });
    html += '</div></div>';
  }

  // Section 2: Key grapes (clickable with tasting notes + wine hints)
  html += `<div class="info-section"><div class="info-section-label"><span>Key Grapes — ${r.name}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-grape-list">`;
  r.grapes.forEach(g => {
    const wc = getGrapeWineClass(g);
    const hasNote = !!grapeTastingNotes[g];
    if (hasNote) {
      const regionHint = getRegionalContext(g, r.name, groupLabel);
      const wineHints = getGrapeWineHints(g, regionName);
      html += `<span class="grape-tag-btn info-grape-tag ${wc}" onclick="toggleInfoGrapeNote(this)">▸ ${g}</span>`;
      html += `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>${grapeTastingNotes[g]}`;
      if (regionHint) html += `<div class="grape-note-region">⬦ In ${r.name}: ${regionHint}</div>`;
      if (wineHints) html += `<div class="grape-note-region">⬦ Wines: ${wineHints}</div>`;
      html += `</div>`;
    } else {
      html += `<span class="info-grape-tag ${wc}">${g}</span>`;
    }
  });
  html += '</div></div></div>';

  // Section 3: Wines & Appellations
  const wines = getWinesForRegion(regionName);
  if (wines.length > 0) {
    html += `<div class="info-section"><div class="info-section-label"><span>Wines & Appellations (${wines.length})</span><span class="info-section-chevron">▼</span></div><div class="info-section-content">`;
    wines.forEach(w => {
      const bc = w.classification.toLowerCase().replace(/[^a-z]/g,'');
      html += `<div class="info-wine-card">`;
      html += `<div class="info-wine-name">${w.name} <span class="info-wine-badge ${bc}">${w.classification}</span></div>`;
      html += `<div class="info-wine-detail"><strong>Grapes:</strong> ${w.grapes.join(', ')}</div>`;
      if (w.aging) html += `<div class="info-wine-detail"><strong>Aging:</strong> ${w.aging}</div>`;
      if (w.method) html += `<div class="info-wine-detail"><strong>Method:</strong> ${w.method}</div>`;
      if (w.abv) html += `<div class="info-wine-detail"><strong>ABV:</strong> ${w.abv}</div>`;
      html += `<div class="info-wine-detail"><strong>Style:</strong> ${w.style}</div>`;
      if (w.notes) html += `<div class="info-wine-detail" style="margin-top:3px;color:#888;font-style:italic">${w.notes}</div>`;
      html += `</div>`;
    });
    html += '</div></div>';
  }

  // Section 4: Climate & Terroir
  if (r.climate) {
    html += `<div class="info-section"><div class="info-section-label"><span>Climate & Terroir</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-text">${r.climate}</div></div></div>`;
  }

  // Section 5: Winemaking & Style
  if (r.notes) {
    html += `<div class="info-section"><div class="info-section-label"><span>Winemaking & Style</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-text">${r.notes}</div></div></div>`;
  }

  // Section 6: All grapes across the group
  if (siblings.length > 1) {
    const allGrapes = new Set();
    siblings.forEach(s => s.grapes.forEach(g => allGrapes.add(g)));
    html += `<div class="info-section collapsed"><div class="info-section-label"><span>All Grapes in ${groupLabel}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-grape-list">`;
    [...allGrapes].sort().forEach(g => {
      const wc = getGrapeWineClass(g);
      const hasNote = !!grapeTastingNotes[g];
      if (hasNote) {
        const wineHints = getGrapeWineHints(g, regionName);
        html += `<span class="grape-tag-btn info-grape-tag ${wc}" onclick="toggleInfoGrapeNote(this)">▸ ${g}</span>`;
        html += `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>${grapeTastingNotes[g]}`;
        if (wineHints) html += `<div class="grape-note-region">⬦ Wines: ${wineHints}</div>`;
        html += `</div>`;
      } else {
        html += `<span class="info-grape-tag ${wc}">${g}</span>`;
      }
    });
    html += '</div></div></div>';
  }

  body.innerHTML = html;

  // Attach collapse toggle handlers
  body.querySelectorAll('.info-section-label').forEach(label => {
    label.addEventListener('click', e => {
      if (e.target.closest('.info-nav-item') || e.target.closest('.grape-tag-btn')) return;
      label.parentElement.classList.toggle('collapsed');
    });
  });

  panel.classList.add('open');
  setTimeout(() => map.invalidateSize(), 300);
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('open');
  setTimeout(() => map.invalidateSize(), 300);
}

function navigateToRegion(name) {
  activateRegion(name);
  showRegionSubappellations(name);
  highlightListItem(name);
  const marker = markerMap[name];
  if (marker) clusterGroup.zoomToShowLayer(marker, () => marker.openPopup());
  openInfoPanel(name);
}

function onInfoPanelGroupChange(groupName) {
  // Navigate to the first region in the selected group
  const firstRegion = regions.find(r => REGION_GROUPS[r.name] === groupName);
  if (firstRegion) navigateToRegion(firstRegion.name);
}
</script>
</body>
