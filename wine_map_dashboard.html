<style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ============================================================
// WINE REGIONS DATA
// ============================================================
const COUNTRIES = {
  'France':        { color: '#3498db', flag: '🇫🇷' },
  'Germany':       { color: '#e67e22', flag: '🇩🇪' },
  'Austria':       { color: '#e74c3c', flag: '🇦🇹' },
  'Hungary':       { color: '#27ae60', flag: '🇭🇺' },
  'Greece':        { color: '#16a085', flag: '🇬🇷' },
  'Italy':         { color: '#2ecc71', flag: '🇮🇹' },
  'Spain':         { color: '#f39c12', flag: '🇪🇸' },
  'Portugal':      { color: '#8e44ad', flag: '🇵🇹' },
  'USA':           { color: '#c0392b', flag: '🇺🇸' },
  'Canada':        { color: '#d35400', flag: '🇨🇦' },
  'Chile':         { color: '#1abc9c', flag: '🇨🇱' },
  'Argentina':     { color: '#9b59b6', flag: '🇦🇷' },
  'South Africa':  { color: '#e91e8c', flag: '🇿🇦' },
  'Australia':     { color: '#f1c40f', flag: '🇦🇺' },
  'New Zealand':   { color: '#00bcd4', flag: '🇳🇿' },
};

// Distinct colors per WSET L3 topic group
const GROUP_COLORS = {
  // France — distinct hues
  'Bordeaux':           '#1a5276',  // deep navy
  'Burgundy':           '#7b241c',  // burgundy red
  'Beaujolais':         '#c0392b',  // bright red
  'Alsace':             '#1e8449',  // forest green
  'Loire Valley':       '#2e86c1',  // bright blue
  'Rhône Valley':       '#884ea0',  // purple
  'South of France':    '#d4ac0d',  // golden yellow
  // Germany — distinct hues
  'Mosel':              '#e67e22',  // orange
  'Rhine Regions':      '#3498db',  // blue (Rheingau, Pfalz, Rheinhessen, Nahe)
  'Southern Germany':   '#f1c40f',  // yellow (Franken, Baden, Württemberg)
  // Austria
  'Niederösterreich':   '#e74c3c',  // red
  'Burgenland':         '#cb4335',  // dark red
  // Hungary
  'Tokaj':              '#27ae60',  // green
  // Greece
  'Greece':             '#16a085',  // teal
  // Italy — distinct hues per group
  'North-East Italy':   '#3498db',  // blue (Veneto, Friuli, Alto Adige, Trentino)
  'Piemonte':           '#e74c3c',  // red (Barolo, Barbaresco country)
  'Tuscany':            '#f39c12',  // golden (Chianti, Brunello, Super Tuscans)
  'Central & Southern Italy': '#2ecc71', // green (Umbria → Sicily)
  // Spain — spread hue range
  'Rioja & Navarra':    '#e74c3c',  // red
  'Catalunya':          '#f39c12',  // golden orange
  'Castilla y León':    '#e67e22',  // warm orange
  'Galicia':            '#2ecc71',  // green (Atlantic NW)
  'Eastern & Central Spain': '#f5b041', // light orange
  'Andalucía':          '#d4ac0d',  // deep gold (sherry country)
  // Portugal — distinct pair
  'Northern Portugal':  '#8e44ad',  // purple (Douro, Vinho Verde)
  'Central Portugal':   '#e67e22',  // warm orange (Dão, Bairrada, Lisboa)
  'Southern Portugal':  '#d35400',  // deep orange (Alentejo)
  // USA
  'California':         '#c0392b',  // US red
  'New York':           '#922b21',  // deep burgundy red
  'Pacific Northwest':  '#a93226',  // dark red
  // Canada
  'Canada':             '#d35400',
  // South America
  'Chile':              '#1abc9c',
  'Argentina':          '#9b59b6',
  // Southern Hemisphere
  'South Africa':       '#e91e8c',
  'Australia':          '#f1c40f',
  'New Zealand':        '#00bcd4',
};

function getRegionColor(regionName) {
  const group = REGION_GROUPS[regionName];
  if (group && GROUP_COLORS[group]) return GROUP_COLORS[group];
  const r = regions.find(r2 => r2.name === regionName);
  return COUNTRIES[r?.country]?.color || '#888';
}

// ============================================================
// CLIMATE CLASSIFICATION SYSTEM
// ============================================================
const CLIMATE_DEFINITIONS = {
  continental: 'Large temperature variation between seasons. Cold winters, warm to hot summers. Low to moderate rainfall. Risk of spring frost.',
  maritime: 'Moderate temperature variation influenced by proximity to ocean or large water body. Mild winters, warm summers. Moderate to high rainfall.',
  mediterranean: 'Warm to hot, dry summers. Mild, wet winters. Low summer rainfall. Long growing season.',
  transition: 'Blend of two climate influences (e.g. Maritime–Continental). Characteristics vary between both types.'
};
const TEMP_DEFINITIONS = {
  cool: 'Growing season avg below 16.5°C',
  moderate: 'Growing season avg 16.5–18.5°C',
  warm: 'Growing season avg 18.5–21°C',
  hot: 'Growing season avg above 21°C'
};
const CLIMATE_COLORS = {
  continental:   { cool: '#FFCC80', moderate: '#FF9800', warm: '#E65100', hot: '#BF360C' },
  maritime:      { cool: '#81D4FA', moderate: '#039BE5', warm: '#01579B', hot: '#002171' },
  mediterranean: { cool: '#A5D6A7', moderate: '#43A047', warm: '#1B5E20', hot: '#0D3B0F' },
  transition:    { cool: '#CE93D8', moderate: '#AB47BC', warm: '#7B1FA2', hot: '#4A148C' },
  unknown:       { cool: '#888', moderate: '#888', warm: '#888', hot: '#888' }
};
const CLIMATE_LABELS = { continental: 'Continental', maritime: 'Maritime', mediterranean: 'Mediterranean', transition: 'Transition', unknown: 'Unknown' };
const TEMP_LABELS = { cool: 'Cool', moderate: 'Moderate', warm: 'Warm', hot: 'Hot' };

function parseClimate(climateText) {
  if (!climateText) return { type: 'unknown', temperature: 'moderate' };
  const t = climateText.toLowerCase();
  const first = t.split(/\.\s/)[0];
  // --- Temperature ---
  let temperature = 'moderate';
  if (/very\s+hot|\bhot\b/.test(first)) temperature = 'hot';
  else if (/warm\s*(to|[-–])\s*hot/.test(first)) temperature = 'hot';
  else if (/warmer\s+cool/.test(first)) temperature = 'moderate';
  else if (/cool\s*(to|[-–])\s*(moderate|warm)|moderate\s*(to|[-–])\s*warm/.test(first)) temperature = 'moderate';
  else if (/\bwarm\b/.test(first)) temperature = 'warm';
  else if (/very\s+cool/.test(first)) temperature = 'cool';
  else if (/\bcool\b/.test(first)) temperature = 'cool';
  else if (/\bmoderate\b/.test(first)) temperature = 'moderate';
  else if (/sub-?tropical/.test(first)) temperature = 'warm';
  if (temperature === 'moderate' && !/moderate|warm|cool|hot|tropical/.test(first)) {
    if (/warmer/.test(first)) temperature = 'warm';
  }
  // --- Climate type ---
  let type = 'unknown';
  const hM = /\bmaritime\b|\bmarine\b/.test(first);
  const hC = /\bcontinental\b|\bpannonian\b/.test(first);
  const hMed = /\bmediterranean\b/.test(first);
  if (/transition/.test(first) || (hM && hC) || (hM && hMed) || (hC && hMed)) type = 'transition';
  else if (hC) type = 'continental';
  else if (hMed) type = 'mediterranean';
  else if (hM) type = 'maritime';
  else if (/sub-?tropical/.test(first)) type = 'maritime';
  else if (/semi-?arid/.test(first)) type = 'continental';
  else if (/\bhot\b.*\bdry\b|\bdry\b.*\bhot\b/.test(first)) type = 'mediterranean';
  if (type === 'unknown') {
    if (/continental|pannonian/.test(t)) type = 'continental';
    else if (/maritime|atlantic|ocean\b|marine/.test(t)) type = 'maritime';
    else if (/mediterranean/.test(t)) type = 'mediterranean';
    else if (/altitude|mountain|plateau|inland/.test(t)) type = 'continental';
    else if (/cape|wind|rainfall|sea\b/.test(t)) type = 'maritime';
    else type = 'mediterranean';
  }
  return { type, temperature };
}

function buildClimateBadge(regionName) {
  const cc = climateClassification[regionName];
  if (!cc || cc.type === 'unknown') return '';
  const color = (CLIMATE_COLORS[cc.type] || CLIMATE_COLORS.unknown)[cc.temperature] || '#888';
  const label = (TEMP_LABELS[cc.temperature] || '') + ' ' + (CLIMATE_LABELS[cc.type] || '');
  const typeDef = CLIMATE_DEFINITIONS[cc.type] || '';
  const tempDef = TEMP_DEFINITIONS[cc.temperature] || '';
  const tooltipText = `<strong>${CLIMATE_LABELS[cc.type]}</strong>: ${typeDef}<br><br><strong>${TEMP_LABELS[cc.temperature]}</strong>: ${tempDef}`;
  return `<span class="climate-badge" style="background:${color}22;color:${color};border:1px solid ${color}55">${label}<span class="climate-help">?<span class="climate-tooltip">${tooltipText}</span></span></span>`;
}

// WSET L3 region groupings — maps region name → group label
const REGION_GROUPS = {
  // France — Bordeaux
  'Bordeaux': 'Bordeaux', 'Bergerac': 'Bordeaux', 'SW France (Cahors, Madiran, Jurançon)': 'Bordeaux',
  // France — Burgundy
  'Chablis': 'Burgundy', "Côte de Nuits (Côte d'Or)": 'Burgundy', "Côte de Beaune (Côte d'Or)": 'Burgundy',
  'Côte Chalonnaise': 'Burgundy', 'Mâconnais': 'Burgundy',
  // France — Beaujolais
  'Beaujolais': 'Beaujolais',
  // France — Alsace
  'Alsace': 'Alsace',
  // France — Loire Valley
  'Loire Valley — Central Vineyards': 'Loire Valley', 'Loire Valley — Touraine': 'Loire Valley',
  'Loire Valley — Anjou-Saumur': 'Loire Valley', 'Loire Valley — Muscadet (Nantais)': 'Loire Valley',
  // France — Rhône Valley
  'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)': 'Rhône Valley',
  'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)': 'Rhône Valley',
  // France — Champagne
  'Champagne': 'Champagne',

// Determine wine color type from its grape list (for wine card coloring)
function getWineColorType(wine) {
  // Check wine name/style for explicit clues
  const nm = (wine.name || '').toLowerCase();
  const st = (wine.style || '').toLowerCase();
  const nt = (wine.notes || '').toLowerCase();
  const grapeStr = (wine.grapes || []).join(' ').toLowerCase();
  // Sparkling detection
  if (nm.includes('spumante') || nm.includes('prosecco') || nm.includes('franciacorta') ||
      nm.includes('cava') || nm.includes('champagne') || nm.includes('crémant') ||
      nm.includes('sekt') || nm.includes('cap classique') || nm.includes('trentodoc') ||
      st.includes('sparkling') || st.includes('mousse') || st.includes('traditional method')) {
    if (/\brosé\b/i.test(nm) || /\brosé\b/i.test(wine.name || '')) return 'rose';
    if (grapeStr.includes('pinot noir') || grapeStr.includes('pinot nero') || grapeStr.includes('pinot meunier')) {
      if (grapeStr.includes('chardonnay') || grapeStr.includes('pinot bianco')) return 'white';
    }
    return 'white';
  }
  // Orange wine detection (must be before sweet/dessert — amber+tannic is orange, not sweet)
  if (nm.includes('orange') || (st.includes('orange') && st.includes('tannic')) || (/\bamber\b/.test(st) && st.includes('tannic'))) return 'orange';
  // Sweet/dessert detection — based on style
  if (st.includes('sweet') || /\bamber\b/.test(st) || nm.includes('passito') || nm.includes('vin santo') ||
      nm.includes('sauternes') || nm.includes('tokaj') || nm.includes('moscato di pantelleria') ||
      nm.includes('recioto') || nm.includes('ramandolo')) {
    if (grapeStr.includes('nero') || grapeStr.includes('corvina') || nm.includes('recioto della valpolicella')) return 'red';
    return 'white';
  }
  // Rosé detection
  if (nm.includes('rosé') || nm.includes('rosato') || nm.includes('cerasuolo d\'abruzzo') ||
      nm.includes('kretzer') || st.includes('rosé') || st.includes('cherry-pink')) return 'rose';
  // Fortified — check for sherry/port styles
  if (nm.includes('fino') || nm.includes('manzanilla') || nm.includes('amontillado') ||
      nm.includes('palo cortado') || nm.includes('oloroso') || nm.includes('pedro ximénez') ||
      nm.includes('white port')) return 'fortified';
  if (nm.includes('port') || nm.includes('porto')) return 'red';
  // Check grape types
  const types = (wine.grapes || []).map(g => {
    const clean = g.replace(/\s*\(.*?\)\s*/g, '').replace(/\s*min\s+\d+.*$/i, '').trim();
    return GRAPE_WINE_TYPE[clean] || 'unknown';
  });
  if (types.includes('red')) return 'red';
  if (types.includes('rose')) return 'rose';
  if (types.includes('white')) return 'white';
  // Fallback: check style keywords
  if (st.includes('full body') || st.includes('tannin') || st.includes('dark fruit') || st.includes('dark berry') ||
      st.includes('red cherry') || st.includes('plum')) return 'red';
  if (st.includes('citrus') || st.includes('crisp') || st.includes('green apple') || st.includes('mineral')) return 'white';
  return 'red'; // default
}

// WSET L3 typical appearance based on wine type and style keywords
function getWsetAppearance(wine) {
  const type = getWineColorType(wine);
  const st = (wine.style || '').toLowerCase();
  const nm = (wine.name || '').toLowerCase();
  const nt = (wine.notes || '').toLowerCase();
  const grapeStr = (wine.grapes || []).join(' ').toLowerCase();

  if (type === 'white' || type === 'orange') {
    // Sparkling whites
    if (st.includes('mousse') || st.includes('sparkling') || nm.includes('prosecco') ||
        nm.includes('champagne') || nm.includes('crémant') || nm.includes('cava') ||
        nm.includes('franciacorta') || nm.includes('trentodoc') || nm.includes('sekt') ||
        nm.includes('cap classique')) {
      if (st.includes('complex') || st.includes('brioche') || st.includes('aged') || st.includes('toasty')) return 'Medium lemon-gold';
      return 'Pale lemon';
    }
    // Sweet/dessert whites
    if (st.includes('sweet') || nm.includes('passito') || nm.includes('vin santo') ||
        nm.includes('sauternes') || nm.includes('tokaj') || nm.includes('ramandolo') ||
        nm.includes('recioto di soave')) {
      if (st.includes('amber') || st.includes('caramel') || st.includes('oxidative') || st.includes('brown')) return 'Deep amber';
      if (st.includes('golden') || st.includes('intense') || st.includes('concentrated')) return 'Deep gold';
      return 'Medium gold';
    }
    // Orange wine
    if (type === 'orange') return 'Deep amber';
    // Oxidative whites (Vin Jaune, aged Sherry-like)
    if (st.includes('oxidative') || nm.includes('vin jaune') || st.includes('walnut') || st.includes('curry')) return 'Deep gold';
    if (st.includes('deep gold') || st.includes('deep amber')) return 'Deep gold';
    // Oaked / full-bodied whites
    if (st.includes('full body') || st.includes('waxy') || st.includes('honeyed')) return 'Medium gold';
    if (st.includes('oak') || st.includes('butter') || st.includes('vanilla') || st.includes('toasty')) return 'Medium lemon-gold';
    // Medium-bodied whites
    if (st.includes('medium body') || st.includes('medium-full') || st.includes('textured') || st.includes('stone fruit')) return 'Medium lemon';
    // Light fresh whites
    return 'Pale lemon';
  }

  if (type === 'rose') {
    if (st.includes('deep') || st.includes('structured') || st.includes('full') || nm.includes('cerasuolo d\'abruzzo')) return 'Medium salmon-pink';
    if (st.includes('pale') || st.includes('delicate') || st.includes('light')) return 'Pale pink';
    return 'Pale pink';
  }

  if (type === 'fortified') {
    if (nm.includes('fino') || nm.includes('manzanilla')) return 'Pale lemon';
    if (nm.includes('amontillado') || nm.includes('palo cortado')) return 'Medium amber';
    if (nm.includes('oloroso')) return 'Deep tawny-brown';
    if (nm.includes('pedro ximénez')) return 'Deep tawny-brown';
    if (nm.includes('ruby port') || nm.includes('lbv')) return 'Deep ruby';
    if (nm.includes('tawny')) return 'Medium tawny';
    if (nm.includes('marsala')) {
      if (st.includes('amber') || st.includes('brown')) return 'Deep amber';
      return 'Medium amber';
    }
    return 'Medium amber';
  }

  // Red wines — determine intensity + color
  // Garnet / aged styles
  if (st.includes('garnet') || nt.includes('garnet') || st.includes('brick')) return 'Medium garnet';
  if (st.includes('tawny') || nt.includes('tawny')) return 'Pale tawny';
  // Very age-worthy, long-aged reds
  if (st.includes('age-worthy') || st.includes('ages well') || nt.includes('age-worthy') ||
      nt.includes('extremely age') || nt.includes('long aging') || nt.includes('long-lived'))  {
    if (st.includes('full body') || st.includes('very high tannin')) return 'Deep ruby-garnet';
    return 'Medium ruby-garnet';
  }
  // Deep / intense / opaque reds
  if (st.includes('deep') || st.includes('inky') || st.includes('opaque') || st.includes('intense') ||
      st.includes('very full') || st.includes('deep color') || st.includes('very high tannin')) return 'Deep purple-ruby';
  // Light-bodied reds — pale
  if (st.includes('light body') || st.includes('light red') || st.includes('pale') ||
      st.includes('cotton candy') || st.includes('light') || grapeStr.includes('schiava') ||
      grapeStr.includes('gamay')) return 'Pale ruby';
  // Full body reds — deep
  if (st.includes('full body') || st.includes('jammy') || st.includes('powerful') ||
      st.includes('concentrated') || st.includes('high alcohol')) return 'Deep ruby';
  // Medium-full body
  if (st.includes('medium-full') || st.includes('firm tannin') || st.includes('moderate tannin')) return 'Medium ruby-purple';
  // Medium body
  if (st.includes('medium body')) return 'Medium ruby';
  // Default
  return 'Medium ruby';
}

  {

  { name:'Savennières', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.370, lng:-0.723, grapes:['Chenin Blanc'], notes:'Bone dry Chenin Blanc. Schist soils. Two monopoles: Coulée de Serrant (biodynamic) and La Roche aux Moines. High acid, waxy texture, ages 20+ years.' },
  { name:'Coteaux du Layon', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.260, lng:-0.600, grapes:['Chenin Blanc'], notes:'Noble rot sweet Chenin. Layon river valley. Min 34g/L RS. Honey, quince, saffron. Great aging. Villages: Beaulieu, Rochefort.' },
  { name:'Quarts de Chaume Grand Cru', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.280, lng:-0.570, grapes:['Chenin Blanc'], notes:'Loire Grand Cru. Noble Rot. Min 85g/L RS. Only 4 producers. Extraordinary aging potential 50+ years.' },
  { name:'Saumur-Champigny', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.249, lng:-0.078, grapes:['Cabernet Franc'], notes:'Red wine on tuffeau limestone. Fresh raspberry, violet, herbaceous, medium tannin. Best vintages age well.' },
  { name:'Bonnezeaux', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.268, lng:-0.545, grapes:['Chenin Blanc'], notes:'Grand Cru sweet Chenin. Noble rot. Three steep schist hillsides. Min 34g/L RS. Honeyed, concentrated, exceptional aging potential.' },
  { name:'Anjou & Anjou-Villages', country:'France', parentRegion:'Loire Valley — Anjou-Saumur', lat:47.340, lng:-0.550, grapes:['Chenin Blanc','Cabernet Franc','Cabernet Sauvignon'], notes:'Broad AC. Whites: Chenin (dry to sweet). Reds: Cabernet Franc/Sauvignon blends. Anjou-Villages: reds only, higher quality from specific villages.' },

  // === FRANCE — Northern Rhône ===
  { name:'Côte Rôtie', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.480, lng:4.782, grapes:['Syrah','Viognier'], notes:'Côte Brune (dark iron soil, powerful) and Côte Blonde (pale schist, elegant). Guigal La Mouline/La Landonne/La Turque: iconic. ≤20% Viognier co-fermented.' },
  { name:'Condrieu', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.453, lng:4.771, grapes:['Viognier'], notes:'Viognier only. Granite. Dry or Vendange Tardive. Peach, apricot, violet, full body, low acid. Château-Grillet: monopole GC within Condrieu.' },
  { name:'Hermitage', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.073, lng:4.840, grapes:['Syrah','Marsanne','Roussanne'], notes:'Hill of granite above Tain. Most powerful, longest-lived Northern Rhône red (20–30yr). Whites: viscous Marsanne, nutty, beeswax with age.' },
  { name:'Crozes-Hermitage', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.098, lng:4.876, grapes:['Syrah','Marsanne'], notes:'Largest Northern Rhône AC. Surrounds Hermitage. More alluvial soils → lighter style, more affordable.' },
  { name:'Cornas', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:44.972, lng:4.827, grapes:['Syrah'], notes:'100% Syrah only. Granite amphitheater. Most tannic Northern Rhône. Deep color, black fruit, smoked meat, iron. Needs significant aging.' },
  { name:'Saint-Joseph', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:45.045, lng:4.790, grapes:['Syrah','Marsanne','Roussanne'], notes:'Long, thin strip on west bank. Most affordable N. Rhône Syrah. Variable quality. Best: concentrated from granite. Whites: Marsanne/Roussanne, fresh, floral.' },
  { name:'Saint-Péray', country:'France', parentRegion:'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)', lat:44.940, lng:4.838, grapes:['Marsanne','Roussanne'], notes:'Whites only. Still and sparkling. Southernmost N. Rhône AC. Granite + limestone. Richer and rounder than other N. Rhône whites.' },

  // === FRANCE — Southern Rhône ===
  { name:'Châteauneuf-du-Pape', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.056, lng:4.830, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Up to 18 varieties permitted. Galets retain heat. Min 12.5% ABV. Grenache dominant. Beaucastel (Mourvèdre-heavy) vs Rayas (100% Grenache). Complex, great aging.' },
  { name:'Gigondas', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.170, lng:5.007, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Dentelles de Montmirail foothills. Powerful GSM. Dark fruit, spice, garrigue. More tannic than CdP. Good value alternative.' },
  { name:'Tavel', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.010, lng:4.666, grapes:['Grenache','Cinsault'], notes:'France\'s most famous dry rosé AC. Grenache dominant. Deep copper-pink, full body, herbal, strawberry, peach.' },
  { name:'Muscat de Beaumes de Venise', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.120, lng:5.033, grapes:['Muscat Blanc à Petits Grains'], notes:'VDN (Vin Doux Naturel), fortified. Sweet, fresh, perfumed, grapey and floral. Also dry GSM reds.' },
  { name:'Vacqueyras', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.142, lng:4.978, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Cru since 1990. Between Gigondas and CdP in style. Dark fruit, spice, garrigue. GSM blend. Full-bodied, good structure.' },
  { name:'Lirac', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.040, lng:4.698, grapes:['Grenache','Syrah','Mourvèdre'], notes:'West bank Rhône opposite CdP. Reds, whites and rosés. Rocky galets. Underrated, similar quality potential to CdP.' },
  { name:'Rasteau', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.228, lng:5.012, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Cru since 2010. Rich, powerful Grenache-dominant. Also produces VDN (fortified). Clay-limestone terraces.' },
  { name:'Cairanne', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.240, lng:4.950, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Newest S. Rhône Cru (2016). Clay-limestone. Concentrated, structured Grenache-based reds. Rising star.' },
  { name:'Côtes du Rhône Villages', country:'France', parentRegion:'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)', lat:44.180, lng:4.880, grapes:['Grenache','Syrah','Mourvèdre'], notes:'Step above generic CdR. 22 named villages. Min 50% Grenache. Better concentration and character.' },

  // === FRANCE — Languedoc-Roussillon ===
  { name:'Faugères AOP', country:'France', parentRegion:'Languedoc-Roussillon', lat:43.620, lng:3.350, grapes:['Grenache','Syrah','Mourvèdre','Carignan'], notes:'All schist soils. Distinctive mineral quality. Red and white styles. Quality leader of Languedoc.' },
  { name:'Corbières AOP', country:'France', parentRegion:'Languedoc-Roussillon', lat:43.100, lng:2.700, grapes:['Grenache','Syrah','Carignan','Mourvèdre'], notes:'Large and varied. Best sites in Boutenac sub-zone. Old vine Carignan and Grenache. Garrigue herbs in flavor.' },
  { name:'Banyuls VDN', country:'France', parentRegion:'Languedoc-Roussillon', lat:42.480, lng:3.128, grapes:['Grenache'], notes:'Fortified VDN. Steep schist terraces on Catalan coast. Rancio character from oxidative aging. France\'s answer to port.' },

  // === FRANCE — Provence ===
  { name:'Bandol', country:'France', parentRegion:'Provence', lat:43.140, lng:5.750, grapes:['Mourvèdre','Grenache','Cinsault'], notes:'Mourvèdre min 50%. Full body, dark fruit, leather, garrigue, needs long aging. Finest Mourvèdre outside of Rhône.' },

  // === GERMANY — Mosel ===
  { name:'Bernkastel', country:'Germany', parentRegion:'Mosel', lat:49.916, lng:7.073, grapes:['Riesling'], notes:'Premier Mosel town. Bernkasteler Doctor: famous steep vineyard, blue-grey slate. Spicy, complex. Weingut Dr. Loosen, Mönchhof.' },
  { name:'Piesport', country:'Germany', parentRegion:'Mosel', lat:49.886, lng:6.921, grapes:['Riesling'], notes:'Deep amphitheater curve of Mosel. Piesporter Goldtröpfchen: fine GG on slate. Light, floral, delicate. (Michelsberg = village level, different quality).' },
  { name:'Wehlen', country:'Germany', parentRegion:'Mosel', lat:49.930, lng:7.072, grapes:['Riesling'], notes:'Wehlener Sonnenuhr: famous GG site (sundial carved in slate). Joh. Jos. Prüm estate. Finesse, minerality, exceptional aging.' },

  // === GERMANY — Rheingau ===
  { name:'Johannisberg', country:'Germany', parentRegion:'Rheingau', lat:49.985, lng:7.983, grapes:['Riesling'], notes:'Schloss Johannisberg: oldest Riesling estate. Spätlese discovered here in 1775. South-facing Rhine slopes. Peach-inflected full-bodied Riesling.' },
  { name:'Assmannshausen', country:'Germany', parentRegion:'Rheingau', lat:49.994, lng:7.870, grapes:['Spätburgunder'], notes:'Exception in Rheingau: mostly red. Best Spätburgunder (Pinot Noir) in Germany. Slate soils. Light-medium body, red fruit, elegant.' },
  { name:'Rüdesheim', country:'Germany', parentRegion:'Rheingau', lat:49.977, lng:7.916, grapes:['Riesling'], notes:'Rüdesheimer Berg: steep slate slope. Powerful, mineral Riesling. Dramatic Rhine bend. Popular wine tourism town.' },

  // === GERMANY — Rheinhessen ===
  { name:'Nierstein', country:'Germany', parentRegion:'Rheinhessen', lat:49.873, lng:8.337, grapes:['Riesling'], notes:'Rheinterrasse (Rhine slope). Red sandstone soils. Fullest-bodied Rheinhessen Riesling. GG sites: Hipping, Pettenthal, Orbel.' },

  // === GERMANY — Nahe ===
  { name:'Schlossböckelheim', country:'Germany', parentRegion:'Nahe', lat:49.770, lng:7.820, grapes:['Riesling'], notes:'Top Nahe village. Kupfergrube vineyard (former copper mine): volcanic porphyry. Complex, spicy mineral Riesling.' },

  // === GERMANY — Baden ===
  { name:'Kaiserstuhl', country:'Germany', parentRegion:'Baden', lat:48.095, lng:7.673, grapes:['Grauburgunder','Spätburgunder'], notes:'Volcanic basalt. Warmest Baden sub-zone. Outstanding Grauburgunder (Pinot Gris) and Spätburgunder.' },

  // === GERMANY — Franken ===
  { name:'Würzburg', country:'Germany', parentRegion:'Franken', lat:49.797, lng:9.934, grapes:['Silvaner','Riesling'], notes:'Würzburger Stein: famous since 12th century. Muschelkalk (shell limestone). Dry Silvaner in Bocksbeutel (flat flagon).' },

  // === AUSTRIA ===
  { name:'Wachau', country:'Austria', parentRegion:'Wachau / Kremstal / Kamptal (Niederösterreich)', lat:48.297, lng:15.415, grapes:['Grüner Veltliner','Riesling'], notes:'Own classification: Steinfeder (≤11.5%), Federspiel (11.5–12.5%), Smaragd (>12.5%). UNESCO heritage. Steep gneiss/granite terraces.' },
  { name:'Kremstal', country:'Austria', parentRegion:'Wachau / Kremstal / Kamptal (Niederösterreich)', lat:48.410, lng:15.598, grapes:['Grüner Veltliner','Riesling'], notes:'Around Krems city. Loess (richer GV) and primary rock (leaner Riesling). DAC. Strong Riesling with mineral edge.' },
  { name:'Kamptal', country:'Austria', parentRegion:'Wachau / Kremstal / Kamptal (Niederösterreich)', lat:48.527, lng:15.775, grapes:['Grüner Veltliner','Riesling'], notes:'Kamptal DAC. Heiligenstein vineyard: volcanic porphyrite, exceptional mineral Riesling. Bründlmayer, Hirsch prominent.' },
  { name:'Neusiedlersee', country:'Austria', parentRegion:'Burgenland', lat:47.728, lng:16.831, grapes:['Welschriesling','Zweigelt'], notes:'Lake Neusiedl. Morning mist → Botrytis. Famous BA/TBA/Ausbruch sweet wines. Alois Kracher: world-class TBA.' },
  { name:'Mittelburgenland', country:'Austria', parentRegion:'Burgenland', lat:47.480, lng:16.470, grapes:['Blaufränkisch'], notes:'Blaufränkisch DAC. Clay-limestone. Full-bodied, high tannin and acid, dark spicy fruit. Austria\'s "Bordeaux."' },

  // === ITALY ===
  { name:'Barolo DOCG', country:'Italy', parentRegion:'Piemonte', lat:44.601, lng:7.940, grapes:['Nebbiolo'], notes:'"King of Italian wine." Calcareous clay. "Traditional" (large Slovenian oak) vs "Modernist" (barrique) debate. Min 3yr aging (5yr Riserva). Tar, rose, cherry, extraordinary longevity.' },
  { name:'Barbaresco DOCG', country:'Italy', parentRegion:'Piemonte', lat:44.700, lng:8.055, grapes:['Nebbiolo'], notes:'"Queen" to Barolo\'s King. Tortonian soils, warmer → more approachable earlier. Min 2yr aging. Subtle perfume, silk. Gaja: revolutionized with French oak.' },
  { name:'Gavi DOCG', country:'Italy', parentRegion:'Piemonte', lat:44.685, lng:8.812, grapes:['Cortese'], notes:'Cortese: high acid, light body, citrus and apple, delicate mineral. Gavi di Gavi: single-commune premium.' },
  { name:'Soave Classico', country:'Italy', parentRegion:'Veneto', lat:45.419, lng:11.251, grapes:['Garganega','Trebbiano di Soave'], notes:'Volcanic basalt soils. Garganega min 70%. Dry, medium body, pear, almond, white flowers, mineral. Soave Superiore DOCG: hillside.' },
  { name:'Valpolicella Classico', country:'Italy', parentRegion:'Veneto', lat:45.520, lng:10.920, grapes:['Corvina','Rondinella','Molinara'], notes:'Light cherry, unoaked, fresh. Classico zone: hills west of Verona. Basis for Amarone via appassimento.' },
  { name:'Amarone della Valpolicella', country:'Italy', parentRegion:'Veneto', lat:45.510, lng:10.950, grapes:['Corvina','Rondinella'], notes:'Appassimento: grapes dried 3–4 months. DOCG. Full body, 15–17% ABV, dark cherry, chocolate, bitter finish. Min 2yr aging.' },
  { name:'Prosecco (Valdobbiadene)', country:'Italy', parentRegion:'Veneto', lat:45.905, lng:12.003, grapes:['Glera'], notes:'Conegliano Valdobbiadene DOCG. Charmat method. Cartizze: single steep vineyard "Grand Cru." Fresh, fruity. Superiore di Cartizze: richest.' },
  { name:'Chianti Classico', country:'Italy', parentRegion:'Tuscany', lat:43.458, lng:11.196, grapes:['Sangiovese'], notes:'DOCG. Gallo Nero (Black Rooster). Min 80% Sangiovese. Galestro and Alberese soils. Annata, Riserva (24mo oak), Gran Selezione (30mo+).' },
  { name:'Brunello di Montalcino', country:'Italy', parentRegion:'Tuscany', lat:43.063, lng:11.489, grapes:['Sangiovese Grosso (Brunello)'], notes:'100% Sangiovese. Min 5yr aging (6yr Riserva). Italy\'s most prestigious red. Large Slavonian oak. Dark cherry, leather, tobacco, 20–50yr aging.' },
  { name:'Bolgheri (Super Tuscans)', country:'Italy', parentRegion:'Tuscany', lat:43.228, lng:10.622, grapes:['Cabernet Sauvignon','Merlot','Cabernet Franc'], notes:'Sassicaia, Ornellaia, Masseto: world-class. IGT classification. Bordeaux varieties on coastal Maremma. International style.' },
  { name:'Vino Nobile di Montepulciano', country:'Italy', parentRegion:'Tuscany', lat:43.097, lng:11.790, grapes:['Sangiovese'], notes:'Prugnolo Gentile (Sangiovese clone). DOCG. Between Chianti and Brunello in style. Plum, cherry, spice. Min 2yr ageing. Rosso di Montepulciano: earlier drinking.' },
  { name:'Vernaccia di San Gimignano', country:'Italy', parentRegion:'Tuscany', lat:43.468, lng:11.042, grapes:['Vernaccia'], notes:'Italy\'s first DOCG (1993, white). Crisp, mineral, almond, light. Medieval hilltop town. Fresh, unoaked style is most typical.' },
  { name:'Asti DOCG', country:'Italy', parentRegion:'Piemonte', lat:44.900, lng:8.206, grapes:['Moscato Bianco'], notes:'Sweet, frothy, low alcohol (5-7%). Muscat grape. Charmat method (Asti Spumante) or tank-closed (Moscato d\'Asti — frizzante). Grapey, peach, floral.' },
  { name:'Roero DOCG', country:'Italy', parentRegion:'Piemonte', lat:44.744, lng:7.958, grapes:['Nebbiolo','Arneis'], notes:'Left bank of Tanaro. Sandy soils = lighter Nebbiolo than Barolo. Roero Arneis: crisp white (almond, pear). Growing reputation.' },
  { name:'Etna DOC', country:'Italy', parentRegion:'Sicily', lat:37.730, lng:15.003, grapes:['Nerello Mascalese','Carricante'], notes:'Volcanic basalt, 500–1000m altitude, old vines (up to 150yr). Nerello Mascalese: high acid/tannin, pale ruby, fragrant — "Burgundy of Sicily."' },
  { name:'Montefalco Sagrantino', country:'Italy', parentRegion:'Umbria', lat:42.890, lng:12.675, grapes:['Sagrantino'], notes:'Highest tannin grape in Italy. Full body, rich blackberry. DOCG. Needs years of aging. Umbrian rarity.' },
  { name:'Taurasi DOCG', country:'Italy', parentRegion:'Campania', lat:41.002, lng:15.010, grapes:['Aglianico'], notes:'"Barolo of the South." High tannin, high acid, dark fruit, tar, earth. Volcanic tuff soils. Min 3yr aging (Riserva 4yr, 18mo oak). Mastroberardino: historic producer.' },
  { name:'Aglianico del Vulture DOC', country:'Italy', parentRegion:'Campania', lat:40.950, lng:15.630, grapes:['Aglianico'], notes:'Basilicata, on slopes of extinct Monte Vulture volcano. Volcanic ash/tuff soils at 200-600m. North-facing slopes = cooler, longer growing season. Superiore elevated to DOCG 2011. Key producers: Elena Fucci, Basilisco, Paternoster. Slightly more elegant than Taurasi.' },

  // === ITALY — PUGLIA ===
  { name:'Primitivo di Manduria DOC', country:'Italy', parentRegion:'Puglia', lat:40.400, lng:17.630, grapes:['Primitivo'], notes:'Primitivo = Zinfandel genetically. Hot climate = ripe, concentrated, high alcohol (14-17%). Traditional alberello (bush vine) training. Also Dolce Naturale (sweet) version. Riserva: 2yr aging.' },
  { name:'Salice Salentino DOC', country:'Italy', parentRegion:'Puglia', lat:40.390, lng:17.960, grapes:['Negroamaro','Malvasia Nera'], notes:'Salento peninsula (heel of Italy). Negroamaro min 75%. Medium-full body, baked red fruit, plum, fig, earthy. Good value. Notable rosato (rosé) also important. Riserva: 2yr (8mo oak).' },
  { name:'Gioia del Colle DOC', country:'Italy', parentRegion:'Puglia', lat:40.800, lng:16.920, grapes:['Primitivo','Negroamaro'], notes:'Higher altitude (300-500m) Puglia DOC on the Murge plateau. More structured, fresh Primitivo than low-elevation Manduria. Cooler nights preserve acidity. Rising quality reputation.' },

  // === ITALY — SICILY (additional) ===
  { name:'Cerasuolo di Vittoria DOCG', country:'Italy', parentRegion:'Sicily', lat:36.930, lng:14.720, grapes:['Nero d\'Avola','Frappato'], notes:'Sicily\'s only DOCG. Nero d\'Avola 50-70% (power) + Frappato 30-50% (elegance, fragrance). Southeastern Sicily (Ragusa/Vittoria). Medium body, red cherry, strawberry, floral, silky. Min 18mo aging.' },
  { name:'Marsala DOC', country:'Italy', parentRegion:'Sicily', lat:37.800, lng:12.430, grapes:['Grillo','Catarratto','Inzolia'], notes:'Fortified wine from western Sicily. Oro/Ambra/Rubino colors; Secco/Semisecco/Dolce sweetness. Declined mid-20th century from cheapening. Revival through Vergine style (uncooked, finest). Fine 1yr, Superiore 2yr, Vergine 5yr, Stravecchio 10yr.' },
  { name:'Moscato di Pantelleria DOC', country:'Italy', parentRegion:'Sicily', lat:36.830, lng:11.950, grapes:['Zibibbo (Muscat of Alexandria)'], notes:'Volcanic island between Sicily and Tunisia. Passito: sun-dried grapes, intensely sweet — apricot, orange peel, honey, dried fig. UNESCO-recognized alberello (bush vine) cultivation against strong winds. 14-20% ABV.' },

  // === ITALY — TUSCANY (additional) ===
  { name:'Maremma Toscana DOC', country:'Italy', parentRegion:'Tuscany', lat:42.410, lng:11.470, grapes:['Sangiovese','Vermentino','Cabernet Sauvignon','Merlot','Syrah'], notes:'Coastal southern Tuscany (Grosseto province). Warmer, more maritime than inland. International varieties thrive alongside Sangiovese. Less restrictive than Chianti — creative blends. Bolgheri is within this broader zone. Rising quality.' },

  // === ITALY — ABRUZZO ===
  { name:'Montepulciano d\'Abruzzo DOC', country:'Italy', parentRegion:'Abruzzo', lat:42.35, lng:14.10, grapes:['Montepulciano'], notes:'Abruzzo\'s signature red. NOT the same grape as Vino Nobile di Montepulciano (which uses Sangiovese). High color, medium-high tannin, plum, dark cherry, earth. Range from simple/fruity to structured/oak-aged. Colline Teramane: sub-zone DOCG (2003), higher quality. Pergola Abruzzese training traditional.' },
  { name:'Trebbiano d\'Abruzzo DOC', country:'Italy', parentRegion:'Abruzzo', lat:42.20, lng:13.75, grapes:['Trebbiano d\'Abruzzo'], notes:'Distinct clone from Trebbiano Toscano — more aromatic and age-worthy. Valentini: legendary producer, among Italy\'s greatest whites. Typically light, crisp, neutral, but top examples show remarkable depth, honey, and almond with age.' },
  { name:'Cerasuolo d\'Abruzzo DOC', country:'Italy', parentRegion:'Abruzzo', lat:42.40, lng:13.95, grapes:['Montepulciano'], notes:'Italy\'s most structured rosé (rosato). Deep cherry-pink color from Montepulciano grape. More body and tannin than most rosés. Fresh red cherry, raspberry, herbal notes. Separate DOC since 2010 (previously a sub-category of Montepulciano d\'Abruzzo).' },

  // === ITALY — MARCHE ===
  { name:'Verdicchio dei Castelli di Jesi DOC', country:'Italy', parentRegion:'Marche', lat:43.52, lng:13.25, grapes:['Verdicchio'], notes:'Main zone for Verdicchio. Green apple, lemon, fennel, almond, high acid. Classico Superiore: premium hillside. Riserva: extended aging. Significant aging potential — develops honeyed, nutty complexity over 5-10+ years. Traditional amphora-shaped bottle. Italy\'s finest native white grape.' },
  { name:'Verdicchio di Matelica DOC', country:'Italy', parentRegion:'Marche', lat:43.25, lng:13.01, grapes:['Verdicchio'], notes:'More inland, higher altitude, continental climate than Castelli di Jesi. Higher acidity, more mineral and austere. Smaller production, less well-known but often more age-worthy. Enclosed valley between two mountain ranges.' },
  { name:'Rosso Conero DOC', country:'Italy', parentRegion:'Marche', lat:43.55, lng:13.55, grapes:['Montepulciano','Sangiovese'], notes:'Monte Conero promontory on the Adriatic coast near Ancona. Montepulciano min 85%. Deep color, firm structure, plum, cherry — serious, age-worthy reds. Conero DOCG (Riserva): minimum 2 years aging. Umani Ronchi: notable producer.' },

  // === ITALY — LAZIO ===
  { name:'Frascati DOC / Superiore DOCG', country:'Italy', parentRegion:'Lazio', lat:41.81, lng:12.68, grapes:['Malvasia del Lazio (Puntinata)','Malvasia Bianca di Candia','Trebbiano Toscano'], notes:'Rome\'s house white from the Colli Albani (Alban Hills). Volcanic soils. Since 2011 reforms: Malvasia del Lazio (Puntinata) up to 70% — higher quality clone. Modern cold fermentation and yield control producing more serious wines. Superiore DOCG: stricter yields.' },
  { name:'Cesanese del Piglio DOCG', country:'Italy', parentRegion:'Lazio', lat:41.83, lng:13.10, grapes:['Cesanese'], notes:'Lazio\'s only red DOCG. Indigenous Cesanese grape: medium body, cherry, spice, herbal. From hills east of Rome (Ciociaria). Small production, gaining recognition. Historically used for sweet/sparkling, now quality dry reds.' },
  { name:'Est! Est!! Est!!! di Montefiascone DOC', country:'Italy', parentRegion:'Lazio', lat:42.53, lng:11.83, grapes:['Trebbiano Toscano','Malvasia'], notes:'Famous for its name (legend of Bishop Defuk\'s servant marking inns). Northern Lazio, near Lake Bolsena. Volcanic soils. Light, crisp, simple white. Historically mediocre but some producers now making more serious versions.' },

  // === ITALY — ALTO ADIGE ===
  { name:'Bolzano / Gries (Lagrein)', country:'Italy', parentRegion:'Alto Adige DOC', lat:46.50, lng:11.36, grapes:['Lagrein'], notes:'Bolzano basin: warmest part of Alto Adige. Lagrein\'s historic heartland (Santa Maddalena/Gries). Alluvial gravel soils with good drainage. Medium-full body, dark berry, smoky, chocolate, moderate tannin. Dunkel (dark/red) is the main style; Kretzer (rosé) also traditional.' },
  { name:'Tramin / Termeno (Gewürztraminer)', country:'Italy', parentRegion:'Alto Adige DOC', lat:46.33, lng:11.24, grapes:['Gewurztraminer'], notes:'Village where Gewürztraminer likely originated (Traminer = from Tramin). South-facing slopes at 250-400m. Volcanic porphyry soils. Lychee, rose petal, spice. Dry style typical (vs Alsace late harvest). Cantina Tramin co-operative: top producer.' },
  { name:'Eisacktal / Valle Isarco', country:'Italy', parentRegion:'Alto Adige DOC', lat:46.73, lng:11.44, grapes:['Sylvaner','Müller-Thurgau','Kerner','Grüner Veltliner'], notes:'Northernmost sub-zone. Narrow Isarco valley, steep slopes, 350-900m altitude. Very crisp, aromatic whites. Mineral, high acid. Abbazia di Novacella: historic monastery winery (est. 1142). Coolest growing conditions in Alto Adige.' },

  // === ITALY — TRENTINO ===
  { name:'Campo Rotaliano (Teroldego)', country:'Italy', parentRegion:'Trentino DOC', lat:46.19, lng:11.08, grapes:['Teroldego'], notes:'Alluvial plain near Mezzocorona. Teroldego Rotaliano DOC: 100% indigenous Teroldego (DNA parent of Lagrein). Deep color, high acid, blackberry, bitter chocolate. Traditional Pergola Trentina training. Ora wind from Lake Garda aids ventilation. Foradori: benchmark producer.' },
  { name:'Trentodoc (Sparkling)', country:'Italy', parentRegion:'Trentino DOC', lat:46.07, lng:11.12, grapes:['Chardonnay','Pinot Noir'], notes:'Italy\'s premier metodo classico sparkling wine. Min 15 months on lees (Millesimato 24mo, Riserva 36mo). Ferrari (est. 1902): benchmark, 5M+ bottles/yr. Mountain altitude (300-800m) preserves acidity. Elegant, citrus, apple, brioche, fine persistent mousse. Growing international recognition.' },

  // === FRANCE — SW France ===
  { name:'Cahors AC', country:'France', parentRegion:'SW France (Cahors, Madiran, Jurançon)', lat:44.448, lng:1.440, grapes:['Malbec (Côt/Auxerrois)','Merlot','Tannat'], notes:'Malbec homeland (called Côt or Auxerrois locally). Min 70% Malbec. Limestone plateau (Causses du Quercy) above the Lot river gorge. Gave Malbec to Argentina in 19th century. Deep, dark, tannic — historically called "Black Wine of Cahors." Traditional: very powerful, structured, austere. Modern: more approachable, fruit-forward, plum and blackberry. Clos de Gamot, Château du Cèdre, Clos Triguedina: benchmark producers.' },
  { name:'Madiran AC', country:'France', parentRegion:'SW France (Cahors, Madiran, Jurançon)', lat:43.578, lng:0.040, grapes:['Tannat','Cabernet Franc','Cabernet Sauvignon'], notes:'Tannat homeland (min 40–60% Tannat required). One of world\'s most tannic grapes — rich in polyphenols. Foothills of the Pyrenees, clay-limestone soils. Deep purple, full body, dark fruit, violets, extraordinary aging potential (10–20+ years). Micro-oxygenation technique invented here by Patrick Ducournau (1991) to tame tannins early. Tannat\'s health benefits studied for the famous Gascon longevity. Château Montus, Domaine Berthoumieu, Château d\'Aydie: benchmark.' },
  { name:'Jurançon AC', country:'France', parentRegion:'SW France (Cahors, Madiran, Jurançon)', lat:43.290, lng:-0.368, grapes:['Gros Manseng','Petit Manseng'], notes:'Pyrenean foothills south of Pau. Two distinct styles: Jurançon Sec (dry, primarily Gros Manseng) — aromatic, tropical fruit, grapefruit, spice, refreshing high acidity. Jurançon (sweet, primarily Petit Manseng) — passerillage (natural drying on the vine by warm Foehn winds from Pyrenees, not botrytis), intensely sweet, preserved apricot, candied orange, honey, ginger, exotic spice — extraordinary aging potential 20+ years. "In a flash of golden sweetness, it was a revelation" — Colette (at her baptism). Domaine Cauhapé, Clos Uroulat: benchmark.' },
  { name:'Bergerac AC', country:'France', parentRegion:'SW France (Cahors, Madiran, Jurançon)', lat:44.851, lng:0.482, grapes:['Cabernet Sauvignon','Merlot','Sémillon','Sauvignon Blanc','Muscadelle'], notes:'Immediately east of Bordeaux on the Dordogne river. Same grapes as Bordeaux, similar terroir but separate AC. Reds: Pécharmant sub-zone produces structured, age-worthy wines. Whites: Bergerac Sec (dry Sauvignon Blanc). Monbazillac AC: botrytised Sémillon/Sauvignon/Muscadelle — great value alternative to Sauternes. Rosette and Saussignac: also sweet white sub-zones. Good value relative to Bordeaux.' },
  { name:'Gaillac AC', country:'France', parentRegion:'SW France (Cahors, Madiran, Jurançon)', lat:43.900, lng:1.900, grapes:['Duras','Braucol (Fer Servadou)','Mauzac','Len de l\'El','Ondenc'], notes:'Ancient wine region east of Toulouse, one of France\'s oldest. Most diverse SW France region: still reds, whites, rosés, sparkling. Indigenous grapes: Duras and Braucol (Fer Servadou) for reds — high acid, fresh, rustic. Mauzac: base for Gaillac mousseux (ancestral/Charmat method) and dry/sweet whites. Len de l\'El: rare indigenous white, aromatic, rich. Gaillac is a treasure of obscure variety preservation.' },

  // === SPAIN ===
  { name:'Rioja Alavesa', country:'Spain', parentRegion:'Rioja', lat:42.555, lng:-2.650, grapes:['Tempranillo','Garnacha'], notes:'Basque Country (Álava). Atlantic climate, clay-limestone. Most elegant, lightest Rioja. Many single-estate finca wines.' },
  { name:'Rioja Alta', country:'Spain', parentRegion:'Rioja', lat:42.420, lng:-2.650, grapes:['Tempranillo'], notes:'Heart of Rioja. Haro the capital. Clay-limestone. Most traditional producers. CVNE, López de Heredia. Structured, classic style.' },
  { name:'Rioja Oriental', country:'Spain', parentRegion:'Rioja', lat:42.300, lng:-2.10, grapes:['Tempranillo','Garnacha'], notes:'Formerly Rioja Baja. Hottest, most Mediterranean sub-zone. More Garnacha. Fuller, riper, higher alcohol. Co-op dominated. Increasingly valued for old-vine Garnacha.' },
  { name:'Penedès DO', country:'Spain', parentRegion:'Penedès & Priorat (Catalunya)', lat:41.372, lng:1.720, grapes:['Macabeo','Xarel-lo','Parellada'], notes:'Home of Cava. Traditional method sparkling. Three local grapes. Also international varieties. Torres pioneered modern winemaking here. Varied altitudes and mesoclimates.' },
  { name:'Priorat DOCa', country:'Spain', parentRegion:'Penedès & Priorat (Catalunya)', lat:41.221, lng:0.720, grapes:['Garnacha','Cariñena','Syrah'], notes:'Llicorella (black slate and quartz). Very steep, terraced. Ultra-low yields (500g/vine). Clos Mogador, Álvaro Palacios l\'Ermita: iconic.' },
  { name:'Rueda DO', country:'Spain', parentRegion:'Ribera del Duero', lat:41.413, lng:-4.955, grapes:['Verdejo','Sauvignon Blanc'], notes:'Verdejo: fresh, crisp, herbal, tropical, high acid, slightly bitter finish. Chalky limestone plateau. Rueda Superior: min 50% Verdejo.' },
  { name:'Jerez (Sherry)', country:'Spain', parentRegion:'Valencia & Levante', lat:36.687, lng:-6.136, grapes:['Palomino Fino','Pedro Ximénez','Moscatel'], notes:'Fortified wine. Albariza soils. Flor yeast for Fino/Manzanilla (biologically aged, pale, dry). Oloroso: oxidatively aged, nutty, darker. PX: very sweet raisined.' },
  { name:'Val do Salnés', country:'Spain', parentRegion:'Rías Baixas', lat:42.530, lng:-8.770, grapes:['Albariño'], notes:'Largest Rías Baixas sub-zone. Most Albariño production. Granite soils. Pergola training. Classic fresh, citrus, stone fruit, briny style.' },

  // === SPAIN — Valencia & Levante ===
  { name:'Jumilla DO', country:'Spain', parentRegion:'Valencia & Levante', lat:38.472, lng:-1.328, grapes:['Monastrell','Airén'], notes:'High plateau (400–800m), northwest of Alicante. Almost exclusively Monastrell (Mourvèdre). Very old bush vines (50–100+ years) — phylloxera-free sandy soils. Low yields, deeply concentrated. Deep color, full body, high alcohol (14–16%), plum, dark fruit, spice, leather. Often unblended, showcasing Monastrell\'s power. Casa Castillo, Juan Gil, El Nido: benchmark producers. Increasingly fresh, modern styles emerging from altitude vineyards.' },
  { name:'Yecla DO', country:'Spain', parentRegion:'Valencia & Levante', lat:38.613, lng:-1.114, grapes:['Monastrell','Garnacha Tintorera'], notes:'Small DO north of Jumilla. High plateau (600–800m), extreme continental climate. Monastrell-dominant. Bodegas Castaño: major producer (90%+ of DO output). Campo Arriba: hillside superior sub-zone with older vines and more elegant style. Phylloxera-free. More refined than Jumilla due to altitude.' },
  { name:'Utiel-Requena DO', country:'Spain', parentRegion:'Valencia & Levante', lat:39.591, lng:-1.097, grapes:['Bobal','Tempranillo','Garnacha'], notes:'High plateau (700–900m), westernmost Valencia appellation. Bobal: the signature grape — thick skin, deep color, high natural acidity, red and black cherry fruit, earthy. Old vine Bobal rosé: excellent quality and value. Traditional clarete (pale red blend) from Bobal. Revolution in quality now showcasing old vine Bobal in single-vineyard wines. Also fresh whites from Macabeo and Merseguera.' },
  { name:'Valencia DO', country:'Spain', parentRegion:'Valencia & Levante', lat:39.470, lng:-0.376, grapes:['Moscatel de Valencia','Merseguera','Monastrell','Macabeo'], notes:'Three sub-zones: Valencia (coastal), Valentino (inland), Alto Turia (high mountain, 700–900m). Moscatel de Valencia: lightly fortified sweet Muscat — aromatic, grapey, fresh, low alcohol — classic tapas wine. Merseguera: dry white, light, crisp. Reds from Monastrell and Tempranillo for large-volume market. Excellent value.' },
  { name:'Alicante DO', country:'Spain', parentRegion:'Valencia & Levante', lat:38.345, lng:-0.490, grapes:['Monastrell','Garnacha Tintorera','Merseguera'], notes:'Two sub-zones: Alicante (coastal/valley, warmer) and Alto Vinalopó (higher altitude 800m+, more finesse). Fondillón: unique historic sweet wine from overripe Monastrell — 16%+ natural alcohol, oxidative aging in solera, rancio character, extraordinary complexity — protected designation, minimum 8yr aging. Garnacha Tintorera: teinturier grape (red flesh) giving deep color.' },

  // === SPAIN — Ribera del Duero ===
  { name:'Toro DO', country:'Spain', parentRegion:'Ribera del Duero', lat:41.517, lng:-5.397, grapes:['Tinta de Toro (Tempranillo)','Garnacha'], notes:'West of Ribera del Duero, near the Portuguese border. Tinta de Toro: local Tempranillo clone evolved to extreme heat. At 650m altitude, hot summers and cold winters. Spain\'s most powerful Tempranillo: deep color, very full body, very high tannin, concentrated plum and blackberry, often exceeds 15% ABV naturally. Phylloxera-free sandy loam soils with some clay. Numanthia (LVMH) and Pintia (Vega Sicilia subsidiary): iconic producers. Modern styles showing more elegance and freshness.' },
  { name:'Cigales DO', country:'Spain', parentRegion:'Ribera del Duero', lat:41.773, lng:-4.538, grapes:['Tempranillo','Garnacha'], notes:'North of Valladolid, between Ribera del Duero and Rueda. Historically famous for clarete (pale red) and rosé wines. Now producing quality structured reds. Tempranillo dominant at 700–800m altitude. Limestone and sandstone soils. Small, rising DO.' },

  // === SPAIN — La Mancha ===
  { name:'La Mancha DO', country:'Spain', parentRegion:'La Mancha & Castilla-La Mancha', lat:39.100, lng:-3.500, grapes:['Airén','Tempranillo (Cencibel)','Cabernet Sauvignon','Merlot','Chardonnay'], notes:'Largest DO in Spain (and world by area). Flat Meseta plateau at 600–700m. Hot, dry continental climate with extreme frost risk in winter. Airén: world\'s most planted variety by area — neutral, high acid white, historically distilled for Brandy de Jerez. Modern Airén: fresh, clean whites with refrigeration technology. Cencibel (Tempranillo): improving dramatically — fruity unoaked jóvenes to structured Crianzas. Huge cooperative sector modernizing. Massive investment since 1990s.' },
  { name:'Valdepeñas DO', country:'Spain', parentRegion:'La Mancha & Castilla-La Mancha', lat:38.762, lng:-3.383, grapes:['Tempranillo (Cencibel)','Airén'], notes:'Within La Mancha zone but separate premium DO. Tempranillo (called Cencibel) dominant for reds. Traditional clarete: Cencibel + Airén blend, pale red, refreshing. Clay-limestone soils, higher than surrounding La Mancha. More structured reds than La Mancha DO. Gran Reserva: min 5 years aging. Luis Megía, Bodegas Félix Solís (Viña Albali): main producers.' },
  { name:'Manchuela DO', country:'Spain', parentRegion:'La Mancha & Castilla-La Mancha', lat:39.367, lng:-1.900, grapes:['Bobal','Tempranillo','Merlot','Syrah','Cabernet Sauvignon'], notes:'Eastern La Mancha DO, bordering Utiel-Requena. Higher altitude (700–900m) gives freshness and acidity. Bobal important here as in Utiel-Requena. International varieties succeed. Growing quality movement with small family producers. Wines often show more freshness and elegance than central La Mancha.' },

  // === PORTUGAL — Douro Valley ===
  { name:'Baixo Corgo', country:'Portugal', parentRegion:'Douro Valley', lat:41.250, lng:-7.900, grapes:['Touriga Franca','Tinta Roriz','Tinta Barroca','Vinhão'], notes:'Westernmost and coolest Douro sub-region, centered around Régua. Highest rainfall (over 1000mm in places). Most fragrant, lighter style Port and Douro table wines. Highest volume production — most Ruby and basic Tawny comes from here. Schist soils. Good everyday-drinking quality.' },
  { name:'Cima Corgo', country:'Portugal', parentRegion:'Douro Valley', lat:41.175, lng:-7.500, grapes:['Touriga Nacional','Touriga Franca','Tinta Roriz','Tinta Barroca','Tinta Cão'], notes:'Heart of the Douro, centered around Pinhão. Most prestigious sub-region — the best Vintage Port comes from here. Quinta do Noval, Quinta do Crasto, Quinta da Romaneira, Taylor\'s Vargellas, Graham\'s Malvedos. Schist soils, dramatic south-facing terraces cut into gorge. Intense heat concentrated by sheltering mountains. Fine balance of power and elegance. Superb single-quinta Vintage Ports.' },
  { name:'Douro Superior', country:'Portugal', parentRegion:'Douro Valley', lat:41.150, lng:-6.900, grapes:['Touriga Nacional','Tinta Roriz','Rabigato','Viosinho'], notes:'Easternmost and driest Douro sub-region, bordering Spain. Very low rainfall (300–400mm), extreme heat, flat terrain (wider valley). Lower yields, very concentrated wines. Quinta da Leda (Sogrape), Quinta Vale Meão (Ramos Pinto): remarkable table wines from far upstream. Largely undeveloped compared to Cima Corgo but with enormous potential. Mechanical harvesting possible on flatter land.' },

  // === PORTUGAL — Alentejo ===
  { name:'Évora', country:'Portugal', parentRegion:'Alentejo', lat:38.57, lng:-7.90, grapes:['Aragonez','Trincadeira','Antão Vaz','Roupeiro'], notes:'Central sub-region near the capital city. Granite soils with schist in some areas. Well-rounded reds and aromatic whites. Key producers: Cartuxa (Fundação Eugénio de Almeida), Herdade do Rocim, Esporão.' },
  { name:'Reguengos', country:'Portugal', parentRegion:'Alentejo', lat:38.42, lng:-7.54, grapes:['Aragonez','Trincadeira','Alicante Bouschet','Antão Vaz'], notes:'South-central Alentejo, most planted sub-region. Granite and schist soils with some clay. Cooperative Reguengos de Monsaraz: one of Portugal\'s finest cooperatives. Herdade do Esporão: benchmark producer, pioneered modern quality Alentejo. Monsaraz fortress town area.' },
  { name:'Vidigueira', country:'Portugal', parentRegion:'Alentejo', lat:38.21, lng:-7.80, grapes:['Antão Vaz','Roupeiro','Alicante Bouschet','Trincadeira'], notes:'Southernmost Alentejo sub-region (Baixo Alentejo). Known for whites — Antão Vaz thrives in the schist soils here. José de Sousa winery: historic producer using Roman clay amphoras (talhas de barro) for fermentation — revival of ancient tradition, UNESCO-recognized. Vasco da Gama was born in nearby Sines.' },
  { name:'Borba', country:'Portugal', parentRegion:'Alentejo', lat:38.81, lng:-7.46, grapes:['Aragonez','Trincadeira','Roupeiro','Antão Vaz'], notes:'Central-east Alentejo, in the marble triangle (Estremoz-Borba-Vila Viçosa). Calcareous marble-limestone soils give mineral freshness. Dry reds of character and structure. Adega Cooperativa de Borba: one of Portugal\'s best cooperatives. Some of Alentejo\'s finest rosés.' },
  { name:'Portalegre', country:'Portugal', parentRegion:'Alentejo', lat:39.30, lng:-7.43, grapes:['Aragonez','Trincadeira','Antão Vaz','Grand Noir'], notes:'Northernmost and highest altitude Alentejo sub-region (400–800m), Serra de São Mamede. Coolest climate — more finesse, freshness, and acidity than lower Alentejo. Granite soils. Often produces wines with a style closer to Dão in elegance and restraint. Underexplored quality potential.' },

  // === USA — Napa Valley ===
  { name:'Stags Leap District', country:'USA', parentRegion:'Napa Valley', lat:38.390, lng:-122.362, grapes:['Cabernet Sauvignon'], notes:'Won 1976 Paris Tasting (Stag\'s Leap Wine Cellars). Palisades rock moderates heat. Cab Sauv: supple tannin, red fruit, softer than other Napa AVAs.' },
  { name:'Oakville AVA', country:'USA', parentRegion:'Napa Valley', lat:38.437, lng:-122.413, grapes:['Cabernet Sauvignon','Merlot'], notes:'Benchmark Napa Cabernet. To Kalon vineyard (Robert Mondavi). Gravel soils. Opulent, concentrated, blackcurrant, tobacco. Screaming Eagle here.' },
  { name:'Rutherford AVA', country:'USA', parentRegion:'Napa Valley', lat:38.455, lng:-122.434, grapes:['Cabernet Sauvignon'], notes:'"Rutherford Dust" — earthy alluvial quality. Inglenook, Beaulieu Vineyard historic estates. Firm structure, cassis, mint, long aging.' },
  { name:'Los Carneros AVA', country:'USA', parentRegion:'Napa Valley', lat:38.228, lng:-122.337, grapes:['Pinot Noir','Chardonnay'], notes:'Coolest Napa zone. San Pablo Bay fog and wind. Pinot Noir and Chardonnay (Burgundian style). Domaine Carneros sparkling.' },
  { name:'Howell Mountain AVA', country:'USA', parentRegion:'Napa Valley', lat:38.584, lng:-122.440, grapes:['Cabernet Sauvignon','Merlot','Zinfandel'], notes:'Above fog line (420m+). Red volcanic ash. Intense tannin, concentrated fruit, high acid. Small production.' },
  { name:'Calistoga AVA', country:'USA', parentRegion:'Napa Valley', lat:38.580, lng:-122.580, grapes:['Cabernet Sauvignon','Zinfandel'], notes:'Warmest Napa AVA. Volcanic soils. Full body, high alcohol, jammy dark fruit. Chateau Montelena (1976 Paris Tasting Chardonnay).' },
  { name:'Yountville AVA', country:'USA', parentRegion:'Napa Valley', lat:38.404, lng:-122.362, grapes:['Cabernet Sauvignon','Merlot'], notes:'One of Napa Valley\'s most prestigious AVAs, centered around the town of Yountville. Deep, fertile alluvial soils deposited by the Napa River. Benchmark producers: Dominus Estate (Christian Moueix of Pétrus), Opus One (Mondavi/Rothschild joint venture), Plumpjack, Cliff Lede. Slightly cooler than Oakville/Rutherford due to morning fog from San Pablo Bay. Cabernet Sauvignon: rich, plush, complex — blue/black fruit, cassis, integrated tannins. Merlot also excels.' },
  { name:'Spring Mountain District AVA', country:'USA', parentRegion:'Napa Valley', lat:38.497, lng:-122.521, grapes:['Cabernet Sauvignon','Merlot','Chardonnay'], notes:'Mountain AVA on western side of Napa Valley (Mayacamas range). Thin, well-drained volcanic and sedimentary soils at 200–600m. Smaller berries, naturally low yields. Cab Sauv: tannic, structured, age-worthy, more restrained than valley floor. Spring Mountain Vineyard, Stony Hill (benchmark Chardonnay): top estates. Old vines on many sites.' },
  { name:'Diamond Mountain District AVA', country:'USA', parentRegion:'Napa Valley', lat:38.551, lng:-122.508, grapes:['Cabernet Sauvignon'], notes:'Small, elevated AVA at top of Napa\'s western mountains. White, volcanic Haire series soils (unique). Intense, structured Cab Sauv with mineral precision. Diamond Creek (4 single-vineyard Cabs): pioneered premium mountain Napa. Revana, von Strasser: also notable. High elevation = cool nights, extreme temperature swings, exceptional acid retention.' },

  // === USA — Sonoma ===
  { name:'Russian River Valley', country:'USA', parentRegion:'Sonoma County', lat:38.470, lng:-122.950, grapes:['Pinot Noir','Chardonnay'], notes:'Benchmark CA Pinot Noir. Morning fog, cold afternoons. Goldridge loam soil. Raspberry, red cherry, earth, spice. Williams Selyem, Rochioli.' },
  { name:'Dry Creek Valley', country:'USA', parentRegion:'Sonoma County', lat:38.680, lng:-122.950, grapes:['Zinfandel','Sauvignon Blanc'], notes:'Old vine hillside Zinfandel. Jammy berry fruit, black pepper. Also valley floor Sauvignon Blanc. Drainwell soils.' },
  { name:'Alexander Valley', country:'USA', parentRegion:'Sonoma County', lat:38.780, lng:-122.990, grapes:['Cabernet Sauvignon','Merlot','Zinfandel'], notes:'Warm, sheltered. Deep alluvial soils. Ripe, plush Cab Sauv, approachable early. Jordan, Silver Oak.' },
  { name:'Los Carneros AVA (Sonoma)', country:'USA', parentRegion:'Sonoma County', lat:38.228, lng:-122.440, grapes:['Pinot Noir','Chardonnay','Meunier'], notes:'Straddles Napa/Sonoma border. San Pablo Bay cooling effect: persistent winds, morning fog. California\'s premier cool-climate zone for Pinot Noir, Chardonnay, and sparkling base wines. Domaine Carneros (Taittinger-owned): benchmark sparkling. Gloria Ferrer (Freixenet): also landmark. Carneros Creek, Saintsbury: still Pinot Noir. Shallow clay soils that stress vines beneficially — low yields, concentrated fruit.' },
  { name:'Sonoma Coast AVA', country:'USA', parentRegion:'Sonoma County', lat:38.600, lng:-123.100, grapes:['Pinot Noir','Chardonnay'], notes:'Broad AVA covering coastal Sonoma exposed to Pacific influence. True Sonoma Coast (extreme western, ocean-facing): wildly cool, high-acid, low-alcohol Pinot Noir — "freakishly good" style (Hirsch, Flowers, Marcassin). Diverse soils: sandstone, clay, Goldridge loam. Highly site-dependent — elevation and fog exposure define character.' },
  { name:'Petaluma Gap AVA', country:'USA', parentRegion:'Sonoma County', lat:38.230, lng:-122.690, grapes:['Pinot Noir','Chardonnay','Syrah'], notes:'Approved 2017. Cool corridor where Pacific winds funnel through the low gap in the Coast Ranges. Persistent afternoon winds (up to 60 km/h) slow ripening dramatically. High natural acidity, low pH. Pinot Noir: structured, savory, high-toned red fruit. Unti, Pax, Wind Gap: key producers. Also strong Chardonnay and emerging Syrah.' },


  // === USA — Central Coast ===
  { name:'Paso Robles AVA', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:35.626, lng:-120.691, grapes:['Cabernet Sauvignon','Zinfandel','Syrah','Grenache','Mourvèdre'], notes:'Large inland AVA. Two sides: west (limestone, cooler — Adelaida District) and east (clay, warmer). Benchmark Rhône varieties and old-vine Zinfandel. Tablas Creek (Perrin family), Turley, Saxum: top producers. Calcareous soils on west side give elegant structure.' },
  { name:'Santa Lucia Highlands AVA', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:36.281, lng:-121.393, grapes:['Pinot Noir','Chardonnay','Syrah'], notes:'High elevation (300–750m) bench above Salinas Valley. Dramatic diurnal range (15–20°C). Pacific winds funnel through Monterey Bay. Benchmark cool-climate Pinot Noir and Chardonnay. Pisoni, Garys\', Rosella\'s: iconic single vineyards. Roar Wines, Morgan, Mer et Soleil: key producers.' },
  { name:'Monterey AVA / Monterey County', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:36.525, lng:-121.576, grapes:['Pinot Noir','Chardonnay','Riesling','Gewurztraminer'], notes:'One of California\'s coolest wine regions. Salinas Valley acts as a funnel for cold Pacific air. Strong afternoon winds common. Ideal for aromatic whites (Riesling, Gewurztraminer) and cool-climate Chardonnay and Pinot Noir. Chalone AVA: elevated limestone bench, mineral Chardonnay. Arroyo Seco: gravelly soils, complex Riesling.' },
  { name:'San Luis Obispo County', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:35.308, lng:-120.657, grapes:['Pinot Noir','Chardonnay','Cabernet Sauvignon','Syrah'], notes:'Diverse county between Monterey and Santa Barbara. Contains Paso Robles (warm inland) and Edna Valley/Arroyo Grande (cool coastal). Edna Valley: strong marine influence, cool-climate Chardonnay and Pinot Noir. Talley Vineyards: benchmark. Also contains York Mountain (historic small AVA) and Avila Beach coastal area.' },
  { name:'Santa Ynez Valley AVA', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:34.627, lng:-120.098, grapes:['Syrah','Cabernet Franc','Merlot','Grenache','Sauvignon Blanc'], notes:'East-west transverse valley in Santa Barbara County. Western end cooler (Sta. Rita Hills), eastern end warmer (Happy Canyon). Rhône varieties excel on west; Bordeaux varieties on warmer eastern benchlands. Featured in Sideways (2004): boosts Pinot Noir and Syrah. Sub-AVAs: Ballard Canyon (Syrah), Los Olivos District, Happy Canyon (Bordeaux varieties).' },
  { name:'Santa Maria Valley AVA', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:34.937, lng:-120.433, grapes:['Pinot Noir','Chardonnay','Syrah'], notes:'Northernmost Santa Barbara County AVA. East-west transverse valley channels powerful Pacific winds and fog from Vandenberg — one of California\'s COOLEST wine regions despite latitude 35°N. Bien Nacido Vineyard: one of CA\'s most important single-vineyard sources (dozens of top winemakers source fruit here). Au Bon Climat, Foxen, Qupé: landmark producers. High acid, elegant Pinot Noir and Chardonnay.' },
  { name:'Sta. Rita Hills AVA', country:'USA', parentRegion:'Central Coast (Paso Robles, Santa Barbara)', lat:34.567, lng:-120.356, grapes:['Pinot Noir','Chardonnay'], notes:'Santa Barbara\'s premier cool-climate AVA (note: abbreviated to avoid trademark conflict with Chilean Viña Santa Rita). Western end of Santa Ynez Valley. Powerful Pacific winds and morning fog. Diatomaceous earth (unique — high silica, very poor, forces deep rooting) and sandstone/shale soils. Benchmark CA Pinot Noir: intense, complex, dark cherry, iron-mineral, high acid. Brewer-Clifton, Sea Smoke, Sanford, Melville: top estates.' },

  // === USA — Oregon ===
  { name:'Dundee Hills AVA', country:'USA', parentRegion:'Willamette Valley (Oregon)', lat:45.268, lng:-123.023, grapes:['Pinot Noir','Chardonnay'], notes:'Red Jory volcanic soil: most structured Willamette Pinot Noir. Domaine Drouhin, Brick House, Cristom. Best aging potential.' },

// Pre-computed climate classification for every region
const climateClassification = {};
regions.forEach(r => { climateClassification[r.name] = parseClimate(r.climate); });

function getClimateColor(regionName) {
  const cc = climateClassification[regionName];
  if (!cc) return '#888';
  return (CLIMATE_COLORS[cc.type] || CLIMATE_COLORS.unknown)[cc.temperature] || '#888';
}

function buildGeoFeatures() {
  // Rivers - blue polylines
  GEO_FEATURES.rivers.forEach(r => {
    const line = L.polyline(r.path, { color: '#4a9fd4', weight: 2, opacity: 0.6, dashArray: null }).addTo(geoLayer);
    line.bindTooltip(r.tooltip, { sticky: true, className: 'geo-tooltip' });
    const mid = r.path[Math.floor(r.path.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({ className: 'geo-label geo-label-river', html: r.name, iconSize: [0,0], iconAnchor: [-5, 8] }),
      interactive: false
    }).addTo(geoLayer);
  });

  // Mountain ranges - brown dashed polylines
  if (GEO_FEATURES.ranges) {
    GEO_FEATURES.ranges.forEach(r => {
      const line = L.polyline(r.path, { color: '#a0785a', weight: 3, opacity: 0.55, dashArray: '6,4' }).addTo(geoLayer);
      line.bindTooltip(r.tooltip, { sticky: true, className: 'geo-tooltip' });
      const mid = r.path[Math.floor(r.path.length / 2)];
      L.marker(mid, {
        icon: L.divIcon({ className: 'geo-label geo-label-mountain', html: `▲▲▲ ${r.name}`, iconSize: [0,0], iconAnchor: [-5, 8] }),
        interactive: false
      }).addTo(geoLayer);
    });
  }

  // Mountains - triangle markers
  GEO_FEATURES.mountains.forEach(m => {
    const icon = L.divIcon({
      className: 'geo-label geo-label-mountain',
      html: `▲ ${m.name}`,
      iconSize: [0, 0], iconAnchor: [-5, 8]
    });
    L.marker([m.lat, m.lng], { icon }).addTo(geoLayer).bindTooltip(m.tooltip, { sticky: true });
  });

  // Winds - green dashed arrows
  GEO_FEATURES.winds.forEach(w => {
    const line = L.polyline(w.path, { color: '#6dc9a0', weight: 2.5, opacity: 0.55, dashArray: '8,6' }).addTo(geoLayer);
    line.bindTooltip(w.tooltip, { sticky: true });
    // Arrow at end
    const last = w.path[w.path.length - 1];
    const prev = w.path[w.path.length - 2];
    const angle = Math.atan2(last[0] - prev[0], last[1] - prev[1]) * 180 / Math.PI;
    L.marker(last, {
      icon: L.divIcon({
        className: 'geo-label geo-label-wind',
        html: `➤ ${w.name}`,
        iconSize: [0,0], iconAnchor: [-5, 8]
      }), interactive: false
    }).addTo(geoLayer);
  });

  // Ocean currents - cyan dashed arrows
  GEO_FEATURES.currents.forEach(c => {
    const line = L.polyline(c.path, { color: '#5bb8d8', weight: 3, opacity: 0.45, dashArray: '12,8' }).addTo(geoLayer);
    line.bindTooltip(c.tooltip, { sticky: true });
    const mid = c.path[Math.floor(c.path.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({
        className: 'geo-label geo-label-current',
        html: `〰 ${c.name}`,
        iconSize: [0,0], iconAnchor: [-5, 8]
      }), interactive: false
    }).addTo(geoLayer);
  });

  // Special features - purple markers
  GEO_FEATURES.features.forEach(f => {
    const icon = L.divIcon({
      className: 'geo-label geo-label-feature',
      html: `◆ ${f.name}`,
      iconSize: [0, 0], iconAnchor: [-5, 8]
    });
    L.marker([f.lat, f.lng], { icon }).addTo(geoLayer).bindTooltip(f.tooltip, { sticky: true });
  });
}

// Only show geo features at zoom >= 5 to reduce clutter at world view
let geoVisible = false;
function updateGeoVisibility() {
  const z = map.getZoom();
  if (z >= 5 && !geoVisible) {
    geoVisible = true;
    buildGeoFeatures();
  } else if (z < 5 && geoVisible) {
    geoVisible = false;
    geoLayer.clearLayers();
  }
}
map.on('zoomend', updateGeoVisibility);
updateGeoVisibility();

function createIcon(color, size = 22) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size*1.4}" viewBox="0 0 30 42">
    <path d="M15 0C6.716 0 0 6.716 0 15c0 8.284 15 27 15 27s15-18.716 15-27C30 6.716 23.284 0 15 0z"
      fill="${color}" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="7" fill="rgba(255,255,255,0.85)"/>
    <circle cx="15" cy="15" r="4" fill="${color}"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [size, size * 1.4],
    iconAnchor: [size/2, size * 1.4],
    popupAnchor: [0, -(size * 1.4)]
  });
}

function formatGrapes(grapes) {
  return grapes.map(g => `<span class="grape-tag ${getGrapeWineClass(g)}">${g}</span>`).join('');
}

  'Aligoté': 'Burgundy\'s secondary white. High acidity, lean, citrus, green apple, sometimes nutty. Used in Kir cocktail (blackcurrant liqueur). Bouzeron AC is its home appellation. Crisp, refreshing but rarely complex.',
  'Melon de Bourgogne (Muscadet)': 'Loire Valley (Nantais). Neutral flavour: green apple, lemon, saline mineral. Very high acidity, light body, low alcohol. Hallmark technique: sur lie (aging on lees) → brioche, creamy texture, extra complexity. Muscadet Sèvre et Maine: finest.',
  'Corvina': 'Valpolicella/Amarone backbone variety. Cherry, sour cherry, almond, herbs, spice. Amarone: dried Corvina → concentrated dried fruit, dark chocolate, tobacco, 15%+ alcohol. Can be structured and age-worthy.',

  'Molinara': 'Minor Valpolicella blending grape. Adds colour, light body, acidity. Increasingly replaced by other varieties. Rarely bottled solo.',
  'Garganega': 'Soave (Veneto). Main white variety. Dry Soave: crisp, almond, white flowers, lemon, bitter finish. Recioto di Soave (sweet, botrytised): honeyed, rich, apricot, golden. Classico zone has best volcanic soils.',
  'Trebbiano di Soave': 'Allowed in Soave DOC blends (up to 30%). Neutral, high acid. Adds freshness. Distinctly different from Trebbiano Toscano (Ugni Blanc). Contributes textural length.',
  'Glera': 'Prosecco grape (Veneto/Friuli). Aromatic, floral, pear, green apple, white peach. Charmat (tank) method → fresh, frothy, easy-drinking. Prosecco DOCG (Conegliano Valdobbiadene): finest examples. Low tannin, moderate acid.',
  'Sangiovese Grosso (Brunello)': 'Montalcino clone of Sangiovese — bigger, richer than standard Sangiovese. Brunello di Montalcino DOCG: full body, high tannins, sour cherry, leather, tobacco, dried roses, earthy minerality. Requires minimum 5 years aging (10 for Riserva). Among Italy\'s greatest.',
  'Cortese': 'Gavi (Piemonte). Crisp, clean, citrus, green apple, almond, mineral. Medium body, high acidity, light alcohol. Gavi di Gavi (Rovereto): finest expressions. Food-friendly, seafood wine.',
  'Spätburgunder': 'German Pinot Noir. Pale ruby, elegant, red cherry, raspberry, subtle earthy/forest floor. Ahr valley: darkest, most structured. Baden: fuller, more Burgundy-like. Cooler than French Pinot — lighter, higher acid.',

  'Welschriesling': 'Austria (Burgenland, Steiermark). NOT related to Riesling. Moderate acidity, neutral flavours: apple, lemon, slight herbal. Used for everyday wines, Eiswein, and in TBA dessert wines. Confusingly named.',
  'Zweigelt': 'Austria\'s most planted red (Blaufränkisch × St Laurent cross). Cherry, plum, pepper, sometimes smoky. Medium body, firm but soft tannins. Versatile: light to medium style. Easy-drinking but can be serious with aging.',
  'Blaufränkisch': 'Austria (Burgenland) — called Lemberger in Germany/USA. Dark cherry, blackberry, spice, pepper, mineral. High acidity, firm tannins. Burgenland: powerful, age-worthy. Blaufränkisch is Austria\'s answer to Syrah.',
  'Nerello Mascalese': 'Etna, Sicily (on volcano slopes). Pale ruby — compared to Pinot Noir. Red cherry, dried herbs, volcanic mineral, earth, smoke. High acidity, silky tannins. Etna Rosso DOC: benchmark. Increasingly fashionable, prices rising.',
  'Carricante': 'Etna Bianco (Sicily, volcanic). Crisp, mineral, citrus, white peach, volcanic/smoky character. High acidity from altitude. Etna Bianco Superiore (Milo area): finest expressions. Very food-friendly.',
  'Sagrantino': 'Montefalco (Umbria). Extremely high tannins — among the world\'s highest. Dark fruit, blackberry, chocolate, dried rose, earthy. Montefalco Sagrantino DOCG: minimum 37 months aging. Passito (sweet) version also made. Requires patience.',
  'Palomino Fino': 'Jerez (Sherry). On its own: neutral, low acidity, thin. But under flor yeast → Fino/Manzanilla Sherry: bone dry, pungent, almond, chamomile, saline. Oxidatively aged → Oloroso: darker, richer, walnut, dried fruit.',
  'Pedro Ximénez': 'Jerez. Dried in sun → intensely sweet, raisin, date, fig, chocolate, molasses, 400+g/L residual sugar. PX Sherry: one of the world\'s sweetest wines. Also blended into Cream Sherry. Montilla-Moriles PDO also makes PX.',
  'Moscatel': 'Spain/Portugal. Muscat-family variety (Muscat of Alexandria). Perfumed: orange blossom, honey, grape. Made as sweet fortified (Málaga, Setúbal) or dry table wine. Less fine than Muscat Blanc à Petits Grains but very aromatic.',
  'Cariñena': 'Spanish name for Carignan. High acidity, high tannins, deep colour, dark fruit. Old vines in Priorat (llicorella slate) produce concentrated, mineral wines. Also grown in Priorat and Roussillon (as Cariñena/Mazuelo). Blending backbone.',
  'Muscat de Frontignan': 'Languedoc sweet fortified (VDN). Same grape as Muscat Blanc à Petits Grains. Intensely grapey, orange blossom, honey, apricot. Fortified during fermentation → sweet, 15%+. Frontignan is the benchmark appellation.',

  'Chardonnay': { origin: 'Burgundy, France', synonyms: 'Morillon (Austria)', type: 'white', climate: 'Cool to warm', vigor: 'Moderate', ripening: 'Early', notes: 'Extremely versatile — adapts to many climates and winemaking styles. Susceptible to spring frost (early budding). Thrives on limestone and chalk.' },

  'Pinot Gris': { origin: 'Burgundy, France (mutation of Pinot Noir)', synonyms: 'Pinot Grigio (Italy), Grauburgunder (Germany), Ruländer', type: 'white', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Early-mid', notes: 'Grey-pink skinned mutation of Pinot Noir. Style varies dramatically: rich and spicy in Alsace, light and crisp in northern Italy.' },
