  'Viognier': { origin: 'Northern Rhône, France (Condrieu)', synonyms: 'None widely used', type: 'white', climate: 'Warm', vigor: 'Moderate', ripening: 'Late', notes: 'Nearly extinct in 1960s (only 14ha). Now globally planted. Low acidity requires careful harvest timing. Often co-fermented with Syrah (up to 20% in Côte Rôtie) to add perfume and stabilise colour.' },
  'Marsanne': { origin: 'Northern Rhône, France', synonyms: 'Ermitage (Switzerland)', type: 'white', climate: 'Warm', vigor: 'Moderate-high', ripening: 'Mid', notes: 'Often blended with Roussanne. Prone to oxidation — typically harvested early. Produces full, waxy wines. Important in Hermitage, St-Joseph, Crozes-Hermitage white blends.' },
  'Roussanne': { origin: 'Northern Rhône, France', synonyms: 'Bergeron (Savoie)', type: 'white', climate: 'Warm', vigor: 'Low', ripening: 'Late', notes: 'More aromatic and higher acidity than Marsanne. "Roux" (russet) refers to the colour of ripe grapes. Susceptible to powdery mildew and wind damage. Adds complexity to Rhône white blends.' },
  'Grüner Veltliner': { origin: 'Austria', synonyms: 'Grüner, GruVe', type: 'white', climate: 'Cool to moderate', vigor: 'High', ripening: 'Mid-late', notes: 'Austria\'s most planted variety (~30% of plantings). Vigorous, needs canopy management. Hallmark white pepper character. Wachau: terraced, steep slopes. Ranging from light Federspiel to powerful Smaragd.' },
  'Chenin Blanc': { origin: 'Loire Valley, France (Anjou)', synonyms: 'Steen (South Africa), Pineau de la Loire', type: 'white', climate: 'Cool to warm', vigor: 'Moderate-high', ripening: 'Late', notes: 'Extraordinarily versatile: dry, off-dry, sweet, sparkling. Late ripening retains high acidity. Very susceptible to botrytis (used for sweet Vouvray, Quarts de Chaume). South Africa: most planted white.' },
  'Albariño': { origin: 'Galicia, NW Spain / N Portugal', synonyms: 'Alvarinho (Portugal)', type: 'white', climate: 'Cool maritime', vigor: 'Moderate', ripening: 'Early', notes: 'Thick skins resist the humid Atlantic climate. Traditionally trained on pergolas (high canopy) for air circulation. Rías Baixas: granite soils. Naturally high acidity and aromatic intensity.' },
  'Verdejo': { origin: 'Rueda, Castilla y León, Spain', synonyms: 'None widely used', type: 'white', climate: 'Continental', vigor: 'Moderate', ripening: 'Mid', notes: 'High-altitude (700-800m) continental climate with hot days and cool nights. Harvested at night to preserve freshness. Distinctive fennel and herbaceous character. Skin contact often used.' },
  'Assyrtiko': { origin: 'Santorini, Greece', synonyms: 'None widely used', type: 'white', climate: 'Hot, dry, volcanic', vigor: 'Low', ripening: 'Mid', notes: 'Grown in kouloura (basket-trained vines) to protect from fierce Aegean winds. Volcanic soils. Phylloxera-free (own roots). Retains remarkable acidity in extreme heat. Pre-Hellenic origins.' },
  'Muscat Blanc à Petits Grains': { origin: 'Greece (ancient)', synonyms: 'Moscato Bianco (Italy), Muskateller, Yellow Muscat', type: 'white', climate: 'Warm', vigor: 'Moderate', ripening: 'Early-mid', notes: 'The oldest and finest Muscat variety. Small, round berries. One of few grapes that actually tastes of grapes. Used for everything from dry Alsace Muscat to sparkling Asti to sweet fortified VDN.' },
  'Torrontés': { origin: 'Argentina (Muscat of Alexandria × Criolla Chica)', synonyms: 'Torrontés Riojano (main type)', type: 'white', climate: 'Warm continental, high altitude', vigor: 'High', ripening: 'Mid', notes: 'Argentina\'s signature white. Best at high altitude (1,700m+ in Cafayate, Salta) where UV intensity concentrates aromatics while cool nights preserve acidity. Three sub-types exist.' },
  'Pinot Blanc': { origin: 'Burgundy, France (mutation of Pinot Gris)', synonyms: 'Weissburgunder (Germany/Austria), Pinot Bianco (Italy)', type: 'white', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Early', notes: 'Less aromatic mutation of Pinot Gris. Understated, versatile. Important in Alsace (Crémant d\'Alsace base) and Alto Adige. Clean, round style.' },
  'Pinot Noir': { origin: 'Burgundy, France', synonyms: 'Spätburgunder (Germany), Blauburgunder (Austria)', type: 'red', climate: 'Cool', vigor: 'Moderate', ripening: 'Early', notes: 'Notoriously difficult to grow — thin-skinned, susceptible to disease, poor weather, and many clonal mutations. Thrives on limestone. Early budding risks frost. Benchmark: Côte d\'Or, Burgundy.' },
  'Cabernet Sauvignon': { origin: 'Bordeaux, France (Cab Franc × Sauvignon Blanc)', synonyms: 'Cab Sauv', type: 'red', climate: 'Warm', vigor: 'Moderate-high', ripening: 'Late', notes: 'World\'s most planted red variety. Small, thick-skinned berries give deep colour and high tannins. Late ripening needs warm sites to fully mature. Left Bank Bordeaux: benchmark. Adapts globally.' },
  'Merlot': { origin: 'Bordeaux, France', synonyms: 'None widely used', type: 'red', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Mid', notes: 'Earlier ripening and thinner skin than Cabernet Sauvignon. Thrives on clay soils (Right Bank Bordeaux). More approachable and softer than Cab Sauv. Pomerol/St-Émilion: Merlot-dominant.' },
  'Cabernet Franc': { origin: 'Bordeaux / Loire, France', synonyms: 'Bouchet (old Bordeaux name), Breton (Loire)', type: 'red', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Mid', notes: 'Parent of Cabernet Sauvignon. Ripens earlier than Cab Sauv, thrives in cooler sites. Loire (Chinon, Bourgueil): lighter, more herbaceous. Bordeaux: blending role. Thin-skinned, aromatic (violet, pepper).' },
  'Syrah': { origin: 'Northern Rhône, France', synonyms: 'Shiraz (Australia, S. Africa)', type: 'red', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Mid-late', notes: 'Small, thick-skinned berries. Sensitive to wind damage. Northern Rhône: steep granite slopes (Hermitage, Côte Rôtie). Rotundone compound gives black pepper character. DNA: Dureza × Mondeuse Blanche.' },
  'Shiraz': { origin: 'Same as Syrah — Rhône origin, Australian name', synonyms: 'Syrah (France/rest of world)', type: 'red', climate: 'Warm to hot', vigor: 'Moderate', ripening: 'Mid-late', notes: 'Same grape as Syrah but Australian name signals a richer, warmer-climate style. Barossa Valley old vines (some 150+ years, own-rooted). Often picked riper with more oak treatment.' },
  'Grenache': { origin: 'Aragon, Spain', synonyms: 'Garnacha (Spain), Cannonau (Sardinia)', type: 'red', climate: 'Warm to hot', vigor: 'High', ripening: 'Late', notes: 'Late ripening, drought resistant, high alcohol potential. Upright growth, susceptible to wind. Thin skins → pale colour, low tannins. Needs blending partners for structure. GSM blend: Grenache-Syrah-Mourvèdre.' },
  'Mourvèdre': { origin: 'Spain (Catalonia)', synonyms: 'Monastrell (Spain), Mataro (Australia)', type: 'red', climate: 'Hot', vigor: 'Moderate', ripening: 'Very late', notes: 'Needs extreme heat and sunshine to ripen fully. Thick-skinned, deep colour, high tannins. Bandol (Provence): benchmark. Blending grape in GSM and southern Rhône. Meaty, gamey character.' },
  'Tempranillo': { origin: 'Rioja, Spain', synonyms: 'Tinta Roriz/Aragonez (Portugal), Tinto Fino (Ribera del Duero), Cencibel (La Mancha)', type: 'red', climate: 'Moderate continental', vigor: 'Moderate', ripening: 'Early ("temprano"=early)', notes: 'Spain\'s most noble variety. Name means "early one." Thick-skinned but moderate tannins. Excellent with oak (both American and French). Continental climate preserves acidity. High-altitude plantings.' },
  'Garnacha': { origin: 'Aragon, Spain', synonyms: 'Grenache (France), Cannonau (Sardinia)', type: 'red', climate: 'Warm to hot', vigor: 'High', ripening: 'Late', notes: 'Same variety as Grenache. In Spain: old bush vines (gobelet) on poor soils give concentration. Priorat: llicorella (black slate) soils. Navarra: excellent rosé. Naturally high sugar/alcohol.' },
  'Sangiovese': { origin: 'Tuscany, Italy', synonyms: 'Brunello (Montalcino), Prugnolo Gentile (Montepulciano), Morellino (Scansano)', type: 'red', climate: 'Warm', vigor: 'High', ripening: 'Late', notes: 'Italy\'s most planted variety. Thin-skinned with high acidity and tannins. Late ripening needs warm, sunny hillsides. Many clonal variations. Sangiovese Grosso (larger berry) used for Brunello.' },
  'Nebbiolo': { origin: 'Piemonte, Italy', synonyms: 'Spanna (N Piemonte), Chiavennasca (Lombardy)', type: 'red', climate: 'Cool-moderate continental', vigor: 'Moderate', ripening: 'Very late', notes: 'Named from "nebbia" (fog) — ripens in autumn fog season. Very late ripening, requires best south-facing sites (sori). Thin-skinned but extremely high tannins and acidity. Calcareous marl soils. Finicky, site-specific.' },
  'Aglianico': { origin: 'Southern Italy (Campania/Basilicata)', synonyms: 'From "Helleniko" (Greek origin)', type: 'red', climate: 'Warm', vigor: 'Moderate-high', ripening: 'Very late', notes: 'Ancient Greek variety. Very late ripening, high tannins and acidity. Volcanic soils of Campania and Basilicata. Taurasi DOCG and Aglianico del Vulture DOC: benchmarks. Requires extended aging.' },
  'Primitivo': { origin: 'Croatia originally; established in Puglia, Italy', synonyms: 'Zinfandel (USA), Crljenak Kaštelanski (Croatia)', type: 'red', climate: 'Hot', vigor: 'Moderate', ripening: 'Early ("primitivo"=early ripening)', notes: 'Genetically identical to Zinfandel. Uneven ripening leads to raisined berries alongside fresh ones → high sugar/alcohol. Bush-trained (alberello) in Puglia. Primitivo di Manduria: benchmark.' },
  'Nero d\'Avola': { origin: 'Sicily, Italy', synonyms: 'Calabrese (old name)', type: 'red', climate: 'Hot Mediterranean', vigor: 'Moderate-high', ripening: 'Late', notes: 'Sicily\'s most important native red. Named after the town of Avola. Thick-skinned, heat and drought resistant. Bush-trained (alberello). Modern winemaking has elevated quality dramatically.' },
  'Zinfandel': { origin: 'Croatia (as Crljenak); iconic in California', synonyms: 'Primitivo (Italy), Tribidrag (Croatia)', type: 'red', climate: 'Warm to hot', vigor: 'Moderate', ripening: 'Uneven', notes: 'Uneven ripening is signature challenge — cluster can have raisined and unripe berries. Old vine (100+ year) plantings in Lodi, Sonoma, Paso Robles prized. White Zinfandel (off-dry rosé) is most produced style.' },
  'Malbec': { origin: 'Cahors, SW France', synonyms: 'Côt (Loire), Auxerrois (Cahors)', type: 'red', climate: 'Warm continental', vigor: 'Moderate', ripening: 'Mid', notes: 'Thin-skinned, susceptible to frost and mildew in France. Found its ideal home in Argentina (Mendoza) at high altitude (900-1,500m). UV intensity concentrates colour and flavour. Argentina: world\'s largest plantings.' },
  'Carménère': { origin: 'Bordeaux, France', synonyms: 'Grande Vidure (old French name)', type: 'red', climate: 'Warm', vigor: 'High', ripening: 'Very late', notes: 'Virtually extinct in Bordeaux after phylloxera. Rediscovered in Chile in 1994 (previously confused with Merlot). Very late ripening, needs warmth. Green/pyrazine character when underripe. Chile\'s signature variety.' },
  'Pinotage': { origin: 'South Africa (1925 crossing)', synonyms: 'None', type: 'red', climate: 'Warm', vigor: 'High', ripening: 'Mid', notes: 'Pinot Noir × Cinsault cross created by Prof. Perold at Stellenbosch. Unique to South Africa. High yields need controlling. Can produce acetone off-flavours if poorly made. Cape Blend: Pinotage-based.' },
  'Gamay': { origin: 'Beaujolais, France', synonyms: 'Gamay Noir à Jus Blanc (full name)', type: 'red', climate: 'Cool to moderate', vigor: 'High', ripening: 'Early', notes: 'Banned from Burgundy in 1395 by Duke Philip the Bold. Thrives on granite soils of Beaujolais. Often processed by carbonic maceration for fruity nouveau style. Cru Beaujolais: more serious, terroir-driven.' },
  'Xinomavro': { origin: 'Macedonia, Northern Greece', synonyms: 'Name means "acid-black"', type: 'red', climate: 'Cool continental', vigor: 'Moderate', ripening: 'Late', notes: 'High-altitude vineyards (200-700m) in Naoussa. Often compared to Nebbiolo for its high acid, high tannin, pale colour, and age-worthiness. Needs extended aging to soften.' },
  'Agiorgitiko': { origin: 'Nemea, Peloponnese, Greece', synonyms: 'St George (translation)', type: 'red', climate: 'Warm Mediterranean', vigor: 'Moderate-high', ripening: 'Mid', notes: 'Most widely planted Greek red. Versatile: rosé to sweet red to serious age-worthy reds. Nemea PDO: vineyards from 250-800m altitude (higher = more acidity and elegance). Deep colour, generous fruit.' },
  'Touriga Nacional': { origin: 'Dão, Portugal', synonyms: 'Touriga', type: 'red', climate: 'Warm continental', vigor: 'Low', ripening: 'Mid', notes: 'Small berries, thick skins, low yields — extremely concentrated. Portugal\'s finest native variety. Essential in premium Port blends. Increasingly used for quality Douro and Dão table wines. Deeply coloured, floral, structured.' },
  'Baga': { origin: 'Bairrada, Portugal', synonyms: 'None widely used', type: 'red', climate: 'Cool maritime', vigor: 'Moderate', ripening: 'Late', notes: 'Extremely thick-skinned with very high tannins. Traditional foot-treading in lagares extracts colour and tannin. Clay soils of Bairrada. Modern producers use gentler extraction. Challenging but rewarding when well made.' },
  'Tannat': { origin: 'Basque Country / SW France', synonyms: 'Harriague (Uruguay)', type: 'red', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Late', notes: 'Among the world\'s most tannic varieties. Madiran birthplace invented micro-oxygenation to soften the wine. Uruguay: national grape, more approachable style. High polyphenol content (health claims).' },
  'Pinot Meunier': { origin: 'Champagne, France', synonyms: 'Meunier, Schwarzriesling (Germany)', type: 'red', climate: 'Cool', vigor: 'Moderate', ripening: 'Early-mid', notes: 'More frost-resistant than Pinot Noir (buds later). "Meunier" means miller (white downy underside of leaves resembles flour). Adds fruitiness and roundness to Champagne blends. Marne Valley: dominant variety.' },
  'Cinsault': { origin: 'Southern France', synonyms: 'Cinsaut (alternative spelling)', type: 'red', climate: 'Hot', vigor: 'High', ripening: 'Late', notes: 'Large berries, thin skins → light colour, low tannins. Drought resistant, heat-loving. Parent of Pinotage (with Pinot Noir). Important for rosé in Provence. Blending variety in southern Rhône and Languedoc.' },
  'Carignan': { origin: 'Cariñena, Aragon, Spain', synonyms: 'Cariñena/Mazuelo (Spain), Carignano (Italy)', type: 'red', climate: 'Hot', vigor: 'High', ripening: 'Very late', notes: 'Once most planted variety in France (Languedoc). High yields unless old vine. Old bush vines produce concentrated, complex wines. Late ripening, susceptible to powdery mildew. Priorat: excellent quality.' },
  'Grenache Blanc': { origin: 'Spain/Southern France', synonyms: 'Garnacha Blanca (Spain)', type: 'white', climate: 'Warm to hot', vigor: 'High', ripening: 'Mid', notes: 'White mutation of Grenache Noir. Low acidity, full body, prone to oxidation — needs careful handling. Important in Châteauneuf-du-Pape blanc, Côtes du Rhône blanc blends.' },
  'Vermentino': { origin: 'Liguria, Italy / Sardinia', synonyms: 'Rolle (Provence, France)', type: 'white', climate: 'Warm maritime', vigor: 'Moderate', ripening: 'Late', notes: 'Coastal Mediterranean variety. Thick skin resists maritime conditions. Important in Provence (as Rolle), Sardinia (Vermentino di Gallura DOCG), and Ligurian coast. Aromatic, mineral, fresh.' },
  'Furmint': { origin: 'Hungary (Tokaj)', synonyms: 'Šipon (Slovenia)', type: 'white', climate: 'Cool continental', vigor: 'Moderate', ripening: 'Late', notes: 'Principal grape of Tokaj Aszú (world\'s great sweet wine). Thin skin, susceptible to botrytis. Late ripening, high acidity retained. Volcanic soils of Tokaj. Dry Furmint wines gaining recognition.' },
  'Sémillon': { origin: 'Bordeaux, France', synonyms: 'Semillon (without accent)', type: 'white', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Early', notes: 'Thin-skinned, highly susceptible to botrytis → essential for Sauternes sweet wines. When healthy: waxy, full-bodied dry whites. Hunter Valley (Australia): extraordinary age-worthy unoaked style.' },
  'Semillon': { origin: 'Same as Sémillon — Australian spelling', synonyms: 'Sémillon (French spelling)', type: 'white', climate: 'Warm', vigor: 'Moderate', ripening: 'Early', notes: 'In Hunter Valley: picked early at low sugar for a lean, neutral style that transforms with 10-15 years bottle age into toasty, honeyed complexity — entirely without oak. Unique Australian tradition.' },
  'Muscadelle': { origin: 'Bordeaux, France', synonyms: 'Tokay (old Australian name)', type: 'white', climate: 'Moderate', vigor: 'Moderate', ripening: 'Early', notes: 'NOT related to Muscat despite aromatic similarity. Minor Bordeaux blending component (typically 5-10% of Sauternes blend). Adds floral perfume. Very susceptible to disease — declining plantings.' },
  'Aligoté': { origin: 'Burgundy, France', synonyms: 'None widely used', type: 'white', climate: 'Cool', vigor: 'High', ripening: 'Early', notes: 'Burgundy\'s secondary white after Chardonnay. Bouzeron AC: its only village-level appellation. Often planted on less favourable sites. Base for Kir (with crème de cassis). Brisk, refreshing.' },
  'Melon de Bourgogne (Muscadet)': { origin: 'Burgundy originally; now Loire Valley', synonyms: 'Muscadet (regional name), Melon', type: 'white', climate: 'Cool maritime', vigor: 'Moderate', ripening: 'Early', notes: 'Frost-resistant, which is why it survived in the Loire after the devastating 1709 winter. Neutral variety that gains character through sur lie aging. Atlantic-influenced terroir adds salinity.' },
  'Corvina': { origin: 'Veneto, Italy', synonyms: 'Corvina Veronese', type: 'red', climate: 'Cool to moderate continental', vigor: 'High', ripening: 'Late', notes: 'Backbone of Valpolicella, Ripasso, and Amarone. Thick skin dries well (appassimento technique). Grows on hillside pergola systems. Contributes cherry character and almond notes to Amarone.' },

  'Carricante': { origin: 'Mt Etna, Sicily, Italy', synonyms: 'None widely used', type: 'white', climate: 'Cool volcanic (altitude)', vigor: 'Moderate', ripening: 'Late', notes: 'Etna\'s principal white grape. Altitude (600-900m) and volcanic terroir give mineral, saline character. Etna Bianco Superiore: Milo commune, east-facing slopes. Gaining international recognition.' },
  'Sagrantino': { origin: 'Montefalco, Umbria, Italy', synonyms: 'None', type: 'red', climate: 'Warm continental', vigor: 'Moderate', ripening: 'Late', notes: 'Among the world\'s highest tannin varieties. Tiny production zone centred on Montefalco. Originally used for Passito (dried grape sweet wine). DOCG requires minimum 37 months aging. Extremely concentrated.' },

  'Pedro Ximénez': { origin: 'Montilla-Moriles / Jerez, Spain', synonyms: 'PX', type: 'white', climate: 'Very hot', vigor: 'Moderate', ripening: 'Early', notes: 'Sun-dried on esparto grass mats (soleo) to concentrate sugars to extreme levels (400+ g/L RS). Creates the world\'s sweetest wines. Also used to sweeten Cream Sherry blends.' },

function showGrapeNote(btn) {
  const panel = btn.nextElementSibling; // always the grape-note-panel div
  const isOpen = btn.classList.contains('active');
  btn.closest('.popup-inner').querySelectorAll('.grape-tag-btn.active').forEach(b => b.classList.remove('active'));
  btn.closest('.popup-inner').querySelectorAll('.grape-note-panel.visible').forEach(p => p.classList.remove('visible'));
  if (!isOpen) {
    btn.classList.add('active');
    panel.classList.add('visible');
  }
}

  'Champagne': 'Traditional method sparkling: crisp, yeasty, complex — brioche, citrus, apple, toasty lees character. Brut NV: the global benchmark. Vintage Champagne: concentrated and age-worthy. Blanc de Blancs (Chardonnay): elegant; Blanc de Noirs: fuller.',

  'Loire Valley — Touraine': 'Chenin Blanc in all styles: bone-dry to lusciously sweet (Vouvray). Cabernet Franc reds from Chinon and Bourgueil: herbaceous, raspberry, light-to-medium tannin, ageable top wines.',
  'Loire Valley — Anjou-Saumur': 'Savennières: bone-dry Chenin Blanc, high acid, extraordinary aging. Coteaux du Layon/Bonnezeaux/Quarts de Chaume: noble rot sweet Chenin, remarkable complexity and longevity. Saumur-Champigny: fresh, vibrant Cabernet Franc.',
  'Loire Valley — Muscadet (Nantais)': 'Light, crisp, briny whites from Melon de Bourgogne. Sur lie aging adds texture and subtle yeasty complexity. Low alcohol (~12%). Classic pairing with oysters and seafood.',

  'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)': 'GSM blends (Grenache-dominant): rich, full-bodied, high alcohol (14–16%), ripe red fruit and garrigue. Châteauneuf-du-Pape: complex, age-worthy. Tavel: full-bodied dry rosé. Muscat de Beaumes-de-Venise: sweet fortified.',

  'Piemonte': 'Italy\'s most prestigious red region. Barolo and Barbaresco: 100% Nebbiolo — full body, very high acid and tannin, tar and roses, age 10–30+ years. Barbera: everyday fruity reds. Moscato d\'Asti: sweet, low-alcohol sparkling.',
  'Tuscany': 'Sangiovese-dominated. Chianti Classico: medium body, cherry, herbal, food-wine. Brunello di Montalcino: powerful, structured, age 20+ years. Super Tuscans: Cab Sauv/Merlot/Sangiovese blends. Vernaccia: dry white.',

  'Abruzzo': 'Montepulciano d\'Abruzzo: full-bodied red, deep color, soft tannin, plum and spice — excellent value. Cerasuolo d\'Abruzzo: serious dry rosé. Trebbiano: fresh whites. High-volume, reliable everyday wine.',
  'Campania': 'Greco di Tufo: structured, mineral white. Fiano di Avellino: aromatic, complex, honey and herb. Taurasi (Aglianico): full body, very high tannin, dark fruit — \'Barolo of the South\', needs 10+ years.',
  'Puglia': 'Primitivo (= Zinfandel): high alcohol (14–17%), full body, dark berry, ripe and jammy. Negroamaro: earthy, rustic dark fruit. Important rosé production (Rosato). Generous, warm-climate Southern Italian style.',
  'Sicily': 'Nero d\'Avola: full body, dark cherry, chocolate, warm spice. Mt Etna (Nerello Mascalese): elegant, high acid, mineral at 600–1000m — \'Burgundy of the South\'. Passito di Pantelleria: intensely sweet Zibibbo. Rapidly improving quality.',

  'Vinho Verde': 'Light, fresh whites; high acid, natural spritz, 8–11.5% ABV. Loureiro/Arinto/Trajadura blends for everyday drinking. Premium Alvarinho from Monção e Melgaço: richer, fuller, no spritz (12.5–14%). "Verde" means youth, not colour.',
  'Douro Valley': 'Port: fortified wine in Tawny (barrel-aged, nutty-oxidative) and Ruby/Vintage (fruity, bottle-aged) styles. Douro DOC dry table wines: powerful, full-bodied red blends of Touriga Nacional and other indigenous varieties. Increasingly acclaimed.',

  return `<div class="popup-inner">
    <div class="popup-header">

      <div class="popup-country">${r.country}</div>

    ${r.subregions ? `<div class="popup-section">
      <div class="popup-label">Sub-regions / Appellations</div>
      <div class="popup-text">${r.subregions}</div>
    </div>` : ''}
    <div class="popup-section">
      <div class="popup-label">Climate & Terroir</div>
      <div class="popup-text">${r.climate}</div>
    </div>
    <div class="popup-section">
      <div class="popup-label">Key Grape Varieties</div>
      <div>${formatGrapes(r.grapes)}</div>
    </div>
    ${REGION_STYLE_NOTES[r.name] ? `<div class="popup-section">
      <div class="popup-label">Winemaking & Style</div>
      <div class="popup-text" style="font-style:italic;opacity:0.85">${REGION_STYLE_NOTES[r.name]}</div>
      <div style="font-size:0.6rem;opacity:0.55;margin-top:3px">→ Click region for full style notes</div>
    </div>` : ''}
    <div class="popup-footer">WSET L3 Study Notes · Jack Yeu &amp; Wang Haitian</div>

function createSubIcon(color, size = 14) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="9" fill="${color}" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" opacity="0.88"/>
    <circle cx="10" cy="10" r="3.5" fill="rgba(255,255,255,0.9)"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -(size/2 + 6)] });
}

function buildGrapeInfoHtml(g) {
  const info = grapeGeneralInfo[g];
  if (!info) return '';
  let h = '<div class="grape-general-info">';
  h += `<div class="ggi-row"><span class="ggi-label">Origin:</span> ${info.origin}</div>`;
  if (info.synonyms) h += `<div class="ggi-row"><span class="ggi-label">Synonyms:</span> ${info.synonyms}</div>`;
  h += `<div class="ggi-row"><span class="ggi-label">Climate:</span> ${info.climate} · <span class="ggi-label">Vigor:</span> ${info.vigor} · <span class="ggi-label">Ripening:</span> ${info.ripening}</div>`;
  if (info.notes) h += `<div class="ggi-notes">${info.notes}</div>`;
  h += '</div>';
  return h;
}

function formatGrapesClickable(grapes, contextRegion) {
  return grapes.map(g => {
    const wc = getGrapeWineClass(g);
    const hasNote = !!grapeTastingNotes[g];
    const hasGenInfo = !!grapeGeneralInfo[g];
    if (hasNote) {
      const wineHints = contextRegion ? getGrapeWineHints(g, contextRegion) : '';
      const infoHtml = buildGrapeInfoHtml(g);
      return `<span class="grape-tag-btn ${wc}" onclick="showGrapeNote(this)">▸ ${g}</span>` +
             `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>` +
             infoHtml +
             `<div class="grape-tasting-header">Tasting Profile</div>${grapeTastingNotes[g]}` +
             (wineHints ? `<div class="grape-note-region">♦ Wines: ${wineHints}</div>` : '') +
             `</div>`;
    } else if (hasGenInfo) {
      // Has general info (origin/synonyms) but no tasting notes — still clickable
      return `<span class="grape-tag-btn ${wc}" onclick="showGrapeNote(this)">▸ ${g}</span>` +
             `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>` +
             buildGrapeInfoHtml(g) +
             `</div>`;
    }
    return `<span class="grape-tag ${wc}">${g}</span>`;
  }).join('');
}

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 40,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let color = '#7b2d8b';
    const markers = cluster.getAllChildMarkers();
    // Use color of majority country in cluster
    const countryCounts = {};
    markers.forEach(m => {
      const c = m.options.regionData.country;
      countryCounts[c] = (countryCounts[c] || 0) + 1;
    });
    const topCountry = Object.keys(countryCounts).sort((a,b) => countryCounts[b]-countryCounts[a])[0];
    color = COUNTRIES[topCountry]?.color || '#7b2d8b';
    return L.divIcon({
      html: `<div style="background:${color};color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.82rem;border:2px solid rgba(255,255,255,0.4);box-shadow:0 2px 6px rgba(0,0,0,0.3);">${count}</div>`,
      className: '',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
  }
});

const markers = regions.map(r => {
  const color = getRegionColor(r.name);

function updateRegionLabelVisibility() {

  if (shouldShow === regionLabelsVisible) return;
  regionLabelsVisible = shouldShow;

const polygonMap = {};
let activePolygons = new Set();

function toLatLngs(b) {
  return b.length === 4 && !Array.isArray(b[0])
    ? [[b[0],b[1]],[b[0],b[3]],[b[2],b[3]],[b[2],b[1]]]
    : b;
}
function polyDefaultStyle(color) {
  return { color, weight: 1.5, opacity: 0.45, fillColor: color, fillOpacity: 0.1, dashArray: '5 4' };
}
function polyActiveStyle(color) {
  return { color, weight: 3, opacity: 1, fillColor: color, fillOpacity: 0.3, dashArray: null };
}
function polyGroupStyle(color) {
  return { color, weight: 2, opacity: 0.6, fillColor: color, fillOpacity: 0.07, dashArray: '8 5' };
}
function polyClimateStyle(color) {
  return { color, weight: 1.5, opacity: 0.6, fillColor: color, fillOpacity: 0.25, dashArray: null };
}

function getPolyDefaultStyle(name) {
  if (showClimateOverlay) return polyClimateStyle(getClimateColor(name));
  return polyDefaultStyle(getRegionColor(name));
}

function activateRegion(name) {
  // Deactivate previously active polygons
  activePolygons.forEach(prev => {
    if (polygonMap[prev]) {
      const prevR = regions.find(r => r.name === prev);
      if (prevR) polygonMap[prev].setStyle(getPolyDefaultStyle(prev));
    }
  });
  activePolygons.clear();

  if (!name) return;

  // Highlight the clicked region
  const r = regions.find(r => r.name === name);
  if (r && polygonMap[name]) {
    const color = getRegionColor(name);
    polygonMap[name].setStyle(polyActiveStyle(color));
    polygonMap[name].bringToFront();
    activePolygons.add(name);
  }

  // Also highlight sibling regions in the same WSET L3 group
  const group = REGION_GROUPS[name];
  if (group) {
    regions.forEach(sibling => {
      if (sibling.name !== name && REGION_GROUPS[sibling.name] === group && polygonMap[sibling.name]) {
        const color = getRegionColor(sibling.name);
        polygonMap[sibling.name].setStyle(polyGroupStyle(color));
        activePolygons.add(sibling.name);
      }
    });
    // Update group header active state
    document.querySelectorAll('.group-header').forEach(el => {
      el.classList.toggle('active', el.dataset.group === group);
    });
  }
}

const polygonGroup = L.layerGroup().addTo(map);
regions.forEach(r => {
  const b = regionBounds[r.name];
  if (!b) return;
  const color = getRegionColor(r.name);
  const poly = L.polygon(toLatLngs(b), polyDefaultStyle(color));
  poly.on('click', () => {
    activateRegion(r.name);
    highlightListItem(r.name);
    showRegionSubappellations(r.name);
    // Zoom to the marker but don't open the floating popup — info panel has all the info
    // and the popup was the source of the "top half cut off" issue on all screen sizes
    if (markerMap[r.name]) clusterGroup.zoomToShowLayer(markerMap[r.name], () => {});
    openInfoPanel(r.name);
  });
  polygonMap[r.name] = poly;
  polygonGroup.addLayer(poly);
});

let climateLegendControl = null;
function toggleClimateOverlay() {
  showClimateOverlay = !showClimateOverlay;
  const btn = document.getElementById('climate-toggle');
  btn.classList.toggle('active', showClimateOverlay);
  btn.textContent = showClimateOverlay ? '🌡 Hide Climate Overlay' : '🌡 Show Climate Overlay';
  // Recolor all non-active polygons
  regions.forEach(r => {
    if (!polygonMap[r.name] || activePolygons.has(r.name)) return;
    polygonMap[r.name].setStyle(getPolyDefaultStyle(r.name));
  });
  // Show/hide legend
  if (showClimateOverlay) {
    if (!climateLegendControl) {
      climateLegendControl = L.control({ position: 'bottomright' });
      climateLegendControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'climate-legend');
        const types = [
          { key: 'continental', label: 'Continental', emoji: '🏔' },
          { key: 'maritime', label: 'Maritime', emoji: '🌊' },
          { key: 'mediterranean', label: 'Mediterranean', emoji: '☀️' },
          { key: 'transition', label: 'Transition', emoji: '🔀' }
        ];
        let html = '<h4>Climate Types</h4>';
        types.forEach(t => {
          const c = CLIMATE_COLORS[t.key].moderate;
          html += `<div class="legend-row"><span class="legend-swatch" style="background:${c}"></span>${t.emoji} ${t.label}</div>`;
        });
        html += '<div class="legend-note">Lighter = cooler · Darker = warmer</div>';
        div.innerHTML = html;
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
    }
    climateLegendControl.addTo(map);
  } else {
    if (climateLegendControl) climateLegendControl.remove();
  }
}

const allGrapes = [...new Set(regions.flatMap(r => r.grapes))].sort((a,b) => a.localeCompare(b));
let activeGrapes = new Set();

function initGrapeFilter() {
  const input = document.getElementById('grape-search');
  const sugg = document.getElementById('grape-suggestions');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    sugg.innerHTML = '';
    if (!q) { sugg.style.display = 'none'; return; }
    const matches = allGrapes.filter(g => g.toLowerCase().includes(q) && !activeGrapes.has(g));
    if (!matches.length) { sugg.style.display = 'none'; return; }
    sugg.style.display = 'block';
    matches.slice(0, 8).forEach(g => {
      const d = document.createElement('div');
      d.className = 'grape-sug';
      d.textContent = g;
      d.addEventListener('mousedown', e => {
        e.preventDefault();
        activeGrapes.add(g);
        input.value = '';
        sugg.style.display = 'none';
        renderGrapeChips();
        applyFilters();
      });
      sugg.appendChild(d);
    });
  });
  input.addEventListener('blur', () => setTimeout(() => { sugg.style.display = 'none'; }, 150));
}

function renderGrapeChips() {
  const c = document.getElementById('active-grapes');
  c.innerHTML = '';
  activeGrapes.forEach(g => {
    const chip = document.createElement('span');
    chip.className = 'grape-chip';
    chip.innerHTML = `${g} <span style="opacity:0.7">✕</span>`;
    chip.addEventListener('click', () => { activeGrapes.delete(g); renderGrapeChips(); applyFilters(); });
    c.appendChild(chip);
  });
}

// SHOW SUB-APPELLATIONS FOR A REGION
// ============================================================
let activeRegionExpand = null;
const regionSubLayer = L.layerGroup().addTo(map);

function subPolyStyle(color) {
  return { color, weight: 2, opacity: 0.8, fillColor: color, fillOpacity: 0.18, dashArray: null };
}
function subPolyHoverStyle(color) {
  return { color: '#e8c97a', weight: 3, opacity: 1, fillColor: color, fillOpacity: 0.32 };
}

function showRegionSubappellations(regionName) {
  regionSubLayer.clearLayers();

  if (activeRegionExpand === regionName) {
    activeRegionExpand = null;
    return;
  }
  activeRegionExpand = regionName;

  // Find all sibling regions in the same WSET group
  const group = REGION_GROUPS[regionName];
  const siblingRegions = group
    ? regions.filter(r => REGION_GROUPS[r.name] === group).map(r => r.name)
    : [regionName];

  // Collect all sub-appellations across the group
  const allGroupSubs = subregionData.filter(sr => siblingRegions.includes(sr.parentRegion));
  if (!allGroupSubs.length) return;

  const allPts = [];

  allGroupSubs.forEach(sr => {
    const isActive = sr.parentRegion === regionName;
    const color = getRegionColor(sr.parentRegion);

    // Draw sub-appellation polygon
    const bounds = subregionBounds[sr.name];
    if (bounds) {
      const style = isActive
        ? subPolyStyle(color)
        : { ...subPolyStyle(color), fillOpacity: 0.08, opacity: 0.4, weight: 1, dashArray: '4 4' };
      const poly = L.polygon(bounds, style);
      poly.bindTooltip(sr.name, { permanent: false, direction: 'center', className: 'sub-poly-tooltip' });
      if (isActive) {
        poly.on('mouseover', () => poly.setStyle(subPolyHoverStyle(color)));
        poly.on('mouseout', () => poly.setStyle(subPolyStyle(color)));
      }
      poly.on('click', () => {
        map.setView([sr.lat, sr.lng], 11, { animate: true });
        if (window.innerWidth > 600) {
          regionSubLayer.eachLayer(m => {
            if (m.getLatLng && m.getLatLng().lat === sr.lat && m.getLatLng().lng === sr.lng) m.openPopup();
          });
        }
      });
      regionSubLayer.addLayer(poly);
      bounds.forEach(pt => allPts.push(pt));
    }

    // Add marker
    const clone = L.marker([sr.lat, sr.lng], {
      icon: createSubIcon(color),
      regionData: sr,
      opacity: isActive ? 1 : 0.5
    });
    clone.bindPopup(createSubPopup(sr), { maxWidth: 300, className: 'wine-popup' });
    regionSubLayer.addLayer(clone);
    allPts.push([sr.lat, sr.lng]);

    // Add permanent name label next to pin
    const label = L.marker([sr.lat, sr.lng], {
      icon: L.divIcon({
        className: 'sub-label-icon',
        html: `<span class="sub-label${isActive ? '' : ' sub-label-dim'}">${sr.name}</span>`,
        iconSize: [0, 0],
        iconAnchor: [-10, 12]
      })
    });
    regionSubLayer.addLayer(label);
  });

  // Also add parent region points
  siblingRegions.forEach(rn => {
    const r = regions.find(r2 => r2.name === rn);
    if (r) allPts.push([r.lat, r.lng]);
  });

  if (allPts.length > 1) {
    map.fitBounds(L.latLngBounds(allPts).pad(0.1), { animate: true, maxZoom: 10 });
  }
}

function formatSidebarGrapes(grapes, subName, parentRegion) {
  return grapes.map(g => {
    const wc = getGrapeWineClass(g);
    const note = grapeTastingNotes[g];
    if (!note) return `<span class="grape-tag ${wc}">${g}</span>`;
    const regionHint = getRegionalContext(g, subName, parentRegion);
    const wineHints = getGrapeWineHints(g, parentRegion);
    const infoHtml = buildGrapeInfoHtml(g);
    return `<span class="grape-tag-btn ${wc}" data-grape="${g}" data-sub="${subName}" data-parent="${parentRegion}">▸ ${g}</span>` +
      `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>` +
      infoHtml +
      `<div class="grape-tasting-header">Tasting Profile</div>${note}` +
      (regionHint ? `<div class="grape-note-region">⬦ In ${subName}: ${regionHint}</div>` : '') +
      (wineHints ? `<div class="grape-note-region">♦ Wines: ${wineHints}</div>` : '') +
      `</div>`;
  }).join('');
}

    { name:'Saint-Estèphe AOC', classification:'AOC', grapes:["Cabernet Sauvignon (dominant), Merlot (high proportion vs other communes), Cabernet Franc"], method:'Long maceration, blend includes more Merlot for clay subsoil', aging:'18–24 months in oak for classed growths', style:'Full body, firm tannins, earthy, mineral, darker fruit, more rustic in youth, excellent aging', notes:'Left Bank. More clay = heavier, more tannic wines needing longer aging. Cos d\'Estournel: famous pagoda-architecture winery, 2nd Growth. Montrose, Calon-Ségur: also important. Least glamorous but can age longest.' },

    { name:'Gevrey-Chambertin AOC / Le Chambertin Grand Cru', classification:'AOC/Grand Cru', grapes:["Pinot Noir (100%)"], method:'Partial or whole-bunch fermentation, light extraction, French oak aging', aging:'Village: 12 months. GC: 18–24 months', style:'Full body, red and black cherry, spice, earth, structured, long-lived. Chambertin: profound power and complexity', notes:'Largest and most powerful commune of the Côte de Nuits. 26 Premier Crus. 9 Grands Crus including Chambertin (the "King of Burgundy") and Chambertin-Clos de Bèze. Napoleon\'s favorite wine. Clay-limestone marlstone soils. Rousseau and Ponsot: top producers.' },
    { name:'Morey-Saint-Denis AOC', classification:'AOC', grapes:["Pinot Noir (red), Chardonnay (white — rare)"], method:'Gentle extraction, French oak', aging:'Village: 12 months', style:'Medium-full body, red cherry, earthy, structured, between Gevrey power and Chambolle elegance', notes:'Less famous than neighbors but 5 GCs: Clos Saint-Denis, Clos de la Roche, Clos des Lambrays, Clos de Tart, Bonnes-Mares (part). Often undervalued. Dujac estate: benchmark for the commune.' },
    { name:'Chambolle-Musigny AOC / Musigny Grand Cru', classification:'AOC/Grand Cru', grapes:["Pinot Noir (Musigny can include tiny Chardonnay)"], method:'Whole-bunch (Roumier/Mugnier style), gentle extraction', aging:'Village: 12 months. GC: 18–24 months', style:'Most elegant and perfumed commune. Red fruit, violets, silky tannins, ethereal, delicate yet complex', notes:'2 Grands Crus: Musigny (finest "feminine" Burgundy — Compte de Vogüé, Roumier), Bonnes-Mares (more structured — shares with Morey). 24 Premier Crus: Les Amoureuses (PC as prized as GC). The epitome of Burgundy elegance.' },
    { name:'Vougeot AOC / Clos de Vougeot Grand Cru', classification:'AOC/Grand Cru', grapes:["Pinot Noir (100%)"], method:'Varies widely — over 80 different owners of Clos de Vougeot', aging:'GC: 18–24 months', style:'Variable quality due to 50ha single-walled vineyard with 80+ owners; best plots: complex, rich, earthy, structured', notes:'Clos de Vougeot: largest Côte de Nuits GC (50ha). Medieval walled monastery vineyard. Multiple quality zones: top slope (best), middle, bottom near road (worst). Producer selection critical: Leroy, Meo-Camuzet, Château de la Tour best producers. Chapitre des Chevaliers du Tastevin holds ceremonies here.' },
    { name:'Vosne-Romanée AOC / Domaine de la Romanée-Conti (DRC)', classification:'AOC/Grand Cru', grapes:["Pinot Noir (100%)"], method:'Traditional whole-bunch, old vines, minimal intervention. DRC: biodynamic', aging:'Village: 12 months. GC: 18–24+ months', style:'Profound, complex, silky, red and black fruit, spice, forest floor, minerals, exceptional aging potential', notes:'Most prestigious commune in Burgundy. 6 Grands Crus: La Romanée-Conti (DRC monopole, world\'s most expensive wine), La Tâche (DRC monopole), Richebourg, Romanée-Saint-Vivant, La Romanée, La Grande Rue. DRC is co-owned and managed with extraordinary care. Leroyand Méo-Camuzet also top producers.' },
    { name:'Nuits-Saint-Georges AOC', classification:'AOC', grapes:["Pinot Noir (dominant), Chardonnay (rare white)"], method:'Classic Burgundy production, often more structured/rustic', aging:'12–18 months', style:'Medium-full body, dark cherry, firm tannin, earthy, spice, can be rustic in youth, long aging', notes:'No Grands Crus (unusual for top Côte de Nuits commune). 41 Premier Crus (most in Burgundy). Two village zones: Nuits and Premeaux-Prissey. Leroy (Maison Leroy) is the most famous producer. "Les Saint-Georges" PC often cited for Grand Cru-quality.' },
    { name:'Fixin AOC', classification:'AOC', grapes:["Pinot Noir (dominant)"], method:'Classic Burgundy', aging:'12 months', style:'Medium-full body, firm, earthy, rustic red fruit, tannic — the most Gevrey-like without the prices', notes:'Northernmost commune of Côte de Nuits. Often overlooked. Firm structure. Clos du Chapitre and Clos de la Perrière: top Premier Crus. Good value.' },
  ],
  // ===== FRANCE — BURGUNDY (CÔTE DE BEAUNE) =====
  'Côte de Beaune (Côte d\'Or)': [
    { name:'Corton AOC (Grand Cru — Red)', classification:'Grand Cru', grapes:["Pinot Noir (100%)"], method:'French oak aging', aging:'18–24 months in oak', style:'Full body, powerful, structured, dark cherry, earthy, tannic — most powerful Côte de Beaune red', notes:'The only red Grand Cru of the Côte de Beaune (the rest are white). Large hill shared by Aloxe-Corton, Ladoix-Serrigny, Pernand-Vergelesses communes. Can be labelled just "Corton" or "Corton-[lieu-dit]". Bertagna, Bonneau du Martray: top producers.' },
    { name:'Corton-Charlemagne AOC (Grand Cru — White)', classification:'Grand Cru', grapes:["Chardonnay (100%)"], method:'French oak (often new), barrel fermentation with lees stirring', aging:'18–24 months in oak', style:'Full body, rich, powerful, mineral, butter, hazelnut, apple, citrus — the "Montrachet of the north"', notes:'Named after Charlemagne who owned vines here. White wine on the hill\'s plateau. Bonneau du Martray (now Kosta Browne-owned) is the iconic producer. Long aging potential (10–20 years). Loubet, Jadot also excellent.' },
    { name:'Pommard AOC', classification:'AOC', grapes:["Pinot Noir (100%)"], method:'Long maceration, firm extraction, French oak', aging:'12–18 months', style:'Full body, dark cherry, earthy, firm tannin, structured — the most "masculine" Côte de Beaune red', notes:'24 Premier Crus: Rugiens (finest) and Épenots top. Clay-limestone soils. Jean-Marc Boillot, Comte Armand: top producers. Known for powerful, tannic style requiring age. Often an entry point for collectors.' },
    { name:'Volnay AOC', classification:'AOC', grapes:["Pinot Noir (100%)"], method:'Gentle extraction, whole-bunch sometimes', aging:'12 months', style:'Elegant, medium body, red cherry, violet, silky tannins — the "feminine" Côte de Beaune red', notes:'35 Premier Crus: Caillerets and Champans finest. Marquis d\'Angerville, Domaine de la Pousse d\'Or, Michel Lafarge: top estates. No Grand Cru but quality often exceeds GC of other communes. Clay marl.' },
    { name:'Meursault AOC', classification:'AOC', grapes:["Chardonnay (100%)"], method:'Barrel fermented in French oak (Allier), lees stirring (bâtonnage)', aging:'12–18 months', style:'Full body, rich, buttery, hazelnut, white peach, citrus zest, toast, round, approachable — quintessential Burgundy white', notes:'Largest commune in the Côte de Beaune for white wines. No Grand Cru but 20 Premier Crus: Perrières, Charmes, Genevrières finest (often better than many GCs). Coche-Dury, Roulot, Lafon: the triumvirate of top producers. La Paulée de Meursault: annual wine festival.' },
    { name:'Puligny-Montrachet AOC / Le Montrachet Grand Cru', classification:'AOC/Grand Cru', grapes:["Chardonnay (100%)"], method:'Barrel fermentation, new/older oak, extended lees', aging:'Village: 12 months. GC: 18–24 months', style:'GC Montrachet: the pinnacle of white Burgundy — powerful yet refined, mineral, hazelnut, citrus, extraordinary complexity and length', notes:'2 Grands Crus: Le Montrachet (shared with Chassagne, finest white wine vineyard on earth), Bâtard-Montrachet (shared), Bienvenues-Bâtard, Chevalier-Montrachet. 11 Premier Crus. Domaine Leflaive, Carillon, Sauzet: top producers. Village Puligny is a fine introduction at lower cost.' },
    { name:'Chassagne-Montrachet AOC', classification:'AOC', grapes:["Chardonnay (white, dominant), Pinot Noir (red, significant)"], method:'Barrel fermented whites; classic red production', aging:'Village: 12 months', style:'Whites: full body, richer/rounder than Puligny, ripe peach, hazelnut, toast. Reds: medium body, firm cherry', notes:'Shares Le Montrachet and Bâtard-Montrachet GCs with Puligny. Southern end of Côte de Beaune. 55 Premier Crus for both red and white. Ramonet, Niellon, Colin: top producers. Good value vs Puligny despite same GCs. Reds are underrated.' },
    { name:'Beaune AOC / Beaune Premier Cru', classification:'AOC', grapes:["Pinot Noir (dominant), Chardonnay (white — small)"], method:'Classic Bordeaux red production', aging:'12–18 months', style:'Medium-full body, red fruit, floral, elegant, well-structured, reliable quality', notes:'Heart of Côte de Beaune. 42 Premier Crus including Clos des Mouches (both red and white — Joseph Drouhin), Grèves, Teurons. Négociants (Drouhin, Jadot, Bouchard) dominate ownership. Hospices de Beaune: famous charity auction each November, sets benchmark prices.' },
    { name:'Aloxe-Corton AOC', classification:'AOC', grapes:["Pinot Noir (red), Chardonnay (white — rare)"], method:'Classic Burgundy', aging:'12–18 months', style:'Medium-full body, structured, dark fruit, earthy — sits below Corton GC on the hill', notes:'Village at foot of Corton hill. Shares the Corton and Corton-Charlemagne GC hill. Premier Crus: Clos des Maréchaux, Les Valozières. Good introduction to the Corton hill without GC prices.' },
    { name:'Santenay AOC', classification:'AOC', grapes:["Pinot Noir (dominant), Chardonnay"], method:'Classic Burgundy', aging:'12 months', style:'Medium body, earthy, rustic, firm cherry, good structure', notes:'Southern end of Côte de Beaune. Often undervalued. Maranges: adjacent commune (even cheaper). Several Premier Crus. Drouhin-Laroze produces here. Known for mineral, earthy character and reliability at lower price points.' },
    { name:'Auxey-Duresses AOC', classification:'AOC', grapes:["Pinot Noir (red), Chardonnay (white)"], method:'Classic Burgundy', aging:'12 months', style:'Reds: medium body, soft cherry, earthy. Whites: fresh, mineral, leaner than Meursault', notes:'Inland village off main Côte. Often good value for Côte de Beaune style. 9 Premier Crus. Robert Ampeau: benchmark producer for aging potential.' },
  ],
  // ===== FRANCE — BURGUNDY (CÔTE CHALONNAISE) =====
  'Côte Chalonnaise': [
    { name:'Mercurey AOC', classification:'AOC', grapes:["Pinot Noir (red, dominant), Chardonnay (white)"], method:'Classic Burgundy production', aging:'Reds: 12 months. Whites: no minimum', style:'Reds: medium body, red cherry, earthy, pepper, firmer than Côte de Beaune. Whites: fresh, mineral, citrus', notes:'Largest Côte Chalonnaise commune. Good quality at lower prices than Côte d\'Or. 32 Premier Crus. Faiveley estate owns significant holdings. Excellent food wine.' },
    { name:'Givry AOC', classification:'AOC', grapes:["Pinot Noir (red, dominant), Chardonnay (white)"], method:'Classic Burgundy', aging:'No minimum', style:'Medium body, red cherry, earthy, reliable, accessible', notes:'Smallest major Côte Chalonnaise commune by volume. Historically favored by King Henri IV. 28 Premier Crus. Good value Burgundy.' },
    { name:'Rully AOC', classification:'AOC', grapes:["Chardonnay (white, dominant), Pinot Noir (red)"], method:'Stainless steel or old oak whites; classic reds', aging:'No minimum', style:'Whites: fresh, mineral, citrus, light oak. Reds: light body, delicate red fruit', notes:'Known more for whites and Crémant de Bourgogne production. 23 Premier Crus. Base wine for Crémant. Best whites compare to Mâconnais top tier.' },
    { name:'Montagny AOC', classification:'AOC', grapes:["Chardonnay (100% — whites only)"], method:'Stainless steel and/or old oak', aging:'No minimum', style:'Light-medium body, crisp, mineral, citrus, relatively neutral, clean', notes:'Only white wine commune of Côte Chalonnaise. Limestone soils. All 4 Premier Crus here are value alternatives to Chablis Premier Cru.' },
    { name:'Bouzeron AOC', classification:'AOC', grapes:["Aligoté (100%)"], method:'Stainless steel, no oak', aging:'No minimum', style:'Light body, high acid, lemony, mineral, slightly nutty, very dry', notes:'Only Burgundy appellation exclusively for Aligoté. Aubert de Villaine (DRC co-owner) restored quality here. Bouzeron Aligoté: best example of the variety. Traditional kir ingredient (Aligoté + crème de cassis).' },
    { name:'Crémant de Bourgogne AOC', classification:'AOC', grapes:["Chardonnay, Pinot Noir (dominant), Aligoté, Gamay, others permitted"], method:'Traditional method — secondary fermentation in bottle', aging:'Min 9 months on lees', style:'Fine persistent bubbles, apple, citrus, brioche, fresh acidity, creamy texture', notes:'Burgundy\'s answer to Champagne at a fraction of the price. Made across entire Burgundy region. Blanc and Rosé. Rully is key production area. Caves de Bailly (underground quarry cellar): major producer. Quality improving rapidly.' },
  ],
  // ===== FRANCE — BURGUNDY (MÂCONNAIS) =====
  'Mâconnais': [
    { name:'Mâcon AOC / Mâcon-Villages AOC', classification:'AOC', grapes:["Chardonnay (white, dominant), Gamay (red), Pinot Noir (red)"], method:'Stainless steel; no oak for basic Mâcon', aging:'No minimum', style:'Whites: clean, simple, fruity, melon, citrus, easy-drinking. Reds: light, fruity', notes:'Workhorse appellation of the Mâconnais. Mâcon-Villages: whites only from 26 named villages. Higher yield than Côte de Beaune. Value entry to Chardonnay. Good everyday drinking. Look for specific village names for best examples.' },
    { name:'Pouilly-Fuissé AOC', classification:'AOC', grapes:["Chardonnay (100%)"], method:'Barrel fermented (old oak or stainless), some lees stirring', aging:'No minimum; Premiers Crus (since 2020) typically 12 months', style:'Medium-full body, ripe stone fruit, melon, mineral, creamy texture, more richness than Chablis', notes:'Premier Cru designation added in 2020 (42 Premier Crus). Most prestigious Mâconnais appellation. Limestone rock outcrops (Roche de Solutré, Vergisson): distinctive terroir. Domaine J.A. Ferret, Château Fuissé: benchmark. Rivals lower Côte de Beaune whites in quality at lower price.' },
    { name:'Saint-Véran AOC', classification:'AOC', grapes:["Chardonnay (100%)"], method:'Stainless steel or old oak', aging:'No minimum', style:'Light-medium body, citrus, green apple, mineral, fresh, clean', notes:'Surrounds Pouilly-Fuissé. Created 1971. Good value Mâconnais white. Southern end is the freshest; northern more mineral. Popular export Chardonnay.' },
    { name:'Pouilly-Loché AOC / Pouilly-Vinzelles AOC', classification:'AOC', grapes:["Chardonnay (100%)"], method:'Stainless steel or old oak', aging:'No minimum', style:'Similar to Pouilly-Fuissé but lighter, fresher, less complex', notes:'Two tiny satellite ACs adjacent to Pouilly-Fuissé. Can be marketed as "Pouilly" to benefit from Fuissé reputation. Good value alternatives.' },
    { name:'Viré-Clessé AOC', classification:'AOC', grapes:["Chardonnay (100%)"], method:'Stainless steel or old oak; moelleux styles possible', aging:'No minimum', style:'Medium body, richer and rounder, honey, stone fruit, melon', notes:'Merged 1999 from Viré and Clessé villages. The richest, most generous style of Mâconnais — can include late-harvest moelleux wines. André Bonhomme: key producer.' },
  ],
  // ===== FRANCE — BEAUJOLAIS =====
  'Beaujolais': [
    { name:'Beaujolais Nouveau AOC', classification:'AOC', grapes:["Gamay (100%)"], method:'Carbonic maceration (whole-bunch fermentation) — short, fast, no crush', aging:'Released third Thursday of November, same year as harvest', abv:'12–13%', style:'Very light body, fresh, strawberry, banana, bubblegum, very fruity, low tannin, zero aging', notes:'Global wine phenomenon — released 6–8 weeks after harvest. Georges Duboeuf made it famous. 35% of all Beaujolais production. Meant for immediate consumption. Carbonic maceration key technique to know.' },
    { name:'Beaujolais AOC / Beaujolais-Villages AOC', classification:'AOC', grapes:["Gamay (100%)"], method:'Semi-carbonic maceration or traditional; light extraction', aging:'No minimum', style:'Light-medium body, red cherry, strawberry, low tannin, slight earthiness', notes:'Basic Beaujolais: southern granite and limestone. Beaujolais-Villages: 38 villages in granite-rich north. The foundation of the appellation. For early drinking (1–3 years). Good value bistro red.' },
    { name:'Beaujolais Cru Wines (Moulin-à-Vent, Morgon, Fleurie, etc.)', classification:'AOC (10 separate ACs)', grapes:["Gamay (100%)"], method:'Some producers use traditional Burgundian techniques (no carbonic); French oak possible', aging:'Cru wines: typically 12 months, some up to 24 months. Moulin-à-Vent and Morgon: age 5–10 years', style:'Wide range: Moulin-à-Vent = deepest and most structured (Pinot-like). Morgon = earthy, brooding. Fleurie = floral, elegant. Chiroubles = lightest, aromatic. Brouilly = approachable. Juliénas = spicy, firm.', notes:'10 Crus: Moulin-à-Vent (most powerful), Morgon (volcanic soil "cru" of terroir), Fleurie, Chiroubles, Chénas, Juliénas, Saint-Amour, Brouilly, Côte de Brouilly, Régnié. All on granite soils in northern Beaujolais. Top producers (Lapierre, Desvignes, Château Thivin, Jadot): make serious age-worthy wines. Moulin-à-Vent can be mistaken for Burgundy in blind tasting.' },
  ],
  // ===== FRANCE — ALSACE =====
  'Alsace': [
    { name:'Alsace AOC — Riesling', classification:'AOC', grapes:["Riesling (100%)"], method:'Stainless steel, no residual sugar for dry (Sec/Trockenauslese). No oak.', aging:'No minimum; ages 5–15 years for quality', abv:'12–14%', style:'Dry, full body (for Riesling), high acid, citrus, stone fruit, petrol/kerosene (with age), mineral, complex', notes:'Most prestigious Alsace variety for Grand Cru. Dry style — very different from German Riesling. Alsace Grand Cru Riesling: among finest in the world. Trimbach Clos Sainte Hune: iconic benchmark. Ages brilliantly — develops petrol note with 8–10 years.' },
    { name:'Alsace AOC — Gewurztraminer', classification:'AOC', grapes:["Gewurztraminer (100%)"], method:'Stainless steel; often off-dry or sweet; low-yielding', aging:'No minimum', abv:'13–15%', style:'Full body, low acid, intensely aromatic (rose, lychee, ginger, allspice, exotic spice), off-dry to sweet, oily texture', notes:'The most distinctive Alsace variety. Can be dry, off-dry, or Vendanges Tardives (VT). Low acidity means best with spicy food. Grand Cru Gewurz from Rangen (volcanic) or Hengst: outstanding. Zind-Humbrecht, Hugel, Weinbach: top producers.' },
    { name:'Alsace AOC — Pinot Gris', classification:'AOC', grapes:["Pinot Gris (100%)"], method:'Stainless steel; rich, low acid; can be dry to sweet', aging:'No minimum', abv:'13–15%', style:'Full body, low acid, smoky, honey, ginger, white peach, rich, textured, off-dry to sweet', notes:'Alsace\'s most food-friendly variety — pairs with everything from foie gras to curry. Called "Tokay Pinot Gris" until 2007 (EU name change). VT and SGN (Sélection de Grains Nobles) versions extraordinary with foie gras.' },
    { name:'Alsace AOC — Pinot Blanc & Auxerrois', classification:'AOC', grapes:["Pinot Blanc, Auxerrois, Pinot Noir (white-vinified permitted)"], method:'Stainless steel, clean winemaking', aging:'No minimum', style:'Light-medium body, neutral, apple, pear, clean, easy-drinking, soft acidity', notes:'The everyday drinking Alsace white. Often blended. Crémant d\'Alsace base wine. Good value, versatile food wine. Pinot Blanc = lighter, Auxerrois = fuller.' },
    { name:'Alsace AOC — Muscat d\'Alsace', classification:'AOC', grapes:["Muscat Blanc à Petits Grains, Muscat Ottonel"], method:'Stainless steel, low temperature fermentation, bone dry', aging:'No minimum', abv:'12–13%', style:'Dry (unique for Muscat!), light body, intensely floral, fresh grape, orange blossom, musk, very aromatic but dry finish', notes:'Unique dry Muscat. Most wines globally are sweet but Alsace Muscat is bone dry — an aperitif wine. Best drunk young. WSET exam tests: what makes Alsace Muscat unusual? Answer: it\'s dry.' },
    { name:'Alsace AOC — Pinot Noir', classification:'AOC', grapes:["Pinot Noir (100%)"], method:'Light extraction; often oak aged', aging:'12 months for oak-aged versions', style:'Light-medium body, red cherry, strawberry, light tannins — lighter style Pinot Noir', notes:'The only red variety of Alsace AOC. Quality improving but still lighter than Burgundy. Best used for rosé or light red. Marcel Deiss makes a serious version.' },
    { name:'Crémant d\'Alsace AOC', classification:'AOC', grapes:["Pinot Blanc (dominant), Auxerrois, Pinot Gris, Pinot Noir, Riesling, Chardonnay"], method:'Traditional method — secondary fermentation in bottle', aging:'Min 9 months on lees', style:'Fresh, apple, citrus, brioche, fine bubbles, clean, crisp', notes:'France\'s most popular Crémant. Good value Champagne alternative. Both blanc and rosé. Rosé must be 100% Pinot Noir. Major export success. Wolfberger, Willm, Dopff au Moulin: large producers.' },
    { name:'Alsace Grand Cru AOC', classification:'Grand Cru AOC', grapes:["Riesling, Gewurztraminer, Pinot Gris, Muscat (only 4 varieties allowed on GC sites)"], method:'Low yields (55–70hl/ha max depending on variety and vintage)', aging:'GC Riesling: 5+ years. Gewurz/PG: 3+ years', abv:'Riesling: 12–14%. Gewurz/PG: 13–15%', style:'More concentrated, complex, and terroir-expressive than village wines', notes:'51 named Grands Crus (controversial — some question quality of all 51). Best: Schlossberg (Riesling, granite), Hengst (Gewurz, marl-limestone), Brand (all 4 varieties), Rangen de Thann (volcanic, steepest). Trimbach does not use GC designation (bottles as Clos Sainte Hune). VT/SGN: late harvest and botrytis wines — highest quality dessert tier.' },
  ],
  // ===== FRANCE — LOIRE VALLEY =====
  'Loire Valley — Central Vineyards': [
    { name:'Sancerre AOC (White)', classification:'AOC', grapes:["Sauvignon Blanc (100%)"], method:'Stainless steel (traditional) or barrel (modern); cool fermentation', aging:'No minimum; best aged 3–7 years', abv:'12.5–13.5%', style:'High acid, citrus, gooseberry, flint/gun-smoke, chalk mineral, herbaceous, crisp, precise', notes:'Benchmark for world Sauvignon Blanc. 3 soil types: Terres Blanches (Kimmeridgian clay-limestone = richest), Caillottes (limestone gravel = more approachable), Silex (hard flint = most mineral, smoky). Domaine Henri Bourgeois, Lucien Crochet, Henri Pellé: top producers. Flint/smoke character = signature.' },
    { name:'Sancerre AOC (Red)', classification:'AOC', grapes:["Pinot Noir (100%)"], method:'Light extraction, French oak optional', aging:'No minimum', style:'Light body, red cherry, delicate, earthy, silky — Loire Pinot Noir style', notes:'Less famous than Sancerre white but distinctive. Terres Blanches soils preferred for red. Light Loire Pinot Noir — drink young or 3–5 years. Traditionally served at cellar temperature. Lucien Crochet: excellent red.' },
    { name:'Pouilly-Fumé AOC', classification:'AOC', grapes:["Sauvignon Blanc (100%)"], method:'Stainless steel; some barrel (Didier Dagueneau style)', aging:'No minimum; ages 3–7 years for quality', abv:'12.5–13.5%', style:'Smoky/flint mineral, white grapefruit, citrus, grassy, similar to Sancerre but slightly richer, fuller', notes:'Directly across the Loire from Sancerre. Silex (flint) soils give the "fumé" (smoky) character. Didier Dagueneau (now Nicolas Dagueneau) made this world-famous with barrel-aged Silex and Buisson Renard. Widely imitated but rarely matched. Not to be confused with Pouilly-Fuissé (Mâconnais Chardonnay).' },
    { name:'Menetou-Salon AOC', classification:'AOC', grapes:["Sauvignon Blanc (white), Pinot Noir (red and rosé)"], method:'Stainless steel, clean style', aging:'No minimum', style:'Similar to Sancerre but lighter, fresher, less complex. Whites: herbaceous, citrus. Reds: light Pinot Noir', notes:'Adjacent to Sancerre. Excellent value alternative at lower price. Henry Pellé: leading producer who put the appellation on the map. Good everyday Sancerre substitute.' },
    { name:'Reuilly AOC', classification:'AOC', grapes:["Sauvignon Blanc (white), Pinot Noir, Pinot Gris (rosé)"], method:'Stainless steel', aging:'No minimum', style:'Light, fresh, herbaceous, citrus. Pinot Gris rosé: unusual pale pink, delicate', notes:'Further west, less well-known. Good value. Known for crisp whites and unique Pinot Gris rosé (unusual in Loire). Denis Jamain: reliable producer.' },
    { name:'Quincy AOC', classification:'AOC', grapes:["Sauvignon Blanc (100%)"], method:'Stainless steel', aging:'No minimum', style:'Light-medium body, citrus, herbal, fresh — leaner and more austere than Sancerre', notes:'All Sauvignon Blanc whites only (rare — one of few Loire ACs exclusively white Sauv Blanc). Sandy gravel soils on Cher river. Tightly structured. Good value.' },
  ],
  'Loire Valley — Touraine': [
    { name:'Vouvray AOC', classification:'AOC', grapes:["Chenin Blanc (100%)"], method:'Stainless steel for dry; natural late harvest for sweet. Tuffeau limestone cellars for aging.', aging:'Dry (Sec): no minimum. Demi-sec/Moelleux: no minimum. Pétillant/Mousseux: 9 months on lees', abv:'Dry: 11–13%. Sweet: 11–14%', style:'Full range: Sec (dry, mineral, quince, chamomile, lanolin, high acid); Demi-sec (off-dry, stone fruit); Moelleux (sweet, honey, quince, extraordinary aging). All show Chenin\'s high acidity', notes:'Touraine\'s most famous AC for whites. Chenin Blanc: the great grape of the Loire. Tuffeau: white limestone-clay creates unique underground cellars. Styles: Sec (bone dry), Demi-sec (off-dry), Moelleux (sweet — not necessarily botrytis but passerillage and botrytis). Pétillant and Mousseux (traditional method) also produced. Huet estate: the benchmark for all styles. 20–40+ year aging for best Moelleux.' },
    { name:'Montlouis-sur-Loire AOC', classification:'AOC', grapes:["Chenin Blanc (100%)"], method:'Stainless steel, natural late harvest', aging:'No minimum', style:'Similar to Vouvray but generally lighter and more mineral. Sec, Demi-sec, Moelleux, Pétillant', notes:'South bank of Loire opposite Vouvray (sandy soils vs tuffeau). Often overlooked vs Vouvray. François Chidaine: top producer making excellent dry and sweet versions. Good value Chenin Blanc.' },
    { name:'Chinon AOC', classification:'AOC', grapes:["Cabernet Franc (dominant for reds, 100%); Chenin Blanc (white)"], method:'Reds: light extraction, some whole-bunch, old oak or concrete. Whites: stainless steel.', aging:'No minimum; premium reds: 12–18 months in oak', style:'Reds: medium body, raspberry, red cherry, graphite, violet, earthy, pepper, firm acidity, light tannins. Whites: dry, mineral, citrus.', notes:'The greatest Cabernet Franc appellation. Tuffeau-limestone soils + gravel terraces. Château du Hureau, Couly-Dutheil, Charles Joguet: top producers. The "pencil shavings" and graphite mineral character of Chinon Cab Franc is distinctive. Lightly chilled in summer. Whites (rare) can be excellent. Ages well 10+ years for top wines.' },
    { name:'Bourgueil AOC & Saint-Nicolas-de-Bourgueil AOC', classification:'AOC', grapes:["Cabernet Franc (dominant), Cabernet Sauvignon (max 10%)"], method:'Light extraction, old oak or stainless', aging:'No minimum; premium: 12 months', style:'Medium body, red cherry, raspberry, violet, earthy, pepper, similar to Chinon but slightly lighter', notes:'North bank of Loire. Bourgueil: clay-tuffeau (more structured). Saint-Nicolas-de-Bourgueil: sandier soils (lighter, fruitier). Pierre-Jacques Druet: Bourgueil benchmark. Both are excellent everyday Cabernet Franc.' },
    { name:'Touraine AOC', classification:'AOC', grapes:["Sauvignon Blanc (white dominant), Gamay (red), Cabernet Franc, Chenin Blanc"], method:'Fresh, clean, early-drinking style throughout', aging:'No minimum', style:'Whites: crisp, herbaceous Sauv Blanc, good value Sancerre alternative. Reds: light, fruity, Gamay-based', notes:'Broad regional AC covering many villages in Touraine. Sub-appellations: Touraine Amboise, Touraine Azay-le-Rideau, Touraine Mesland. Value wines from Loire. Gamay and Cabernet Franc for reds; Sauvignon Blanc and Chenin for whites.' },
    { name:'Touraine Pétillant de Raisin (Pét-Nat)', classification:'Vin de France/AOC', grapes:["Chenin Blanc, Cabernet Franc, Gamay, Pineau d\'Aunis, others"], method:'Méthode ancestrale — single fermentation, bottle refermentation before fermentation complete', aging:'Variable — released early', style:'Low alcohol (7–11%), slightly hazy, gentle bubbles, fresh fruit, natural, lively', notes:'Loire is the heartland of natural pétillant (Pét-Nat). Traditional ancestral method (méthode ancestrale). Domaine de la Garrelière, Hervé Villemade: producers. Trendy, low-intervention, distinctive. Not to be confused with Crémant.' },
  ],
  'Loire Valley — Anjou-Saumur': [
    { name:'Anjou Rouge AOC / Anjou-Villages AOC', classification:'AOC', grapes:["Cabernet Franc (dominant), Cabernet Sauvignon"], method:'Light extraction, some oak', aging:'No minimum; Anjou-Villages: min 1 year in cask', style:'Light-medium body, earthy, red fruit, pepper — entry-level Loire red', notes:'Anjou-Villages: higher quality tier with stricter rules and longer aging. Good value everyday red. Schist (slate) soils give minerality.' },
    { name:'Rosé d\'Anjou AOC', classification:'AOC', grapes:["Grolleau (dominant), Cabernet Franc, Gamay, others"], method:'Short skin contact', aging:'No minimum', abv:'7–12%', style:'Off-dry to medium-sweet, pale rosé, strawberry, light, simple, refreshing', notes:'One of France\'s most-sold rosés. Usually semi-sweet. Contrasted with Cabernet d\'Anjou (sweeter, better quality). Good value everyday rosé.' },
    { name:'Cabernet d\'Anjou AOC', classification:'AOC', grapes:["Cabernet Franc (dominant), Cabernet Sauvignon"], method:'Short skin contact', aging:'No minimum', abv:'11–13%', style:'Off-dry to medium-sweet, deeper pink, strawberry, raspberry, more aromatic and complex than Rosé d\'Anjou', notes:'Better quality than Rosé d\'Anjou. Made with Cabernet varieties instead of Grolleau. Semi-sweet style — actually has aging potential, unlike most rosé.' },
    { name:'Savennières AOC (Sec and Moelleux)', classification:'AOC', grapes:["Chenin Blanc (100%)"], method:'Stainless or old foudres; low yields, slate-schist soils', aging:'No minimum; dry: ages 5–15 years', abv:'12–14%', style:'Dry: intense, mineral, beeswax, quince, citrus, lanolin, very high acid, austere and demanding, requires time. Moelleux styles: honey, apricot, floral.', notes:'One of Loire\'s greatest dry white ACs. Volcanic schist and slate soils + south-facing slopes. Strict yields. Domaine aux Moines, Château d\'Epiré: top producers. Two famous single-vineyard ACs: Savennières-Roche-aux-Moines and Savennières-Coulée-de-Serrant (biodynamic, Nicolas Joly estate — one of world\'s most individual wines).' },
    { name:'Coteaux du Layon AOC', classification:'AOC', grapes:["Chenin Blanc (100%)"], method:'Late harvest, often botrytis (noble rot) and passerillage; multiple tries through vineyard', aging:'Moelleux: ages 10–30+ years', abv:'11–15%', style:'Sweet to liquoreux, honey, apricot, quince, orange marmalade, ginger, high acid, complex', notes:'Loire\'s greatest sweet wine AC. Layon river mists create botrytis conditions. Coteaux du Layon Chaume: premier cru. Sub-ACs: Quarts de Chaume Grand Cru (rarest, finest, classified 2011 as Grand Cru — Loire\'s only one). Bonnezeaux AOC: another top tier. Domaine des Baumard, Patrick Baudouin: top estates. Rivals Sauternes.' },
    { name:'Saumur AOC (White)', classification:'AOC', grapes:["Chenin Blanc (dominant), Sauvignon Blanc, Chardonnay"], method:'Stainless steel; tuffeau limestone cellars', aging:'No minimum', style:'Medium-light body, high acid, mineral, citrus, clean, fresh', notes:'Saumur whites made from Chenin Blanc primarily. Good value Loire white. Tuffeau caves used for storage and Crémant production.' },
    { name:'Saumur-Champigny AOC', classification:'AOC', grapes:["Cabernet Franc (100% or dominant)"], method:'Light extraction, old oak or concrete', aging:'No minimum; premium: 12 months', style:'Medium body, raspberry, red cherry, crushed stone mineral, violet, fresh acidity, silky', notes:'Premier red Loire AC. Cabernet Franc on tuffeau limestone = elegant, mineral, distinctive "cool climate" style. Count Lennart Bernadotte of Sweden popularized this wine internationally. Filliatreau: top producer. Loire\'s best red.' },
    { name:'Crémant de Loire AOC', classification:'AOC', grapes:["Chenin Blanc, Cabernet Franc, Cabernet Sauvignon, Pineau d\'Aunis, Chardonnay, Pinot Noir, Grolleau"], method:'Traditional method — secondary fermentation in bottle', aging:'Min 12 months on lees (more than Crémant d\'Alsace or Bourgogne)', style:'Fine bubbles, clean, apple, citrus, creamy, good acidity', notes:'Loire\'s traditional method sparkling. Longer minimum aging than other Crémants (12 months). Chenin Blanc gives characteristic high acidity. Made across the Loire Valley. Good value and quality rival. Bouvet-Ladubay: major producer.' },
  ],
  'Loire Valley — Muscadet (Nantais)': [
    { name:'Muscadet AOC', classification:'AOC', grapes:["Melon de Bourgogne (100%) — also called Muscadet"], method:'Stainless steel, cold fermentation, minimal intervention', aging:'No minimum (basic Muscadet)', style:'Light body, very dry, citrus, neutral, clean, very high acid, sea-salt, lean', notes:'Basic tier of Muscadet. Simple, clean, crisp. Classic oyster wine. Atlantic climate near Nantes gives sea-salt mineral quality.' },
    { name:'Muscadet Sèvre et Maine AOC (sur lie)', classification:'AOC', grapes:["Melon de Bourgogne (100%)"], method:'Extended lees aging in tank (sur lie) from harvest until bottling in spring', aging:'Sur lie: min until 3rd Thursday of February following harvest (min ~5 months); quality wines: 12–18 months', style:'Light-medium body, very dry, citrus, sea-salt, yeasty/brioche, slight petillance, textured', notes:'The classic Muscadet. Sur lie (on lees) aging adds texture, yeasty complexity, and slight CO2 freshness. New classifications: Muscadet SEM sur lie Cru Communaux (10 village-level ACs). Top Crus: Clisson (granite, ages 10+ years), Gorges (volcanic), Goulaine. Domaine Luneau-Papin, Guy Bossard: top producers. Underrated aging potential.' },
    { name:'Muscadet Côtes de Grandlieu AOC (sur lie)', classification:'AOC', grapes:["Melon de Bourgogne (100%)"], method:'Sur lie aging', aging:'Min 5 months sur lie', style:'Light, dry, fresh, citrus — slightly rounder than Sèvre et Maine', notes:'Newer sub-appellation south of the Loire near Lac de Grandlieu. Generally lighter and simpler than Sèvre et Maine. Less known but can offer value.' },
    { name:'Gros Plant du Pays Nantais AOVDQS/AOC', classification:'AOC', grapes:["Folle Blanche (100%)"], method:'Stainless steel, sur lie possible', aging:'No minimum', abv:'9.5–12%', style:'Very light, very high acid, citrus, neutral, sharp, almost austere — an acquired taste', notes:'One of France\'s most acidic wines. Folle Blanche (Gros Plant) = naturally very high acid. Promoted to AOC 2011. Extremely food-specific (oysters, seafood). Locals love it. Value wine.' },
  ],
  // ===== FRANCE — RHÔNE (SOUTHERN) =====
  'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)': [
    { name:'Châteauneuf-du-Pape AOC (Red)', classification:'AOC', grapes:["Grenache (dominant, min 80% in practice), Syrah, Mourvèdre, Cinsault, Counoise, and more (13 varieties permitted)"], method:'Traditional: whole-bunch in large old oak foudres. Modern: destemmed, shorter maceration, barriques or foudres.', aging:'Min 12 months in wood', abv:'14–16% (highest minimum alcohol in France)', style:'Full body, ripe plum, cherry, herbes de Provence, leather, spice, garrigue (scrubland herbs), iron, pepper, tobacco, complex', notes:'Historical seat of the Avignon Papacy (14th century). Galets (large rounded stones) on the plateau: retain heat, help ripen Grenache. 13 permitted varieties. Two styles: traditional (earthy, spicy, structured) vs modern (concentrated, ripe, oaky). Château Rayas: tiny, unconventional, world-famous. Château Beaucastel: uses all 13 varieties, long-lived. Mourvèdre gives spice and aging in cooler sites.' },
    { name:'Châteauneuf-du-Pape AOC (White)', classification:'AOC', grapes:["Grenache Blanc, Clairette, Roussanne, Bourboulenc, Picpoul, others permitted"], method:'Barrel or stainless; often fermented in old foudres', aging:'No minimum', style:'Full body, low acid, rich, white peach, honey, floral, nutty, textured, aromatic complexity', notes:'Only 6–7% of CdP production is white. Beaucastel Blanc (old vine Roussanne): one of the world\'s greatest whites. Château Rayas Blanc: also legendary. Rich, oxidative style with age. Usually drink young or age 10+ years with care.' },
    { name:'Côtes du Rhône AOC & Côtes du Rhône Villages AOC', classification:'AOC', grapes:["Grenache (min 40%), Syrah, Mourvèdre, Cinsault and others (red); Grenache Blanc, Viognier, others (white)"], method:'Standard southern Rhône: carbonic or traditional maceration', aging:'No minimum', style:'Medium body, ripe cherry, southern herbs, pepper, easy-drinking, warm', notes:'Backbone of Rhône production. CDR Villages: higher min alcohol, lower yields. Named CDR Villages (22 communes): even better. Sablet, Séguret, Cairanne (now its own AC) among best. Guigal CDR is benchmark affordable Rhône. Also Rosé CDR.' },
    { name:'Gigondas AOC', classification:'AOC', grapes:["Grenache (min 50%), Syrah (max 20%), Mourvèdre, Cinsault, others"], method:'Old foudres or barriques; structured extraction', aging:'Min 12 months in wood', style:'Full body, ripe dark fruit, garrigue, leather, spice, firmer tannins than CdP, earthier, "poor man\'s CdP"', notes:'Rocky Dentelles de Montmirail hills. More structured and tannic than Châteauneuf. Can age 10–15+ years. Santa Duc, Château Saint-Cosme: top producers. Excellent value relative to CdP.' },
    { name:'Vacqueyras AOC', classification:'AOC', grapes:["Grenache (min 50%), Syrah, Mourvèdre"], method:'Old foudres or barriques', aging:'No minimum', style:'Medium-full body, earthy, garrigue, dark fruit, pepper — between CDR and Gigondas in quality', notes:'Elevated from CDR Villages to full AC in 1990. Just south of Gigondas. Less tannin than Gigondas. Domaine le Sang des Cailloux: top producer. Good value.' },
    { name:'Rasteau AOC', classification:'AOC', grapes:["Grenache (min 50%), Syrah, Mourvèdre"], method:'Classic southern Rhône', aging:'No minimum', style:'Full body, ripe dark fruit, warm, spicy, rustic', notes:'Elevated to full AC in 2010 for reds. Also makes Rasteau Vin Doux Naturel (VDN): fortified Grenache (red and blanc), aged oxidatively. Important for WSET: distinguish dry red AC from fortified VDN.' },
    { name:'Muscat de Beaumes-de-Venise AOC (VDN)', classification:'AOC (Vin Doux Naturel)', grapes:["Muscat Blanc à Petits Grains (100%)"], method:'Fortification during fermentation with neutral grape spirit to ~15% ABV, halting fermentation', aging:'No minimum', abv:'15%', style:'Sweet, golden, intensely floral, fresh grape, peach, apricot, orange blossom, roses, honeyed, low tannin', notes:'One of France\'s most famous sweet wines. Mutage (fortification) preserves natural grape sweetness — not botrytis. VDN = Vin Doux Naturel. Must be served cold. Best drunk within 2–3 years of harvest. Domaine des Bernardins: top estate.' },
    { name:'Tavel AOC', classification:'AOC', grapes:["Grenache (dominant), Cinsault, Syrah, Mourvèdre, Clairette, others"], method:'Maceration on skins for 24–48 hours + cold soaking; partial whole-bunch', aging:'No minimum; can age 3–5 years (unusual for rosé)', abv:'13–15%', style:'Deep salmon/copper rosé, full body, dry, strawberry, cherry, spice, garrigue, powerful, structured — most serious dry rosé in France', notes:'Only appellation making solely rosé (no red or white). High minimum alcohol (min 11%). Famous for full-bodied, serious style. Aged in oak or concrete. Château d\'Aquéria, Domaine de la Mordorée: top producers. "King of rosés" by reputation. Generally too full for light aperitif style.' },
    { name:'Lirac AOC', classification:'AOC', grapes:["Grenache (dominant), Syrah, Mourvèdre (red/rosé); Grenache Blanc, Clairette, Viognier (white)"], method:'Classic southern Rhône', aging:'No minimum', style:'Reds: medium-full body, red cherry, herbal, earthy. Whites: aromatic, stone fruit, full body. Also rosé.', notes:'Directly across from Châteauneuf. Undervalued. Excellent whites also produced. Roger Sabon, Domaine de la Mordorée: leading producers. Value for CDR-style wines.' },
  ],
  // ===== FRANCE — LANGUEDOC-ROUSSILLON =====
  'Languedoc-Roussillon': [
    { name:'Languedoc AOC (Reds)', classification:'AOC', grapes:["Syrah, Grenache, Mourvèdre (GSM blend), Carignan, Cinsault"], method:'Traditional: whole-bunch carbonic for Carignan. Modern: partial destemming, barriques or foudres.', aging:'No minimum', style:'Medium-full body, ripe dark fruit, garrigue, spice, warm, Mediterranean character', notes:'Formerly Coteaux du Languedoc (renamed 2007). Vast appellation from Nîmes to Narbonne. 15 named sub-zones (including Terrasses du Larzac — highest, coolest — La Clape, Pic Saint Loup, Montpeyroux, Grès de Montpellier). Quality revolution since 1980s — Mas de Daumas Gassac put region on map (Vin de Pays but icon). Good values at all levels.' },
