function buildGeoFeatures() {
  // Rivers - blue polylines
  GEO_FEATURES.rivers.forEach(r => {
    const line = L.polyline(r.path, { color: '#4a9fd4', weight: 2, opacity: 0.6, dashArray: null }).addTo(geoLayer);
    line.bindTooltip(r.tooltip, { sticky: true, className: 'geo-tooltip' });
    const mid = r.path[Math.floor(r.path.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({ className: 'geo-label geo-label-river', html: r.name, iconSize: [0,0], iconAnchor: [-5, 8] }),
      interactive: false
    }).addTo(geoLayer);
  });

  // Mountain ranges - brown dashed polylines
  if (GEO_FEATURES.ranges) {
    GEO_FEATURES.ranges.forEach(r => {
      const line = L.polyline(r.path, { color: '#a0785a', weight: 3, opacity: 0.55, dashArray: '6,4' }).addTo(geoLayer);
      line.bindTooltip(r.tooltip, { sticky: true, className: 'geo-tooltip' });
      const mid = r.path[Math.floor(r.path.length / 2)];
      L.marker(mid, {
        icon: L.divIcon({ className: 'geo-label geo-label-mountain', html: `▲▲▲ ${r.name}`, iconSize: [0,0], iconAnchor: [-5, 8] }),
        interactive: false
      }).addTo(geoLayer);
    });
  }

  // Mountains - triangle markers
  GEO_FEATURES.mountains.forEach(m => {
    const icon = L.divIcon({
      className: 'geo-label geo-label-mountain',
      html: `▲ ${m.name}`,
      iconSize: [0, 0], iconAnchor: [-5, 8]
    });
    L.marker([m.lat, m.lng], { icon }).addTo(geoLayer).bindTooltip(m.tooltip, { sticky: true });
  });

  // Winds - green dashed arrows
  GEO_FEATURES.winds.forEach(w => {
    const line = L.polyline(w.path, { color: '#6dc9a0', weight: 2.5, opacity: 0.55, dashArray: '8,6' }).addTo(geoLayer);
    line.bindTooltip(w.tooltip, { sticky: true });
    // Arrow at end
    const last = w.path[w.path.length - 1];
    const prev = w.path[w.path.length - 2];
    const angle = Math.atan2(last[0] - prev[0], last[1] - prev[1]) * 180 / Math.PI;
    L.marker(last, {
      icon: L.divIcon({
        className: 'geo-label geo-label-wind',
        html: `➤ ${w.name}`,
        iconSize: [0,0], iconAnchor: [-5, 8]
      }), interactive: false
    }).addTo(geoLayer);
  });

  // Ocean currents - cyan dashed arrows
  GEO_FEATURES.currents.forEach(c => {
    const line = L.polyline(c.path, { color: '#5bb8d8', weight: 3, opacity: 0.45, dashArray: '12,8' }).addTo(geoLayer);
    line.bindTooltip(c.tooltip, { sticky: true });
    const mid = c.path[Math.floor(c.path.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({
        className: 'geo-label geo-label-current',
        html: `〰 ${c.name}`,
        iconSize: [0,0], iconAnchor: [-5, 8]
      }), interactive: false
    }).addTo(geoLayer);
  });

  // Special features - purple markers
  GEO_FEATURES.features.forEach(f => {
    const icon = L.divIcon({
      className: 'geo-label geo-label-feature',
      html: `◆ ${f.name}`,
      iconSize: [0, 0], iconAnchor: [-5, 8]
    });
    L.marker([f.lat, f.lng], { icon }).addTo(geoLayer).bindTooltip(f.tooltip, { sticky: true });
  });
}

// Only show geo features at zoom >= 5 to reduce clutter at world view
let geoVisible = false;
function updateGeoVisibility() {
  const z = map.getZoom();
  if (z >= 5 && !geoVisible) {
    geoVisible = true;
    buildGeoFeatures();
  } else if (z < 5 && geoVisible) {
    geoVisible = false;
    geoLayer.clearLayers();
  }
}
map.on('zoomend', updateGeoVisibility);
updateGeoVisibility();

// ============================================================
// MARKER CREATION
// ============================================================
function createIcon(color, size = 22) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size*1.4}" viewBox="0 0 30 42">
    <path d="M15 0C6.716 0 0 6.716 0 15c0 8.284 15 27 15 27s15-18.716 15-27C30 6.716 23.284 0 15 0z"
      fill="${color}" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="7" fill="rgba(255,255,255,0.85)"/>
    <circle cx="15" cy="15" r="4" fill="${color}"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [size, size * 1.4],
    iconAnchor: [size/2, size * 1.4],
    popupAnchor: [0, -(size * 1.4)]
  });
}

function formatGrapes(grapes) {
  return grapes.map(g => `<span class="grape-tag ${getGrapeWineClass(g)}">${g}</span>`).join('');
}

  'Cabernet Franc': { origin: 'Bordeaux / Loire, France', synonyms: 'Bouchet (old Bordeaux name), Breton (Loire)', type: 'red', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Mid', notes: 'Parent of Cabernet Sauvignon. Ripens earlier than Cab Sauv, thrives in cooler sites. Loire (Chinon, Bourgueil): lighter, more herbaceous. Bordeaux: blending role. Thin-skinned, aromatic (violet, pepper).' },
  'Syrah': { origin: 'Northern Rhône, France', synonyms: 'Shiraz (Australia, S. Africa)', type: 'red', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Mid-late', notes: 'Small, thick-skinned berries. Sensitive to wind damage. Northern Rhône: steep granite slopes (Hermitage, Côte Rôtie). Rotundone compound gives black pepper character. DNA: Dureza × Mondeuse Blanche.' },
  'Shiraz': { origin: 'Same as Syrah — Rhône origin, Australian name', synonyms: 'Syrah (France/rest of world)', type: 'red', climate: 'Warm to hot', vigor: 'Moderate', ripening: 'Mid-late', notes: 'Same grape as Syrah but Australian name signals a richer, warmer-climate style. Barossa Valley old vines (some 150+ years, own-rooted). Often picked riper with more oak treatment.' },
  'Grenache': { origin: 'Aragon, Spain', synonyms: 'Garnacha (Spain), Cannonau (Sardinia)', type: 'red', climate: 'Warm to hot', vigor: 'High', ripening: 'Late', notes: 'Late ripening, drought resistant, high alcohol potential. Upright growth, susceptible to wind. Thin skins → pale colour, low tannins. Needs blending partners for structure. GSM blend: Grenache-Syrah-Mourvèdre.' },
  'Mourvèdre': { origin: 'Spain (Catalonia)', synonyms: 'Monastrell (Spain), Mataro (Australia)', type: 'red', climate: 'Hot', vigor: 'Moderate', ripening: 'Very late', notes: 'Needs extreme heat and sunshine to ripen fully. Thick-skinned, deep colour, high tannins. Bandol (Provence): benchmark. Blending grape in GSM and southern Rhône. Meaty, gamey character.' },
  'Tempranillo': { origin: 'Rioja, Spain', synonyms: 'Tinta Roriz/Aragonez (Portugal), Tinto Fino (Ribera del Duero), Cencibel (La Mancha)', type: 'red', climate: 'Moderate continental', vigor: 'Moderate', ripening: 'Early ("temprano"=early)', notes: 'Spain\'s most noble variety. Name means "early one." Thick-skinned but moderate tannins. Excellent with oak (both American and French). Continental climate preserves acidity. High-altitude plantings.' },
  'Garnacha': { origin: 'Aragon, Spain', synonyms: 'Grenache (France), Cannonau (Sardinia)', type: 'red', climate: 'Warm to hot', vigor: 'High', ripening: 'Late', notes: 'Same variety as Grenache. In Spain: old bush vines (gobelet) on poor soils give concentration. Priorat: llicorella (black slate) soils. Navarra: excellent rosé. Naturally high sugar/alcohol.' },
  'Sangiovese': { origin: 'Tuscany, Italy', synonyms: 'Brunello (Montalcino), Prugnolo Gentile (Montepulciano), Morellino (Scansano)', type: 'red', climate: 'Warm', vigor: 'High', ripening: 'Late', notes: 'Italy\'s most planted variety. Thin-skinned with high acidity and tannins. Late ripening needs warm, sunny hillsides. Many clonal variations. Sangiovese Grosso (larger berry) used for Brunello.' },
  'Nebbiolo': { origin: 'Piemonte, Italy', synonyms: 'Spanna (N Piemonte), Chiavennasca (Lombardy)', type: 'red', climate: 'Cool-moderate continental', vigor: 'Moderate', ripening: 'Very late', notes: 'Named from "nebbia" (fog) — ripens in autumn fog season. Very late ripening, requires best south-facing sites (sori). Thin-skinned but extremely high tannins and acidity. Calcareous marl soils. Finicky, site-specific.' },
  'Aglianico': { origin: 'Southern Italy (Campania/Basilicata)', synonyms: 'From "Helleniko" (Greek origin)', type: 'red', climate: 'Warm', vigor: 'Moderate-high', ripening: 'Very late', notes: 'Ancient Greek variety. Very late ripening, high tannins and acidity. Volcanic soils of Campania and Basilicata. Taurasi DOCG and Aglianico del Vulture DOC: benchmarks. Requires extended aging.' },
  'Primitivo': { origin: 'Croatia originally; established in Puglia, Italy', synonyms: 'Zinfandel (USA), Crljenak Kaštelanski (Croatia)', type: 'red', climate: 'Hot', vigor: 'Moderate', ripening: 'Early ("primitivo"=early ripening)', notes: 'Genetically identical to Zinfandel. Uneven ripening leads to raisined berries alongside fresh ones → high sugar/alcohol. Bush-trained (alberello) in Puglia. Primitivo di Manduria: benchmark.' },
  'Nero d\'Avola': { origin: 'Sicily, Italy', synonyms: 'Calabrese (old name)', type: 'red', climate: 'Hot Mediterranean', vigor: 'Moderate-high', ripening: 'Late', notes: 'Sicily\'s most important native red. Named after the town of Avola. Thick-skinned, heat and drought resistant. Bush-trained (alberello). Modern winemaking has elevated quality dramatically.' },
  'Zinfandel': { origin: 'Croatia (as Crljenak); iconic in California', synonyms: 'Primitivo (Italy), Tribidrag (Croatia)', type: 'red', climate: 'Warm to hot', vigor: 'Moderate', ripening: 'Uneven', notes: 'Uneven ripening is signature challenge — cluster can have raisined and unripe berries. Old vine (100+ year) plantings in Lodi, Sonoma, Paso Robles prized. White Zinfandel (off-dry rosé) is most produced style.' },
  'Malbec': { origin: 'Cahors, SW France', synonyms: 'Côt (Loire), Auxerrois (Cahors)', type: 'red', climate: 'Warm continental', vigor: 'Moderate', ripening: 'Mid', notes: 'Thin-skinned, susceptible to frost and mildew in France. Found its ideal home in Argentina (Mendoza) at high altitude (900-1,500m). UV intensity concentrates colour and flavour. Argentina: world\'s largest plantings.' },
  'Carménère': { origin: 'Bordeaux, France', synonyms: 'Grande Vidure (old French name)', type: 'red', climate: 'Warm', vigor: 'High', ripening: 'Very late', notes: 'Virtually extinct in Bordeaux after phylloxera. Rediscovered in Chile in 1994 (previously confused with Merlot). Very late ripening, needs warmth. Green/pyrazine character when underripe. Chile\'s signature variety.' },
  'Pinotage': { origin: 'South Africa (1925 crossing)', synonyms: 'None', type: 'red', climate: 'Warm', vigor: 'High', ripening: 'Mid', notes: 'Pinot Noir × Cinsault cross created by Prof. Perold at Stellenbosch. Unique to South Africa. High yields need controlling. Can produce acetone off-flavours if poorly made. Cape Blend: Pinotage-based.' },
  'Gamay': { origin: 'Beaujolais, France', synonyms: 'Gamay Noir à Jus Blanc (full name)', type: 'red', climate: 'Cool to moderate', vigor: 'High', ripening: 'Early', notes: 'Banned from Burgundy in 1395 by Duke Philip the Bold. Thrives on granite soils of Beaujolais. Often processed by carbonic maceration for fruity nouveau style. Cru Beaujolais: more serious, terroir-driven.' },
  'Xinomavro': { origin: 'Macedonia, Northern Greece', synonyms: 'Name means "acid-black"', type: 'red', climate: 'Cool continental', vigor: 'Moderate', ripening: 'Late', notes: 'High-altitude vineyards (200-700m) in Naoussa. Often compared to Nebbiolo for its high acid, high tannin, pale colour, and age-worthiness. Needs extended aging to soften.' },
  'Agiorgitiko': { origin: 'Nemea, Peloponnese, Greece', synonyms: 'St George (translation)', type: 'red', climate: 'Warm Mediterranean', vigor: 'Moderate-high', ripening: 'Mid', notes: 'Most widely planted Greek red. Versatile: rosé to sweet red to serious age-worthy reds. Nemea PDO: vineyards from 250-800m altitude (higher = more acidity and elegance). Deep colour, generous fruit.' },
  'Touriga Nacional': { origin: 'Dão, Portugal', synonyms: 'Touriga', type: 'red', climate: 'Warm continental', vigor: 'Low', ripening: 'Mid', notes: 'Small berries, thick skins, low yields — extremely concentrated. Portugal\'s finest native variety. Essential in premium Port blends. Increasingly used for quality Douro and Dão table wines. Deeply coloured, floral, structured.' },
  'Baga': { origin: 'Bairrada, Portugal', synonyms: 'None widely used', type: 'red', climate: 'Cool maritime', vigor: 'Moderate', ripening: 'Late', notes: 'Extremely thick-skinned with very high tannins. Traditional foot-treading in lagares extracts colour and tannin. Clay soils of Bairrada. Modern producers use gentler extraction. Challenging but rewarding when well made.' },
  'Tannat': { origin: 'Basque Country / SW France', synonyms: 'Harriague (Uruguay)', type: 'red', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Late', notes: 'Among the world\'s most tannic varieties. Madiran birthplace invented micro-oxygenation to soften the wine. Uruguay: national grape, more approachable style. High polyphenol content (health claims).' },
  'Pinot Meunier': { origin: 'Champagne, France', synonyms: 'Meunier, Schwarzriesling (Germany)', type: 'red', climate: 'Cool', vigor: 'Moderate', ripening: 'Early-mid', notes: 'More frost-resistant than Pinot Noir (buds later). "Meunier" means miller (white downy underside of leaves resembles flour). Adds fruitiness and roundness to Champagne blends. Marne Valley: dominant variety.' },
  'Cinsault': { origin: 'Southern France', synonyms: 'Cinsaut (alternative spelling)', type: 'red', climate: 'Hot', vigor: 'High', ripening: 'Late', notes: 'Large berries, thin skins → light colour, low tannins. Drought resistant, heat-loving. Parent of Pinotage (with Pinot Noir). Important for rosé in Provence. Blending variety in southern Rhône and Languedoc.' },
  'Carignan': { origin: 'Cariñena, Aragon, Spain', synonyms: 'Cariñena/Mazuelo (Spain), Carignano (Italy)', type: 'red', climate: 'Hot', vigor: 'High', ripening: 'Very late', notes: 'Once most planted variety in France (Languedoc). High yields unless old vine. Old bush vines produce concentrated, complex wines. Late ripening, susceptible to powdery mildew. Priorat: excellent quality.' },
  'Grenache Blanc': { origin: 'Spain/Southern France', synonyms: 'Garnacha Blanca (Spain)', type: 'white', climate: 'Warm to hot', vigor: 'High', ripening: 'Mid', notes: 'White mutation of Grenache Noir. Low acidity, full body, prone to oxidation — needs careful handling. Important in Châteauneuf-du-Pape blanc, Côtes du Rhône blanc blends.' },
  'Vermentino': { origin: 'Liguria, Italy / Sardinia', synonyms: 'Rolle (Provence, France)', type: 'white', climate: 'Warm maritime', vigor: 'Moderate', ripening: 'Late', notes: 'Coastal Mediterranean variety. Thick skin resists maritime conditions. Important in Provence (as Rolle), Sardinia (Vermentino di Gallura DOCG), and Ligurian coast. Aromatic, mineral, fresh.' },
  'Furmint': { origin: 'Hungary (Tokaj)', synonyms: 'Šipon (Slovenia)', type: 'white', climate: 'Cool continental', vigor: 'Moderate', ripening: 'Late', notes: 'Principal grape of Tokaj Aszú (world\'s great sweet wine). Thin skin, susceptible to botrytis. Late ripening, high acidity retained. Volcanic soils of Tokaj. Dry Furmint wines gaining recognition.' },
  'Sémillon': { origin: 'Bordeaux, France', synonyms: 'Semillon (without accent)', type: 'white', climate: 'Moderate to warm', vigor: 'Moderate', ripening: 'Early', notes: 'Thin-skinned, highly susceptible to botrytis → essential for Sauternes sweet wines. When healthy: waxy, full-bodied dry whites. Hunter Valley (Australia): extraordinary age-worthy unoaked style.' },
  'Semillon': { origin: 'Same as Sémillon — Australian spelling', synonyms: 'Sémillon (French spelling)', type: 'white', climate: 'Warm', vigor: 'Moderate', ripening: 'Early', notes: 'In Hunter Valley: picked early at low sugar for a lean, neutral style that transforms with 10-15 years bottle age into toasty, honeyed complexity — entirely without oak. Unique Australian tradition.' },
  'Muscadelle': { origin: 'Bordeaux, France', synonyms: 'Tokay (old Australian name)', type: 'white', climate: 'Moderate', vigor: 'Moderate', ripening: 'Early', notes: 'NOT related to Muscat despite aromatic similarity. Minor Bordeaux blending component (typically 5-10% of Sauternes blend). Adds floral perfume. Very susceptible to disease — declining plantings.' },
  'Aligoté': { origin: 'Burgundy, France', synonyms: 'None widely used', type: 'white', climate: 'Cool', vigor: 'High', ripening: 'Early', notes: 'Burgundy\'s secondary white after Chardonnay. Bouzeron AC: its only village-level appellation. Often planted on less favourable sites. Base for Kir (with crème de cassis). Brisk, refreshing.' },
  'Melon de Bourgogne (Muscadet)': { origin: 'Burgundy originally; now Loire Valley', synonyms: 'Muscadet (regional name), Melon', type: 'white', climate: 'Cool maritime', vigor: 'Moderate', ripening: 'Early', notes: 'Frost-resistant, which is why it survived in the Loire after the devastating 1709 winter. Neutral variety that gains character through sur lie aging. Atlantic-influenced terroir adds salinity.' },
  'Corvina': { origin: 'Veneto, Italy', synonyms: 'Corvina Veronese', type: 'red', climate: 'Cool to moderate continental', vigor: 'High', ripening: 'Late', notes: 'Backbone of Valpolicella, Ripasso, and Amarone. Thick skin dries well (appassimento technique). Grows on hillside pergola systems. Contributes cherry character and almond notes to Amarone.' },
  'Rondinella': { origin: 'Veneto, Italy', synonyms: 'None', type: 'red', climate: 'Moderate continental', vigor: 'Moderate', ripening: 'Late', notes: 'Minor blending variety in Valpolicella/Amarone. Reliable yields, good disease resistance. Dries well for appassimento. Adds colour and body to Corvina-based blends.' },
  'Molinara': { origin: 'Veneto, Italy', synonyms: 'None', type: 'red', climate: 'Moderate continental', vigor: 'Moderate', ripening: 'Late', notes: 'Declining in Valpolicella blends. Thin-skinned, light colour. Name from "mulino" (mill) — dusty bloom on berries. Being replaced by Oseleta and Corvinone in modern blends.' },
  'Garganega': { origin: 'Veneto, Italy', synonyms: 'Grecanico Dorato (Sicily)', type: 'white', climate: 'Moderate continental', vigor: 'High', ripening: 'Late', notes: 'Soave\'s principal variety. Late ripening, vigorous. Best on volcanic hillside soils of Soave Classico. Can develop botrytis for sweet Recioto di Soave. Almond character is distinctive.' },
  'Trebbiano di Soave': { origin: 'Veneto, Italy', synonyms: 'Verdicchio (Marche) — genetically identical', type: 'white', climate: 'Moderate', vigor: 'High', ripening: 'Late', notes: 'Distinct from Trebbiano Toscano. Genetically same as Verdicchio. Higher quality than the more common Trebbiano varieties. Good acidity, mineral character.' },
  'Glera': { origin: 'Veneto/Friuli, Italy', synonyms: 'Formerly called Prosecco (grape renamed 2009)', type: 'white', climate: 'Moderate', vigor: 'High', ripening: 'Late', notes: 'Renamed from "Prosecco" to "Glera" in 2009 to protect the Prosecco geographic designation. High yields. Charmat method preserves freshness and floral aromatics. Steep hillsides of Conegliano Valdobbiadene.' },
  'Sangiovese Grosso (Brunello)': { origin: 'Montalcino, Tuscany, Italy', synonyms: 'Brunello', type: 'red', climate: 'Warm continental', vigor: 'Moderate', ripening: 'Late', notes: 'Larger-berried clone of Sangiovese. 100% used for Brunello di Montalcino DOCG. South/SW facing slopes at 150-500m. Galestro (flakey marl) and clay soils. Among Italy\'s finest and most age-worthy wines.' },
  'Cortese': { origin: 'Piemonte, Italy', synonyms: 'None widely used', type: 'white', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Mid', notes: 'Principal variety of Gavi DOCG. Light, clean, neutral. Best on calcareous clay soils. Gavi di Gavi (commune of Gavi): finest expressions. Important seafood wine in Piemonte.' },
  'Spätburgunder': { origin: 'Same as Pinot Noir — German name', synonyms: 'Pinot Noir (France), Blauburgunder (Austria)', type: 'red', climate: 'Cool', vigor: 'Moderate', ripening: 'Early', notes: 'German Pinot Noir. Ahr Valley: warmest site in Germany. Baden: most Burgundian style. Pfalz: emerging region. Quality has dramatically improved since 2000s. Often lighter than French Pinot.' },
  'Grauburgunder': { origin: 'Same as Pinot Gris — German name', synonyms: 'Pinot Gris (France), Pinot Grigio (Italy), Ruländer (sweeter style)', type: 'white', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Early-mid', notes: 'When labelled Grauburgunder: dry, modern style. When labelled Ruländer: traditional, sweeter style. Baden: benchmark. Fuller-bodied than Italian Pinot Grigio.' },
  'Silvaner': { origin: 'Austria (possibly Transylvania)', synonyms: 'Sylvaner (Alsace)', type: 'white', climate: 'Cool continental', vigor: 'Moderate', ripening: 'Early', notes: 'Franken: principal variety, served in distinctive Bocksbeutel flagon. Earthy, herbal, mineral character. Alsace Sylvaner: lighter, simpler. Declining plantings globally but treasured in Franken.' },
  'Welschriesling': { origin: 'Central Europe (NOT related to Riesling)', synonyms: 'Olasz Rizling (Hungary), Laški Rizling (Slovenia)', type: 'white', climate: 'Cool to moderate', vigor: 'Moderate-high', ripening: 'Late', notes: 'Confusingly named — no relation to Riesling. Widely planted in Austria, Hungary, Slovenia. Everyday dry wine + excellent Eiswein and TBA sweet wines in Burgenland. Neutral aromatic profile.' },
  'Zweigelt': { origin: 'Austria (1922 crossing by Dr. Zweigelt)', synonyms: 'Rotburger (old name)', type: 'red', climate: 'Cool to moderate', vigor: 'High', ripening: 'Mid', notes: 'Austria\'s most planted red. Blaufränkisch × St Laurent cross. Named controversially after its creator. Versatile: light fruity to serious oak-aged. Reliable, winter-hardy, generous yields.' },
  'Blaufränkisch': { origin: 'Austria / Central Europe', synonyms: 'Lemberger (Germany/USA), Kékfrankos (Hungary), Frankovka', type: 'red', climate: 'Cool to moderate', vigor: 'Moderate', ripening: 'Late', notes: 'Burgenland: Austria\'s finest reds (especially Mittelburgenland). Late ripening needs warm sites. Deep colour, firm tannins, spicy. Increasingly compared to Syrah. Iron-rich soils in Burgenland.' },
  'Nerello Mascalese': { origin: 'Mt Etna, Sicily, Italy', synonyms: 'None widely used', type: 'red', climate: 'Cool volcanic (altitude)', vigor: 'Moderate', ripening: 'Late', notes: 'Grown on volcanic slopes of Mt Etna (400-1000m+). Old bush vines (alberello) on black lava and ash soils. Phylloxera-free (volcanic soils). Compared to Pinot Noir for elegance. Rapidly rising reputation.' },
  'Carricante': { origin: 'Mt Etna, Sicily, Italy', synonyms: 'None widely used', type: 'white', climate: 'Cool volcanic (altitude)', vigor: 'Moderate', ripening: 'Late', notes: 'Etna\'s principal white grape. Altitude (600-900m) and volcanic terroir give mineral, saline character. Etna Bianco Superiore: Milo commune, east-facing slopes. Gaining international recognition.' },
  'Sagrantino': { origin: 'Montefalco, Umbria, Italy', synonyms: 'None', type: 'red', climate: 'Warm continental', vigor: 'Moderate', ripening: 'Late', notes: 'Among the world\'s highest tannin varieties. Tiny production zone centred on Montefalco. Originally used for Passito (dried grape sweet wine). DOCG requires minimum 37 months aging. Extremely concentrated.' },
  'Palomino Fino': { origin: 'Jerez, Andalusia, Spain', synonyms: 'Listán Blanco (Canary Islands)', type: 'white', climate: 'Hot', vigor: 'High', ripening: 'Early', notes: 'Neutral on its own — transformed by flor yeast aging (biological) into Fino/Manzanilla or oxidative aging into Oloroso. Albariza (white chalk) soils of Jerez are essential. Solera system for aging.' },
  'Pedro Ximénez': { origin: 'Montilla-Moriles / Jerez, Spain', synonyms: 'PX', type: 'white', climate: 'Very hot', vigor: 'Moderate', ripening: 'Early', notes: 'Sun-dried on esparto grass mats (soleo) to concentrate sugars to extreme levels (400+ g/L RS). Creates the world\'s sweetest wines. Also used to sweeten Cream Sherry blends.' },
  'Moscatel': { origin: 'Mediterranean', synonyms: 'Muscat of Alexandria, Moscatel de Alejandría, Zibibbo (Sicily)', type: 'white', climate: 'Hot', vigor: 'High', ripening: 'Late', notes: 'Larger-berried, less fine than Muscat Blanc à Petits Grains. Used for sweet fortified wines in Málaga, Setúbal, and Pantelleria (as Zibibbo). Also used for table grapes and raisins.' },
  'Cariñena': { origin: 'Aragon, Spain', synonyms: 'Carignan (France), Carignano (Italy), Mazuelo (Rioja)', type: 'red', climate: 'Hot', vigor: 'High', ripening: 'Very late', notes: 'Named after the town of Cariñena in Aragon. Same variety as French Carignan. Old bush vines on slate soils (Priorat) produce exceptional quality. Key component in GSM+ blends.' },
  'Muscat de Frontignan': { origin: 'Languedoc, France', synonyms: 'Same grape as Muscat Blanc à Petits Grains', type: 'white', climate: 'Hot Mediterranean', vigor: 'Moderate', ripening: 'Early-mid', notes: 'Frontignan is the appellation, not a separate grape. Vin Doux Naturel (VDN): fortified during fermentation. Also made in Beaumes-de-Venise, Rivesaltes. Intensely aromatic sweet wine.' },
  'Petit Verdot': { origin: 'Bordeaux, France', synonyms: 'None widely used', type: 'red', climate: 'Warm', vigor: 'Moderate', ripening: 'Very late', notes: 'Latest ripening Bordeaux variety — often fails to fully ripen. Used in small proportions (2-5%) for colour, tannin and violet perfume. New World (Australia, California): can ripen fully, sometimes varietal.' }
};

function showGrapeNote(btn) {
  const panel = btn.nextElementSibling; // always the grape-note-panel div
  const isOpen = btn.classList.contains('active');
  btn.closest('.popup-inner').querySelectorAll('.grape-tag-btn.active').forEach(b => b.classList.remove('active'));
  btn.closest('.popup-inner').querySelectorAll('.grape-note-panel.visible').forEach(p => p.classList.remove('visible'));
  if (!isOpen) {
    btn.classList.add('active');
    panel.classList.add('visible');
  }
}

  'Loire Valley — Muscadet (Nantais)': 'Light, crisp, briny whites from Melon de Bourgogne. Sur lie aging adds texture and subtle yeasty complexity. Low alcohol (~12%). Classic pairing with oysters and seafood.',
  'Northern Rhône (Côte Rôtie, Hermitage, Condrieu)': 'Single-varietal Syrah reds: full body, black pepper, violets, smoked meat, great aging. Côte Rôtie: most elegant. Hermitage: most powerful. Condrieu: rare, opulent dry Viognier — peach, apricot, floral.',
  'Southern Rhône (Châteauneuf-du-Pape, Côtes du Rhône)': 'GSM blends (Grenache-dominant): rich, full-bodied, high alcohol (14–16%), ripe red fruit and garrigue. Châteauneuf-du-Pape: complex, age-worthy. Tavel: full-bodied dry rosé. Muscat de Beaumes-de-Venise: sweet fortified.',
  'Languedoc-Roussillon': 'Full-bodied GSM reds from garrigue landscapes. Old-vine Carignan on schist: mineral and structured. Banyuls/Maury: excellent fortified Grenache — chocolate and dried fruit. Pays d\'Oc IGP: France\'s largest varietal wine zone.',
  'Provence': 'World benchmark pale, dry rosé: delicate salmon-pink, fresh strawberry, citrus, low tannin. Bandol: structured, tannic Mourvèdre reds — powerful, age 5–15+ years. Cassis: notable dry whites. Rosé is the flagship.',
  // Germany
  'Mosel': 'Lightest, most delicate German Riesling. Lowest alcohol, highest acidity, floral, green apple, citrus, distinctive slate mineral. Spätlese: stone fruit, honeyed. Botrytised BA/TBA: luscious, ages decades. Exceptional elegance and finesse.',
  'Nahe': 'Intermediate style between Mosel and Rheingau: mineral complexity from volcanic and slate soils. Riesling ranges from light and floral to fuller and peachy. Less well-known and excellent value.',
  'Rheingau': 'Fuller, drier Riesling than Mosel — peachy, rounder, powerful. Historic home of classic dry German Riesling. Assmannshausen: quality Spätburgunder. Hochheim gave English the word \'Hock\' for German wine.',
  'Rheinhessen': 'Fullest-bodied German Riesling from Rheinterrasse slopes (Nierstein). Large volumes of easy-drinking Müller-Thurgau. Liebfrauenmilch originated here. Best single-vineyard Rieslings are excellent.',
  'Pfalz': 'Warmer than Mosel — richer, spicier Riesling. Important for Pinot family: Grauburgunder (full, smoky), Weißburgunder (crisp), Spätburgunder (Burgundian-style reds). Versatile, food-friendly styles.',
  'Baden': 'Germany\'s warmest region. Fullest-bodied Spätburgunder (Pinot Noir), often Burgundian in character. Kaiserstuhl volcanic soil: excellent Grauburgunder. Wines generally fuller and riper than other German regions.',
  'Franken': 'Silvaner is the star — dry, earthy, herbal, good acidity, distinctive character. Predominantly dry styles. Bottled in the distinctive flat Bocksbeutel flagon. Stein vineyard in Würzburg is most celebrated.',
  // Austria
  'Wachau / Kremstal / Kamptal (Niederösterreich)': 'Grüner Veltliner: high acid, white pepper, citrus, stone fruit — from light Steinfeder to powerful Smaragd. Riesling: intense minerality and citrus. Predominantly dry, age-worthy whites from steep terraced vineyards.',
  'Burgenland': 'Two worlds: Neusiedlersee — famous BA/TBA/Ausbruch sweet whites from lake-humidity botrytis. Mittelburgenland: powerful, spicy Blaufränkisch reds. Neusiedlersee also produces soft, fruity Zweigelt.',
  // Hungary
  'Tokaj': 'World\'s most historic noble rot wine. Tokaji Aszú: Furmint-based — honey, dried apricot, nut, extraordinary longevity. Dry Furmint: steely, high acid. Eszencia: ultra-rare, almost pure botrytised juice.',
  // Greece
  'Naoussa PDO': 'Xinomavro reds — Greece\'s Barolo. High acid, high tannin, complex: red tomato, dried herbs, leather. Demanding when young but remarkable aging potential. Dry red only. Food wine par excellence.',
  'Nemea PDO': 'Agiorgitiko reds: deep ruby, velvety tannin, ripe plum and cherry, sometimes spiced with oak. More approachable than Xinomavro. Ranges from everyday to powerful Reserve wines.',
  'Santorini PDO': 'Assyrtiko from volcanic ash soils — bone-dry, laser-sharp acidity, citrus, saline, volcanic mineral. One of the world\'s most distinctive whites. Vinsanto: sweet dried-grape wine, extraordinary concentration.',
  // Italy
  'Alto Adige DOC': 'Alpine character — crisp, aromatic whites (Pinot Grigio, Gewurztraminer, Riesling) with cool altitude freshness. Some elegant Pinot Nero and Lagrein reds. Very distinctive, high-quality, Tyrolean identity.',
  'Trentino DOC': 'Alpine freshness. Local red varieties: Marzemino (soft, fragrant) and Teroldego (dark, structured). Good everyday whites and sparkling. Less prestigious than Alto Adige but approachable and reliable.',
  'Friuli-Venezia Giulia': 'Italy\'s benchmark dry white wine region. Crisp, aromatic: Pinot Grigio, Friulano, Ribolla Gialla. Collio and Colli Orientali: finest crus. Some orange wine tradition from skin-contact whites.',
  'Veneto': 'Soave: delicate crisp white (Garganega). Valpolicella: light Corvina; Ripasso: richer, velvety; Amarone: powerful dried-grape, 15–17%, very age-worthy. Prosecco DOC/DOCG: fresh, frothy sparkling. Very diverse.',
  'Piemonte': 'Italy\'s most prestigious red region. Barolo and Barbaresco: 100% Nebbiolo — full body, very high acid and tannin, tar and roses, age 10–30+ years. Barbera: everyday fruity reds. Moscato d\'Asti: sweet, low-alcohol sparkling.',
  'Tuscany': 'Sangiovese-dominated. Chianti Classico: medium body, cherry, herbal, food-wine. Brunello di Montalcino: powerful, structured, age 20+ years. Super Tuscans: Cab Sauv/Merlot/Sangiovese blends. Vernaccia: dry white.',
  'Umbria': 'Sagrantino di Montefalco: exceptionally tannic, very full body, blackberry, dark chocolate, needs 10+ years. Orvieto Classico: crisp, dry white from Grechetto/Trebbiano. Small but distinctive appellation.',
  'Marche': 'Verdicchio: crisp, high acid, almond finish — the signature white (Castelli di Jesi, Matelica). Rosso Conero and Rosso Piceno: Montepulciano-based medium-full reds. Clean, honest, food-friendly wines.',
  'Abruzzo': 'Montepulciano d\'Abruzzo: full-bodied red, deep color, soft tannin, plum and spice — excellent value. Cerasuolo d\'Abruzzo: serious dry rosé. Trebbiano: fresh whites. High-volume, reliable everyday wine.',
  'Campania': 'Greco di Tufo: structured, mineral white. Fiano di Avellino: aromatic, complex, honey and herb. Taurasi (Aglianico): full body, very high tannin, dark fruit — \'Barolo of the South\', needs 10+ years.',
  'Puglia': 'Primitivo (= Zinfandel): high alcohol (14–17%), full body, dark berry, ripe and jammy. Negroamaro: earthy, rustic dark fruit. Important rosé production (Rosato). Generous, warm-climate Southern Italian style.',
  'Sicily': 'Nero d\'Avola: full body, dark cherry, chocolate, warm spice. Mt Etna (Nerello Mascalese): elegant, high acid, mineral at 600–1000m — \'Burgundy of the South\'. Passito di Pantelleria: intensely sweet Zibibbo. Rapidly improving quality.',
  'Lazio': 'Frascati and Est! Est!! Est!!!: crisp, neutral dry whites for easy drinking. Cesanese: soft, approachable local red. Rome\'s regional table wines — not world-class but reliable everyday drinking.',
  // Spain
  'Rioja': 'Spain\'s most classic red. Tempranillo-dominated blends: Crianza, Reserva, Gran Reserva hierarchy. Traditional: American oak, vanilla-coconut. Modern: French oak, fresher fruit. White Rioja (Viura): often barrel-fermented.',
  'Navarra': 'Garnacha reds and rosés (clarete style). Improving Tempranillo and international varieties. Rosado: serious, structured, dry rosé. Diverse range from entry-level to premium.',
  'Cariñena & Calatayud': 'High-altitude Aragón (600–900m). Old Garnacha vines: rich, concentrated, spicy. Old-vine Carignan: complex, mineral, tannic. Limestone soils. Traditional and improving quality.',
  'Penedès & Priorat (Catalunya)': 'Cava DOC (Penedès): traditional method sparkling from Macabeo/Xarel·lo/Parellada — fresh, yeasty, excellent value. Priorat DOCQ: old-vine Garnacha/Cariñena on slate (llicorella) — powerful, mineral, very age-worthy.',
  'Ribera del Duero': 'Tempranillo (Tinto Fino) reds at 700–900m altitude. Full body, dark fruit, firm structure, high acid. Top wines (Vega Sicilia, Pingus) rival Bordeaux in longevity and prestige.',
  'Rías Baixas': 'Albariño: Spain\'s benchmark aromatic white. Peachy, citrus, floral, naturally high acidity, light spritz, saline. Val do Salnés: most classical sub-zone. Perfect pairing with Galician seafood.',
  'Bierzo': 'Mencía: medium body, fresh red fruit, mineral slate character — often compared to Pinot Noir. Old vines on steep slate slopes. Palacios family elevated the region\'s reputation internationally.',
  'Valencia & Levante': 'Bobal and Garnacha reds: warm, full-bodied, high alcohol. Moscatel de Valencia: sweet fortified Muscat. Utiel-Requena (Bobal): improving quality especially for rosé. Accessible, food-friendly wines.',
  'La Mancha & Castilla-La Mancha': 'Spain\'s largest wine region. Airén: neutral dry whites. Tempranillo reds: improving, excellent value. Hot continental plateau (700m altitude). Historically high-volume; increasingly quality-focused.',
  // Portugal
  'Vinho Verde': 'Light, fresh whites; high acid, natural spritz, 8–11.5% ABV. Loureiro/Arinto/Trajadura blends for everyday drinking. Premium Alvarinho from Monção e Melgaço: richer, fuller, no spritz (12.5–14%). "Verde" means youth, not colour.',
  'Douro Valley': 'Port: fortified wine in Tawny (barrel-aged, nutty-oxidative) and Ruby/Vintage (fruity, bottle-aged) styles. Douro DOC dry table wines: powerful, full-bodied red blends of Touriga Nacional and other indigenous varieties. Increasingly acclaimed.',
  'Dão': 'Elegant, restrained reds from Touriga Nacional and Tinta Roriz on granite soils: fresh acidity, firm tannin, medium body — often called \'the Burgundy of Portugal\'. Encruzado: benchmark dry white, creamy and textured.',
  'Bairrada': 'Baga-based reds: very high tannin, deep color, high acid — demanding but age-worthy (10–20+ years). Bairrada Espumante: traditional method sparkling, one of Portugal\'s best. Bical and Arinto for structured whites.',
  'Alentejo': 'Warm, powerful, full-bodied reds from Aragonez, Alicante Bouschet, Trincadeira: ripe dark fruit, spice, often oak-aged. Rich, generous style. Increasingly important for premium Portuguese reds.',
  'Lisboa': 'Diverse wines from multiple sub-regions. Colares (Ramisco on sand): extremely tannic, very rare. Setúbal: sweet fortified Moscatel. Generally fresh, fruit-forward reds and crisp whites for everyday.',
  // USA
  'Napa Valley': 'California Current drives coastal fog up the San Pablo Bay into Carneros, moderating the valley. Cabernet Sauvignon: full body, ripe black fruit, supple polished tannin — powerful yet refined. Cult wines among the world\'s most expensive. Age-worthy 10–25+ years.',
  'Sonoma County': 'California Current and Pacific fog are central: Russian River Valley fog tunnel creates cool-climate Pinot Noir and Chardonnay (elegant, Burgundian). Dry Creek Valley sheltered from ocean: jammy Zinfandel. Sonoma Coast directly ocean-exposed: very cool Pinot Noir.',
  'Central Coast (Paso Robles, Santa Barbara)': 'California Current and marine layer are critical. Santa Barbara\'s transverse valleys channel cold Pacific air inland → elegant Pinot Noir and Chardonnay. Paso Robles more inland and warm: full-bodied Rhône varieties (Syrah, Grenache) and Cabernet.',
  'Central Valley': 'Isolated from California Current by Coast Ranges — hot, irrigated, high-volume production. Ripe, full-bodied Zinfandel, Cabernet, Chardonnay. White Zinfandel rosé largely from here. Bulk wine for blending. Lodi (near delta) slightly cooler.',
  'New York State': 'Finger Lakes: America\'s finest Riesling — bone-dry to botrytis, high acid, cool-climate precision. Deep glacial lakes moderate frost risk. Long Island: maritime Bordeaux-style blends (Merlot, Cab Franc). Hudson Valley: America\'s oldest wine region. Dr. Konstantin Frank pioneered vinifera varieties.',
  'Willamette Valley (Oregon)': 'Oregon\'s benchmark cool-climate Pinot Noir: earthy, red fruit, high acid, elegant — Burgundian character. Pinot Gris: structured, textured. Dijon clones planted since 1980s. Internationally acclaimed.',
  'Columbia Valley & Walla Walla (Washington)': 'Washington\'s flagship appellation. Cabernet Sauvignon and Merlot: ripe fruit, firm tannin, high natural acidity due to cool nights. Walla Walla: premium sub-appellation. Riesling and Syrah also notable.',
  // Canada
  'Niagara Peninsula (Canada)': 'Icewine: world-famous, naturally frozen Riesling and Vidal — intensely sweet, concentrated, beautifully balanced. Table wines: Riesling, Chardonnay, Pinot Noir in cool continental conditions. Unique lake-moderated microclimate.',
  'Okanagan Valley (Canada)': 'BC\'s showcase region. Diverse: Riesling and Pinot Gris in north (cooler), Merlot and Cabernet in south (warmer). Icewine production. High quality relative to volume. Growing international reputation.',
  // Chile
  'Elqui & Limarí Valleys (Coquimbo)': 'Cool-climate coastal influence — Pacific fog brings acidity. Chardonnay and Syrah with fresh, mineral character. Limarí limestone soils give Chardonnay elegance. Chile\'s premium cool-climate appellations.',
  'Aconcagua Valley': 'Divided: Aconcagua Alto (mountain): cool-climate Cabernet and Carménère. Casablanca and San Antonio valleys: Pacific influence, elegant Sauvignon Blanc, Pinot Noir, Chardonnay.',
  'Maipo & Cachapoal (Central Valley)': 'Maipo: Chile\'s most historic appellation — Cabernet Sauvignon, full body, blackcurrant, herbal minty notes. Home of Concha y Toro. Cachapoal: Carménère and Merlot, slightly warmer.',
  'Colchagua Valley (Central Valley)': 'Merlot, Carménère, Cabernet Sauvignon: riper and more powerful than Maipo. Full body, dark fruit, spice. Chile\'s premier red wine valley. Lapostolle benchmark producer.',
  'Curicó & Maule Valleys': 'Large-volume production. Maule dry-farmed: old-vine País and Cinsault from granite soils — heritage varieties now sought-after. Carménère, Cabernet, increasingly artisan wine movement.',
  'Southern Chile (Itata, Bío-Bío, Malleco)': 'Cool-climate frontier. Old-vine País and Muscat on granite: fresh, light, low-alcohol. Emerging Riesling and Pinot Noir. Pioneer craft wine movement. Chile\'s most exciting new wave region.',
  // Argentina
  'Cafayate / Salta': 'World\'s highest commercial vineyards (1,700–3,100m). Torrontés Riojano: floral, aromatic, peachy — Argentina\'s signature white. High-altitude Malbec: intensely concentrated yet elegant. Extraordinary diurnal range.',
  'Mendoza (Luján de Cuyo, Maipú, Uco Valley)': 'Argentina\'s wine heartland. Malbec: deep purple, velvety tannin, plum, dark cherry, violets — benchmark New World Malbec. Uco Valley: high-altitude elegance. Cabernet Sauvignon and Cabernet Franc also excellent.',
  'Patagonia (Río Negro & Neuquén)': 'Cool-climate frontier. Long growing season, intense diurnal range. Malbec: leaner, more elegant than Mendoza. Pinot Noir and Chardonnay gaining reputation. Sparkling wine potential.',
  // South Africa
  'Stellenbosch': 'SA\'s most prestigious red appellation. Cabernet Sauvignon, Merlot, Pinotage: full-bodied, ripe, with cooling ocean influence. Cape Blends include Pinotage. Mountain slopes give elegance and structure.',
  'Paarl': 'Diverse region. Shiraz: full-bodied, dark fruit, spicy. Chenin Blanc: from dry and light to rich and oaked. Less fashionable than Stellenbosch but excellent value. Fairview and KWV prominent.',
  'Constantia': 'SA\'s oldest wine estate. Vin de Constance: world-famous sweet Muscat, one of history\'s great wines. Modern Sauvignon Blanc: cool, elegant, herbal. Maritime cooling from Table Bay for premium dry whites.',
  'Swartland': 'New-wave artisan, minimal-intervention wine movement. Old-vine Grenache, Cinsault, Carignan on schist and granite: Rhône-style reds. Chenin Blanc: textured, complex. SA\'s natural wine pioneer region.',
  'Walker Bay & Elgin': 'SA\'s coolest appellations — Pacific Ocean influence. Hemel-en-Aarde Valley (Walker Bay): benchmark Pinot Noir and Chardonnay, Burgundian character. Elgin: Sauvignon Blanc, Riesling, elegant Pinot Noir.',
  // Australia
  'Barossa Valley': 'Australia\'s most famous red region. Shiraz: full body, deep color, dark berry, chocolate, leather — powerful and concentrated. Old-vine Shiraz (100+ year old vines): world-class. Also Grenache, Mourvèdre, and fortified wines.',
  'Eden Valley': 'High-altitude (400–500m above Barossa). Elegant Riesling: lime, citrus, floral, then petrol and toast with age. Cooler, more restrained Shiraz than valley floor. Excellent value for quality Riesling.',
  'Clare Valley': 'Australia\'s benchmark dry Riesling. Lime cordial, citrus, mineral — develops petrol and toast with age. Medium body, crisp, long-lived under screwcap. Shaw + Smith and Grosset benchmark producers.',
  'Adelaide Hills': 'Cool climate (400–700m altitude). Sauvignon Blanc: crisp, grassy, elderflower. Chardonnay: elegant, fresh. Pinot Noir: light, earthy. Sparkling wine production. Artisan producers with fine-wine focus.',
  'McLaren Vale': 'Shiraz: richer and more chocolatey than Barossa, with olive and herb savory notes from maritime influence. Old-vine Grenache: plush and complex. Close to the sea — cooler, more textured wines.',
  'Coonawarra': 'Terra Rossa (red soil over limestone): famous for structured Cabernet Sauvignon — blackcurrant, mint, eucalyptus, long-lived (15–20+ years). Cool maritime influence from Southern Ocean. Some Shiraz and Merlot.',
  'Yarra Valley': 'Victoria\'s premier cool-climate region. Pinot Noir: earthy, red fruit, medium body. Chardonnay: complex, mineral. Some elegant Shiraz and Pinot Gris. Increasingly Burgundian in aspiration and quality.',
  'Mornington Peninsula': 'Cool maritime. Pinot Noir: silky, red fruit, elegant — Burgundian character. Chardonnay: crisp, fine. Small-producer premium region with limited production. Similar style to Yarra Valley.',
  'Hunter Valley': 'Hot, humid NSW. Semillon: world-unique style — low alcohol (10–11%), bone dry, high acid, develops remarkable honeyed toasty complexity after 5–20 years in bottle. Shiraz: earthy, leathery, medium body.',
  'Margaret River': 'Australia\'s most \'Bordelais\' region. Cabernet Sauvignon: blackcurrant, herbal, firm tannin — blended with Merlot for elegance and balance. Chardonnay: full but elegant, stone fruit and oak.',
  // New Zealand
  'Auckland & Northland': 'NZ\'s wine origin. Waiheke Island specialty: Bordeaux-style reds (Merlot, Cab Franc) in warm, drier conditions. Pinot Gris and Chardonnay. Less fashionable than South Island but quality Bordeaux-style reds.',
  'Hawke\'s Bay': 'NZ\'s premier red wine region. Syrah: elegant, cool-climate black pepper. Bordeaux red blends (Cab/Merlot/Cab Franc) — structured. Gimblett Gravels sub-zone: warmest, fullest reds. Chardonnay excellent.',
  'Gisborne': 'Nicknamed \'Chardonnay Capital\' of NZ. Tropical, ripe, full-bodied Chardonnay. Pinot Gris growing. Organic viticulture prevalent. Easternmost major region — accessible, approachable fruit-forward style.',
  'Wairarapa (Martinborough)': 'Benchmark NZ Pinot Noir: earthy, spicy, complex, medium body. Cool, windy conditions. Small artisan producers with premium quality. Less productive than Marlborough but highly regarded.',
  'Marlborough': 'World\'s benchmark Sauvignon Blanc: tropical passion fruit, gooseberry, cut grass, vibrant acidity. Dominates NZ wine exports. Pinot Noir: lighter, fresh. Méthode traditionnelle sparkling also excellent.',
  'Nelson': 'Organic and biodynamic wine hub of NZ. Chardonnay, Riesling, Pinot Noir: fresh and aromatic, similar to Marlborough but slightly warmer. Smaller, artisanal, often excellent quality.',
  'Canterbury & Waipara': 'Cool continental. Waipara Valley: benchmark NZ Riesling — off-dry, citrus, mineral. Pinot Noir: earthy, structured. Pegasus Bay the flagship producer. Riesling is the unexpected regional star.',
  'Central Otago': 'World\'s southernmost premium wine region. Pinot Noir: powerful, concentrated, dark fruit, spice — unlike any other Pinot Noir. Continental extremes create intensity and complexity. Very fashionable, premium priced.',
};

function createPopup(r) {
  const c = COUNTRIES[r.country];
  return `<div class="popup-inner">
    <div class="popup-header">
      <div class="popup-region">${c.flag} ${r.name}</div>
      <div class="popup-country">${r.country}</div>
    </div>
    ${r.subregions ? `<div class="popup-section">
      <div class="popup-label">Sub-regions / Appellations</div>
      <div class="popup-text">${r.subregions}</div>
    </div>` : ''}
    <div class="popup-section">
      <div class="popup-label">Climate & Terroir</div>
      <div class="popup-text">${r.climate}</div>
    </div>
    <div class="popup-section">
      <div class="popup-label">Key Grape Varieties</div>
      <div>${formatGrapes(r.grapes)}</div>
    </div>
    ${REGION_STYLE_NOTES[r.name] ? `<div class="popup-section">
      <div class="popup-label">Winemaking & Style</div>
      <div class="popup-text" style="font-style:italic;opacity:0.85">${REGION_STYLE_NOTES[r.name]}</div>
      <div style="font-size:0.6rem;opacity:0.55;margin-top:3px">→ Click region for full style notes</div>
    </div>` : ''}
    <div class="popup-footer">WSET L3 Study Notes · Jack Yeu &amp; Wang Haitian</div>
  </div>`;
}

function createSubIcon(color, size = 14) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="9" fill="${color}" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" opacity="0.88"/>
    <circle cx="10" cy="10" r="3.5" fill="rgba(255,255,255,0.9)"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -(size/2 + 6)] });
}

function buildGrapeInfoHtml(g) {
  const info = grapeGeneralInfo[g];
  if (!info) return '';
  let h = '<div class="grape-general-info">';
  h += `<div class="ggi-row"><span class="ggi-label">Origin:</span> ${info.origin}</div>`;
  if (info.synonyms) h += `<div class="ggi-row"><span class="ggi-label">Synonyms:</span> ${info.synonyms}</div>`;
  h += `<div class="ggi-row"><span class="ggi-label">Climate:</span> ${info.climate} · <span class="ggi-label">Vigor:</span> ${info.vigor} · <span class="ggi-label">Ripening:</span> ${info.ripening}</div>`;
  if (info.notes) h += `<div class="ggi-notes">${info.notes}</div>`;
  h += '</div>';
  return h;
}

function formatGrapesClickable(grapes, contextRegion) {
  return grapes.map(g => {
    const wc = getGrapeWineClass(g);
    const hasNote = !!grapeTastingNotes[g];
    if (!hasNote) return `<span class="grape-tag ${wc}">${g}</span>`;
    const wineHints = contextRegion ? getGrapeWineHints(g, contextRegion) : '';
    const infoHtml = buildGrapeInfoHtml(g);
    return `<span class="grape-tag-btn ${wc}" onclick="showGrapeNote(this)">▸ ${g}</span>` +
           `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>` +
           infoHtml +
           `<div class="grape-tasting-header">Tasting Profile</div>${grapeTastingNotes[g]}` +
           (wineHints ? `<div class="grape-note-region">♦ Wines: ${wineHints}</div>` : '') +
           `</div>`;
  }).join('');
}

function createSubPopup(sr) {
  const c = COUNTRIES[sr.country];
  return `<div class="popup-inner">
    <div class="popup-header">
      <div class="popup-region">${c.flag} ${sr.name}</div>
      <div class="popup-country">${sr.country} · <span style="opacity:0.7;font-size:0.72rem">${sr.parentRegion}</span></div>
    </div>
    <div class="popup-section">
      <div class="popup-label">Key Grape Varieties <span style="font-size:0.6rem;color:#888;font-weight:normal;text-transform:none;letter-spacing:0">(click for tasting notes)</span></div>
      <div>${formatGrapesClickable(sr.grapes, sr.parentRegion)}</div>
    </div>
    <div class="popup-section">
      <div class="popup-label">Tasting Notes</div>
      <div class="popup-text">${sr.notes}</div>
    </div>
    <div class="popup-footer">Sub-appellation · WSET L3</div>
  </div>`;
}

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 40,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let color = '#7b2d8b';
    const markers = cluster.getAllChildMarkers();
    // Use color of majority country in cluster
    const countryCounts = {};
    markers.forEach(m => {
      const c = m.options.regionData.country;
      countryCounts[c] = (countryCounts[c] || 0) + 1;
    });
    const topCountry = Object.keys(countryCounts).sort((a,b) => countryCounts[b]-countryCounts[a])[0];
    color = COUNTRIES[topCountry]?.color || '#7b2d8b';
    return L.divIcon({
      html: `<div style="background:${color};color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.82rem;border:2px solid rgba(255,255,255,0.4);box-shadow:0 2px 6px rgba(0,0,0,0.3);">${count}</div>`,
      className: '',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
  }
});

// Build markers
const markerMap = {};
const markers = regions.map(r => {
  const color = getRegionColor(r.name);
  const marker = L.marker([r.lat, r.lng], {
    icon: createIcon(color),
    regionData: r
  });
  marker.bindPopup(createPopup(r), { maxWidth: 340, className: 'wine-popup' });
  marker.bindTooltip(r.name, { permanent: true, direction: 'top', offset: [0, -28], className: 'region-name-label' });
  marker.on('click', () => { highlightListItem(r.name); activateRegion(r.name); showRegionSubappellations(r.name); });
  markerMap[r.name] = marker;
  return marker;
});

clusterGroup.addLayers(markers);
map.addLayer(clusterGroup);

// Region name label visibility — only show at zoom >= 7
let regionLabelsVisible = false;
function updateRegionLabelVisibility() {
  const z = map.getZoom();
  const shouldShow = z >= 7;
  if (shouldShow === regionLabelsVisible) return;
  regionLabelsVisible = shouldShow;
  markers.forEach(m => {
    if (shouldShow) m.openTooltip();
    else m.closeTooltip();
  });
}
map.on('zoomend', updateRegionLabelVisibility);

const polygonMap = {};
let activePolygons = new Set();

function toLatLngs(b) {
  return b.length === 4 && !Array.isArray(b[0])
    ? [[b[0],b[1]],[b[0],b[3]],[b[2],b[3]],[b[2],b[1]]]
    : b;
}
function polyDefaultStyle(color) {
  return { color, weight: 1.5, opacity: 0.45, fillColor: color, fillOpacity: 0.1, dashArray: '5 4' };
}
function polyActiveStyle(color) {
  return { color, weight: 3, opacity: 1, fillColor: color, fillOpacity: 0.3, dashArray: null };
}
function polyGroupStyle(color) {
  return { color, weight: 2, opacity: 0.6, fillColor: color, fillOpacity: 0.07, dashArray: '8 5' };
}
function polyClimateStyle(color) {
  return { color, weight: 1.5, opacity: 0.6, fillColor: color, fillOpacity: 0.25, dashArray: null };
}

function getPolyDefaultStyle(name) {
  if (showClimateOverlay) return polyClimateStyle(getClimateColor(name));
  return polyDefaultStyle(getRegionColor(name));
}

function activateRegion(name) {
  // Deactivate previously active polygons
  activePolygons.forEach(prev => {
    if (polygonMap[prev]) {
      const prevR = regions.find(r => r.name === prev);
      if (prevR) polygonMap[prev].setStyle(getPolyDefaultStyle(prev));
    }
  });
  activePolygons.clear();

  if (!name) return;

  // Highlight the clicked region
  const r = regions.find(r => r.name === name);
  if (r && polygonMap[name]) {
    const color = getRegionColor(name);
    polygonMap[name].setStyle(polyActiveStyle(color));
    polygonMap[name].bringToFront();
    activePolygons.add(name);
  }

  // Also highlight sibling regions in the same WSET L3 group
  const group = REGION_GROUPS[name];
  if (group) {
    regions.forEach(sibling => {
      if (sibling.name !== name && REGION_GROUPS[sibling.name] === group && polygonMap[sibling.name]) {
        const color = getRegionColor(sibling.name);
        polygonMap[sibling.name].setStyle(polyGroupStyle(color));
        activePolygons.add(sibling.name);
      }
    });
    // Update group header active state
    document.querySelectorAll('.group-header').forEach(el => {
      el.classList.toggle('active', el.dataset.group === group);
    });
  }
}

const polygonGroup = L.layerGroup().addTo(map);
regions.forEach(r => {
  const b = regionBounds[r.name];
  if (!b) return;
  const color = getRegionColor(r.name);
  const poly = L.polygon(toLatLngs(b), polyDefaultStyle(color));
  poly.on('click', () => {
    activateRegion(r.name);
    highlightListItem(r.name);
    showRegionSubappellations(r.name);
    clusterGroup.zoomToShowLayer(markerMap[r.name], () => markerMap[r.name]?.openPopup());
    openInfoPanel(r.name);
  });
  polygonMap[r.name] = poly;
  polygonGroup.addLayer(poly);
});

      html: `<div style="background:${color};color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.7rem;border:2px solid rgba(255,255,255,0.4);opacity:0.85;">${count}</div>`,

const allGrapes = [...new Set(regions.flatMap(r => r.grapes))].sort((a,b) => a.localeCompare(b));
let activeGrapes = new Set();

function initGrapeFilter() {
  const input = document.getElementById('grape-search');
  const sugg = document.getElementById('grape-suggestions');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    sugg.innerHTML = '';
    if (!q) { sugg.style.display = 'none'; return; }
    const matches = allGrapes.filter(g => g.toLowerCase().includes(q) && !activeGrapes.has(g));
    if (!matches.length) { sugg.style.display = 'none'; return; }
    sugg.style.display = 'block';
    matches.slice(0, 8).forEach(g => {
      const d = document.createElement('div');
      d.className = 'grape-sug';
      d.textContent = g;
      d.addEventListener('mousedown', e => {
        e.preventDefault();
        activeGrapes.add(g);
        input.value = '';
        sugg.style.display = 'none';
        renderGrapeChips();
        applyFilters();
      });
      sugg.appendChild(d);
    });
  });
  input.addEventListener('blur', () => setTimeout(() => { sugg.style.display = 'none'; }, 150));
}

function renderGrapeChips() {
  const c = document.getElementById('active-grapes');
  c.innerHTML = '';
  activeGrapes.forEach(g => {
    const chip = document.createElement('span');
    chip.className = 'grape-chip';
    chip.innerHTML = `${g} <span style="opacity:0.7">✕</span>`;
    chip.addEventListener('click', () => { activeGrapes.delete(g); renderGrapeChips(); applyFilters(); });
    c.appendChild(chip);
  });
}

// ============================================================
// SHOW SUB-APPELLATIONS FOR A REGION
// ============================================================
let activeRegionExpand = null;
const regionSubLayer = L.layerGroup().addTo(map);

function subPolyStyle(color) {
  return { color, weight: 2, opacity: 0.8, fillColor: color, fillOpacity: 0.18, dashArray: null };
}
function subPolyHoverStyle(color) {
  return { color: '#e8c97a', weight: 3, opacity: 1, fillColor: color, fillOpacity: 0.32 };
}

function showRegionSubappellations(regionName) {
  regionSubLayer.clearLayers();

  if (activeRegionExpand === regionName) {
    activeRegionExpand = null;
    return;
  }
  activeRegionExpand = regionName;

  // Find all sibling regions in the same WSET group
  const group = REGION_GROUPS[regionName];
  const siblingRegions = group
    ? regions.filter(r => REGION_GROUPS[r.name] === group).map(r => r.name)
    : [regionName];

  // Collect all sub-appellations across the group
  const allGroupSubs = subregionData.filter(sr => siblingRegions.includes(sr.parentRegion));
  if (!allGroupSubs.length) return;

  const allPts = [];

  allGroupSubs.forEach(sr => {
    const isActive = sr.parentRegion === regionName;
    const color = getRegionColor(sr.parentRegion);

    // Draw sub-appellation polygon
    const bounds = subregionBounds[sr.name];
    if (bounds) {
      const style = isActive
        ? subPolyStyle(color)
        : { ...subPolyStyle(color), fillOpacity: 0.08, opacity: 0.4, weight: 1, dashArray: '4 4' };
      const poly = L.polygon(bounds, style);
      poly.bindTooltip(sr.name, { permanent: false, direction: 'center', className: 'sub-poly-tooltip' });
      if (isActive) {
        poly.on('mouseover', () => poly.setStyle(subPolyHoverStyle(color)));
        poly.on('mouseout', () => poly.setStyle(subPolyStyle(color)));
      }
      poly.on('click', () => {
        map.setView([sr.lat, sr.lng], 11, { animate: true });
        regionSubLayer.eachLayer(m => {
          if (m.getLatLng && m.getLatLng().lat === sr.lat && m.getLatLng().lng === sr.lng) m.openPopup();
        });
      });
      regionSubLayer.addLayer(poly);
      bounds.forEach(pt => allPts.push(pt));
    }

    // Add marker
    const clone = L.marker([sr.lat, sr.lng], {
      icon: createSubIcon(color),
      regionData: sr,
      opacity: isActive ? 1 : 0.5
    });
    clone.bindPopup(createSubPopup(sr), { maxWidth: 300, className: 'wine-popup' });
    regionSubLayer.addLayer(clone);
    allPts.push([sr.lat, sr.lng]);

    // Add permanent name label next to pin
    const label = L.marker([sr.lat, sr.lng], {
      icon: L.divIcon({
        className: 'sub-label-icon',
        html: `<span class="sub-label${isActive ? '' : ' sub-label-dim'}">${sr.name}</span>`,
        iconSize: [0, 0],
        iconAnchor: [-10, 12]
      })
    });
    regionSubLayer.addLayer(label);
  });

  // Also add parent region points
  siblingRegions.forEach(rn => {
    const r = regions.find(r2 => r2.name === rn);
    if (r) allPts.push([r.lat, r.lng]);
  });

  if (allPts.length > 1) {
    map.fitBounds(L.latLngBounds(allPts).pad(0.1), { animate: true, maxZoom: 10 });
  }
}

function formatSidebarGrapes(grapes, subName, parentRegion) {
  return grapes.map(g => {
    const wc = getGrapeWineClass(g);
    const note = grapeTastingNotes[g];
    if (!note) return `<span class="grape-tag ${wc}">${g}</span>`;
    const regionHint = getRegionalContext(g, subName, parentRegion);
    const wineHints = getGrapeWineHints(g, parentRegion);
    const infoHtml = buildGrapeInfoHtml(g);
    return `<span class="grape-tag-btn ${wc}" data-grape="${g}" data-sub="${subName}" data-parent="${parentRegion}">▸ ${g}</span>` +
      `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>` +
      infoHtml +
      `<div class="grape-tasting-header">Tasting Profile</div>${note}` +
      (regionHint ? `<div class="grape-note-region">⬦ In ${subName}: ${regionHint}</div>` : '') +
      (wineHints ? `<div class="grape-note-region">♦ Wines: ${wineHints}</div>` : '') +
      `</div>`;
  }).join('');
}

// Helper: format r.notes into readable paragraphs with bold ALL-CAPS headings
function formatRegionNotes(notes) {
  // Split into paragraphs at ". ALLCAPS" sentence boundaries
  // Negative lookbehind: skip abbreviations like "DR.", "ST.", "MR." (uppercase char before period)
  const parts = notes.split(/(?<![A-Z])\.\s+(?=[A-Z]{2})/);
  return parts.map((part, i) => {
    const text = i < parts.length - 1 ? part + '.' : part;
    // Bold the heading (text before first colon) if the first word is all-caps (2+ chars)
    const formatted = text.replace(/^([^:]{1,120}:)/, (m, head) => {
      const firstWord = head.split(/[\s("']/)[0].replace(/[^A-Z]/g, '');
      return firstWord.length >= 2
        ? `<strong style="color:#c8a84a">${head}</strong>`
        : m;
    });
    const isLast = i === parts.length - 1;
    return `<p style="margin:0 0 ${isLast ? '0' : '0.6em'} 0">${formatted}</p>`;
  }).join('');
}

// Helper: get all wines for a region (includes subregion wines)
function getWinesForRegion(regionName) {
  if (!WINE_DATA) return [];
  let wines = [];
  if (WINE_DATA[regionName]) wines = wines.concat(WINE_DATA[regionName]);
  subregionData.filter(sr => sr.parentRegion === regionName).forEach(sr => {
    if (WINE_DATA[sr.name]) wines = wines.concat(WINE_DATA[sr.name]);
  });
  const seen = new Set();
  return wines.filter(w => { if (seen.has(w.name)) return false; seen.add(w.name); return true; });
}

// Helper: for a grape, find which wines in a region use it
function getGrapeWineHints(grape, regionName) {
  const wines = getWinesForRegion(regionName);
  const gl = grape.toLowerCase();
  const matches = wines.filter(w => w.grapes.some(g => g.toLowerCase().includes(gl)));
  if (!matches.length) return '';
  return matches.map(w => w.name).join(', ');
}

// Toggle grape note in info panel
