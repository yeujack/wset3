    { name:'Swartland — Old Vine Chenin Blanc', classification:'WO', grapes:["Chenin Blanc (dominant), Grenache Blanc, Viognier, Roussanne, Marsanne"], method:'Old bush vines (60–80 years), no irrigation, minimal intervention, neutral wood or clay vessels (amphora)', aging:'No minimum; quality: 8–12 months in old barrique/amphora', style:'Full body, complex, textured, quince, beeswax, citrus, mineral — profound', notes:'The new frontier of Cape wine. Adi Badenhorst (Badenhorst Family Wines), Chris Alheit: redefining Cape Chenin. Swartland Revolution: movement of young winemakers rejecting mainstream for old vine expression. Vilafonté, Sadie Family (Eben Sadie): cult status. Mullineux: outstanding across whites and reds. Dry-farmed, no irrigation — low yields, concentrated wines.' },
    { name:'Swartland — Syrah and Rhône Blends', classification:'WO', grapes:["Syrah (dominant), Grenache, Mourvèdre, Cinsault"], method:'Minimal intervention, older oak, sometimes whole-cluster, extended maceration', aging:'12–18 months', style:'Full body, dark olive, meat, black pepper, violets, complex — more Crozes-Hermitage than Australia', notes:'Eben Sadie (Sadie Family Wines): "Columella" = South Africa\'s most acclaimed red wine. Mullineux Syrah: benchmark for old vine character. Cool maritime influence from Atlantic (northwest coast). Schist and granite soils. A revolution in Cape red wine quality.' },
  ],
  'Walker Bay & Elgin': [
    { name:'Walker Bay Pinot Noir (Hemel-en-Aarde Valley)', classification:'WO', grapes:["Pinot Noir (100%)"], method:'Whole-cluster, French oak (25–50% new)', aging:'10–14 months in French oak', style:'Medium body, red cherry, strawberry, earthy, fresh — cool maritime, most "Burgundian" in SA', notes:'Hemel-en-Aarde ("Heaven and Earth"): three sub-wards (Hemel-en-Aarde Valley, Upper H-en-A, Hemel-en-Aarde Ridge). Hamilton Russell: created the appellation\'s reputation — "the most Burgundian Cape Pinot Noir." Bouchard Finlayson: also excellent. Storm Wines: newcomer acclaim.' },
    { name:'Elgin Chardonnay / Sauvignon Blanc / Pinot Noir', classification:'WO', grapes:["Chardonnay, Sauvignon Blanc, Pinot Noir"], method:'Stainless steel (Sauv Blanc); barrel fermented (Chard)', aging:'No minimum', style:'High acid, restrained, fresh, cool-climate — apple/citrus/mineral', notes:'Apple-farming region repurposed for wine since 1990s. High elevation (300–400m), cool maritime. Paul Cluver: founding estate. Iona (Sauvignon Blanc specialist): landmark producer. South Africa\'s coolest major wine region by temperature.' },
  ],
  // ===== ARGENTINA =====
  'Mendoza (Luján de Cuyo, Maipú, Uco Valley)': [
    { name:'Mendoza Malbec (Luján de Cuyo)', classification:'DOC/IG', grapes:["Malbec (100% or dominant)"], method:'French oak (18–24 months); modern: less oak, more freshness', aging:'No minimum; premium: 18–24 months', abv:'14–15.5%', style:'Full body, concentrated, dark plum, violet, chocolate, velvety tannins, high altitude freshness', notes:'Luján de Cuyo: home of Argentina\'s most elegant Malbec (alluvial soils, 900–1100m). DOC Luján de Cuyo: specific altitude/quality rules. Catena Zapata (Nicolas Catena revolutionized Argentine wine): Adrianna Vineyard at 1450m = world-class. Achaval Ferrer (Quimera), Clos de los Siete (Rolland), Dominio del Plata: top estates.' },
    { name:'Mendoza Malbec (Uco Valley — high altitude)', classification:'IG', grapes:["Malbec (dominant), Cabernet Franc, Petit Verdot"], method:'French oak; minimal manipulation; cold-climate purity', aging:'12–18 months', style:'Medium-full body, fresher, more mineral, red and dark fruit, violet, high natural acidity — cooler style than valley floor', notes:'Uco Valley: 1000–1500m altitude, coolest Mendoza zone. Valle de Uco DOC: quality tier. Tupungato, Tunuyán, San Carlos sub-zones. O. Fournier, Clos des Siete, Zuccardi Valle de Uco (new flagship): world-class. High altitude = natural acid retention, lower sugar accumulation. Argentina\'s new frontier.' },
    { name:'Mendoza Cabernet Sauvignon / Blends', classification:'IG', grapes:["Cabernet Sauvignon, Malbec, Cabernet Franc, Merlot"], method:'French oak', aging:'18–24 months', style:'Full body, cassis, dark fruit, structure, cedar — serious Bordeaux-style blends', notes:'Catena Zapata Adrianna Vineyard: both Malbec and Cab Sauv at extreme altitude. Achaval Ferrer: high-rated Cab from Uco. Argentina also making excellent Cabernet-dominant blends. Mendoza dominates Argentine wine (~70% of production).' },
  ],
  'Cafayate / Salta': [
    { name:'Cafayate Torrontés (Salta DOC)', classification:'DOC', grapes:["Torrontés Riojano (100%)"], method:'Stainless steel, cold fermentation, aromatic preservation', aging:'No minimum; best drunk young', abv:'13–14%', style:'Medium body, intensely aromatic, floral (rose petal, jasmine, orange blossom), peach, lychee, low acid despite aromatic intensity, dry', notes:'Torrontés: Argentina\'s signature white variety. Cafayate at 1700m: highest quality expression. Possibly from Muscat × Criolla Grande cross — Argentina only. El Esteco (Etchart): benchmark. Crios de Susana Balbo: accessible version. Very distinctive wine: looks sweet, smells sweet, tastes dry.' },
    { name:'Cafayate Malbec / Cabernet Sauvignon (Salta High Altitude)', classification:'DOC', grapes:["Malbec, Cabernet Sauvignon, Tannat"], method:'French oak', aging:'12–18 months', style:'Full body, concentrated, spice, dark fruit, structured — intense high altitude character', notes:'Salta at 1700m: some of highest vineyards in world. Intense UV, extreme temperatures. Bodega Colomé (Donald Hess ownership): highest commercial vineyard at ~3111m (Altura Máxima). Also Achaval Ferrer has Salta holdings. Unique mineral character.' },
  ],
  'Patagonia (Río Negro & Neuquén)': [
    { name:'Patagonia Pinot Noir (Río Negro / Neuquén)', classification:'IG', grapes:["Pinot Noir (100%)"], method:'French oak; cool climate extraction', aging:'10–14 months', style:'Medium body, red cherry, earthy, spice — cool Patagonian character, Argentina\'s most Burgundian Pinot Noir', notes:'Argentina\'s southernmost and coolest wine region. Río Negro and Neuquén provinces. Cool desert climate moderated by Andes snowmelt. Infinitus: widely available. Humberto Canale: historic estate. Family Zuccardi expands here.' },
    { name:'Patagonia Malbec / Merlot / Sparkling', classification:'IG', grapes:["Malbec, Merlot, Chardonnay (sparkling)"], method:'Varies; sparkling: traditional method', aging:'Varies', style:'Reds: lighter, cooler style than Mendoza. Sparkling: fine, fresh, mineral', notes:'Rio Negro: known for Malbec and also sparkling wine (traditional method Chardonnay-based). Humberto Canale: benchmark Rio Negro estate. Very low humidity = minimal need for spray.' },
  ],
  // ===== CHILE =====
  'Aconcagua Valley': [
    { name:'Aconcagua Valley Cabernet Sauvignon / Carménère', classification:'DO', grapes:["Cabernet Sauvignon (dominant), Carménère, Syrah"], method:'French oak aging', aging:'12–18 months', style:'Full body, ripe cassis, dark fruit, pepper — warm valley floor; hillside: more elegant', notes:'Aconcagua: northernmost quality wine valley in Chile (30°S). Hot valley floor. Errazuriz Don Maximiano (icon), Seña (Mondavi/Errazuriz): top estates. Also sub-valley Casablanca nearby (whites, cool).' },

  'Maipo & Cachapoal (Central Valley)': [
    { name:'Maipo Valley Cabernet Sauvignon', classification:'DO', grapes:["Cabernet Sauvignon (dominant), Carménère, Merlot, Cab Franc"], method:'French oak aging', aging:'18–24 months', style:'Full body, cassis, tobacco, cedar, olive, firm tannins — Chile\'s answer to Napa Cab', notes:'Alto Maipo (near Andes, higher altitude): finest Maipo Cab Sauv. Concha y Toro Don Melchor: Chile\'s most acclaimed red wine (from Puente Alto). Almaviva (Concha y Toro × Mouton Rothschild): prestige Chilean Bordeaux blend. Viña Santa Rita, Cousiño-Macul: important historic estates.' },
    { name:'Cachapoal Valley Carménère / Merlot', classification:'DO', grapes:["Carménère (dominant), Merlot, Cabernet Sauvignon"], method:'French oak', aging:'12–18 months', style:'Medium-full body, dark plum, chocolate, herbs, pepper — distinctive Carménère character', notes:'Cachapoal: north part of O\'Higgins Region. Peumo: famous Carménère sub-area. Viña Altair (San Pedro): premium estate in Cachapoal. Carménère = lost Bordeaux variety "rediscovered" in Chile 1994 (originally thought to be Merlot).' },
  ],
  'Colchagua Valley (Central Valley)': [
    { name:'Colchagua Valley Carménère', classification:'DO', grapes:["Carménère (100%)"], method:'French oak (12–24 months)', aging:'12–24 months', style:'Full body, dark plum, chocolate, green pepper (if underripe), spice, tobacco — Chile\'s signature variety', notes:'Chile\'s most important Carménère region. Carménère: one of the original Bordeaux varieties, almost extinct in France (late ripening = routinely "cut" from blends), surviving in Chile where it was misidentified as Merlot until 1994. Green pepper (pyrazine) = hallmark of underripe; fully ripe = dark fruit, chocolate. Montes Alpha, Casa Lapostolle Clos Apalta, Viu Manent: top producers.' },
    { name:'Colchagua Valley Syrah / Bordeaux Blends', classification:'DO', grapes:["Syrah, Carménère, Cabernet Sauvignon, Merlot"], method:'French oak', aging:'18 months', style:'Full body, dark fruit, pepper, spice, chocolate, olive — generous warm-climate style', notes:'Apalta (hillside sub-zone): Chile\'s most coveted terroir. Casa Lapostolle "Clos Apalta": consistently one of Chile\'s best wines. Montes "Folly" Syrah from Apalta hillsides: cult wine. Santa Cruz: nearby town gives appellation recognition.' },
  ],
  'Curicó & Maule Valleys': [
    { name:'Maule Valley Malbec / Carignane (País) — Old Vine', classification:'DO', grapes:["Old vine País (Listán Prieto), Carignan (Cariñena), Malbec"], method:'Minimal intervention, old vines (50–100+ years), natural winemaking trend', aging:'No minimum', style:'Medium body, red fruit, earthy, mineral, fresh acid — natural wine movement favorite', notes:'Maule: south of Colchagua. Old vine Carignan and País (Chile\'s oldest variety, brought by missionaries 16th century). Natural wine movement embraces these ungrafted centenarian vines. De Martino, Gillmore, Garage Wine Co: trend-setting producers. País: previously ignored basic variety, now trendy in natural wine circles.' },
    { name:'Curicó Valley Sauvignon Blanc / Chardonnay', classification:'DO', grapes:["Sauvignon Blanc, Chardonnay"], method:'Stainless steel for Sauv Blanc; barrel fermented Chardonnay', aging:'No minimum', style:'Light-medium body, fresh, citrus, crisp, clean — workhorse Chilean white', notes:'Curicó: hub of Chilean wine industry (Torres España built Chile\'s first modern winery here). Large production. Miguel Torres Chile: quality benchmark. San Pedro: also major.' },
  ],
  'Southern Chile (Itata, Bío-Bío, Malleco)': [
    { name:'Itata Valley — País / Muscat / Cinsault Old Vines', classification:'DO', grapes:["País (Listán Prieto), Muscat of Alexandria, Cinsault"], method:'Old vine bush training (no irrigation), natural winemaking, minimal sulfites', aging:'No minimum', style:'Light body, delicate, wild strawberry, mineral, fresh — the "Beaujolais of Chile"', notes:'Chile\'s southernmost established wine valley. Pre-phylloxera, ungrafted vines. Cool, wet climate. Bío-Bío and Malleco: even further south, experimental. De Martino: champion of old Itata vines. Cinsault (old vine): interesting, fresh, light reds. Getting world attention via natural wine movement.' },
  ],
  'Elqui & Limarí Valleys (Coquimbo)': [
    { name:'Limarí Valley Chardonnay / Pinot Noir', classification:'DO', grapes:["Chardonnay (dominant), Pinot Noir, Sauvignon Blanc"], method:'Stainless steel or barrel Chardonnay; minimal extraction Pinot', aging:'No minimum', style:'High acid, mineral, saline, citrus, lean — Pacific influenced, one of Chile\'s most distinctive white wine terroirs', notes:'Limarí: northernmost quality white wine region (30°S). Fog-shrouded coastal desert. Limestone and sea sediment soils = mineral character unique in Chile. Concha y Toro (Terrunyo), Casa Tamaya: top producers. Growing reputation for Chardonnay with Burgundian mineral character.' },

  // ===== AUSTRALIA (ADDITIONAL) =====
  'Eden Valley': [
    { name:'Eden Valley Riesling', classification:'GI', grapes:["Riesling (100%)"], method:'Stainless steel; dry; no oak', aging:'No minimum; ages brilliantly 5–20 years (develops kerosene/petrol notes)', abv:'11–12%', style:'Light body, very high acid, bone dry, citrus (lime, lemon), floral, linear, mineral — best Australian Riesling outside Clare', notes:'Eden Valley (hills above Barossa): cooler climate. Henschke: Hill of Grace (Shiraz) AND excellent Eden Valley Riesling. Pewsey Vale: landmark Riesling vineyard. Leo Buring: also exceptional. Ages to develop the classic "toasty/kerosene" note of mature Australian Riesling. Higher altitude than Barossa — significant quality.' },
  ],
  'Clare Valley': [
    { name:'Clare Valley Riesling', classification:'GI', grapes:["Riesling (100%)"], method:'Stainless steel; dry; often sealed under screwcap to preserve freshness', aging:'No minimum; ages 5–20+ years', abv:'11–12.5%', style:'Light body, very high acid, dry, lime juice, chalk, mineral, linear — Australia\'s finest Riesling', notes:'Clare Valley: Australia\'s Riesling benchmark. Cool nights despite warm days. Polish Hill River and Watervale: best sub-zones. Grosset (Jeffrey Grosset): Australia\'s most acclaimed Riesling producer ("Polish Hill" and "Springvale"). Jim Barry, Knappstein, Sevenhill: also excellent. Screwcap adoption: Clare and Eden valleys led Australia\'s shift from cork in early 2000s. Aged Clare Riesling = world-class.' },
  ],
  'Adelaide Hills': [
    { name:'Adelaide Hills Sauvignon Blanc / Chardonnay / Pinot Noir', classification:'GI', grapes:["Sauvignon Blanc, Chardonnay, Pinot Noir, Syrah"], method:'Stainless steel for Sauv Blanc; barrel Chardonnay; light extraction Pinot', aging:'No minimum', style:'High acid, fresh, cool-climate. Sauv Blanc: tropical-herbal. Chardonnay: citrus, mineral. Pinot Noir: elegant.', notes:'Mount Lofty Ranges, cool and elevated. South Australia\'s premium cool-climate zone. Shaw + Smith: founded it as premium AC, particularly Sauvignon Blanc. Petaluma: historic pioneer. Ashton Hills, Henschke (Lenswood): also outstanding. Grüner Veltliner also planted.' },

// Helper: format r.notes into readable paragraphs with bold ALL-CAPS headings
function formatRegionNotes(notes) {
  // Split into paragraphs at ". ALLCAPS" sentence boundaries
  // Negative lookbehind: skip abbreviations like "DR.", "ST.", "MR." (uppercase char before period)
  const parts = notes.split(/(?<![A-Z])\.\s+(?=[A-Z]{2})/);
  return parts.map((part, i) => {
    const text = i < parts.length - 1 ? part + '.' : part;
    // Bold the heading (text before first colon) if the first word is all-caps (2+ chars)
    const formatted = text.replace(/^([^:]{1,120}:)/, (m, head) => {
      const firstWord = head.split(/[\s("']/)[0].replace(/[^A-Z]/g, '');
      return firstWord.length >= 2
        ? `<strong style="color:#c8a84a">${head}</strong>`
        : m;
    });
    const isLast = i === parts.length - 1;
    return `<p style="margin:0 0 ${isLast ? '0' : '0.6em'} 0">${formatted}</p>`;
  }).join('');
}

// Helper: get all wines for a region (includes subregion wines)
function getWinesForRegion(regionName) {
  if (!WINE_DATA) return [];
  let wines = [];
  if (WINE_DATA[regionName]) wines = wines.concat(WINE_DATA[regionName]);
  subregionData.filter(sr => sr.parentRegion === regionName).forEach(sr => {
    if (WINE_DATA[sr.name]) wines = wines.concat(WINE_DATA[sr.name]);
  });
  const seen = new Set();
  return wines.filter(w => { if (seen.has(w.name)) return false; seen.add(w.name); return true; });
}

// Helper: for a grape, find which wines in a region use it
function getGrapeWineHints(grape, regionName) {
  const wines = getWinesForRegion(regionName);
  const gl = grape.toLowerCase();
  const matches = wines.filter(w => w.grapes.some(g => g.toLowerCase().includes(gl)));
  if (!matches.length) return '';
  return matches.map(w => w.name).join(', ');
}

function buildSubCards(regionName) {
  const subs = subregionData.filter(sr => sr.parentRegion === regionName);
  if (!subs.length) return null;

  const wrap = document.createElement('div');
  wrap.className = 'sub-expand';
  wrap.innerHTML = `<div class="sub-expand-title">Sub-appellations (${subs.length})</div>`;

  subs.forEach(sr => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.innerHTML = `
      <div class="sub-card-name">${sr.name}${buildClimateBadge(sr.parentRegion)}</div>
      <div class="sub-card-grapes">${formatSidebarGrapes(sr.grapes, sr.name, sr.parentRegion)}</div>
      <div class="sub-card-note">${sr.notes.slice(0, 120)}${sr.notes.length > 120 ? '…' : ''}</div>`;
    // grape tag click handler (toggle note panels within this card)
    card.querySelectorAll('.grape-tag-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const panel = btn.nextElementSibling;
        const isOpen = btn.classList.contains('active');
        card.querySelectorAll('.grape-tag-btn.active').forEach(b => b.classList.remove('active'));
        card.querySelectorAll('.grape-note-panel.visible').forEach(p => p.classList.remove('visible'));
        if (!isOpen) {
          btn.classList.add('active');
          panel.classList.add('visible');
          setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
        }
      });
    });
    // card click → fly to sub-appellation on map
    card.querySelector('.sub-card-name').addEventListener('click', e => {
      e.stopPropagation();
      map.setView([sr.lat, sr.lng], 10, { animate: true });
      if (window.innerWidth > 600) {
        regionSubLayer.eachLayer(m => {
          if (m.getLatLng().lat === sr.lat && m.getLatLng().lng === sr.lng) m.openPopup();
        });
      }
    });
    wrap.appendChild(card);
  });
  return wrap;
}

const collapsedGroups = new Set();

function buildRegionList(filtered) {
  const container = document.getElementById('region-items');
  container.innerHTML = '';
  document.getElementById('list-count').textContent = filtered.length;

  // Group filtered regions by WSET L3 group
  const grouped = new Map(); // group → [regions]
  const ungrouped = [];
  filtered.forEach(r => {
    const g = REGION_GROUPS[r.name];
    if (g) {
      if (!grouped.has(g)) grouped.set(g, []);
      grouped.get(g).push(r);
    } else {
      ungrouped.push(r);
    }
  });

  function makeRegionItem(r) {
    const color = getRegionColor(r.name);
    const subs = subregionData.filter(sr => sr.parentRegion === r.name);
    const div = document.createElement('div');
    div.className = 'region-item';
    div.id = `item_${r.name.replace(/\s/g,'_')}`;
    const wines = getWinesForRegion(r.name);
    const wineNames = wines.slice(0,3).map(w => w.name.replace(/ DOC$| DOCG$| IGT$/,'')).join(', ');
    const wineExtra = wines.length > 3 ? ` +${wines.length - 3}` : '';
    div.innerHTML = `
      <div class="r-dot" style="background:${color}"></div>
      <div class="r-info">
        <div class="r-name" title="${r.name}">${r.name}${subs.length ? ` <span style="font-size:0.6rem;opacity:0.5">(${subs.length})</span>` : ''}</div>
        <div class="r-grapes">${r.grapes.slice(0,3).join(' · ')}</div>
        ${wines.length ? `<div class="r-wines" title="${wines.map(w=>w.name).join(', ')}">🍷 ${wineNames}${wineExtra}</div>` : ''}
      </div>`;
    const wrapper = document.createElement('div');
    wrapper.appendChild(div);
    div.addEventListener('click', () => {
      activateRegion(r.name);
      showRegionSubappellations(r.name);
      // Remove any existing sub-cards from other regions
      container.querySelectorAll('.sub-expand').forEach(el => el.remove());
      // Insert sub-cards right below this region item
      if (activeRegionExpand === r.name) {
        const cards = buildSubCards(r.name);
        if (cards) wrapper.appendChild(cards);
      }
      // Zoom to region and open info panel (no floating popup — panel has all the info)
      const marker = markerMap[r.name];
      if (marker) clusterGroup.zoomToShowLayer(marker, () => {});
      openInfoPanel(r.name);
    });
    return wrapper;
  }

  grouped.forEach((members, group) => {
    const flag = GROUP_COUNTRY[group] || '';
    const isCollapsed = collapsedGroups.has(group);

    const header = document.createElement('div');
    header.className = 'group-header' + (isCollapsed ? ' collapsed' : '');
    header.dataset.group = group;
    header.innerHTML = `<span>${flag} ${group}</span><span class="group-chevron">▼</span>`;
    header.addEventListener('click', () => {
      const collapsed = collapsedGroups.has(group);
      if (collapsed) collapsedGroups.delete(group);
      else collapsedGroups.add(group);
      header.classList.toggle('collapsed', !collapsed);
      itemsWrap.classList.toggle('collapsed', !collapsed);
    });
    container.appendChild(header);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'group-items' + (isCollapsed ? ' collapsed' : '');
    members.forEach(r => itemsWrap.appendChild(makeRegionItem(r)));
    container.appendChild(itemsWrap);
  });

  ungrouped.forEach(r => container.appendChild(makeRegionItem(r)));
}

// ============================================================
function applyFilters() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  const filtered = regions.filter(r => {
    if (activeGrapes.size > 0 && !r.grapes.some(g => activeGrapes.has(g))) return false;
    if (query) {
      const searchStr = [r.name, r.country, r.subregions, r.climate, ...r.grapes, r.notes].join(' ').toLowerCase();
      return searchStr.includes(query);
    }
    return true;
  });

  clusterGroup.clearLayers();
  clusterGroup.addLayers(filtered.map(r => markerMap[r.name]).filter(Boolean));

  subClusterGroup.clearLayers();
  if (showSubregions) {
    const filteredSub = subregionData.filter(sr => {
      if (activeGrapes.size > 0 && !sr.grapes.some(g => activeGrapes.has(g))) return false;
      if (query) {
        const searchStr = [sr.name, sr.country, sr.parentRegion, ...sr.grapes, sr.notes].join(' ').toLowerCase();
        return searchStr.includes(query);
      }
      return true;
    });
    subClusterGroup.addLayers(filteredSub.map(sr => subMarkerMap[sr.name + '|' + sr.parentRegion]).filter(Boolean));
    if (!map.hasLayer(subClusterGroup)) map.addLayer(subClusterGroup);
  } else {
    if (map.hasLayer(subClusterGroup)) map.removeLayer(subClusterGroup);
  }

  // Sync polygon visibility
  const filteredNames = new Set(filtered.map(r => r.name));
  regions.forEach(r => {
    if (!polygonMap[r.name]) return;
    if (filteredNames.has(r.name)) {
      if (!polygonGroup.hasLayer(polygonMap[r.name])) polygonGroup.addLayer(polygonMap[r.name]);
    } else {
      polygonGroup.removeLayer(polygonMap[r.name]);
      activePolygons.delete(r.name);
    }
  });

  buildRegionList(filtered);
  document.getElementById('region-count').textContent = `${filtered.length} Regions`;
  const countryBreakdown = {};
  filtered.forEach(r => { countryBreakdown[r.country] = (countryBreakdown[r.country] || 0) + 1; });
  const top = Object.entries(countryBreakdown).sort((a,b) => b[1]-a[1]).slice(0,4).map(([c,n]) => `${c}: ${n}`).join(' · ');
  document.getElementById('stats-text').textContent = top;
}

let _infoPanelCurrentRegion = '';

function openInfoPanel(regionName) {
  const panel = document.getElementById('info-panel');
  const sel = document.getElementById('info-panel-select');
  const body = document.getElementById('info-panel-body');
  const r = regions.find(r2 => r2.name === regionName);
  if (!r) return;

  _infoPanelCurrentRegion = regionName;
  const group = REGION_GROUPS[regionName];
  const groupLabel = group || regionName;

  // Build dropdown with all groups
  const allGroups = [...new Set(Object.values(REGION_GROUPS))];
  sel.innerHTML = allGroups.map(g => {
    const flag = GROUP_COUNTRY[g] || '';
    return `<option value="${g}"${g === groupLabel ? ' selected' : ''}>${flag} ${g}</option>`;
  }).join('');

  let html = '';

  // Section 1: Sibling regions navigation
  const siblings = group
    ? regions.filter(r2 => REGION_GROUPS[r2.name] === group)
    : [r];
  if (siblings.length > 0) {
    html += `<div class="info-section"><div class="info-section-label"><span>Regions in ${groupLabel}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content">`;
    siblings.forEach(s => {
      const isActive = s.name === regionName;
      const subs = subregionData.filter(sr => sr.parentRegion === s.name);
      html += `<div class="info-nav-item${isActive ? ' active' : ''}" onclick="navigateToRegion('${s.name.replace(/'/g, "\\'")}')">
        ${s.name}${subs.length ? ` <span style="opacity:0.5;font-size:0.65rem">(${subs.length})</span>` : ''}
        ${subs.length ? `<div class="info-nav-sub">${subs.map(sr => sr.name).join(', ')}</div>` : ''}
      </div>`;
    });
    html += '</div></div>';
  }

  // Section 2: Key grapes (clickable with tasting notes + wine hints)
  html += `<div class="info-section"><div class="info-section-label"><span>Key Grapes — ${r.name}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-grape-list">`;
  r.grapes.forEach(g => {
    const wc = getGrapeWineClass(g);
    const hasNote = !!grapeTastingNotes[g];
    const hasGenInfo = !!grapeGeneralInfo[g];
    if (hasNote) {
      const regionHint = getRegionalContext(g, r.name, groupLabel);
      const wineHints = getGrapeWineHints(g, regionName);
      html += `<span class="grape-tag-btn info-grape-tag ${wc}" onclick="toggleInfoGrapeNote(this)">▸ ${g}</span>`;
      html += `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>`;
      html += buildGrapeInfoHtml(g);
      html += `<div class="grape-tasting-header">Tasting Profile</div>${grapeTastingNotes[g]}`;
      if (regionHint) html += `<div class="grape-note-region">⬦ In ${r.name}: ${regionHint}</div>`;
      if (wineHints) html += `<div class="grape-note-region">⬦ Wines: ${wineHints}</div>`;
      html += `</div>`;
    } else if (hasGenInfo) {
      // No tasting notes but has general info (origin, synonyms etc.) — still make clickable
      html += `<span class="grape-tag-btn info-grape-tag ${wc}" onclick="toggleInfoGrapeNote(this)">▸ ${g}</span>`;
      html += `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>`;
      html += buildGrapeInfoHtml(g);
      html += `</div>`;
    } else {
      html += `<span class="info-grape-tag ${wc}">${g}</span>`;
    }
  });
  html += '</div></div></div>';

  // Section 3: Wines & Appellations (+ Key Varietals card if detailed notes exist)
  const wines = getWinesForRegion(regionName);
  const hasDetailedNotes = r.notes && r.notes.length > 250;
  if (wines.length > 0 || hasDetailedNotes) {
    const wineCount = wines.length;
    const sectionLabel = wineCount > 0 ? `Wines & Appellations (${wineCount})` : 'Key Varietals & Producers';
    html += `<div class="info-section"><div class="info-section-label"><span>${sectionLabel}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content">`;
    wines.forEach(w => {
      const bc = w.classification.toLowerCase().replace(/[^a-z]/g,'');
      const wineType = getWineColorType(w);
      const appearance = getWsetAppearance(w);
      const appClass = 'app-' + appearance.toLowerCase().replace(/\s+/g, '-');
      const isAdded = ADDED_WINE_NAMES.has(w.name);
      const sourceBadge = isAdded
        ? '<span class="source-added">✚ Added</span>'
        : '<span class="source-wang">📖 Wang</span>';
      html += `<div class="info-wine-card wtype-${wineType}${isAdded ? ' added-wine' : ''}">`;
      html += `<div class="info-wine-name">${w.name} <span class="info-wine-badge ${bc}">${w.classification}</span> <span class="info-wine-appearance ${appClass}">${appearance}</span> ${sourceBadge}</div>`;
      html += `<div class="info-wine-detail"><strong>Grapes:</strong> ${w.grapes.join(', ')}</div>`;
      if (w.aging) html += `<div class="info-wine-detail"><strong>Aging:</strong> ${w.aging}</div>`;
      if (w.method) html += `<div class="info-wine-detail"><strong>Method:</strong> ${w.method}</div>`;
      if (w.abv) html += `<div class="info-wine-detail"><strong>ABV:</strong> ${w.abv}</div>`;
      html += `<div class="info-wine-detail"><strong>Style:</strong> ${w.style}</div>`;
      if (w.notes) html += `<div class="info-wine-detail" style="margin-top:3px;color:#888;font-style:italic">${w.notes}</div>`;
      if (w.addedNotes) html += `<div class="info-wine-added">${w.addedNotes}</div>`;
      html += `</div>`;
    });
    html += '</div></div>';
  }

  // Section 4: Climate & Terroir
  if (r.climate) {
    html += `<div class="info-section"><div class="info-section-label"><span>Climate & Terroir ${buildClimateBadge(r.name)}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-text">${r.climate}</div></div></div>`;
  }

  // Section 5: Winemaking & Style (full formatted notes)
  if (r.notes) {
    html += `<div class="info-section"><div class="info-section-label"><span>Winemaking &amp; Style</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-text">${formatRegionNotes(r.notes)}</div></div></div>`;
  }

  // Section 6: All grapes across the group
  if (siblings.length > 1) {
    const allGrapes = new Set();
    siblings.forEach(s => s.grapes.forEach(g => allGrapes.add(g)));
    html += `<div class="info-section collapsed"><div class="info-section-label"><span>All Grapes in ${groupLabel}</span><span class="info-section-chevron">▼</span></div><div class="info-section-content"><div class="info-grape-list">`;
    [...allGrapes].sort().forEach(g => {
      const wc = getGrapeWineClass(g);
      const hasNote = !!grapeTastingNotes[g];
      if (hasNote) {
        const wineHints = getGrapeWineHints(g, regionName);
        html += `<span class="grape-tag-btn info-grape-tag ${wc}" onclick="toggleInfoGrapeNote(this)">▸ ${g}</span>`;
        html += `<div class="grape-note-panel wine-${wc}"><div class="grape-note-name">${g}</div>`;
        html += buildGrapeInfoHtml(g);
        html += `<div class="grape-tasting-header">Tasting Profile</div>${grapeTastingNotes[g]}`;
        if (wineHints) html += `<div class="grape-note-region">⬦ Wines: ${wineHints}</div>`;
        html += `</div>`;
      } else {
        html += `<span class="info-grape-tag ${wc}">${g}</span>`;
      }
    });
    html += '</div></div></div>';
  }

  body.innerHTML = html;

  // Attach collapse toggle handlers
  body.querySelectorAll('.info-section-label').forEach(label => {
    label.addEventListener('click', e => {
      if (e.target.closest('.info-nav-item') || e.target.closest('.grape-tag-btn')) return;
      label.parentElement.classList.toggle('collapsed');
    });
  });

  panel.classList.add('open');

  // On mobile: show backdrop and close any floating Leaflet popups
  const isMobile = window.innerWidth <= 600;
  if (isMobile) {
    document.getElementById('info-panel-backdrop').classList.add('visible');
    map.closePopup();
  }

  setTimeout(() => map.invalidateSize(), 300);
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('open');
  document.getElementById('info-panel-backdrop').classList.remove('visible');
  setTimeout(() => map.invalidateSize(), 300);
}

function navigateToRegion(name) {
  activateRegion(name);
  showRegionSubappellations(name);
  highlightListItem(name);
  const marker = markerMap[name];
  // Zoom to marker but don't open the floating popup — info panel is the source of truth
  if (marker) clusterGroup.zoomToShowLayer(marker, () => {});
  openInfoPanel(name);
}

function onInfoPanelGroupChange(groupName) {
  // Navigate to the first region in the selected group
  const firstRegion = regions.find(r => REGION_GROUPS[r.name] === groupName);
  if (firstRegion) navigateToRegion(firstRegion.name);
}
</script>
</body>
</html>
